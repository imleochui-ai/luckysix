《畢法》正文終
前後引從升遷吉第一 引乾宜進職，引支宜遷宅。
夫前引後從格者有二等，如遇初傳居乾前為引，末傳居乾後為從，值此格者，必升擢官職；又如遇初傳居支前引，末傳居支後為從，值此格者，必遷修家宅，二事皆吉。
拱貴格 引從天干格內，如庚辰日寅加酉為初傳，子加未為末傳，此乃初末引從庚乾在內，乾上丑為晝貴人，兼三傳下賊上，豈不應升擢官職也？夜占乃墓神覆日亦無畏，緣中傳未作天乙衝破醜墓，乃為吉課也。
兩貴引從天干格 如壬子日初傳巳加子為晝貴，末傳卯加戌為夜貴，亦是墓神覆日，賴中傳之戌衝辰，不畏墓也。凡值此例，必得上人提攜，或兩處貴人引薦成事，如辰為月將尤妙也。
初末引從地支格 如己亥日初傳巳加子，末傳卯加戌，亦系引從地支格，雖初末加其干墓覆支，賴中傳之戌衝辰亦無畏，宜遷修家宅則吉。又如丁亥日初傳巳加子，末傳卯加戌，亦初末引從地支格，奈晝夜天將皆是白虎居於支上，豈宜遷修宅舍乎？殊不知亦賴中傳戌蛇衝辰虎，不為害也。如用辰為月將尤為妙也，或占人行年本命又居巳位，以巳上二戌衝辰，眾凶皆散矣。
晝夜貴人臨干支上拱其年命在內者 宜告貴用事，必得兩貴人成就。如丁酉日酉加丁，亥加酉，占人年命在申；丁巳日亥加丁，酉加巳，占人年命在午；癸亥日巳加癸，卯加亥，占人年命在子。
凡干支夾拱在下層，惟甲子、甲辰、癸亥、癸卯。在上層惟庚午、庚戌、丁巳、丁酉。
易無思注：此處可不必分上下層。甲寄寅宮，與子或辰；癸寄丑宮，與亥或卯；庚寄申宮，與午或戌；丁寄未宮，與巳或酉。以上皆形成夾拱。甲子日及庚午日伏吟課，天盤上可見干支拱貴；丁巳日及癸亥日伏吟課，天盤上可見干支拱日祿；丁巳日、癸亥日亥加未，丁酉、癸卯日酉加未，在天盤上可見兩貴臨干支拱年命。
二貴拱年命格 如癸未日初傳巳加子，未傳卯加戌，占人行年本命在亥，宜告貴成事，名末助初財初德，亦貴人助貴人也。
干支拱定日祿格 惟伏吟卦為的，如丁巳、己巳、癸亥皆伏吟，宜占食祿事。癸亥為嫌祿空。
干支拱夜貴晝貴格 惟伏吟為的，如庚午、己酉支干拱夜貴，甲子支干拱晝貴，皆伏吟卦，宜告貴人求事。
初中拱地盤貴人格 如庚午日乾上戌，支上申，乃支乾並初中拱夜貴也；又庚午日乾上酉、支上未，又庚午日乾上午、支上辰，乃支乾初中皆拱地盤之夜貴，皆宜告貴而成合事。餘皆仿此。
首尾相見始終宜第二 攻必取，戰必勝。
謂乾上有旬尾，支上有旬首，名周而複始格，亦名一旬周遍格，凡值此者，占事不脫，所謀皆成。占赴試，宜代工；占訟宜換司易局；占交加用事，去而複來。惟不宜占釋散事，如有憂疑，其事盡在未能決斷。
干上有旬尾，支上有旬首，惟乙未卯加辰、辛丑卯加戌、丙申卯加巳、壬寅卯加亥、戊申丑加巳五日有之。干支隔四位方有。前四日俱甲午旬，惟戊申乃甲辰旬。
干上有旬首，支上有旬尾，惟乙丑子加辰、辛未子加戌、丙寅丑加巳、戊寅戌加巳、壬申子加亥五日有之，諸占亦照前斷。惟戊寅乃甲戌旬，其餘四日俱甲子旬。
天心格 乃年月日時皆在四課之內，凡占乃非常之事，即日而成，或干天庭之事，定然成就。如占陰私、常用鄙俚之事，反成咎也。
回還格 乃三傳在四課之中。如辛亥日乾上酉、亥上戌，三傳戌酉申是也，此以不備言之。至於干支自作三合者，內多回還格，乃干支相會，不可作不備言之。如丁卯、丁亥、己卯、己亥，皆乾上卯或干上亥，諸如此類，占凶凶成，占吉吉就，凡事只宜守舊，不能動作。如占病，其病難退，訟不解。如女命占得干加支，男命占得支加乾，來意占婚尤驗，宜詳其生、克、空、脫、刑、衝、破、害、墓言也。
簾幕貴人高甲第第三 班超封萬里之侯。
簾幕官者，如晝占乃夜貴，夜占乃晝貴。如占科目，專視此神，臨於占人年命之上，或臨日乾上，試必高中矣。凡庶人占得簾幕，得林下官扶持。如有官人占得之，為休官之象。
旬首作簾幕官者臨年命、日乾之上尤的，惟乙己辛日有之。
又辰戌作旬首臨年命、日乾者必中魁元，乃甲辰、甲戌兩旬二十日有之。
斗鬼相加格 或丑加未，或未加丑作年命日乾者，亦中魁元，緣丑有斗，未中有鬼，斗鬼二字合而為魁故也。
亞魁星，天盤酉臨年命日乾者，占試必高中，緣酉為從魁也。以上諸說忌空亡。
德入天門格 乃日德加亥為用，士人占之必高中。亥為天門，德者得也。
真朱雀格 如六己日於四季年占，用夜貴逆布，乃朱雀乘午，占春闈，其文貼上意，必得高中，緣朱雀主文書，生太歲又生日乾。如真朱雀克太歲，占訟必達朝廷，罪必致死，惟申酉歲的。
朱雀乘神克簾幕官，占試其文不貼主文意。
朱雀乘丁馬，榜將出， 忌。
晝夜貴人拱年命者，赴試必中。如丁酉日乾上酉、支上亥，占人年命在申，大宜占試，緣干支上神作晝夜貴人拱年命上河魁。
源消根斷格 如癸卯日乾上卯、支上巳，年命在寅，大宜占試，不在此論，緣只取二貴拱年命也，但高中矣，恐以不攝終成勞瘵。
簾幕貴人尤分喜畏，細具於後。甲日不喜未墓為之，庚日不喜丑墓為之。又甲寅日不喜丑空為之，庚寅日不喜未空為之，丙寅、丁卯日不喜亥空為之，己卯、乙亥日不喜申空為之，壬子、癸丑日不喜卯空為之，壬寅、癸卯日不喜巳空為之，六辛日不喜午克為之，又辛亥日不喜寅空為之，空亡尤甚，使試官置卷不視，徒勞一次。
占武舉法，以巳為弓弩，申為矢箭，申加午必箭中紅心。如申加寅、申、巳、亥為四腳花，以第幾課發用言其箭中之數。四墓脫垛。
催官使者赴官期第四 惟將赴任宜見。
凡占上官赴任，見日鬼乘白虎加臨日乾或年命之上，乃名催官使者，縱是遠缺，必催速赴任也。如催官使者空亡，又是虛信，或被遣差。
催官符 如官星臨日干年命者，其三傳上神生其官星是也。
恩主舉薦例 傳、年、日辰有父母爻者是，亦為食祿之地，如值長生作貴人亦如之。如乙日見日貴為父母，己日見夜貴為長生。外乙卯日晝貴空，己卯日夜貴空不用。
四時返本煞 占赴任極遲。夫返本煞者，春得金局，夏得水局，秋得火局，冬得土局是也。如赴任占得返吟，多不滿任。
六陽數足須公用第五 隨六三，系丈夫，失小子，隨有求得，利居貞，揚兵於九天之上。
六陽格 謂支乾四課三傳皆居六陽之位是也，凡占皆利公幹而不利私謀。假令庚子日第一課戌加庚，第二課子加戌，第三課寅加子，第四課辰加寅作初傳，其中傳午加辰，末傳申加午，卦名登三天，宜占天庭事，有動達高尊之象，如君子占之稍畏初中空亡而減力。如常人占之，賴初中空卻省力也，尤未免公幹，明白事理。
悖戾格亦名倒拔蛇 如甲午日乾上子，雖四課三傳皆處六陽之地，緣三傳退間，主事間阻艱難，兼被初傳戌財引入中末鬼鄉，凡占事皆艱辛，尤不免公用也。如甲戌日乾上子，四課三傳亦皆處六陽位，以上是自夜傳出晝，尤明白。
五陽格 課傳居五陽之上者，或占人年命填之，亦名六陽，事主公用明白，利公不利私也。此例極多，不暇細具。
六陰相繼盡昏迷第六 隨六二，系小子，失丈夫。伏兵於九地之下。
六陰格 謂課傳皆居六陰之位是也，凡占利陰謀私干，不利公聞，尤盡昏迷也，或自晝傳夜昏迷愈甚。如己卯日第一課酉加巳，第二課亥加酉作初傳，第三課巳加卯，第四課未加巳，中傳丑加亥，末傳卯加丑，課名溟蒙，凡占事必是陰謀奸私之象，兼天將天后、螣蛇、六合、元武，支干上皆乘盜氣，又是彈射發用坐於空鄉，至費力而不可言也，占病必死，求望皆為脫耗。又己亥日乾上巳同。
五陰格 課傳止五陰者，占人年命填之，凡占利私不利公，利小人不利君子。
源消根斷格 如癸卯、癸未、癸巳，乾上卯，課傳俱在五陰之位，又是下生上神，迤邐而脫去，占病緣不攝而致病，豈不危絕乎？凡占皆脫耗，其法如神，切宜秘之。
又如辛卯日乾上子，自乾至支及初中末，迤邐下生上神，盡被脫盜，雖不系五陰位全，其理其理一同。以上例除占病外，諸占未免脫耗，日漸消鑠也。
旺祿臨身徒妄作第七 不戰而屈人之兵。
謂日之祿神，又作日之旺神，臨於乾上者，切不可舍此而別謀動作。如乙卯日乾上卯，幸得乘日之旺祿，何不守此，乃舍而就初傳之財、中末之生，殊不知皆是旬內空亡，既逢幹空，不免囉嚦，再歸幹上就祿就旺，誠所謂「到處去來，不如在此。」之語也。又乙酉、乙亥日乾上卯，癸巳、癸丑日乾上子，辛卯、辛丑、辛酉日乾上酉，己亥、己酉、己巳日乾上午，雖不系己土旺神，亦可用也。以上皆在鈐內。又如辛巳日，雖干上酉為日之旺祿，奈是旬空，既旺祿空亡，必所得不償所費，反不宜坐用，未免棄祿而就三傳之財，及別謀改業，遂致亨旺，切不可如前論之。又如癸亥日，乾上雖乘子為日之旺祿，亦是旬空，未免棄祿而就初傳之戌，乃值日鬼乘白虎，又不免向前投中傳酉，又值敗氣，又坐鬼鄉酉加戌為鬼鄉也，迤邐至於末傳申，始逢日之長生，凡值此課，未免舍空祿而就艱難中，更進一步，始得如意，此意法奇妙。丁亥日乾上午，乙巳日乾上卯同。外有乙未日乾上卯，緣是閉口之祿而不可守，遂投初傳，奈是昴星不入之財，不免中傳再歸幹上受其旺祿，又不能守，致於末傳，棄祿而歸於末傳宅上，受其干墓之鄉，以此占之，乃見食於人，把心不定，終處於家中受困厄而已。
祿被元奪格 如辛卯日，乾上酉為日旺祿，緣晝乘元而夜乘虎，遂不可守，未免投初傳丑，又是日墓，中傳子又是脫氣，末傳又是丁亥乘虎而遙傷日乾，自末傳至乾，雖欠一位，終不能複投其旺祿也。此例尚有，皆在鈐內，甚詳。又辛未日乾上酉，夜乘虎，支上午火，初巳、中歸巳鄉，末丁卯。
權攝不正祿臨支第八 不為鄰國之游士，亦作幕府之客臣。
謂日干祿神加臨支辰上者，凡占不自尊大，受屈折於他人。如占差遣，主權攝不正，或遙授職祿，或正宜食宅上之祿；或將本身之職祿替於兒男者，斯占尤的。且此例每日有一課，可逐類而言之。假令甲子日寅加子，乙丑日卯加丑之類，不暇細具，皆仿此。
祿被支墓克脫 外有日乾之祿加支上，被支辰墓其祿，或被支克其祿神者，必因起蓋房宅而失其祿。或被支辰脫其祿神者，必因起蓋房宅而以祿償債。假令辛丑日，酉加丑，乃祿神受墓。又乙酉日卯加酉，乃祿神受宅克。乙巳日卯加巳，乃祿神受脫。此例極多，不暇細具，餘仿此。
避難逃生須棄舊第九 四面受敵，亦有無敵之處。
避難逃生格 如甲子日戌加子作初傳，雖曰日財，乃是旬空，中傳申金又是日鬼，末傳午火作日之脫氣，且三傳既無所益，不免只就乾上子水而受生，乃應避難而逃生之語。丁卯日乾上亥，乙亥日乾上酉，戊寅日乾上申，庚戌日乾上午，辛未日乾上丑，戊午日乾上辰，己巳日乾上酉，辛酉日乾上亥，壬申日乾上寅，庚辰日乾上子。
避難逃生，如甲子日辰加寅為初傳，雖曰日財，奈晝夜天將皆是六合，其財受上下夾克，終不可得，中傳午火乃日之脫氣，末傳申金又是日鬼，三傳既無所益，不免日乾就子支上而受生，亦謂之避難而逃生。又如庚子日子加申，此乃支神上門而脫干，兼三傳水局皆作脫氣，及晝夜天將蛇龍武皆是水中之獸也，愈擊其水而蝕庚金，誠所謂脫耗迍邅，而不可逃；熟視之，天盤申金坐於辰土之上就生，子水坐於申金之上長生，豈能蝕天上之申金？亦為避難逃生也。
占人本命作丁神，動搖不安，而坐長生之上，亦為避難逃生。
避難逃生而終不能逃生者，例如丁亥日乾上戌，夜占昴星，三傳午戌寅，緣始棄干上之墓，遂投初傳之祿，奈是旬空，不免棄空祿而再歸幹上中傳戌墓，終不可受，其久困又投未之長生，奈值白虎，未免止居宅中，受驚危之長生爾。
避難逃生得財格 如壬午日，辰加亥作初傳，乃是墓神覆日為用，三傳辰酉寅，不免棄墓而投中傳酉金之生，又是旬空，遂再投末傳寅木，又是脫氣，然後棄其三傳，而壬干加午而取財也。如丙寅日寅加丙，申財加亥乘元，三傳亥申巳，緣申見在之財落空，又焉能求外來之財也。
舍益就損格 亦名不受福德，賁初九：「賁其趾，舍車而徒」。如壬寅日不就乾上之申金為長生，願以壬干加寅木而受脫。
舍就皆不可格 如乙酉日乾上亥，辛丑日乾上未，唯有庚子日乾上辰乃空亡，庚午日乾上戌乃空亡。
墓作太陽格 謂墓神覆日，卻作太陽，處難中得上人提攜，共有五等：一、就乾上之生，二、就支上之生，三、日乾坐地盤之生，四、本命乘丁坐地盤長生，五、日乾下臨財鄉。
朽木難雕別作為第十
謂斫輪課中，卯為空亡者，故名朽木不可雕也。凡值此例，宜改科易業而別作營生。如庚戌日卯加申，辛亥日卯加辛，此二者尤的，餘有癸丑日卯加申發用。
斧斤不利格 如丁丑日卯加申為發用，乃申酉空亡，卯木加空地，非朽木難雕之例也，凡謀不遂。
眾鬼雖彰全不畏第十一 雖有烏合之敵眾，難當虎豹之雄師。
假令壬辰日戌加未為初傳，丑加戌為中傳，辰加丑為末傳，三傳戌丑辰皆是日鬼，誠為凶也，殊不知干上先有寅木可以敵其三傳之土，制鬼賊不能為害，兼是蒿矢擇比為用，又坐空鄉，鬼力至輕也，凡占未免先值驚危，下稍北海閒人按：下稍指事情的結局無畏，但言必有人相謀害，終不能為禍也。如用夜貴，初乘白虎，尚可畏焉。如用日貴，全無畏矣。且論寅木切不可作脫氣言之，實為救神，其寅木論如孔氏門下有子路能禦侮者也。又如壬戌日乾上寅，丙子、丙申、丙辰干上丑皆是。己亥日乾上申夜貴，必得貴人力。
家鬼取家人，如己丑日乾上申，支上寅為用，三傳寅卯辰，如用夜貴，必得貴人解救，自支寅木發用，中末傳俱歸木鄉，凡值支上有鬼，引入鬼鄉者，皆如此說。如丙申日乾上丑，丙寅日乾上辰，從支陰發用為鬼，亦以家鬼斷，賴干上有救，有官人可，病訟凶。
家人解禍格 如癸亥日辰加癸為用，三傳辰未戌皆是土神，並來傷幹，兼夜天將皆是蛇勾虎，誠為凶也。殊不知支上有寅木可以敵鬼，不為凶咎，此例必得宅中之人解禍，餘仿此。
引鬼為生格 謂初傳日鬼，而生其末傳來育乾者是也。如丙子日並干上子為初傳，雖是鬼卻生末傳寅木，作丙火之長生，反不畏干上之子水，亦賴宅上未土為救，是丙子日是也。丙午日亦有丑土為救也，餘不為救。己丑日卯加申，甲寅、甲午日酉加寅，乃先凶後吉。
傳鬼為生格 三傳皆作日鬼，反生起乾上之神而育乾者是也。如庚午日乾上辰，三傳戌午寅火局，雖全傷日乾，殊不知三傳反生乾上辰土而育養庚金也。又癸巳日巳加酉，用晝將皆土克日，殊不知土將生三傳金局，三傳金局生乾，乃凶返吉也。
貴德臨身消除萬禍格 如如乙丑、乙巳日並酉加巳為初傳，三傳金局並來傷其乙干，如用晝貴，凶不可遏，設用夜貴反為吉，言初傳酉金上被塍蛇克，下被巳火傷，又被中傳丑土來墓，末傳巳火來克其酉金，全無力來克干，縱然乾上乘申金，又為貴人、又為日之德神臨身，能伏諸煞。
天將為救神格 如辛巳日午加辛為用，三傳火局並來傷幹，誠為凶也，如觀天將，晝夜皆是貴、常、勾土神，而竊其火氣生其日乾，亦宜免禍。
脫氣為救格 如壬子日未加卯為用，三傳木局並來脫干，且此例既無日鬼，豈宜處於眾鬼雖彰全不畏者之例，三傳木局切不可作脫氣言之，如用夜將，緣三傳天將皆是勾、常、貴人土神，並來傷壬干，反賴三傳木局去其土將，豈不應斯格也。餘五壬日乾上卯，夜貴並如其說。壬戌、壬子、癸卯、癸亥，三傳未卯亥夜同。
雖憂狐假虎威儀第十二 夫仗他人之力，乞兒向火何倚冰山之徒。
狐假虎威格 如丁未日乾上子，其丁火實畏子水所克，反倚賴支屬土卻能制其子水，不敢來傷丁幹也，疑丁火喻狐，未土喻虎，故名為狐假虎威儀之例也。凡占切不可動謀，如動用離其未土，其子水隨蹤而傷丁火也。又辛亥日乾上亥，晝虎夜元皆乘脫氣，尤賴亥水坐於戌土之上，尚懼戌土，不至辛金全脫，尤不宜動作，稍如前例。餘五辛日亦可如此說。
鬼賊當時無畏忌第十三 吳釋越而終為越滅吳。
假令戊子日乾上午，三傳寅卯辰皆是日鬼，如春占木旺，誠所畏也，殊不知木至春令而榮旺，既貪榮盛而無意克土，故戊土不畏木克也。此例雖春占無畏，防至夏秋其禍仍發，如有禍時，便宜斷絕，免致後患，其餘傳內全逢日鬼者，各詳四季天令而言之。
三合為鬼亦如前說。
傳財太旺反財虧第十四 漢黷武而海內空虛。
假令戊申日乾上丑，三傳子申辰皆作日之財，兼晝夜天將皆是水中之獸，又於秋冬水生旺之月，占求財事即無財也，如取其財，切防反費己財，緣水自貪其生旺，不能與我作財，只待身旺之月，財氣稍衰之月令，方可取其財。例尤多，餘亦仿此。
進退連茹為財格 如網江魚之諭求財，不宜坐財墓，亦忌財加鬼墓。
財神空亡格 求財反費己財，緣見在之財已空，求外來之財豈有得也。如辛亥日乾上寅、支上卯，二財皆空。庚戌日同。
脫上逢脫防虛詐第十五 金以議和愚宋，而宋以議和自愚。
謂日乾生其上神，上神又生天將者，故名脫上脫，凡占盡被脫耗，多虛詐不實之象也。假令六庚日乾上子，夜將上乘青龍，此乃庚干生上神，子水又生青龍木將，那更三傳皆是水局並來盜日，凡占豈不遭虛詐乎。內有庚子日子加庚，乃支上門來脫干，三傳又來脫之，並三傳天將夜晝俱是蛇龍元，盡被脫盜，倘熟視之，其庚居天盤坐辰土之上受生，子水居申金之上受長生，終不致脫盡，不可不知。六甲日乾上巳，晝占上乘太常；六乙日乾上午，晝占上乘天空，六丁日乾上丑，晝占上乘太陰。
無依脫耗格 惟丁未日反吟，晝占乃乾生醜，丑生將，一火逢九土，如憂事不止一件，若止見一件，別項又來，必有大災。六己日乾上酉，夜占上乘天後。
脫盜格 乃干上逢脫氣，天將作元武者例，亦如前說。六辛日乾上亥，夜占乘元武；六壬日乾上寅，晝占乘元武；六癸日乾上寅，晝占上乘元武。餘有甲午日午加甲，三傳又是火局，並支來盜乾，虛詐尤甚。內辛亥日乾上亥尤可惡，緣支干上皆脫，初墓又坐脫方，中末空亡，晝虎夜元之將日上俱值，其凶可見。
空上乘空事莫追第十六 陳隋基業於唐，五代收功於宋。
謂上見旬空乘天空者，凡占指空話空，全無實象。如甲申日乾上未，晝占上乘天空。余占日上空亡，上乘天空，皆仿此。
脫空格 謂乾上有脫乘天空，亦名脫空神，凡占皆無中生有，盡是脫空，全無實蹤，不足取信也。如辛卯日乾上子，晝占上乘天空，初傳又是遙克，中末皆空亡，凡占盡被脫空。六辛日乾上子，晝占乘空；六乙日乾上午，晝占乘空，餘日皆仿此。
但凡遙克為用作空亡，或坐空鄉，或乘天空者，凡占皆虛無不實也。
進茹空亡宜退步第十七 坎初六：「習坎，入於坎窞，凶。」遇此課宜班師。
假令壬子日乾上子，三傳寅卯辰，皆是空亡，既向前值三空亡，即宜退步，抽身縮首，卻就支干上子與醜合，反有所得，庶使壬水不被傳木全脫，可以全身遠害，不利托人。如甲午日乾上卯，三傳辰巳午亦皆是空亡，亦宜退步，庶乎甲木不被傳火脫盡，奈支乾前後夾定脫氣在內，盡被脫空而無窮也，如遇丑為年命，始宜退步就其祿神。
脫空格 如癸丑日乾上寅，自是空亡，那更寅卯辰為三傳，使癸水生其脫空，雖有千金亦不周其足，如晝占乘元武在乾上尤甚，占訟費而不直，占病脫而虛甚，終不能退步。
踏腳空亡進用宜第十八 四課三傳俱退連茹，丁巳日乾上午，三傳卯寅丑，宜深入重地。
謂退步傳全值空亡者，故名踏腳空亡，既退後遇空，宜進而不宜退也。如戊申日乾上辰，三傳卯寅丑皆作日之鬼，幸遇鬼空，足可以脫災避難，惟不宜守舊，緣乾上乘墓，反宜於三傳之外，向前一步，便逢祿神，此卻不利有官人占之，緣官爻空亡故也。
尋死格 如丙午日乾上辰，三傳卯寅丑，雖三傳生日，豈宜皆空，如占病，乃尋死格也。占父母病死尤急，如占子息病無畏，占訟理虧，必官人不主張，緣生我者空亡故也。如乙卯日乾上卯，亦若尋死格。已上例如背後有三阱坑，豈宜退乎，如退則腳下踏空，反陷其身，凡占宜催督。
踏腳空亡格 惟不宜進前者例，但占事虛聲而無成就耳。如甲子日戌加子為初傳，乃是本旬之空，申加戌為中傳，乃後旬之空，午加申為末傳，乃外後旬之空亡，故向後全無實意，盡無成就。甲申日午加申，乙卯日丑加卯，丙辰日丑加卯，丁巳日丑加卯。
胎財生氣妻懷孕第十九
謂日乾之胎神，作日之妻財，又逢月內之生氣者，如占妻必孕也。如壬寅日乾上午，七用占，午加亥為發用，壬水胎在午，又是日之妻財，及七月生氣在午，占妻必有孕而無疑。五壬日乾上午，七月占皆同。六庚六辛日乾上卯，四月占皆然。六戊六己日乾上子，正月占亦主孕喜，何故言？戊己土神胎亦在子，或有用午為胎神者，不可不知，未免略具，擬土神歌於後。歌云「戊己當絕在亥懷，明知子上是胞胎。」云云。
支之胎神作月內生氣，占妻有胎孕亦確，不必作乾之財，惟此胎神臨妻之年命尤好，或臨支上亦同。妻財作生氣，縱不作胎神亦可用。
損胎格 如壬辰日乾上午為發用，又七月占，雖妻財作胎神乘生氣，必後有損孕，緣午作空亡故也。餘仿此。
妾孕格 如辛癸巳日，胎神為生氣，乃妻妾之妹有孕尤驗。如丙丁日胎神在子，如正月占非妻有孕，即是偏房也。
私孕格 如辛癸日乘元有私。外有甲乙日胎神在酉，十月占；丙丁日胎神在子，正月占，非妻有孕，必是偏室婢妾有胎孕也。如作空乘死氣，必是鬼胎也。
互胎格 如戊寅日乾上酉，乃支之胎神，支上午乃乾之胎神，又作夫妻之行年本命，必然妻懷孕喜，不必尋生氣及財神也。乙丑、己未、癸未，乾上子；己未、癸丑、己丑、辛未、丁丑，乾上午；甲申干上卯，庚寅干上酉，已上並是乾上得支之胎神，支上得乾之胎神也。
憂子格 論孕產，乃六合三月占加申、四月占加酉，乃月之死氣克六合，至產則憂子凶，此二例乃天后、六合為子母之類也。
憂母格 如十一月占天后乘辰，五月占天后乘戌，八月占天后乘丑，二月占天后乘未，已上者乃月內死氣克天後也，如至產期必憂母凶。
子戀母腹格 如乾加支、支加乾而互相生者，乃名子戀母腹，利占孕則保育，不利占產，如至產期占之，遲生則吉。外有支加乾而克乾者，主產速，或無克亦產，支為母俯首已見其子也。
損孕格 如壬辰日午加亥，癸巳日午加丑，庚戌日卯加申，辛亥日卯加戌，戊午日子加巳，己未日子加未，甲戌、乙亥日酉加巳午，丙辰、丁巳日子加辰戌丑未，已上例緣胎神作空受克，占產當日便生，占孕必損。
月厭煞 如三月占，不宜申加母年命上，九月占，不宜寅加母年命上，緣死氣作月厭，占產必凶。六月占，巳加母年命，十二月占，亥加母年命上，緣生氣作月厭，占產必速生。
養神二血法 如丙丁、戊己日，胎神在子，養神在丑，如在正月占，言血支血忌皆在丑，並養神而克胎神，如占產生速，如或占孕有損無疑。如在十二月占，言血支血忌皆在子作胎神，如占產亦生速，如占孕亦防損。已上血忌作空亡或坐空鄉，占孕占產亦無妨也。
三元胎格 如寅加亥為生元胎，懷孕之時漸有生意，生下男女，必興旺家門也。如寅加巳為病元胎，如值此懷孕之時，母常有病，生下男女多病不甚長進。寅加辰為衰元胎卦，惟乙未日亥加丑昴星一課是也，懷孕之時，家道日漸衰替，生下男女身軀衰弱，全無生意。
昴星格 剛日生女，或柔日虎視生男，取俯仰而生故也。
胎受克絕格 胎神臨本日及臨絕受克。六壬日午加亥，六庚日卯加申，乃胎臨本日，占產可言當日便生且安好。或六癸日午加亥，六辛日卯加申，乃胎神臨絕受克，占孕占產俱畏。六戊日子加巳，同六甲日亦如前說，且占產稍不畏矣。
小產法 如母之年命上神衝克胎神者，縱作生氣，必是小產，此法極驗。
胎神坐長生格 如丙丁、戊己日子加申，庚辛日卯加亥，壬癸日午加寅，甲乙日酉加巳，大宜占孕，惟不利占產，占得此者反凶。
腹胎格 腹加胎神，醜為腹也。如甲乙日丑加酉，丙丁、戊己日丑加子，庚辛日丑加卯，戊己壬癸日丑加午，如值此，來意妻必有孕，緣胎在腹內，醜為腹之類加臨胎神故也。
腹空格 如天盤之醜作空或落空，如占產則生速，緣腹空而必已誕其右子，占孕必損孕。
全傷格 支干全傷，子母俱凶，獨支受傷害母，獨幹受傷害子。如產期以本月之內破胎之日生，或害胎之日生，或刑胎之日生，或月內生氣之日生，或以子息爻中長生之日生，或以五行養處生，如甲乙日以戌為養神，或以逐季之天喜神所臨之日生妙矣，夫天喜者，乃逐季之養神也。以上不利占孕，反有損。
納音法，又妻本命納音之胎神，衝破之日生產尤驗。
夾定三傳格 如干支夾定三傳，或初末六合，如占產，子母俱不可保，緣氣塞於中故也，如約母之年命透出支干之外，可免母之凶也。
胎財死氣損胎推第二十
戊己日子為胎財，七月死氣在子；庚辛日卯為胎財，十月死氣在卯；壬癸日午為胎財，正月死氣在午；甲乙日酉為胎財，四月死氣在酉，甲戌旬鬼胎空亡，餘亦仿此，全如前篇論，但凡胎神作月內之死氣，婦孕不育。
交車相合交關利第二一 臨機應變，或戰或守，或退或和，視課體而行焉。
交車長生 大宜合本而作營生，庚寅干上亥、支上巳，甲申干上巳、支上亥，戊申伏吟，戊寅返吟。
交車合財 惟宜交關取財，以財交涉最好。辛丑干上子、支上卯，辛巳干上申、支上卯，壬申返吟，辛卯伏吟，癸未午加癸、子加未。
交車脫 雖相交涉而用事，彼此各懷相脫之意，如壬午干上未、支上寅，乙亥寅乙，戊辰酉戊，丁卯戊丁；甲申巳甲，庚寅亥寅各自脫；壬辰酉壬；乙未午乙自脫。
交車害 彼此各相謀害，但不宜相交用事，各有戾害，辛酉伏吟，乙卯伏吟，丁丑午丁，己丑午己。
交車空 如占事始初相交之時，極和極美，後總成畫餅，靡不有初，鮮克有終也。
交車刑 如結交朋友，正和美中必致爭競，各無禮也。丙寅、戊寅伏吟，辛未辛丑伏吟。
交車衝 不論親疏，先合而後離，夫婦、父子、兄弟、客主皆然。丁丑、癸未、甲申、庚寅俱伏吟。
交車克 乃蜜裡砒，笑裏刀之喻也，匿怨而友其人，如相交涉，必至爭訟。庚子丑庚，庚戌卯庚，辛未午辛自克。
交車三交 乃三交為三傳，凡因交關用事，必有奸私，或相交涉二三事。己酉辰己，丁卯戊丁，丁酉辰丁，己卯辰己原文己卯戊己之局有誤，因三傳非三交，子午日無。
交車三合 乃三合為三傳，支支幹交車相合，亦名交合格，凡值此者，家合仁義，外人相助而成合，惟忌空亡。乙丑子乙，三傳巳丑酉；辛未午辛，三傳卯亥未之類。已上謂日乾與支上神作六合，地支與乾上神作六合，故名交車合，凡占皆主交關交易，交加交換而成合也，惟不利占解散諸事矣。此例如六十日內除甲寅、庚申、丁未、己未、癸丑五日系八專日，干支不分，交車無合，其餘五十五日每日一課，更宜詳其相合凶吉而言之，內有伏吟相會合者亦同其說。內辛未日乾上午、支上卯，三傳卯亥未，如占交易，後必齟齬；始見齟齬，後卻和合，因發用乘丁也。又丙寅日返吟亦同。
上下皆合兩心齊第二二 上下同心三軍協力
謂支干上神作六合，地盤支干亦作六合。如乙酉、丙申、戊申、辛卯、壬寅，此五日伏吟者是也。
干支相會格 如乙酉日酉加乙，或乙加酉；丙申日申加丙，或巳加申；戊申日申加戊，或巳加申；辛卯日卯加辛，或戌加卯；壬寅日寅加亥，或壬加寅，緣上下作六合也。
上下俱合格 如日乾與上神作六合，地支亦與上神作六合者。例如甲申日乾上亥與甲乾作六合，支上巳與地支申作六合。丁丑日乾上午、支上子，己丑日同。癸未日乾上子、支上午，庚寅日乾上巳、支上亥。
獨支干上神作六合格 如戊辰日乾上丑與支上子作六合，又戊辰日乾上未與支上午作六合。辛未日乾上寅，又干上申；乙亥日乾上酉，又干上卯；丙子日乾上卯，又干上酉；戊子日乾上卯，又干上酉。
交互六合格 如乾上神與支作六合，支上神與乾作六合。如乙丑日乾上子、支上酉，丙寅日乾上亥、支上申，戊辰日乾上酉，辛未日乾上午，乙亥日乾上寅，丙子日乾上丑，戊寅日乾上亥，每日皆有。內有一字空亡，反為凶咎。已上相合，凡占主客相順，神合道合之象。
外好里槎丫格 凡占皆如其言，緣支干上神雖作六合，奈何地盤支干上神卻作六害也。如壬申日乾上寅支支上亥作六合，殊不知壬干與申支作六害。乙基卯日乾上丑與支上子作六合，其支干辰卯卻作六害，況合空亡而害實在，凡事空喜而實害。辛酉日乾上丑與支上子作六合，俱空，獨留支干酉戌六害。又辛酉日乾上未與支上午作六合，支干酉戌自作六害。乙卯日乾上未與支上午作六合，卯辰支干自作六害。丙寅日乾上寅與支上亥作六合，乾巳與支寅卻作六害。戊寅日乾上寅與支上亥作六合，乾巳與寅支乾作六害。
日辰鄰近格 緣干支相會，上神作六合者，凡占皆主有變換，彼我共謀求合之事也。如壬子日，子加亥與支上丑作六合，又是支加乾兼支干相鄰近也。戊午日乾上午與支上未作六合，支是支加乾兼支干相鄰近，丙午日同。值此例者，客主相順，神和道合。
干支相會格 緣上神相合而不相鄰近者例，亦可相共謀而成合事。丙寅日寅加巳、亥加寅，丙戌日戌加巳及卯加戌，戊戌日戌加巳及卯加戌，壬辰日辰加亥及酉加辰。
彼求我事支傳乾第二三 彼有事必來求於我者
謂初傳從支上起，末傳歸幹上者，凡占必主他人委托我幹謀事體，吉凶皆成，故占吉則吉遂，占凶則凶成，行人至，求取得。如癸酉日初傳從支上巳起，末傳至乾上酉止，乃三傳巳酉醜也。
我求彼事幹傳支第二四
謂初傳從干上起，末傳歸在支上者，凡事勉強，不免俯求於人，亦為人抑勒，難自屈伸，旺相尤吉，死囚不安，又主為卑下所屈，兼禮下求人之意，只宜低心下意，不宜高上，百事不舉，家宅不和，行人未來，病者難愈，死。如丁亥日自乾上酉作初傳起，至支上丑作末傳止也。
金日逢丁凶禍動第二五 海內方寧，不料盜賊蜂起
如有官人占之，則赴任極速，不欲占人行年上神克去六丁所乘之神。常人占之，反宜制丁乘神。謂庚辛二干，三傳、年命、日辰逢旬內六丁神者，必主凶動。如乘勾陳必被官詞勾追；如乘月之死氣，必親族在外府郡報死亡而動往；乘貴人必貴人差往；乘元武主逃或妻有血災，蛇雀尤的。如庚午、辛未二日，見卯是丁神，則因妻而凶動，不然取財而禍起，或先得財而後凶。庚辰、辛巳二日，見醜是丁神，則因父母之墓田而凶動，尤分旺相為田，死囚為墓；內辛巳日晝將順行，醜乘白虎作丁神而遙傷日乾，其凶動尤速。庚寅、辛卯二日，見亥是丁神，則因子息而凶動；內辛卯日晝將逆行，亥乘白虎，凶動尤速。庚子、辛丑二日，見酉是丁神，則因兄弟或己身而凶動，尤分庚日是兄，辛日是弟及己身及祿有動遙；內辛丑日夜將順行，酉乘白虎，其凶尤速。庚戌、辛亥二日，見未是丁神，則因父母長上而凶動，內辛亥日夜將逆行，未乘白虎，其凶亦速。庚申、辛酉二日見巳是丁神，則因官鬼及長上而凶動，尤分庚日主鬼動，辛日主官搖動。
火鬼蛇雀克宅格 緣火鬼乘朱雀而克宅神，其末傳又乘丁而遙克日乾者例，惟庚辰日卯加辰，冬占用晝將是也，如值此課，必遭天火焚伐而怨也。餘有火鬼乘蛇雀而克宅者例。春占火鬼是午，如甲申、戊申、庚申三日並午加申，用夜將乘塍蛇而克宅，宜以井泥塗灶禳之，後例亦同。夏占火鬼是酉，如甲寅、庚寅、戊寅三日酉加寅，用夜將乘朱雀而克宅；乙卯、己卯二日酉加卯，用夜將乘塍蛇而克宅；丁卯日酉加卯用晝將乘朱雀而克宅。秋占火鬼是子，如甲午、庚午、戊午三日並子加午，用晝將乘塍蛇而克宅；丁巳日子加巳，晝將乘塍蛇而克宅；辛巳日子加巳，夜將乘朱雀而克宅。冬占火鬼是卯，如甲辰、戊辰、庚辰三日並卯加辰，晝將乘朱雀而克宅；癸未日卯加未，晝將乘朱雀而克宅；辛丑日卯加丑，夜將乘塍蛇而克宅；壬辰日卯加辰，晝將乘朱雀而克宅。
人宅罹禍格 緣日上神克日，而辰上神乘丁又克日，主身宅皆凶，人且災而宅必動搖，惟有官人占赴任極速，宜乎晝將。凡六庚日巳加庚，六辛日午加辛者，皆丁神臨宅。
蛇虎遁鬼格 專論蛇虎二爻，謂六甲日遁旬內之庚乘白虎在六處，並辛日遁旬內之丁乘塍蛇在六處者，凡占至凶至危，至怪至動，縱空亡不能解救。如甲子日，庚午加戌，三傳戌午寅，又庚午加子返吟，又庚午加丑，三傳辰申子，並用晝將，此乃遁旬內之庚乘白虎而遙傷日乾者例。辛巳日丁丑乘蛇加巳臨宅，三傳午寅戌；又丁丑加申，三傳卯申丑，丁在末傳；又丁丑加酉，三傳酉丑巳，丁在中傳，並用夜將。此乃遁旬內之丁乘塍蛇而遙作日乾者例。
凶怪格 謂月厭、大煞、天目、墓神、丁神，皆主怪異凶災，並臨年命日辰。如乙巳日乾上未，四月占；庚辰、辛巳日乾上丑，十月占，此主極怪極凶。
馬載虎鬼格 如甲寅日申加午為末傳，晝將又乘白虎，又伏吟，又申加戌，又申加亥，並用晝將，戊午日寅加未晝將，戊辰日寅加未，又寅加酉，又寅加亥，並用夜將，白虎克干，餘甲戌及戊申此二日，雖有此例，賴鬼空亡不能為害，其餘日辰極多，不暇細具，凡占主凶速。
蛇虎乘丁格 如乙亥日丑加亥，辛亥日未加亥者，乃丁作白虎而克支辰，必因家宅而有動，不然屋宇塌倒以致損人口，或染災病而不可免。餘日鬼乘丁作塍蛇尤兇尤怪。乙未日乾上酉，夜乘塍蛇亦凶。外有丁神作日鬼乘白虎而克日乾者，未免本身有凶動也。惟有己巳一日卯加巳夜將乘白虎而克乾者是也。
水日逢丁財動之第二六 掠敵人之糧必得
惟畏占人行年上神克去六丁所乘之神，則財不動。謂壬癸二日，三傳、年命、日辰之六處，逢旬內之丁神者，必主財動，及遠方封寄財物付本身之象。如未有妻，則有娶妻之喜，如已有妻，則主別妻之憂。如壬申、癸酉二日見卯是丁，則因子息動而有財。內癸酉日因門戶之財動，或為子息而得財。壬午、癸未二日，見醜是丁，則因官鬼之財動，內癸未日伏吟，與癸丑日同說。壬辰、癸巳二日見亥為丁，則因己身或兄弟黨之財動，內有癸巳日見亥丁馬交加，財動又速。壬寅癸卯二日見酉是丁，則因父母或長上而財動，內癸卯日又因門戶之財動。壬子、癸丑二日見未是丁，則因官鬼之財動，內癸丑日乾上未，並初傳是丁，緣三傳皆鬼，不可取財。壬戌、癸亥二日見巳是丁，則因妻之財動，內有癸亥，巳為丁馬交加，財動尤速，離妻娶妻更的。
財乘丁馬格 緣財神乘丁，或為驛馬者，必因出入求財或因妻動用者，如丁馬交加，必因妻財而非細之動。如己丑日亥為財乘丁馬，甲辰、乙巳見未，丙申、丁酉見酉，戊子日見亥，甲戌、乙亥日見醜。太常乘日之長生臨日乾上者，來人必占婚姻之喜，或有錫賜物帛之事。如六甲日亥加寅，夜將乘太常。六己申加未，晝將乘太常，癸亥日乾上亥，夜常，未巳卯皆財。
太常乘日之長生臨支上者，宅中必有婚禮之喜，或宜開彩帛鋪或開酒食店肆，後有長進。如甲子日夜占，亥加子作太常，為日長生，又是交車合並。甲戌日亥加戌，夜將亦是交車合，乘太常作日之長生，斯二例占婚尤的。甲寅日亥加寅夜，己未日申加未晝。
牛女相會格 緣丑中有牛宿，子中有女宿，子與醜合，乘太常為用。如乙丑、己丑，子加丑；丙子、壬子，丑加子乘太常，大宜占婚姻。內壬子日是蕪淫體，後必不成。
傳財化鬼財休覓第二七 不宜掠軍糧，不可受敵賄賂
謂三傳皆作日之財，而生起乾上日鬼，而傷其日乾者，必因取財而致禍，及防妻與鬼交而損失。餘生支上鬼者，主破家。如辛亥日乾上午，三傳未卯亥，皆作木局為日之財，其財且不可取，欲待不取，奈財在目前，爭忍舍之，設取其財，即生起乾上之午火而作辛金，難免其凶禍也。此財如在虎口，又喻如刀上蜜，焉可舐，稍識事君子見其財自禍而出，必不取之，庶得全身遠害。此例雖不利取財，惟宜以己財而告貴人成其事，言用晝貴，乃以財生貴，必宜僥求關節事，可諧也。餘辛卯、辛未二日乾上午同前說。丁巳、丁丑二日乾上亥，若丁酉日乾上亥，三傳亥卯未全生，但日上見鬼耳，幸為貴德，宜告貴得益，宜為長上占之。若壬戌日乾上未，夜乘太常，三傳全脫，占病則因傷食以致邪祟侵纏，尤恐不救，如得占人年命去其干上之鬼，稍輕。內有丁丑日乾上亥，三傳酉丑巳，其金財不能生亥水，言初中空陷，末作天空，夜占三傳天將皆土，能克去亥鬼，致使財亦不可取，禍亦不傷身，未免經繇，此二事後始無一成。並丁巳、丁酉二日，各視天將言之。
傳財化鬼格 緣三傳作日之財，反生起支上神而作日乾者，此等禍害，必自宅中而發，惟要行年本命上神克制其鬼，庶不致深害。如乙巳未乙，三傳未戌丑，支上申；丑亥丑乙，三傳丑戌未，支上申；丁亥申丁，三傳申酉戌，支上子，惟宜納粟得官，或以財告貴，買恩澤而補授極妙。但有官人占之則吉，必升擢官職也。又如四己日，己卯、己亥、己酉、己未，乾上亥，雖為日財，奈三傳曲直木局，並來傷幹，亦宜納粟求官。
因財致禍格 或畏妻室，如帶凶將，或被妻傷者，緣財爻反克干上之神者是也。如庚辰日乾上丑，初傳寅木為財乘白虎而傷幹上丑土，必被妻傷其命，又被醜旬中之丁作墓而覆日，亦是命運災衰，以致然耳，不然娶惡妻而不孝於父母。
財遁鬼格 緣日上神作財，卻遁旬中乾鬼，必因財致禍，為食喪身，因妻成訟。如甲戌日乾上庚辰，甲辰日乾上庚戌，乙丑日乾上辛未，乙未日乾上辛丑，丙寅日乾上壬申，壬戌日乾上戊午，癸酉日乾上己巳，丁卯日乾上癸酉，戊辰日乾上甲子。
借錢還債格 如辛酉日乾上卯、支上寅，壬子日乾上巳，丙午日乾上申，外有乙未日伏吟，凡干支相同者，不宜求財耳，此曰借錢還債不明也。
傳鬼化財錢險危第二八 占後同前
謂三傳俱鬼，則能去比肩，既無奪財之神，於傳內有一作財現，其財安穩而無破也。謂三合課中雖作日之鬼，兩課俱空，獨存一字，中間為財者，乃名全鬼變為財，其財終是危險中出，縱得之亦不安穩，倘君子識事，必不取其財也。如占人命年上乘日鬼，其禍仍發，亦不為財也。如丙申、丙子、丙辰三日並干上丑土，可以敵其水局，獨存申金為財，如用晝將，少畏龍蛇元皆水獸，恐為禍也。
取還魂債格 緣三傳全為脫氣，反生乾上財神者。例如己丑干上亥，三傳酉丑巳雖為日之脫氣，殊不知金局生起乾上亥水作日之財。己巳干上亥空亡尤為的驗。壬寅返吟，甲戌、甲午、甲申、甲辰、甲寅日乾上戌。又如丁丑日酉加巳用，墓土將生空亡之財，亦如前說。有三傳為脫氣，生起支上財神者，如壬寅、壬戌二日並支上午，甲午日支上戌，亦為取還魂債。
求財急取格 如乙未日未加乙，雖曰財就人格，惟宜速去取之，如緩則財反被未來墓其乙木，卻恐為禍。又如辛卯日卯加辛，雖名財就人格，亦宜速取其財，如少緩，亦被卯木克其戌土，反有害也。
空財格 如丙子日酉加巳，乃空財，如用夜將反生三傳之財，亦宜索債。
危中取財格 緣乾克支辰為財，支上神為鬼者，不免自驚，危中取財。如甲辰日乃甲木克辰土為財，如辰上乘申是也。甲戌日支上申空亡，似乎無畏。乙丑、乙未二日支上酉，丙申日支上亥，丁酉日支上子，戊子日支上寅，己亥日支上卯，庚寅日支上巳，辛卯日支上午作空亡，不可畏之。
眷屬豐盈居狹宅第二九 凡占兵利先舉
謂三傳生其日乾，反脫其支辰者是也，值此必人口豐隆而居宅窄狹也。如甲申日乾上午，三傳辰申子水局全來生日，乃應人口豐盈也，申金為支辰，反生三傳之水局，乃應屋舍窄狹也，如得此課，切不可遷居寬廣之屋舍，恐反生災咎，此造化使然，不可逆天理而妄作也。其餘占別事，即我盛而他衰，我勝而他負，後例准此，乙酉日乾上申，三傳申子辰，又干上巳，三傳亥子丑。
人旺棄宅格 緣三傳生其日乾而克其支辰者，占人雖亨旺而無正屋可居，縱為官多是寄居，或欲逃亡而棄其家尤的。如丁未日卯加未，又亥加未用，癸卯日酉加巳用，甲午日子加丑，丙戌日卯加辰用。
贅婿卦 緣支加乾而被乾克者，其支上又乘脫氣，或克支者，必無正屋可居。如丙申日申加丙，亥脫申；丁酉日酉加丁，亥脫酉；戊子日子加戊，未克子；己亥日亥加巳，卯脫亥。
屋宅寬廣致人衰第三十 占兵利為主而後應，或營空虛
謂三傳竊盜日干反生支辰者是也，凡值此課，必宅不容人居止，不然人口少而居寬廣之屋舍，致使人口日漸衰羸，患難俱生，惟宜棄此住場而別遷居止，庶免此患。余占事皆我衰他旺，我負他勝，後例准此。如甲辰日戌加寅，甲戌日寅加戌，又壬午日未加卯。
賣宅備患格 緣三傳生支克干，惟宜兌賣宅舍，以錢預備災患之費，如癸酉日辰加丑用，己巳日卯加未，丙寅日子加丑，癸酉日伏吟。
獅獸衝宅格 緣對鄰獸頭吻衝其本家，或有獅子道路衝宅，以致家道衰替，如對鄰空亡不足畏也。如壬辰日，申加戌作白虎，衝支上寅；辛巳日伏吟，亥作虎衝支上巳；甲午、庚午二日伏吟，子作虎衝支上午；辛丑日酉加未作虎衝支上卯。
血厭克宅格 緣天后乘血支、血忌作月厭，臨支克支，凡交易買賣鋪店，皆宜忌此。如七月癸亥日，辰作天後加亥，乃夜占，緣七月血忌在辰，月厭亦在辰，又墓克其宅神故也。止有七月占有血忌與月厭同處，餘中有天后臨血支、血忌之例。
三傳遞生人舉薦第三一 生幹客勝，生支主勝
此格有二等，一自初傳生中，中生末傳，末傳生日乾；一自末生中傳，中傳生初傳，初傳生日乾。凡占值二例，必隔三隔四有人於上位推薦之意，所謂皆賴眾人之說。如欲幹官及請舉文狀，皆宜得之，必得始終成就也。惟宜詳初末空亡，如值空亡者，雖有舉薦之心，終無成就之實，乃便作閒話多赤心少之語也。如辛丑日，卯加丑為初傳，生其中傳巳，中傳巳生末傳未，未土生辛干，此中空末落空，如年月並幹事人命填實可成。又辛酉日乾上寅，癸未日乾上卯，甲子、壬申、壬辰、甲申、壬寅、壬子、壬戌並干上午；丙子、丙寅、丙辰、丙午、丙申、丙戌干上申，三傳申亥寅，此數日內有傳空者，有傳不空者，如丙子初中空，丙寅中末空。
將生財神格 緣三傳作財，其天將又生財神者，大宜取財，如六丙日酉加巳夜。
支干相生格 如壬戌日乾上申，支上未土生申金，金來生日，可無畏未為鬼，然後作福。
兩面刀格 如六戊日伏吟，巳申寅，末傳寅能助初生乾，亦能克干，俗諺云，成也蕭何，敗也蕭何，作兩面刀。
外有三傳生乾，天將又生傳者，例如六癸日三傳酉丑巳，或巳丑酉，晝占天將貴常勾。
三傳互克眾人欺第三二 克幹客敗，克支主敗
此例亦有二等，一初克中，中克末，末克日乾；一末克中，中克初，初克日乾。凡占值此二例，必有人遞互而相克害我也，或使眾口一詞，總相欺凌，或如常人所為凶橫，遂被他人雷攻狀論。如或見在朝官占得此課，宜自檢束提防，恐有台閣上言之患。如丙辰日初傳寅加酉，克中傳未，其中傳未克末傳子，末傳子克日幹丙火。辛酉日乾上卯，己巳日伏吟，六戊日伏吟，如丙子日，末傳寅加未，克中傳未，中傳未克初傳子，初傳子克丙火日乾。
求財大獲格 如庚辰日乾上丑，三傳寅未子，自庚金克初傳寅為財，初傳寅木克中傳未土，中傳未土克末傳子水，總為財，故求財可以大獲。此法極好，他課例推。又如乙酉日未加寅，或如乙丑日乾上酉，三傳寅未子俱同。
土將助財格 如六丙日酉加巳，三傳皆財，夜將又皆土神，盡生起財神，大宜求財事，尤宜成合萬事，卻不利父母，占病列，兼此人不義，多貪橫發。
雀鬼格 朱雀作日鬼加乾，如在朝官，防彈章，及不宜上書獻策，反受責黜。六丙日乾上亥夜，六庚日乾上巳暮，六甲日乾上酉夜，六戊日乾上卯晝，壬癸日未乘雀晝貴順行有之，但不臨乾，如臨年命亦可用。
三傳內戰格 緣三傳俱下賊上，迤邐克去，遞相侵伐，乃名三傳內戰，凡占必是有窩犯，訟自家庭而出。如癸酉日，未加寅下克上，中傳子加未受克，末傳巳加子亦受克，且天盤未克子，子克巳，地盤寅克未，未克子，盡相傷伐而無窮也。又如戊辰日寅加酉為發用亦同。
有始無終難變易第三三 占兵有先後，互為勝負
此一句，乃是二項事體。夫有始無終者，乃因初傳是日之長生，末傳為乾之墓是也。夫難變易者，乃初為干墓，末為乾之長生是也。如乙未日，初傳亥加未為乾之長生，末傳未加卯為干墓。占得此例者，如初起謀事之時，如花似錦，後將必無成合。又如乙丑日亥加丑，初傳亥，末傳未，皆自生傳墓也，亦如前說。又如丙寅日戌加寅，初傳戌為干墓，末傳寅乃丙火長生之地，占事先難後易。又如壬子、壬寅二日，辰加寅為初傳，申加午為末傳，此乃自墓傳生，先迷後醒，如占得此例，謀事之初，雖值艱難，已後卻有成合，凡占未免先暗後明。
舍損就益格 如甲辰日丑加甲，醜乃日之破碎，支上卯又作六害，又是乾之羊刃，宜棄此而就三傳子亥戌為生乾，凡占不免舍無益而就亨旺也。占得此例，一則有壽，二則自微至顯。又如甲子日亥加甲，六月占，乃父母爻作空亡，又是死氣，又為木之長生，主父母災，如父母歿後不論。餘極多，仿此。
苦去甘來樂里悲第三四 不成功處反成功
此一句亦宜分為二項說，且夫苦去甘來者，如戊午日，末傳申生中傳亥水，中傳水生初傳寅木，而克日乾之戊土，誠為被寅木之苦，殊不知反賴末之申金部克其寅，又為戊土之長生，乃應苦去甘來之喻也。凡占未免先受磨折，後卻安逸。又如六戊日伏吟，乃初克中，克末，末克日乾，亦是先被寅苦，殊不知又賴寅徑生其巳火而生戊乾也，以上二例，亦可作成敗蕭何。
一喜一悲格 如癸亥日，乾上戌乘龍克日，乃幸中不幸；支上申乘虎生日，乃不幸中幸。又癸卯日乾上申乘虎，支上戌乘龍；又壬寅、壬子，戌加子發用，夜將同。如乾上長生於月令無氣，卻喜傳中見鬼，乃甲日上見亥，月令無氣，傳中見申酉為可生亥水也，亦名不幸中幸。
樂里生憂格 如庚寅日乾上巳乃庚金之長生，支上亥乃寅木之長生，此乃先各有長生之意，然後遞互相參，其庚金反被亥水脫，寅木又被巳火脫，卻反為兩邊脫盜，凡占皆然。又甲申日乾上亥、支上巳同前。庚辰日乾上戌生乾，支上午辰，此例止宜坐待用事，盡有其益，如若動，其支干皆坐於克鄉。如庚午日乾上辰土生庚金，支上寅木生午火，亦宜坐用，倘動，其支干坐於脫氣鄉。如庚子日乾上巳作乾之長生，殊不知巳火亦能克庚金，且支上酉生支，殊不知水敗於酉。如癸酉、癸丑、癸巳三日，酉加癸晝占，三傳雖金生日，其天將皆來傷日，雖有面前之生，背後反為深害，占病死，占訟刑，乃應俗諺云：貪得一粒粟，失卻半年糧。凡占俱如是。如庚辰日乾上巳，雖曰日之長生，卻被末傳生中傳，中傳生初傳之巳火而克庚幹。丙申日夜占，乾上申，三傳申亥寅，初傳申加巳作日之財，受上下夾克而無用，中傳為日之鬼，末傳乘虎遁壬水克干，先是初生中，中生末，末生日乾，後卻變出許多不美，亦如前說。已上諸例，變宮商薤露。
恩多怨深格 緣乾生初恩也，初生中，中生末，末卻克日乾，反成仇是也。如己巳日，申加巳生中傳之亥水，中傳水生末傳之寅木，反克日乾之己土。乙亥、乙未、乙巳、乙卯四日午加亥用。
不幸中幸，幸中不幸格 緣白虎卻作長生，青龍卻乘日鬼是也，凡占皆然。如六戊日伏吟，晝占三重白虎作長生，乃不幸中幸；如夜占三重青龍作日乾之鬼，乃幸中不幸。外有戊己日返吟，三月占，生氣克日，主病，死氣生日主生。
人宅受脫俱招盜第三五 占兵主客俱不利
此例亦有二等，一則支上干上皆乘脫氣；一則乾上脫支，支上脫干。以上二例，凡占人被脫賺，家宅必被盜竊財物，如占病定然起蓋屋宅費用，以致心氣脫弱而成虛憊，宜服補元氣藥餌獲愈。內有支干遞互相脫者及相交涉，必是我欲脫漏彼，彼亦早辦脫漏我也，既各懷脫漏之意，故應道典云：天網恢恢，疏而不漏。
遙克、昴星、別責，乘空落空為初傳發用，將乘元武者，凡占定主失脫，此法極驗。如乙亥日蒿矢，酉元加亥用；丙子日彈射，申元加子用晝將；己巳日彈射，亥元加酉；辛丑日別責，巳元加申夜將；庚午日昴宿，戌加酉晝將夜將有之。又有庚子日元首，辰空元加子晝將皆乘元武；辛亥卯加戌晝將，此等日乃空亡乘元武為用，但初傳不系遙克並昴星。
財空乘元格 或臨支發用，亦防失脫。如甲子日戌加子，晝占上乘元武，此例極多。
鬼脫乘元格 緣日鬼或脫氣乘元武，來意占失脫，為發用尤的。如己酉日卯加酉晝，辛丑日亥加丑夜。
干支皆敗勢傾頹第三六 占兵同前
謂干支上皆逢敗氣者，占身氣血衰敗，占宅屋舍崩頹，日漸狼狽，全無長進，更不可捕捉奸私，告訐他人陰事，倘若到官，必牽連我之舊過，同時敗露，各獲罪也。其餘占用，彼此皆值衰敗，乃應俗諺云：「殺人一萬，自損三千」之意也。如甲申日乾上子、支上午，庚寅日乾上午、支上子，丙申、丙寅日乾上卯。
破敗神臨宅格 緣支上有敗氣，又為破碎煞，必宅中有人不利，而致日漸衰殘，家道破敗，宜詳其破敗者類神是何人。如己巳、己亥二日，乾上乘酉，乃乾之敗氣又作支之破碎，故總名為破敗神也。以類推之，晝占必家中有破敗之子，緣酉為己土之子息故也；夜乘天後因妾敗。又戊申、戊寅日乾上酉，壬寅、壬申、癸巳、癸亥四日乾上酉，並同其其酉為婢類，亦緣酒色而敗家。其餘破敗神臨之同說。一說破敗神臨乾主凶，非臨支。
末助初兮三等論第三七 占兵視其或利主或利客
謂末傳助其初傳而生日乾者，亦有末助初而克乾者，亦有末助初傳而作日之財神者，此三等皆是，傍有相助而和各成其上說。內末助初生日者，欲年命制末始可言吉，年命生末反凶。如庚午日乾上午，三傳午辰寅，末傳寅加辰，生起初傳午火而克伐庚金，末傳之寅木乃教唆詞訟之人也，其為公曹吏道士，為胡須人，或屬虎人，或姓從木，詳天將逐類而言而之，尢不宜求財取財，反為禍也，又庚辰、庚申二日寅加辰，辛未日卯加戌，甲辰日辰加子。
抱雞不鬥格 緣己亥、己酉日卯丑亥為傳，庚寅日午辰寅為傳，癸亥日丑卯巳為傳，雖末助初而克日乾者，因初傳或空亡或落空本無意克其日乾，其末傳徒為怨憎，奈初傳無力終不能克干，故取喻於抱雞不鬥之例也。
枉作惡人格 如庚戌日午辰寅為三傳，末空，乾上午；又庚子日午辰寅為三傳，末傳落空亦是。末助初傳而克日乾者，緣末傳空亡不能助其初傳，其教唆人必自敗露，所以喻枉做惡人也。
謁求禍出格 乃支上神作財生乾上神為鬼者，大不利謁貴求財，犯之即有禍出。如甲子甲午日乾上酉，甲辰甲戌日乾上申，乙亥乙巳日乾上酉，乙卯乙酉日乾上申，丙寅日乾上子、又干上亥。
二等者，如辛酉日末傳巳加子助其初傳之未土生日乾者例，必傍有人暗地相助推薦而致亨旺，如值末傳空亡，亦名閒話多赤心少也。六戊日伏吟，己巳伏吟，己丑、辛亥、己巳、己卯、己亥、己未、辛酉七日並干上子。
三等者，如甲辰日乾上子，三傳戌申午，末傳午加申，助其初傳之戌土而作甲乾之財者，凡占值此，必暗有人以財相助也。如占博奕，宜此末助初為財者作例，來意占婚尤的。如甲寅、甲午、癸未日乾上子。
末助初傳作日財反克干上神者，如甲子日乾上子，三傳戌申午；又壬申日乾上酉，三傳午辰寅同。
自招其禍格 緣年命自助其初傳而克乾者，乃自招其禍，必致患害也。
閉口卦體兩般推第三八 捕盜亦可察
《心鏡》云：陽神作元武，度四是終陰。閉口卦止宜捕盜賊而追逃亡，此課縱值，目前時師多未嘗拈出，故立成法於後。
地盤旬首上神乘元武者，每日有一二課推之，如甲子旬中，甲子日辰戌加子，晝夜皆乘元武；戊辰戌加子晝夜，乙丑日卯加子晝，乙丑日亥加子夜，戊辰日辰加子夜晝，庚午日戌加子晝夜，庚午日辰加子晝夜，己巳日卯加子晝，己巳日亥加子夜，丙寅日伏吟夜，丙寅日申加子晝，丙寅日寅加子晝，丁卯伏吟夜，丁卯日返吟夜。
甲申旬中，甲申日辰戌加申晝夜，戊子日辰加申晝夜，又戌加申晝夜，庚寅日辰戌加申晝夜，乙酉亥加申夜，卯加申晝，丙戌日子午加申夜又返吟、伏吟晝，丁亥日午子加申夜、返吟伏吟晝，壬辰日子午加申夜、返吟伏吟晝，乙酉日巳加申夜、酉加申晝。
甲戌旬中，凡甲戊庚返吟、伏吟晝夜皆是，乙亥日巳亥加戌夜、卯酉加戌晝，己卯日卯酉加戌晝，己亥加戌夜。
甲午、甲辰、甲寅三旬，止有天盤之旬首乘元武，無地盤旬首乘元武，因元武不到東南方也，亦可如其說。凡旬尾加旬首作元武者，惟甲子甲申二旬，甲戌旬無之。
旬尾加旬首為發用者例，更值初末上下六合，則氣塞於中，如占病即是啞重或患禁口痢，不然咽喉腫塞，或痰厥症，不納飲食，如占胎產定是啞兒，如占失脫縱有傍人見其賊盜竊物，竟不肯言之，凡求人說事，人但閉口而不語有無之意。余占更詳天將而言其事類，且如上乘貴人，告貴不允，上乘朱雀，占訟屈枉難伸，乘白虎占訟使人不明而伏罪，餘皆仿此。但不免應閉口之意，此法尤好，如甲申、丙戌、丁亥、壬辰、庚寅日並巳加申用，甲寅 、戊午、癸亥、丙辰、丁巳、己未、庚申日並亥加寅，內惟丙辰 、丁巳為閉口發用，若甲午、庚子、丁酉日卯加午，甲辰日丑加辰，乙巳日丑加辰，甲子、丁卯日酉加了，甲戌、乙亥、未加戌，以上不必皆屬閉口發用，但旬尾加旬首即有閉口之意，六旬中皆有。
祿作閉口 緣辛未日酉加寅，大不利占病，緣日祿作閉口，非旬尾加旬首，如乙未日卯加申酉，夜又乘白虎，或乘元武，不在傳課，就天盤言也，亦非旬尾加旬首，辛未日酉加戌夜亦乘白虎，外有丙戌、戊子日巳為閉口祿神，但不乘虎，壬戌日亥為閉口，亦無白虎。
財作閉口或食神空亡 皆如前說。丙寅日干支上酉，丁卯日干支上酉，甲戌日干支上未，壬辰、癸巳日干支上巳，庚子、辛丑日乾上卯，甲辰、乙巳日干支上丑，戊午、己未日干支上亥。
太陽照武宜擒賊第三九 不利劫營伐路
謂元武坐於太陽月將之上，占賊必敗，緣賊人喜夜而可以隱形，豈宜被太陽之光照耀，以致盜賊之形現露，不勞捕捉，必然自敗，縱太陽月將乘天空或作空亡，及坐空亡尤好，緣太陽不被雲翳，更光明也，惟畏占時在夜，賊反大幸也。尤宜逐季推尋日出日入之時，極准。如止以卯為日出，酉為日入，則元武止有臨地盤之申上者為晝，緣不臨地寅卯辰巳午未故也。如推究節氣，日出日入，則元武縱臨酉戌，尚可作太陽照武之用也。如壬申日返吟卦，十月占，且支上寅木乃是日之盜氣，上又乘元武，必是家中人作盜，後必敗露，緣寅為月將照破元武故也。如辛亥日亥將戌時，三傳丑寅卯，此課所合主失脫而無疑也，緣乾上亥是日之盜神又乘元武，又初傳是日之墓神，中傳雖寅卯為日財，又是旬空，雖是太陽照武，奈何是戌時，太陽已歸地下，其賊難獲，此例極多，餘皆仿此。至元武雖不臨太陽之上，如於卯辰巳午申天盤之上者，尚可捕盜，或元武臨天馬六丁，更臨酉戌亥子丑上，其賊終不敗露，必至遠竄。如占失財，其財坐長生之上者，終不致失，或所失物類坐於長生之上者，亦不至失也。
天網四張格 最宜占賊必獲，謂用神與正時同克日是也，惟在破網卦反難捉賊矣。破網者，有神克其初傳是也。
賊向防連坐者例 緣元武所臨之神有神作六合是也。如元武加子臨丑，子與醜作六合故也。
捉賊不如趕賊格 假令甲日占，以申為賊，不可便以丙火克克之，雖去其鬼賊，亦竊甲乾之氣，尤憂所費，以此推之，不如以壬水暗竊其申金尤生其甲木為妙。
游都下捉賊必獲，游都煞者，甲己日醜，乙庚日子，丙辛日寅，丁壬日巳，戊癸日申。
玄武加丁主失脫。
賊捉賊格 如壬癸日辰戌未丑等為傳，三傳自相刑衝，可以凶制凶，又內有四金字可以化鬼也。又元之本家上神能制元亦是。
鬼作生氣，賊來不已，如日之劫財，或占失財，亦以此為賊，或鬼賊本家與元武本家上神乘太陽，占盜立獲。
後合占婚豈用媒第四十 大過九五枯楊生花，家人九三嗃嗃嘻嘻，占兵有敵與臣下私謀者
謂乾為夫，支為妻，凡占婚全看此，豈宜支干上乘天后、六合，以應私情，那更女之行年居在乾上，男之行年居在支上，此乃私情，先相交通，至嫁娶之時，何有用媒伐乎。如占婚值此者，必有有先奸後娶之意也。如丁卯日乾上寅，晝乘六合，支上戌乘天後，又干上子夜乘六合，支上申乘天後，又干上戌乘天後，支上午乘六合夜。更看那邊空亡，審其真偽，如值空亡，則雖乘天后、六合，既已坐空，乃止懷虛意也。
富貴干支逢祿馬第四一 功成受賞
謂乾上有支驛馬，支上有干祿神者，故名真富貴卦，凡君子占之加官添俸，富貴雙全，常人占之，病訟俱凶，宅移身動。如丙寅日乾上申，乃支驛馬，支上巳乃干祿，餘仿此。
尊崇傳內遇三奇第四二 如占大吉有成功封拜之喜
且夫三奇者有二等，有三傳全遇甲庚戊者，有三傳全遇乙丙丁者。其法亦有二，有遁旬中之乾者，有遁五子元建之法者，凡值此二例，君子占之，官居一品之尊，貴入岩廊，縱使常人占之，雖無吉泰之兆，亦可消除災禍。
遁旬中之乾者，如己卯日乾上午，第四課發用，初傳丁丑加寅，中傳丙子，末傳乙亥。又己巳日丁卯加辰，丙寅加卯，乙丑加寅，又壬申日初傳乙丑加子，中傳丙寅，末傳丁卯。戊辰日初傳丁卯加辰，中傳丙寅，末傳乙丑。
遁甲己還生甲者，如辛巳日乾上午，初傳甲午加戌，中傳庚寅，末傳戊戌。己酉日初傳乙亥加戌，中傳丙子，末傳丁丑，餘仿此。
害貴訟直作屈斷第四三 雖有深謀密計，終主敗露無成
如甲申日未加申為夜貴，乃日之墓神，丑作晝貴，又受寅木克，又作天空，初傳子與未又為害，如占訟理雖直而必致曲斷，事小而必大凶。余占皆弄巧成拙，止宜識時而屑就，庶不為大禍，其餘五甲日未加寅用夜貴，亦如其說。又如乙酉日未加寅作初傳，害中傳之晝貴，其象稍相類占，亦如前說，曲直作鬼枷錮，如六己日逢曲直課也也，卯加亥先曲後直，卯加未先直後曲。凡申加午為白虎投朱雀，午加辰為朱雀投勾陳，皆主訟。
課傳俱貴轉無依第四四 李廣不封侯，樂毅見疑
如丁酉日第一課，乾上酉乃夜貴，第二課酉上見亥乃晝貴，第三課酉亥相加，第四課又歸亥鄉，然後三傳酉亥丑，此四課三傳，皆是晝夜貴人所聚，名曰遍地貴人，貴多者不貴，凡占不歸其一，反無依倚，或權攝所委不一，托事無成，如用夜貴，乃名咄目煞，如貴人咄目專視，反坐罪也，大不利告貴，占訟尤凶，外有三傳皆是貴人者亦可用，辛巳日乾上午，丁卯日乾上酉，乙亥日乾上子、又干上午。
晝夜貴加求兩貴第四五 亦可請謁於諸侯
謂六處有旦暮天乙相加者，如占告貴求事，必干涉兩貴人而成就。或占謁貴，必不得見其貴人，緣貴人往見別貴，多不在宅，縱然在宅，必會貴客而排筵，蓋貴臨貴位，乃官人見官人也。如是同官，占之反宜謁見。已後雖值晝夜貴人相加在傳，視其合用之貴，如值空亡，不可照前說，如六丁日亥加酉晝，丁巳、丁亥、丁丑日酉加亥夜，六丙日酉加亥夜，六癸日巳加卯晝，癸未卜先知 、癸亥、癸巳、癸酉日卯加巳夜，辛酉日午加寅晝，辛巳日寅加午夜，乙酉日子加申晝，申加子夜，甲戊庚日返吟，餘雖有之，緣不在傳課，故不具載。
貴覆干支格 緣干支上皆乘晝夜貴人例，凡占亦得兩貴人周全而成事，如甲申日乾上丑、支上未，庚寅日乾上未，支上丑，己卯日乾上子、支上申，己亥日乾上申、支上子，丁巳日乾上亥、支上酉，丁酉日乾上酉、支上亥。
兩貴空害格 如己卯日乾上子、支上申，用夜貴乃空亡之貴加宅上，又克宅，乾上之晝貴卻作勾陳，又為六害，凡占必家庭神位不齊，尊卑相厭，邪正同處，以致人口災患，又不宜告貴，告貴反逢其怒，或夜貴人加在晝貴人上，宜求關節也。
貴人差迭事參差第四六 權臣在內，忠臣不能在外立功
謂晝貴臨於夜地，夜貴卻臨晝方，故名貴人差迭，如占告貴人求事，多不歸一，如俗諺云：尖擔兩頭脫也。此例極多，不暇細具，或每日有二課者，但仿此而言之。如甲子日醜為晝貴坐在酉上，未為夜貴卻坐在卯上是也。
貴人順治格 緣一日內全無逆貴人者，凡告貴皆順，竟無阻卻，兼宜催督複進取。唯有巳為月將，甲戊庚日有之，內有空亡貴人乃無用，如醜未坐於辰戌上，貴人怒嗔。
貴人逆治格 緣一日內全無順貴人者，凡告貴竟無相允意，止宜退步，不宜進前，如進則反受挫，惟亥為月將，甲戊庚日有之，內忌空亡。
日貴在夜，開眼作暗。
夜貴在日，自暗而明。
貴在乾前事不宜迫，迫則反為貴所怒，事必無成，貴在日後，事宜速催，不催事反被散漫，久必有災。
貴雖在獄宜臨乾第四七
謂天乙貴人加臨地盤辰戌上者，雖名入獄，如是乙辛二日占，卻名貴人臨身，反宜幹投貴人周全成事。其餘八干，晝夜貴人坐地盤辰戌之上，始名天乙入獄，幹官貴怒，惟宜私謀陰禱，亦名貴人受賄。如辰戌二日占之，乃為貴人入宅，非坐獄論也。
鬼乘天乙乃神祗第四八 當行反間，可得敵人之助
如六辛日午加乾，如用晝占，雖是日鬼臨身，緣為貴人，切不可作鬼祟看，占病必是神祗為害，如臨宅上者，必是家堂神像不肅而致病患，宜修設功德安慰宅神，庶得無咎。又六丙日晝將亥加巳或亥加支，六丁日晝將亥加未，或亥加支，六乙日申加乙或申加支。
空亡貴人格 緣貴人作空亡者，亦是神祗撓害，占訟大凶，亦為之閒貴人尤忌。
貴人作墓格 六甲日醜為夜貴作墓神加乾，六庚日醜為晝貴作墓神加乾。
貴人脫氣格 如六壬、六癸日以卯為夜貴作脫氣，必被貴人脫賺，或神祗降殃，以致脫耗。
兩貴受克難干貴第四九 棲棲皇皇，終身不遇知己之主

干上乘支之網，支上乘乾之羅者例，凡占事我欲網羅他，他已網羅我，互相暗昧，如庚寅日乾上卯、支上酉，餘干四絕體中多有。值干之天羅地網，有官人主丁父服；值支之天羅地網，主丁母服。丁丑日乾上寅為互網，又干上申為皆網，癸未日乾上寅申，己丑日乾上寅申，庚寅日乾上下班卯酉，丙申日乾上午，庚申日乾上酉，戊申日乾上午，壬寅日乾上子。
天網自裹己招非第五六 霍光有廢立之功，卒招夷族之禍

丁神厭目格 如乙巳日未加乙，乃墓神覆日，如夜占上乘塍蛇，如四月占，又為月厭，亦是飛廉大煞，亦是天目煞，又乘旬內之丁神，如占人未為本命，必是夜多怪夢而至身位災衰，亦宜禱禳上天星煞，庶免極凶。餘甲辰旬中，遇未加支於四月占，皆如前說，必宅中多怪現形，蓋未為丁神乘厭目等凶煞故也。

如丙午日乾上寅、支上卯，此支干全生，豈宜俱空，其第二、第四課卻全見鬼賊。如壬午日乾上申，雖為日之長生，奈是旬空，既見生不生，不如無生，不免尋初傳巳火為財，又坐空鄉，又為破碎，及至破費錢財，豈宜中傳見寅為脫氣，及支上卯木並力而盜脫其日乾之氣，以此推之，得之不足，費之有餘，亦喻所得不償所費。又如癸未日乾上申金，乃長生作空，支上寅木乃脫氣卻實。又戊子日乾上午雖是生氣，奈是旬空，既生我者空亡，豈宜三傳寅卯辰皆鬼，引起乾午反為羊刃，其凶難免，如亥子本命稍緩。又癸未日丑加巳，三傳金局生日，豈可初末空亡，獨留中傳丑土不空，並晝將貴勾常土將盡來克幹。又乙巳日乾上卯空亡，情願以干加支而受脫也。以上總皆生空，脫與鬼皆實論耳。
得少失多格 如甲寅日乾上卯，乃日之旺神，三傳辰巳午，彼此引入初傳，辰乃干上卯之六害，中末盜氣，此所謂貪他一粒米，失卻半年糧也。

謂辰之華蓋作乾之墓神，臨於乾上發用是也。凡占身位，多昏多晦，卒難明白；或遭冤枉，難以分訴；占行人不歸，盡在彼處不如意也。如壬申，壬辰二日辰加壬為用；乙亥、乙未二日未加乙為用。
太陽射宅屋光輝第六十 無邀正正之旗，無擊堂堂之陣
如丙午日戌加午，乃是支墓，如占家宅，誠為宅舍不亨快，如用戌為月將，反名太陽輝照家宅，其屋必向陽而明朗，不然常有上人光飾尤勝。如太歲、貴人入宅更美，其餘占彼我，乃我不利而利於他人，以支屬他人也。又如乙卯日子將卯時，此乃太陽作貴人而生宅，如占宅下必有寶藏，或是子年占之，其年必產貴子，其子雖是旬空，緣太陽乃懸空之象，不畏空亡故也。餘論太陽惟忌坐於夜方而不可用，或太陽臨身甚宜辨明雪恨。

外有六乙日晝貴順行，雖是未乘白虎，上有臨行年本命上者，即無加乾者也，夏占稍輕，緣未旺亦為庫也，餘干無此例。

謂乾被支上神克，支卻被乾上神克者，為蕪淫卦，既名蕪淫，何又云夫婦各有私乎？繃夫婦乃人之大倫，既無夫婦好合之情，必有奸私不協之意，卻詳何處有情而言夫婦之私情也。如《心鏡》中以甲子日乾上戌，支上申一課為例，乃甲將就子受申克，子近甲兮魁必侵，妻懷內喜私情有，申子相生水合金是也。餘有癸巳、壬午干上子，庚子、乙亥干上丑諸例，凡占不可執為蕪淫卦，非專言夫婦而已，如先有人相允許，後各不相顧接，非獨存無情，尤彼此各懷惡意。
真解離卦，緣乾克支上神，支克干上神，或夫婦行年又值此者尤的。如甲子日乾上午、支上辰，乾克支上辰土，支克干上午火，如男命年在支上，女命年在乾上，此時占人必占解離事，已後例內唯詳空亡而言之，小畜九三，輿說輻，夫妻反目。

夫關神者，春丑、夏辰、秋未、冬戌。如乙丑、乙未、乙酉、乙亥四日於秋季占之，未乃乾之墓作關神為發用，臨於乾上，乃應人口災衰。餘六甲日除甲辰秋占未作丁更凶，其餘各占皆如前說。如丁卯日戌加卯為發用，冬占乃干墓臨支上，乃應宅頹廢，餘仿此。
墓神覆日作生氣格 如占作庫務差遣必得，勿作墓看之。
支墳財並旅程稽第六六 鐘鄧終沒於蜀
謂地支之墓作日乾之財者，必主商販折本，在路阻程，凡謀蹇滯不亨通也。如甲子日辰加子，乃支之墓神而作乾之財為發用；甲午日戌加寅用，甲午日戌加子用，乙酉日丑加辰用。
疑惑格 卯酉日占事，如行年又在卯酉之上者，必行人進退疑惑，此《心鏡》內龍戰卦中具載，尤忌天車煞。天車煞者，春丑、夏辰、秋未、冬戌也。
受虎克神為病証第六七 受虎克之國民流兵疫
金神乘白虎，必是肝經受病，可治肺而不可治肝。
木神乘白虎，必是脾經受病，可治肝而不可治脾。
水神乘白虎，必是心經受病，可治腎而不可治心。
火神乘白虎，必是肺經受病，可治心而不可治肺。
土神乘白虎，必是腎經受病，可治脾而不可治腎。
以上諸法，常得靈驗，惟虎受克及家亡，不必治也。
運糧神格 占治病專視日乾之食神，尤妙干、行年乘之，乃名運糧神，忌空。
祿糧神格 緣宜觀乾之祿神，亦名祿糧神，唯不可落空亡及作閉口，或受克。如占久病值此，必絕食而餓死。如辛未日酉加寅，乃是祿坐絕鄉，又作閉口，又名無祿卦，占病必死，占食祿事亦忌。
絕體卦乃是柔干之祿受絕，返吟卦乃是剛干之祿受絕，絕嗣體先亡為祟。
生死格 宜觀生氣死氣尤驗。如正月生氣在子，死氣在午，乃生氣克死氣也。如在甲寅旬中占之，乃生氣空亡而死氣實在，占病可畏。如行年上神是亥水尚可醫療，緣亥水克其午之死氣故也。如死氣克生氣，又落空亡，或行年上神生其死氣者必死。如生氣與死氣不相克者，占病雖無妨，但遷延而未即痊瘥也。
白虎乘日鬼而作空亡，必已病而未瘥。
虎墓格 緣日乾之墓乘白虎在六處者，如占病必是積塊病，宜以破積藥治之，如六乙日晝將順行，乃未乘白虎；內乙酉日未空亡無畏，或易療，非年深積塊也。又六辛日晝將順行，亦醜乘白虎，辛酉日醜空亡，亦容易治療。
虎乘丁鬼格 如六辛日有白虎乘丁者，占病必知所患疼痛之處也。如辛卯日亥加丑作中傳，晝占乃亥乘白虎作丁神，必為頭疼以致不救，餘觀丁虎類而言之。丑為脾疼或腹疼，卯手疼或目疼，巳齒疼或咽喉疼，未胃疼或積塊疼，酉大腸，亥臨戌亥子丑寅卯為頭，亥臨辰巳午未申酉為腎，餘逐類言之。如日鬼臨於六處不乘白虎，但擬其鬼亦為病証，如火為鬼便言肺病，水為鬼便言心病，金為鬼便言肝病，土為鬼腎病，木為鬼脾病。如鬼受克並空亡不必療亦瘥。
蒿矢卦亦宜言有疼痛處，金加火上，筋骨疼痛，惟庚日申酉加巳午尤的。
連茹卦作日之財，占病必因傷食而得，如人年命上神能制其財神者，尚可醫療。如年命上神生其財神者，必致死亡。
斫輪格 如卯加申，戌加卯，占病必手足不舉，或有傷。
空祿格 緣日之祿神作空亡又坐克方，占病必絕食而餓死。如甲辰日寅加酉，夜又乘白虎，返吟夜；乙巳日卯加申夜，返吟夜；丁亥日午加亥夜，日之食神在禁方與前課同。
祿神閉口格 緣祿神作閉口，為旬尾乘白虎者是也。如乙未卯加申，又返吟夜；丙戌、戊子，巳為祿神閉口；辛未日酉加戌夜；壬戌日亥為閉口祿。
六片板格 緣六合乘申臨卯，為尸入棺。緣申者身也，於三月占尤的，乃是死身，即死尸也，且上有六合，下有卯木，是為棺也。尸入棺，占病必死，尤宜詳其類神而言之，或申加卯不乘六合，於九月占，但病在床而未愈，緣申是生氣，卯為木床。癸卯日申加卯，占父母長生病死尤速，緣父母爻入棺故也。又如丙戌、丁卯二日申加卯，晝將上乘六合，如占妻病必死，緣妻財爻亦入棺故也。已上皆三月占尤驗。
白虎入喪車格 緣申加巳發用為的，占病可畏。
人入鬼門格 如庚日申為本命，返吟課占病必死。
收魂神 乃戊日辰為元武者是，夜順晝逆有之，於十一月占尤的，緣辰為死氣故也。
浴盆煞 緣忌浴盤有水。夫浴盤者，春辰、夏未、秋戌、冬丑是也。如地盤見浴盆上，忌乘亥子水；天盤見浴盤上忌天后元武二將，如占小兒病死尤速，緣亥為孩，子為子息，故不要見水也。天后亦是子，元武亦是亥。
寒熱格 如巳午加亥子，如或克日主癆病，十干返吟必心患痁（疒+邑）。
宴喜致病格 如癸酉、癸亥、癸丑三日並支上未作太常為用，夜將有之。壬戌子寅日並支上未作太常，夜貴有之。以上六日例，緣未為太常克乾居於宅上，或為發用，如占病必因喜事及宴飲，或往親戚家帶病而歸。若是官人占之，必因赴宴席過觴而得病，余占皆因前事而致不美。
因妻致病格 如壬子癸丑二日，未遁旬乾者，必往妻家得病極驗，惟占人行年本命上有卯木為救，如乘寅木必得神護，尤宜命法官治之為妙，倘少緩，寅木反被未墓，便難救也。
血厭病虎作鬼格 白虎乘病符克乾尤可畏，或年命上乘血支血忌者，必是血病。或女命占病又帶月厭作血支血忌，病必是血崩或墮胎尤驗。
制鬼之位乃良醫第六八 訪賢求救於制鬼
凡鬼喜見者，惟妻占夫與有官人為宜，其餘皆凶。巳午作虎鬼，不宜灸，申酉作虎鬼，不宜針。如乙丑日酉加乙，乃日之鬼，卻賴支上有午火而克其酉金，此午火便是良醫，或是本家親人能醫，或得家堂祖宗神位保護，其餘可逐類而言之。除占病外，凡占雖值危難災患之中，必得人解紛，誠為救神也，其神臨於占人行年本命之上者，宜雪理辯明，自解其禍。如制鬼之神上乘貴人，必得上人除釋過愆，如見被囚禁，必有救援而可免禍，或乘蛇虎，必得神護，更詳神類而還謝，且制鬼之神即是良醫，緣皆是日之食神故也，趕賊神宜占捕盜，即制鬼之神。如甲戌日乾上酉，雖為日鬼，奈是旬中空亡，不足為畏，兼支上巳火坐於墓上，亦不能為救，似此一例求醫，其醫雖言病証甚的，其實庸愚不能治療，奈何有福而成功也，必竟憤憤不平火克空鬼。又己丑日乾上卯、支上酉，壬辰日乾上戌、支上卯，其餘救神不在支上而臨三傳之上及臨行年本命，亦可為救，虎鬼臨處為畏期。且如制鬼之神加亥子，宜服湯藥，加寅卯並四土之上宜服丸散，如巳午宜灸，加申酉宜針砭。其餘制鬼神空亡者，乃言不副行之喻，醫神所生為瘥期，所克為死期，乃天地醫也。
天醫作虎鬼格 不宜醫者治，虎乘乾鬼，必有不明之人作禍。
病體難擔荷格 如丁憤憤不平日乾上申，三傳申酉戌俱日財，占病必因傷食而得，以致不救，緣丁火逢病死墓，更於秋冬占之無疑也。如求財，春夏二季卻有，緣干強之故，尤宜詳空而憂喜俱無，如占病，三傳俱財，無制財者必死，有制財者可救。丁丑、丁未、丁亥干上申用。
虎乘遁鬼殃非淺第六九 入險巉之敵境，遇伏藏之強卒
謂白虎加臨旬內之乾為日鬼者例，此法應驗如神，凡占皆畏其咎彌深，難以消除，縱空亡亦不能為救。如甲子日晝占，乃虎加庚午臨戌為用，又旦占虎加庚午臨子在支上，又旦占庚午作虎加乾，或返吟。乙丑日晝占虎臨辛未加戌，戊辰日夜占，虎臨甲子加戌。
明暗二鬼格 乃干上神作日乾明鬼，又支上神遁旬乾作日乾暗鬼。如六甲日申加甲、庚加支；六乙日酉加乙，亦庚加支；六丙日亥加丙，即壬加支；六丁日子加丁，即壬加支；六戊日寅加戊，即乙加支；六己日卯加己，即乙加支；六壬日未加壬，即戊加支；六癸日占無。
鬼臨三四訟災隨第七十 先和好而後有兵謀
謂日乾之鬼臨於第三四課全者，官詞病患繼踵而至，唯宜修德作福，及歸正道，庶得稍輕，猶未免於病詞二事也。如或全值空亡，始能免此，然亦且先見此而後無慮。如乙未日申加未為第三課，酉加申為第四課之類；如甲戌日酉加戌為第三課，申加酉為第四課，雖日鬼加臨辰兩課，尤幸皆作空亡，不能為害，似可無畏也。
歲破作鬼臨支格 如再克支辰，訟災免難。
天鬼作日鬼格 在六處占病，必是疫氣，如天鬼作日鬼空亡者病，雖似疫，旋即無事，但未免頭疼發熱而已。
朱勾相會格 如丙辰午加辰，乃朱雀入勾陳，必有非常之訟。
病符克宅全家患第七一 兵疲師老，為主將者宜深忌焉
夫病符者，每年舊太歲是也，且如子年亥為病符，醜年子為病符，餘年仿此。若病符臨支又克支者，乃主闔家病患，更乘天鬼，定遭時疫而無疑也，病符乘白虎而臨支克支尤凶。如病符作月之生氣，尤主闔家病，或作月之死氣必死。以上乘天鬼尤凶。天鬼者，正月酉，逆行四仲，涉害深者必久病。
宜成合舊諸事格 緣緣病符臨宅反來生宅，或生日乾，或作日財，或作貴人者，卻宜成合殘年舊事，一切之事宜逐類而推之，勿作病符論。
喪吊全逢挂縞衣第七二 主帥喪亡，三軍皆服縞素
謂歲前二辰為喪門，歲後二辰為吊客。如支干上全逢此二位凶煞，主凶，又於占人行年本命上神乘之，其年必哭送親姻，身披孝服也。若論支干上全逢喪吊者，唯甲午、丁亥、己亥、庚子、癸巳，乃干上乘吊客，支上乘喪門。甲戌、丁卯、己卯、庚辰、癸酉，乃干上乘喪門，支上乘吊客。
內外孝服格 如日鬼作死氣而乘太常加乾上，必主有外孝服，至如六辛日午加戌，正月夜占為死氣作太常；六壬日未加亥，二月夜占，又六壬日丑加亥，八月旦占；六癸日未加丑夜占，二月為死氣。內辛亥日太常臨午加戌，支上未亦為太常，上又乘白虎作丁神而克支，此必有內外孝服。內壬子日太常臨未加亥，支上申又乘白虎，三月占又是死氣乘虎入宅，亦主內外孝服。又壬戌日太常臨醜而克亥，干支上子為白虎作空亡羊刃入宅。
孝白蓋妻頭格 如癸亥卯未三日，乾上未夜將，酉年二月丑為年命，如是妻占夫病必死，緣妻之年命上乘華蓋作太常為日鬼，又是死氣為吊客故也。如八月內占之，乃未為生氣，尚有孝服未巳。又如日乾之鬼作死氣乘太常，如於支上主有內服至，再見喪吊更凶。又乙未日申加未，三月占用晝將，作死氣乘太常入宅。又戊戌日卯加戌，十月占用夜將，乃卯作死氣乘太常入宅，而又克宅，凶尤甚也。又戊子日卯加子作太常，死氣入宅刑宅，亦十月占，用夜將有之。又壬子日丑加子，八月占，用晝將，乃日鬼乘太常作死氣入宅克宅。又辛酉日午加酉，正月占用夜將，乃死氣作日鬼乘太常入宅克宅，凶甚。又壬戌日未加戌二月占，夜將乃死氣作鬼乘太常入宅。又癸亥日未加亥，二月夜將，乃死氣作日鬼乘太常入宅又克宅，凶。又癸酉日未加酉，二月夜將，乃死氣作日鬼乘太常入宅。辛未日九月晝將，寅加未作死氣乘太常入宅又克宅。甲戌、庚戌二日卯加戌，十月占，夜將乃死氣作太常入宅又克宅。己亥日戌加亥，十一月占，晝夜將乃死氣作太常入宅又克宅。辛亥日戌加亥，五月占，晝夜將乃死氣作太常入宅又克宅。
墓門開格 如歲後五墓又為干墓，臨卯酉作蛇，又作月厭，必主重喪。如子年四月乙酉日未加酉，放乘蛇同上。又午年十月辛酉日，丑加酉乘蛇作月厭，為歲後五墓而又作干墓。
前後逼迫難進退第七三 前有強敵，後有追兵
假令壬寅日乾上子，三傳辰巳午皆空而不可進，欲退後一步，逢地下寅盜氣，又退一步，逢丑為干鬼，乃前不可進，後不可退，以此推之，惟宜守干上旺，切不可輕舉妄動，如動則虛耗百出。又癸巳日乾上子，乙巳日乾上卯，三傳卯寅丑。甲寅日乾上卯，三傳辰巳午。壬申日乾上子，三傳丑寅卯。癸卯日乾上寅，三傳辰巳午。此於逼迫二字不合，若克處回歸，又受克還似。
初傳被下克，繼歸地盤之本宮，又被上神所克格 此例乃克處回歸又受克，雖虎賁之勇，亦不可為。如癸巳卯丑亥四日，午加癸為初傳，乃午火受癸水所克，及歸本家午上，又被亥水所克，使其午火去住不能也。且午火之類神為日之財，主財聚散。如用夜將元武加午，主失財，其午火之上亥亦為元武，主重重失財。亦為日乾之妻，主妻常病，亦為馬類或有馬而常被人撓。亦為屋類，主頻遷徙而耗費用。亦為心類，主心病。亦為眼類，主常患眼目。以上之類皆不宜占。
全傷坐克格 如支幹各受上神克，又坐被克方者。假令甲午寅、丙寅午辰戌、癸卯巳，並是返吟。
顧祖格並回還格 止宜守舊，亦進退不能也。
空空如也事休追第七四 不可受降盟約
謂三傳皆空亡者是也，於進退連茹課中多有，如三合課兩傳空亡，縱有一傳不空，而上乘天空將者，亦系此例，不必細具。凡值此等例，占事皆主指空話空，全無實象。惟宜解散憂疑，欲成事而不可得也，或鬼空尤妙。如遇占病，久病者死，新病者空，欲望事成合，須待改旬再謀之方可也。凡鬼空亦宜制之，不然尤有虛撓之凶，為我難見彼之象。
四課全空格 四課無形，事不出名，縱然出也，也是虛聲。如乙巳日乾上寅為空亡，第二課又入空亡鄉，支上卯作空亡，第四課又入空亡鄉，此乃四課皆空，故應前言。丙午日乾上寅，戊辰日返吟，戊戌日返吟，以上前例內，如年命上乘空亡，但非成事，或替他人占事，或初傳遙克作空亡坐空鄉，尤無力也。
賓主不投刑在上第七五 猶金宋之和議而畢竟南侵
凡支干乘刑者有三等，凡占未免相刑之意，所謀交涉事，必各有異心。
一字刑者，乃四課上神全逢辰午酉亥者是也。甲辰日第一課酉加寅、第二課辰加酉、第三課亥加辰、第四課午加亥，此乃四課上神全逢辰午酉亥者也。又癸亥日乾上午同。又乙酉日第一課亥加辰、第二課午加亥、第三課辰加酉、第四課複亥加辰，支干上乘辰午酉亥又克支乾者，尤可畏也。壬午日乾上辰克幹壬、支上亥克支午。又己酉日辰加己，上為墓覆幹，午加酉而克支。丙戌日乾上亥克干，支上辰墓支。如甲子日支上辰，其三傳辰申子，乃名自刑在干支上。又乙丑日支上酉，其三傳巳丑酉，亦支上重逢自刑。又丙寅日乾上酉，其三傳酉丑巳，乃干上重逢自刑之酉也。餘並仿此。
二字刑者，乃支干上全乘子卯是也。子卯相刑者，兩邊無禮。乙未、丙申、戊申、壬申、辛丑五日，乾上子、支上卯。乙丑、丙寅、戊寅、辛未、壬申五日，乾上卯、支上子。以上十日，乃支干上神各無禮之刑也。
三字刑者，乃三傳寅巳申或醜戌未是也。寅巳申三刑者，未免無恩之義，凡占必恩反怨也。如醜戌未者，凡占多恃勢而凌弱。尤宜觀乾上之神帶生旺不空、乘吉將，乃名能刑於他人也。三傳寅巳申、巳申寅或申寅巳、丑戌未、戌未丑或未丑戌俱是也。
金剛格 巳酉丑三合為三傳，支干上複見酉者，乃應金剛自刑其方，緣巳刑申、醜刑戌，唯酉不能刑，故自刑其西方。
火強格 寅午戌三合為三傳，支干上複見午者，乃就火強自刑其方，緣寅能刑巳、戌能刑未，唯午不能刑，故自刑其南方也。
水流趨東格 申子辰為三傳，干支上複見辰者，乃應水流趨東也，緣子能刑卯，申能刑寅，惟辰不能刑，用趨其辰之本宮，以辰為水之墓庫故也。
木落歸根格 亥卯未為三傳，干支上複見亥字者，乃應木落歸根也，緣卯能刑子，未能刑丑，唯亥不能刑，故歸其亥之本宮也，兼亥為木局之本，夫本者，乃木之父母鄉也。
以上皆不宜值之。如占訟，不論一字刑、二字刑、三字刑，皆被刑責，如乘凶將其凶猶甚，唯空亡及皇恩、天赦可解，亦宜問罪犯輕重而言赦宥，如犯重但刑稍輕，而未免遭刑，如情輕則無刑也。皇恩者，正月起未順行六陰位。天赦者，春戊寅、夏甲午、秋戊申、冬甲子。
四勝煞格 乃干上酉、支上午或支上酉、乾上午者皆是。又就自刑中單言酉午為四勝煞，凡占各逞能，或皆邀功逞俊之意。如乙丑日、丙寅、戊寅、辛未、壬申五日乾上酉，支上午。又壬寅、乙未、丙申、戊申、辛丑五日，乾上午，支上酉。以前無恩刑等中，如甲子日寅刑干上巳、子刑支上卯；丙子日乾上申，日刑干上申、子刑支上卯；辛丑日戌刑干上未、醜刑支上戌；癸卯日醜刑干上戌、卯刑支上子；辛卯日戌刑干上未、卯刑支上子。於前例中，如此五日，乃支干相刑其上神，又是子卯無禮刑。外有甲寅、庚申、己未、丁未、癸丑五日，或干上乘辰午酉亥，亦作自刑例。
助刑戕德格 乃六處有神作支之自刑，又作干鬼，又結連三傳為鬼是也。庚午日午加庚發用，又午加未暮將，天乙臨乾本身可以解凶。
彼此猜忌害相隨第七六 威振人主者身危，功蓋天下者不賞
此例有五等：一者，干支上下皆各作六害，凡值此者，彼此各相猜忌，主客不相顧接，乃兩意相謀，各有戾害。如甲申日乾上巳與乾為六害，支上亥與支為六害。外有庚寅、丁丑、己丑、癸未等日，皆干支上下作害者。二者，支干上神作六害，亦主各相猜忌。如乙亥日乾上子與支上未為六害，辛巳、壬午、丙子、戊子日乾上子，支上未。三者，支干、天盤、地盤皆作六害，此等戾害尤甚。如辛酉日返吟，支干戌酉為六害，上神辰卯六害。又壬申、乙卯、丙寅返吟，又乙卯、戊寅、丙寅、壬申、辛酉伏吟，皆有之。四者，干支三傳作六害，此局全無和氣。如辛卯日乾上未，支上子，三傳又子未子，皆作六害；辛未日乾上亥，支上申，三傳又申亥申皆作六害。五者，支干上下交互作六害，如我方動念害人，人已早思害我，此局更為危難。如乙未日，乾上子與地支未作六害、支上卯與乾作六害，而支干上子卯又複相刑，輾轉為害，無從解免。外如甲申日乾上亥，支上巳；庚寅日乾上巳，支上亥；丁卯、己卯日乾上辰。
人喜我憂格 如辛丑日乾上酉與乾作六害，支上子與醜卻作六合也。外有乙未、乙丑日並干上卯，辛未日乾上酉。
互生俱生凡事益第七七 南唐有順正之忠，宋祖有褒封之惠
雖有生而作墓敗空亡者，知其人宅盛衰，彼此旺敗。
互生格 干上神生支，支上神生乾是也。此例兩相有益，各有生意。如辛卯日乾上亥生支，支上辰生幹。庚戌日乾上巳生支，支上未生幹。庚子日乾上酉雖生支而卻敗其支，支上丑雖生乾而卻是乾之墓。庚午日乾上卯雖生支，而卻敗其支，支上丑雖生乾，而卻墓其幹。丁酉日乾上丑雖生支，而卻墓其支，支上卯雖生乾，而卻敗其幹。己酉日乾上辰雖生支，而卻墓其干，支上午雖生乾，而卻克其支。辛巳日乾上卯雖生支而卻敗其支，支上戌雖生乾而卻墓其支。辛亥日乾上酉雖生支而卻敗其支，支上戌雖生乾而自克其支。壬午日乾上寅生支，支上酉雖生乾而作空亡，又為敗氣也。如值此等例，雖有生旺之名，反作衰敗空耗論矣。
俱生格 乃干上神生乾，支上神生支是也。此例各有生意，彼此和順，或兩家合本作營生尤應也。如逢月生氣尤的。支干全受上神生，丙寅、丁酉日並干上寅，庚午子戌申日並干乘辰。丙寅日乾上卯雖生乾而亦敗其干，支上子雖生支而亦敗其支。丁卯日乾上卯雖生乾而亦敗其干，支上亥雖生支而奈作旬空。乙卯日乾上子雖生乾而作空敗，支上亥為長生，此一課乃利宅不利人，利彼不利己。己巳日乾上巳生乾，支上卯雖生支而反敗支，此一課乃利己不利彼，利人不利宅。丙子日乾上寅實生其干，支上酉雖生支而反敗其支，又作旬空。丙午日乾上寅，支上卯皆作空亡。
自在格 如甲子、乙亥、丙寅、丁卯、戊午、己巳、庚辰、辛未、壬申、癸酉十日，並支加乾上而生日也。
互旺皆旺坐謀宜第七八 運籌於帷幄之中，決勝於千里之外
互旺格 止甲申、庚寅二日有之。甲申日乾上酉，乃是支之旺神，支上卯乃是乾之旺神。庚寅日乾上卯乃是支之旺神，支上酉乃是乾之旺神。凡值此者，惟宜兩相投奔，各有興旺，客旺主而主旺客，人旺宅而宅旺人，夫旺妻而妻旺夫，父旺子而子旺父，兄旺弟弟旺兄，朋友彼此助益。
皆旺格 支干上皆乘旺神者，乃彼我、客主、夫婦、父子皆然興旺，凡謀事順利，不勞其力，惟宜坐待，不利謀動，止可就本身之宅職而靜聽造轉，或已遭失而欲複舊事極妙。倘若意外之求，或遠謀動用，則變為網羅纏繞身宅，乃作羊刃，反為災禍。如或坐待，則人口通泰，宅複興隆，並無心中得人扶持而發旺，斯占最的。甲申日乾上卯、支上酉，庚寅日乾上酉，壬申、壬寅日乾上子，丙申、丙寅日乾上午，忌空亡。
干支值絕凡謀決第七九 立三穴而欲晉室，終不能遂其謀
如甲申、甲寅日返吟，乃支干上皆乘絕神。又丙申、丙寅日亦是返吟，絕神作鬼，止宜結絕凶事，亦宜釋解官訟，占病痊。丙辰、丙戌日如晝占，亦宜告貴結絕，凶吉二事皆可。戊寅、庚寅、壬寅、戊申、庚申、壬申六日返吟，緣絕神作日之財神，止宜結絕財物事，惟不利占妻病，值此必死；又作月內之死氣者，妻死尤速。壬辰、壬戌日，如旦占，亦宜告貴結絕財物事。以上返吟結絕事極速，緣絕神投絕鄉故也。亦不宜占食祿事，緣神神投絕，如占病又作死氣，必絕食而死。外有乙未日乾上申為乙木之絕，支上亥乃未土之絕，如夜占卻宜告貴結絕事理。又辛未日乾上寅、支上亥，如夜占亦宜結絕告貴之事。又癸未日乾上巳、支上亥，晝占亦宜告貴結絕事理。丁未日支干上皆乘亥，己未日乾上亥、又干上巳，以上皆宜結絕，亦不宜占食祿事，此言土內有寄寅者，故以亥為絕也。
絕神加生格 如庚辰寅加亥為用是也，凡巳加寅、申加巳、亥加申、寅加亥，最不宜占結絕事，緣絕神反坐長生之上，凡占事卒未了當，必止了又興，或年命乘之。
遞互作絕神格 最宜兩相退換屋宇，或兌替差遣、交代職任等事。如甲申、庚寅二日伏吟，又癸未日乾上亥、支上巳，丁丑日乾上亥、支上巳，丁未日乾上亥，癸丑日乾上巳。

支干全乘死氣格 如庚寅、庚申、辛丑日並干上子，乙丑、甲申、甲寅日乾上午，己未、壬申、壬寅並干上卯，丙寅、丙申、丁丑日並干上酉，此例止宜休息，萬事不利謀動。

此等例詳初傳是何類神而言之，如是日之財神、祿神、長生、官星等，不可值中末之墓，如是日之鬼及盜炁等，卻喜中末墓也，細具於後。
生我者傳墓入墓，如辛未日，三傳巳戌卯，巳加子為初傳，乃日之長生，豈宜中傳戌來墓巳，末傳又入戌鄉。又己巳卯未亥丑日，並巳加子為用，大不利占生計及長上之事，如辛未日有官人占之，緣官星、德神、長生入墓。如常人占之，反喜鬼入墓也。
德祿傳墓格 如丙子日巳加子為用，癸未、壬子日巳加子為用，乃財神入墓；戊子日巳加子，乃德祿並生炁入墓。
長生入墓格 如庚子日巳加子用，常人占之，喜鬼入墓。
脫氣入墓格 乙未日巳加子用。
財神傳墓格 丙戌日申加卯、庚辰日寅加酉乃財入墓、庚戌日申加卯用乃德入墓格。

鬼入墓格 戊辰日寅加酉用，以上占行人來遲。
不行傳者考初時第八二
夫不行傳者，乃中末空亡是也，中末既空，但只以初傳斷其凶吉，言其事類，此例極多，不必細具，或一日內有三五課者，如甲子日乾上巳，初傳申是日之鬼，中傳亥是日之長生，末傳寅是日之德祿，既長生德祿皆空，豈宜獨存初傳之申金為日之鬼而坐實地，若以初傳用事，必好事無而惡事有也。已後如值初傳凶者，若是遙克者，好惡俱無，皆仿此，亦名守株待兔。
獨足卦 己未日乾上酉，凡占萬事皆不可行，此一例乃初中末並支干皆在未上，於七百二十課中，止有此一課，故名獨足。既止有一足，焉可行乎。如欲商販，利行舟而不利陸路，如欲逃亡者亦然，占病死。雖眾皆知有獨足例，殊不會稽考。己未伏吟卦亦名獨足，且己未伏吟雖有未丑戌為三傳，緣中傳乃旬內空亡，既中傳空亡，豈能刑其末傳之戌乎？且中末既無，惟支干與初傳皆在未上，與獨足何異耶。凡謀皆不能成也。
萬事喜忻三六合第八三 民豐物阜，君明臣良
謂三傳寅午戌等，或干支上見未；三傳亥卯未等，或干支上見戌；三傳申子辰等，或干支上見醜；三傳巳酉丑等，或干支上見辰，皆名為三合課，又與中間一字作六合者是也。故經云：三六相呼見喜忻，縱然帶惡不成嗔。且夫帶惡者，乃金日得寅午戌，土日得亥卯未，木日得巳酉丑，火日得申子辰，縱然三傳克干亦不能為禍，尚可成合。其餘占雖曰未盡善，究竟事亦可成就也，何況三傳生日或作日之財。又三六相呼，凡謀皆遂，全無障礙，不然有人在中相助而成合事。唯不宜占解釋憂疑事。如占病，其勢彌篤。如占行人，忻喜而來。如乙酉日申加辰用，三傳申子辰水局並來生乾，又支上見醜，乃名三合中有六合，為全吉之課，兼三傳之天將晝夜皆是貴勾常土神，並作日之財，盡可求財。舍占財外，大不宜尊長，及不利占作生計，緣天將上神克生氣故也。又如丙申、丙子、丙辰三日乾上丑，三傳皆水局來作日乾，殊不知三合六合相呼之格，帶惡不成嗔之義也，兼乾上丑亦可以敵其傳水，凡謀雖有成意，終是可畏，但顧目下成合，余畏撥置事也。又辛未日乾上寅，壬午日乾上卯，辛亥日乾上午，壬寅日乾上未，戊申日乾上丑，三合課中又逢天將六合居干支上者，亦可用，但力稍輕。

謂三傳寅午戌，如支干上有午為自刑，見醜為六害，見子為衝；三傳亥卯未，如干支上有子為無禮刑，見辰為六害，見酉為衝；三傳申子辰，如干支上有卯為無禮刑，見未為六害，見午為衝；三傳巳酉丑，如干支上有酉為自刑，見戌為六害，見卯為衝，凡值此例，所謂三合犯殺少人知，惟防好裏定相欺，笑裏有刀誰會得，事將成合失便宜。占得此者，必至恩中變怨，合中有破，雖是屬我之事，亦被人在中阻隔，俗諺云：笑裏刀，蜜裡砒，正此意也。其中犯殺空亡，徒為冤憎，下稍成阻，不免先應其事。
初遭夾克不由己第八五 指日克汴，而班師之詔屢頒
謂初傳坐於克方，又被天將所傷，故取名夾克。凡占必身不由己，及受人驅策，尤宜詳其受克者是類而言之。且如夾克者是財，必財不由己費用；或是日之同類受夾克者，乃自身不由己。惟是日鬼受夾克者為妙，乃當憂不憂之義也。如六甲日戌加寅為初傳，晝夜天將皆乘六合木神，此乃夾克其財。六壬日午加亥為初傳，晝夜天將元武水神及天後水神，此乃夾克日財，必財不由己而費用。外有甲辰日辰加卯為初傳，晝夜天將皆是六合木神，夾克其財。又甲申日戌加卯同上，或妻常病。
家法不正格 緣三傳皆受夾克例，唯乙丑、乙卯、乙亥日並寅加酉，旦占有之。
俯丘仰仇格 甲子日夜將寅加未為用，乃俯見丘仰見仇。乙巳日酉加丑，乙未日卯加未夜。

青龍內戰格 壬寅日夜占，乃青龍乘申臨巳為用。
白虎內戰格 丁亥日晝占，乃白虎乘午臨亥為用。
太常內戰格 丁酉日晝占，乃太常乘卯臨酉為用。元武無內戰。
天空內戰格 如丁丑日卯加申為用，夜占。
太陰內戰格 壬辰、壬戌日返吟夜占，乃太陰乘巳臨亥為用。
夫十一天將皆有內戰，此例餘尚有之，不暇細具。今略具一例，餘皆仿此，而逐類言其內戰之意也。
三傳日辰內戰格 支乾三傳皆下克上者，凡占皆是家法不正，或自窩犯，或醜聲出於堂中，以致爭競，斯占極驗。如癸酉日，癸水克上神之午火，酉金克上神之寅木，初傳未加寅，中傳子加未，末傳巳加子，皆下賊上，凡占全無和氣，占訟被刑，占病必死，吉事不成。惟宜占官從卑賤而迤邐遷轉，大為興旺，舍此皆凶。己酉、辛酉日未加寅，戊辰日寅加酉皆如前說。
人宅坐墓甘招晦第八七 魯酒薄而邯鄲圍
謂天盤支干皆坐於地盤墓上者，乃心肯意肯情願受其暗昧，凡事皆自招其禍，切不可怨天尤人也。不惟本身甘招其禍，猶且將家宅亦情願假借與人作賤，欲兌憑終不能脫出也。如壬寅日亥加辰、寅加未，壬申日亥加辰、申加丑，己未日未加辰，丁丑日未加戌、丑加辰、庚寅日申加丑、寅加未，庚申日申加丑，剛日四絕體也。
互坐丘墓格 干坐於支墓之上，支坐於干墓之上者，乃彼此各招其昏晦，惟不宜兩相投奔，必是愚蠢人也。如丁丑日未加辰、丑加戌；戊寅日巳加未、寅加辰；甲申日寅加丑、申加未；庚寅日申加未、寅加丑，戊申日巳加丑、申加辰。餘傳內雖有所喜之神，其年命上卻克去者，乃心多退懶，自不肯向前也。
干支乘墓各昏迷第八八
如支干全被上神墓者，其人如雲霧中行，其家宅敝而自塵暗，凡彼此占不亨快，經云：墓覆日辰，人宅昏沉。壬申日乾上辰、支上丑；壬寅日乾上辰、支上未，己未日干支上辰；丙寅日乾上戌、支上未；丙申日乾上戌、支上丑；乙丑日乾上未，以上諸例，乃干支兩課皆見墓神，經云：干支墓全逢，所為皆不通，兩處欲克害，猶忌合墓神。如甲申日乾上未，如用夜貴，則兩處皆空，可以解疑。
互乘墓神格 干乘支之墓，支乘乾之墓者，此例我欲昏昧他，卻被他已昏昧我也。道典云：天網恢恢，疏而不漏。戊寅日乾上未，支上辰；戊申日乾上丑、支上辰；辛未日乾上辰、支上丑；甲申日乾上丑實、支上未空；庚寅日乾上未空，支上丑實；乙未日乾上辰空，支上未實。
欲棄屋宇格 凡干加支，求宅必得，緣己身入宅故也。或被支所克或所脫，雖目下強，得其屋後無益也。凡支加乾得之，尤不費力，緣宅來就人故也，亦不可受宅克、墓、脫，如我有屋宅欲出兌者，如值干加支，乃人尚戀宅，或支加乾，乃屋戀人，二項皆不能脫也。其支干相加，宅生其人，切不可棄之，，後有長進，如被克、脫、墓者，終被屋所累矣。
任信丁馬須言動第八九 如占訪人雖不藏匿，必在他處相見，有倉卒之軍旅
夫任信者，伏吟卦也。如剛日名自任，可委任於他人。柔日名自信，可取信於自己。凡值伏吟卦，切不可便言伏匿而不動。於傳中及支干上有旬內丁神，或乘天馬驛馬者，必靜而求動，不可不知。如壬辰、戊午、丙辰、甲寅、庚申、癸未、癸丑、己酉、辛亥，以上俱丁神在傳，如占訪人必出外幹事，如先允許，後必改易，故名無任無信也。天馬逐月推之，如填內無天馬、驛馬、旬丁者，如始欲謀事，盡伏盡匿，終不可動謀矣。如已嘗得人先蒙允許，後必有信也。凡占靜中求動終是靜，或動中求靜終是動，諸占不易之故也。
伏吟卦內無丁馬，卻占人本命行年上乘魁罡及丁馬者，亦主動尤速。又乙酉、己丑、癸巳三日伏吟，如占人年命是亥，乃丁馬，又如占身動最速。又乙卯、己未、癸亥三日伏吟，如占人年命是巳，亦丁馬交加身動尤速。
非伏吟而乘丁馬者亦主動。如癸亥日乾上巳為財動，餘同。又癸酉、己未、丙子、戊寅、辛巳、丁亥、甲午、庚戌九日伏吟，占行人必中路被阻，緣中傳空亡而不能刑至末傳，故前後難進退耳。余占必先雖允許，後卻無實惠也。
六丁加天馬，或天馬加六丁，必非小動也。如甲子日卯加甲，十一月占是也，餘皆仿此言之。如值丑為本命，乃名本命戀宅，全無動意，此法極驗。
伏吟卦六丙日吉，緣初傳為德祿，中傳為財，末傳為長生，各忌空亡。
伏吟卦六戊日伏吟凶，緣初傳巳火克中傳申金，中傳克末傳寅木而作日乾，似乎無和氣也，且戊日伏吟切不可被是人惑作甲戊庚三奇言之，且初傳天盤乃巳火，地盤乃戊土，豈可言三傳甲戊庚耶，此之不可不知者也。
來去俱空豈動宜第九十 複，七日來複，虛張攻勢
夫來去者，返吟卦也，緣初傳與末傳、初中末往來交互也。故凡占得返吟卦，切不可便言凡事往來動移，內有三傳皆空亡者，雖有動意，實不動也。尤詳其空亡有用及無用言之。己酉返吟，三傳卯酉卯，此用鬼皆空亡，正宜處難中解禍，余占空空然。乙丑日三傳戌辰戌，此傳財俱空亡，止宜占病，不宜問婚，妻及財凶。戊辰日返吟，三傳巳亥巳，此乃生氣落空亡，不利長上，或六月、十二月占之，尊長病死尤的。戊寅、戊午、戊戌、戊申、戊子、己亥、庚戌、甲辰等日返吟皆空，更宜逐類推之。
德喪祿絕格 乃陽日返吟者是，若陰日子加巳，乃四絕體也。
移遠就近格 天罡乘青龍、六合在日上，乃真斬關卦。如占時為發用，名動中不動，尋遠在近處。兼中末空亦然。如初見太歲，中末見月建或日胡，亦名移遠就近，將緩為速。又如己丑日乾上辰、支上戌，雖干支上全乘魁罡，緣乾上墓覆，又是柔日昴星，伏匿萬狀，終不能動。庚寅日乾上辰、支上戌亦是真斬關卦，必主動，緣中末空亡，反不能動；又干上戌、支上辰同。後二假令乃言斬關卦之義，非返吟也，須知之。
似返吟卦，癸未日乾上寅，雖不系返吟卦，緣三傳申寅申，往來皆在支干上，似乎與返吟相類也，如占事雖不免往來交通，下稍全無一事，緣始末皆空，又是柔日昴星，故伏匿也。如用晝貴，三傳合元合，陰私萬狀，兼支干上皆乘脫氣，占事不出旋窩。諸返吟卦占事難成而覆破，訪人差迭，複被誘差迭。
虎臨乾鬼凶速速第九一 克幹客敗，傷支主敗
謂日乾之鬼上乘白虎者，凡占凶禍速中又速。如六己日卯加未夜占，六壬日戌加亥旦夜占，六癸日戌加丑晝占，此三幹乃虎鬼臨乾者。六六日申乘白虎旦將順行有之，但不臨乾而在五處；六戊日寅乘白虎夜將順行有之，亦不臨乾；六庚日午乘白虎旦將逆行，不臨乾而在五處。若乙丙丁辛四乾無此例。唯宜詳其虎鬼或空亡、或鬼坐鬼方、或坐生方。及虎之陰神能制虎者，雖目前值其災禍，後卻無畏也。如甲子日申加戌晝將，上乘白虎作中傳，誠為可畏，殊不知申坐戌空，又賴虎之陰神上乘午火而制虎鬼。經云：「虎之陰神還制虎，生者安寧病者愈」，此虎鬼論，如小人稍得其勢，即為禍患極速，倘受制伏，隨即縮首拘捉，灰飛煙滅而不能為害也。又如甲子日申加午晝將，上乘白虎作末傳，其申不空，誠為可畏，尤賴申金坐於午火之上。經云：「鬼坐鬼方無所畏」。又如戊寅日寅加亥夜將，上乘白虎作中傳，縱干上有申金，緣作空亡而不能克其寅鬼，誠為凶也，殊不知寅木坐於亥水之上，寅木受亥水作長生，不來為害。經云：「鬼自就生不來侵」。其餘虎鬼無制不空等，占訟被刑，占病作死氣必死，所占萬事禍不可逃。唯有官人占赴任，卻名催官符，赴任極速，反不宜受制及空。餘仿此而推之。
馬載虎鬼格 乃虎鬼作日之驛馬是也，凶禍尤速。占訟必得罪於遠方極妙。如戊辰日夜將，得寅加未作末傳，乃鬼乘白虎，又是驛馬。又戊辰日寅加酉夜，又戊辰日寅加亥夜，戊子日寅加未夜，甲寅日申加午晝，甲寅日伏吟晝，甲寅日申加戌晝，甲午日申加午晝。甲戌、戊申二日雖有，因虎鬼空亡，不足論也。
龍加生氣吉遲遲第九二
謂青龍乘生乾之神，又作月內之生氣者，雖目下未足崢嶸，卻徐徐而發福也。此例喻君子欲施惠於人，未嘗啟齒，緩而作吉，尤奈歲寒爾。如六丙日，寅加巳夜將乘青龍，三月占尤的。六丁日乾上寅夜將，三月占，內丙午、丁未日空亡不中用。六戊日乾上申晝將乘青龍，九月占，內戊寅日申空。六己日乾上巳晝將，六月占，內己亥日巳空。餘干無例。
妄用三傳災福異第九三
時人起三傳尚有錯誤，想災福應無的驗也。且問三傳錯誤者何？辛酉日乾上亥，既是辛日，豈可便以亥加戌為初傳乎。又如乙酉日亥加辰，既是乙日，豈可便以亥加辰為初傳乎。乙巳日乾上卯，既是乙日，豈可便以卯加辰為初傳乎。戊寅日第四課申加巳有克。又如甲辰日乾上戌，時人皆以戌加寅涉害為用，三傳戌午寅皆作脫氣，凡占謀用無成，有憂皆散，殊不知乃擇此為用，非涉害也，何故？緣甲木與子水比和，戌土長甲木而不比，乃子申辰作三傳皆來生日，凡占欲成合而不利解釋災禍，但凶吉二事皆成也。後學何得以知之。又甲戌日乾上辰乃子加戌為用，非辰加寅用也。又戊辰、戊戌日返吟，丙子、戊辰日乾上子，內戊子一日乾上寅，庚辰、丁亥二日乾上卯，壬戌、甲申日乾上辰，庚子日乾上午，乙卯日乾上申，又乙卯日乾上寅，庚寅日乾上午，甲申日乾上戌，各有其說也。
喜懼空亡乃妙機第九四 強敵宜落空亡
凡空亡有要見，有不要見者，後學不辨，一例而言之，誠為可嘆。蓋天盤作空亡者，謂之游行空亡，其吉凶有七八分，如地盤作空亡者，謂之落底空亡，其吉凶有十分。此不可不知者也。且夫要空亡者，乃克、盜、墓神，及神遙克日，以上皆要空亡。惟生我者及救神並天德、生氣、財官及日遙克神，並不宜空亡，皆返為凶兆，尤有遇不遇者，共列五等於後。
見生不生格 甲乙日以亥為生，其亥水居申上，他自戀生，不來生我。或是亥水居於辰戌丑未之上，為土所制，縱日辰行年上見之，亦不能生我。至於亥入空亡則大凶。如生我者空亡，占父母上人病，主不救，占干上位亦是徒然。略舉一全例，十二仿此，各令占之，亦如上說。
見克不克格 如甲乙日以申酉為克，其金居巳午火上，他自受克，何暇克我。又申酉坐辰戌丑未上，他自戀生，亦不來克我。鬼陷空亡，亦不能為害。惟鬼作空亡加日辰、傳、年命上，無制伏者極凶，或失人口，或犯官司，費用百出。十干仿此。
見財無財格 如甲乙日以辰戌丑未為財，其財居寅卯上，不可取財也。或財作空亡，雖得，反有所費。財陷空亡亦不得，尤費財。如財居申酉脫氣之上，反有所費。十干仿此。戊辰日乾上酉，壬午日乾上未，壬寅日乾上子，庚子日乾上酉，丙午日乾上午，己酉日乾上申。
見救不救格 如甲乙日，傳內先有申酉金，於日辰上見巳午火乃為救神，其巳午火居亥子上，或作空亡，或陷空亡，或在寅卯上，他自貪生，此不能為救也。如此反為災咎。如不見日鬼，其救神即盜神也。餘八乾仿此。
見盜不盜格 如甲乙日見巳午火居亥子之鄉，或入空亡之內，皆是盜我之氣不得也，反變成吉。十干日同。今人不看如何，見生便言生，見財便說財，見鬼便言有鬼，有救便言救，至於所立之地，所行之方，不少為分別，惜哉。
德貴合局生身格，亦貴德臨身消除禍患格 如乙酉日乾上申，晝占，雖三傳水局生日，緣天將晝夜皆貴勾常土神，使水局不能生其乙木。如用夜貴，尚賴貴臨本身，猶能勉強倚貴而求生計。
長上災凶格 乃長生空亡之例。戊寅日申為長生作空亡，庚子日巳為長生作空亡，壬午日申為長生作空亡，甲子日亥為長生作空亡，丙午日寅為長生作空亡。月內生氣亦忌空亡。
喜懼格 一則以喜，一則以懼之例，謂乾上長生，三傳皆鬼。
六爻現卦防其克第九五
財爻現卦，必憂父母。歌云：「三傳俱作日之財，得此須憂長上災，年命日辰乘乾鬼，爭知此類不為乖」。如辛未日乾上午，三傳卯亥未木局，三傳皆作日之財，雖憂父母，賴干上先有午火生其父母爻，竊其財爻，此名傳財化鬼。人但知言父母等類，而不知言傳財化鬼，如欲占財，則有災禍耳。餘日辰年命上無官鬼爻者，乃可言父母災也，亦必支干年命上先有父母爻，後被傳財克者，始可言父母長上災。如無父母爻，則亦不言此例。如丁丑日乾上先見卯為父母爻，豈應三傳金局之財來傷卯木，此方可言長上災。或求財而妨生計，或被惡妻逆其翁姑，此二事尤的。又有己丑日乾上午，庚辰日乾上未，丁酉日乾上卯，戊戌日乾上午，皆如前說。必待財旺月乃憂長上，其財休囚，卻為財也。外有乙亥日，欲賴支上申生父母爻而竊其財爻，殊不知申空亡，仍主父母之災。
父母爻現卦，必憂子息。歌云：「父母現卦子孫憂，日辰年命細參求，同類比肩居在上，兒男昌盛不為仇」。如戊寅日乾上丑，三傳戌午寅火局，皆作父母爻，雖憂子息，賴干上先有丑土生其子息，竊其父母。
若子息爻現卦，必憂官事。歌云：「子息見時官事無，古法流傳實不虛，豈知四處財爻現，官遷訟罪病難蘇」。己巳日乾上亥，三傳酉丑巳金局皆作子息爻，雖憂官職，緣乾上先有亥水生其官鬼，竊其子息爻，餘如前說。官訟則忌。
官鬼爻現卦，憂己身及兄弟。歌云：「官星鬼賊作三傳，本身兄弟不宜占，父母之爻如透出，己身昆仲總安然」。如乙丑日乾上子，三傳巳丑酉金局皆鬼爻，雖憂己身及兄弟，奈干上先有子水生其己身兄弟，竊其官鬼爻也。餘仿此。
同類現卦，必憂妻及去財。歌云：「干支同類在傳中，錢財耗散及妻凶，支干上神乘子息，妻宮無恙反財豐」。如丙寅日乾上丑，三傳戌午寅皆是日之同類，雖憂妻位及損耗錢財，奈干上先有丑土生其財爻，竊其比肩。餘仿此。
六爻相生而成類，乃三傳生起乾上之爻象者。
傳財化鬼者，如辛未日乾上午，三傳卯亥未生起乾上之午鬼。
傳鬼化父母者，如乙巳日乾上子，三傳酉巳丑生起乾上之子水父母爻。
傳父母化兄弟，如戊午日乾上丑，三傳戌午寅生起乾上之醜兄弟爻。
傳兄弟化子息，如丁亥日昴星，乾上戌，三傳午戌寅，生起乾上之戌土為子息，乃不言墓。
傳子息化財爻，如甲寅日乾上戌，三傳戌午寅生起乾上之戌土為財。以上如或占病，或父母、兄弟、子孫、妻妾、己身有病，如逐類現卦，雖曰不吉，其各類加乾，令得地反不為凶。如位死絕又坐克方，死而無疑。
三傳內現類而傳自墓克者例，皆是午丑申作三傳者。如乙亥、乙酉、乙未、乙巳、乙卯五日，並午加亥為用，如有官人占之，不可得官，如常人占之，反宜急難除禍，緣末傳之申金為官鬼，被初傳午火所克，又被中傳醜來墓申，兼末之申金自坐於丑墓之上，其申金全無氣象。又如丙辰、丁亥二日，亦是午丑申為三傳，乃申金財全無氣象，亦緣初被克，中被墓也。己亥日長生無氣，庚辰日德祿無氣。辛亥日兄弟爻無氣。六壬日長生無氣。以上皆是午丑申為三傳者。
支乾同類格 難求財，緣支幹各相爭奪，惟有十二日，甲寅、乙卯、庚申、辛酉、丙午、丁巳、壬子、癸亥、己丑、己未、戊辰、戊戌。
白蟻食尸格 壬癸日申坐丑上，夜將上乘白虎，此乃父母爻乘白虎坐墓，必父母墓中生白蟻，或興禍端。如父母在，主病災。更作月內死氣、死神，占父母病必死。又六戊日午加戌，晝將上乘白虎。六己日巳坐戌旦將，上乘白虎，皆如前說。餘干逐類而推之。
懶去取財格 六甲日乾上寅或卯，縱傳內見財爻，如求財，必心多退悔，懶去取財，恐爭奪也。餘日逐類看所乘何神而言其事類。
德喪祿絕格 陽日返吟，陰日四絕體。
旬內空亡逐類推第九六 財空軍儲乏，鬼空敵人遁，救空謀策拙，比空贊佐慵，生空防失惠。
甲子旬戌亥空亡。甲子、乙丑日妻財及父母空；丙寅、丁卯日墓貴及官鬼空；戊辰、己巳日兄弟及妻財空；庚午、辛未日父母及子息空；壬申、癸酉日官鬼及兄弟空。又壬日德祿皆空。以上縱戌亥在六處亦不可用。
甲戌旬申酉空亡。甲戌、乙亥日官鬼空；丙子、丁丑日妻財空；戊寅、己卯日子息空；庚辰日德祿空，辛巳日兄弟己身空；壬午癸未日父母空。以上縱申酉在三傳、年命、日辰上亦不可用。
甲申旬午未空亡。甲申、乙酉日子息、墓、妻財空；丙戌、丁亥日兄弟、子息空；戊子、己丑日父母、兄弟空，內己日祿空；庚寅、辛卯日官鬼、父母空，辛日旦貴空；壬辰、癸巳日妻財、官鬼空，內甲戊庚三日夜貴空。
甲午旬辰巳空亡。甲午、乙未日妻財、子息空；丙申、丁酉日子息、兄弟空；戊戌、己亥日兄弟、父母空；庚子、辛丑日父母、官鬼空及長生空，辛日官德空；壬寅、癸卯日墓及官鬼、妻財空，並晝貴尤不得力，內丙戌日德祿空。
甲辰旬寅卯空亡。甲辰、乙巳日兄弟、己身並祿空，甲日德空；丙午、丁未日父母空；戊申己酉日官鬼空，內己日德空；庚戌、辛亥日妻財空，內辛日夜貴空；壬子、癸丑日子息空，止宜脫禍。
甲寅旬子丑空亡。甲寅、乙卯日父母、妻財空；丙辰、丁巳日官鬼、子息空；戊午、己未日妻財、兄弟空；庚申、辛酉日子息及父母或墓空；壬戌、癸亥日兄弟、官鬼空；甲戊庚乙己五日旦貴空。
十惡大敗日乃無祿之日也。蓋甲辰、乙巳、壬申、丙申、丁亥、庚辰、戊戌、癸亥、辛巳、己丑，此十日內祿神空亡，故為無祿之日。
所筮不入仍憑類第九七
如占失脫，雖元武並脫氣、日鬼不在六處，亦宜用此類而言其方所、色目也。餘所占萬類皆如其法。
非占現類勿言之第九八 凡行師之日，以乾為三軍，支為營壘
如前賢有諸秘法，用之極靈。且如白虎臨寅在支上發用者，必宅中有棟折榱崩之驚，斯法極驗。設有占課君子問求財事，卜得此課，切不可言其梁棟摧折大抵與求財異。如此條貫犯之極多，時人不可不為自警。舉此一法，其餘可知。
常問不應逢吉象第九九 貴課利貴人不利小人，太平時雖有破敵之策而無所用之日
諸龍德、鑄印、高蓋乘軒、斫輪、官爵、富貴、三光、三奇、三陽之吉泰卦，但有官君子占之則為吉兆，或遷官轉職，或面君而奏事也。如常人占得上項吉卦，恐致災咎臨身，大難相壓，蓋常流百姓，既不事貴，兼以本身無官無祿，豈宜占得面君及見貴之卦乎。必因訟而名達朝廷，不然必到訟庭，面見太守而遭罪，占病必見陰司，如得遠乾出外，可免病訟。
已災凶逃返無疑一百
凡值喪魂、魄化、天禍、天寇、伏殃、天獄、天網四張、天地二煩諸凶否卦，如已見病訟災迍，之後占得前項諸凶卦，其災卻可消除，不足為慮，如未見病訟之前占得此者，必病訟喪禍並至，更無疑也。至天罡之神臨身命、行年，靜者主動，動者主靜，如占訟入獄者，即出獄也，及問罪會犯與不犯，然後言之，其餘占凶者卻吉，占吉者卻凶。
結絕格 六丙日乾上亥，或常問必主病訟，如已見凶災，反宜結絕舊事，又作晝貴尤宜告貴人而結絕凶事。
以凶制凶格 六癸日辰加丑，此乃墓神覆克日，誠為凶也，如夜將又乘蛇尤凶，以末戌乘白虎衝辰，謂之破墓衝鬼，以凶制凶，凶即散而無咎也。又四癸日戌加丑晝將，亦賴末之蛇衝虎，辰衝戌，尤宜解憂。外無癸酉、癸亥日也。）

<text name="太乙金鏡式經" author="王希明">
（序
太乙金鏡式經 唐 王希明 撰
太乙，天帝之神也。下司九宮，中建皇極。欽若則彞倫攸敘，怠棄三正，錯亂五常。黃帝以惠迪吉而為五帝之聖，大禹戒從逆凶而衍九疇之文。炎漢高祖受命，張良秘金刀之錄；吳主爭權，劉悵演炎旌之祥。神用於不言之載，容化於無為之間。閉戶而休咎自征，拂鑒而毫髮皆極。非主精妙物、執契於混油之始者，又何足以知之？愛發上元，迄是帝載，幾千年而一聖，數百年而一賢。得隩隅有登龍之喜，窺閉鍵而若重關之隔。沿波獨往，泛滄海而不歸，討本窮源，恃孟門之嶄絕。至於計神審物，天日司奸，一三置將之數，四六對絕之氣，掩迫孤單，閉杜十精。喉交較以八節占水早，九州島言吉凶，五將定主客，亦猶兵戈勝負。丘明受經而作傳，見非公穀；子夏師聖而序詩．複殊毛魯。學而時習之，攻乎異端；籠他人之口，未忘已拙。以鼓測海，以管窺天；心見之外．愚衷謂盡。或指陳實錄，或涎錫嘉名。正二局，有陰陽之殊；糾六壬，附時計之謬。淮南分野，縱博我以多聞；黃道日躔，競有疑而則闕。源流則廣，枝葉扶疏。孤裘同士薦之風，玉石抵昆山之鵲。雖億則屢中，時自賢於仲尼，而謀之不藏，且推過於季氏。王大實遂偃弊風，國之事多惟慚德。伏惟開元皇帝陛下明極稽疑，睿聖作範．察璇璣以齊七政，制禮樂以穆百揆，明太乙之威神，封泰山之能事，高視萬古名言。謂何神嘉承日月之照，荷覆躊之廣，參沼賜於金馬，觀秘籍於蘭台。磋此《式經》，有乖微旨。乃上稽天象，中跡算術，下統人事，旁貫歲時，考帝先於神女之符，歷載紀於蒼頡之筆，甲乙之終數、宮元之往複、奇偶之二算、勝負之八門，與人惎法式之愆、陣圖水火之失、禮樂不興之論、周宇狂簡之文，或義通而即流．或理僻而便削，皆考經義，以一貫之。穆若蕙婉，聲如玉振。夫詩對惠連，輒得嘉句；筆因樂廣，便至能文。萬殊皆極而同歸，獨見忘言而既驗。校之以元紀，又精之以日時。代謀於述作之前，總括於天人之際。會披覽得意之妙，動契合如神之在，亦曠代之能事也。經凡十卷，名曰《太乙金境式經》。若筆削後於孔明用賢，則子房升堂，風後入室，宋琨樂產，李淳風屬，可座廊廡之下，如以爾言過矣。將侯來哲。
《太乙金鏡式經十卷》
其以歲、月、日、時為綱而以八將為緯，三基五福、十精之類為經亦猶夫歷也。其法以八將推其掩迫、囚擊、關格之類，占內外災福，又推四神所臨分野，占水旱、兵喪、飢饉、疾疫，又推三基、五福、大小游、二限易卦大運，占古今治亂。
俞正夑《癸巳類纂》十史記用蓋天論云：「渾天所有箕義云；萬物之根棋，徐廣本作橫，則橫非基無疑，大一十神之君棋、臣棋、民棋，沈括《蘿溪筆談》謂是基字，因唐諱改棋， 熙寧中，領太史欲正之而未能也。《雲麗漫抄》亦言十神君基、民基。唐明皇諱為碁，至今不改，今所見邱溶太乙淘金歌，已改從基，其亦未之思矣。」又《九宮紀年論》云：「太乙金鏡式經云：太一十神、五福、君棋，大游、小游、天一、地一、四神，臣棋、民棋、直符，皆天之尊神，行五宮五移而周，」《蘿溪筆談》小游作太一，四神作十神，直符作九氣，三年一移」，又云：「棋應作基，案其式君棋、臣棋、民棋行十二次天，一行十二宮，或行八卦或行十六神，不得總雲行五宮五移而周也。」其下詳論諸法，有一月—移，一年—移，三年一移，四十五年一移，不錄。
元朝曉山老人輯《太乙統宗寶鑒》序文中曰：「太乙理蘊於數之中，數顯於理之外，主管三元，分布四方。」由此觀之，太乙主以「數」來顯理，即演數其理昭著於太乙周行，而「太乙」之神正像其它術數一樣，是推算的起點，像個帶頭人，統領十六神，而知風雨水旱金革凶饉之事。何謂十六神，以天有十二次配地十二辰，以天有四時配地有四維，通之十六也。
《太乙金鏡式經卷一》
《推上元積年》
自上元以來，歲代綿遠，紀法差殊。雖設繁詞，備而靡用。今從上元甲子到唐開元十二年甲子歲，通前計四萬八百一算。臣按宋琨置元，似童兒戲。推求人紀之年，下求不得日辰，上求不得冬至。自三百餘年，學者何多，逮於淳風，但效尤而已。臣今別修甲子元四分歷法，與太乙同元。舉而備用，得上元甲子冬至；引而下之，齊距歲計大乙行官。進不違於四分，退不失於元紀。自上元混沌甲子之歲，至今大唐開元十二年甲子歲，積得一百九十三萬七乾二百八十一算。上考注古，每年減一算；下撿將來，每年加一算。
《推太歲所在》
置上元甲子積年，以三百六十去之；不盡，以六十去之；又不盡，命甲子算外，即太歲所在辰也。
《推入六紀三無法》
置上元以來距所求積年，以周紀法三百六十去之；不盡，紀法六十去之，所得為紀數；不盡，為入紀年數也。
《積太乙所在法》
推上元積年，以周紀法三百六十去之；不盡，以元法七十二去之；又不盡，以太乙小周法二十四除之，又不盡，以三約之，為宮數，不滿，為入宮以來年數。其宮數易其命起一宮，順行八宮，不游中五，算外，即得太乙所在及入官以來年數也。
《推天目所在法》
置上元積年，以周紀法去之；不盡，以元法七十二去之；不盡，以天目周法十八去之，不滿者，命起武德，順行十六神，遇武德、大武，重留一算外，即天目所在。
《推計神所在法》
置積年，以紀法六十去之；不盡，命起寅宮，逆行十二辰，算外，即計神所在也。
《推太歲支合神法》
假令太歲在子，合神在丑，逆行十二辰，十二年一周天矣。
《推六紀月建法》
一紀：二甲仲辰。甲子、甲午，二甲仲辰。十一月建甲子，太乙在一宮，武德為天目，計神寅，合神醜；
二紀：二己孟辰。己巳、己亥，二已孟辰。十一月建甲子，太乙在六宮，地主為天目，計神、合神如上同；
三紀：二甲季辰。甲辰、甲戍，二甲季辰。十一月建甲子，太乙在一宮，大靈為天目，計神、合神如上同；
四紀：二己仲辰。已卯、己酉，二已仲辰。十一月建甲子，太乙在六官，武德為天目，計神、合神如上同；
五紀：二甲孟辰。甲申、甲寅，二甲孟辰。十一月建甲子，太乙在一官，地主為天目，計神、合神如上同；
六紀：二已季辰。己丑、已未，二已季辰。十一月建甲子，太乙在六宮，大靈為天目，計神、合神如上同。
凡三十有六紀。三十年有三百六十個月，是以甲子、甲午同建，太乙、天目、計神、合神用式之法一同歲計之法，占驗逆顧，其義亦等。臣今為李淳風定時，計五日六十時。法以為月，計五年六十個月，三十年有三百六十個月。若有閏月，只以逐月節氣時刻為正也。
《推太乙月計差法》
章歲六百五十七。章月八千七百二十六。
閏差二十秒二十七。周紀法三百六十。
秒法二百。
《推積月》
置積年，所求年以章月乘之。
章歲而一，為積月；不盡，為閏餘。若有餘月，隨數加之。
《推求閏月》
置閏餘，每月加閏差及秒，滿法從閏餘，或六百三十秒者，以上無中氣者，詳之。
《推太乙月計所在》
置積月，以周紀法三百六十去之；不盡，以元法七十二去之，又不盡，以太乙小周法二十四去之；不盡，以三約之，為宮數；不滿，為入宮月數。命起一宮，順行八宮，不游中五，算外，即月計大乙所在也。
《推天目所在》
置入月紀，以天目周法十八去之；不盡，命起武德，順行十六神，遇陰德大武，重留一算外，即天目所在也。
《推計神所在》
置積月，以紀法去之；不滿者，以周法十二去之；不盡，命起寅，逆行十二辰，算外，即計神所在也。
《推日計差法》
日法四十九。 月法二千四百四十七。
朔策二十九。 小餘二十六。紀法六十。
《推積月朔法》
置積月，以月法乘之，日法而一．為積日；不盡，為小餘。以紀法除積日，不滿，為月餘。命甲子算外，即所求年天正十一月經朔日辰及小餘也。若更有餘日，隨數加之，求次月，每月加二十九，小餘三十六，各加法求之。弦望，算如大歷，非此所須也。臣按：梁武帝天監三年甲申，帝召太史虞履、樂茂言之：今日太乙在八宮，和德為天目，文昌將外宮，迫災輕，無所畏也。退謂人曰：外宮迫，為外人之迫也。四十年後辰巳之年，同於桓公大亨之歲。臣以日計太乙求之，積至梁天監三年甲申歲六月八日，凡得七億七百五十萬一千六十一日。以周紀法除之，得一百九十六萬五千二百八十；不盡二百六十一，以小紀法除之，得四；不盡二十一，為入第五紀也。
《推日計太乙所在》
置積日，以周紀法三百六十去之；不盡者，以元法七十二去之；不盡，以大乙小周法二十四去之；又不盡，以三約之，不滿，為入宮以來日數。其宮數命起一宮，不游中五，算外，即太乙所在也。
《推月計天目所在》
置積月，以元法七十二去之；不盡，以天目周法十八去之；又不盡，命起武德，順行十六神，遇陰德大武，重留一算外，即天目所在也。
《推日計計神所在》
置積日，以紀法六十去之；不盡者，又以計神十二除之。命起寅，逆行二十辰，算外，即計神所在也。
《推時計差法》
全數二十六萬口千八百四十三。
氣法三萬三千一百九十三。
辰法三千六百八十二。 小分十二分之也。
半辰法一千三百四十一。 小分十二分之四半。
《求冬至法》
置積年減一，以餘數乘之，為氣法，而一，得積日；不盡，為小餘。以紀法去積日，不盡，為大餘。命大餘起甲子，算外，天正冬至日辰也。
《求次氣法》
置天正冬至大小餘．每氣加一十五日，餘七十三千五秒，滿二十四，從小餘一；滿氣法，從大餘；滿紀法去之，即次氣大、餘也。
《求加時法》
先置半辰法之數一千三百四十一、以十二小分之四半，以夏至小餘加之，滿法而一，所得為辰數。命甲子算外，則氣應加時也。不盡，以三乘之，辰法而一，得致命為一辰中孟、仲季數也。
《求太乙冬夏至入紀》
陽遁太乙冬至起乾，陰遁太乙夏至起巽，凡一百八十二日三萬二千二百九十三分日之二萬三十五，為太乙變行。
《推冬至太乙加時變行》
臣希明按，張良云：太神變順氣為餘。今置上元所求年天正積日及小餘，先加半辰法，以辰法除之，得為加時辰數。及置積日減一，以十二乘之，並加時辰數，為天正時實。以周紀法去之；不盡，為入紀實。置入紀實，以太乙周法去之，餘者，以三約之，為宮數；不盡，為入宮時數。命起第一宮，順行入宮，不游中五．算外，即天正加時太乙所在宮也。
《推太乙夏至加時所在變行》
置天正積日及小餘秒，加陽遁一百八十二日三萬二干二百九十三分日之二萬三十五為小餘秒。滿秒法，從小餘一；不盡，為秒。其小餘先加半辰法，以辰法除之，為加時辰數。乃置積日減一，以十二乘之，並入加時辰數，為夏至加時實，亦以周紀除之；不盡，為入紀實。
置入紀實，以太乙周法二十四去之；不盡，以三約之數；不滿，為入宮時數。命起一宮，順行八官，不游中五，則為陰遁大乙變行也。
《推冬、夏二至以後太乙所在法》
置冬、夏二至以來並今日所求日減一，以十二乘之，先加冬、夏二至時數並今加所求時數，為冬、夏二至後時實，以太乙周法二十四去之；不盡者，以三約之，為宮數；不滿，為入宮時數。陽遁命起一宮，順八宮，不游中五，算外，即太乙所在宮。陰遁命起九宮，逆行八宮，三時一移，不游中五，算外，即陰遁太乙所在宮也。
《推陰、陽二遁時計計神法》
置時實，各以十二去之，餘者；陽遁命起寅，逆行十二辰；陰遁命起申十二辰，各一時一移算外，即陰、陽二遁計神所在也。
《推太乙當時法》
算二至以後日度所在加時位，加於時支也。明太乙、天目類時計終法，立五將式之天乙，朝暮治神。
甲日朝治小吉，暮治大吉，戊、庚日反是；
己日朝治神後，暮治傳送，乙日反是；
丁日朝治登明，暮治從魁，丙日反是；
癸日胡治太乙，暮治太衝，壬日反是；
六辛之日，朝治功曹，暮治勝光。
不理魁、罡二辰。戍為天獄，辰為天庭，非貴所居也，老將所在，以宰殺推吉凶。
天乙貴神土，主貴人、接引、升進、王相，吉；囚死，凶；
前一螣蛇火，主驚恐、戰鬥，凶；
前二朱雀火，主文書、口舌、衣物，凶；
前三六合木，主凡事和合、婚姻，吉；
前四勾陳土，主勾留、戰鬥，凶；
前五青龍木，主遷官、錢財、婚姻，吉；
後一天後水，主蔽匿、婦人淫亂事；
後二太陰金，主陰人掌事，吉；
後三玄武水，主盜賊、亡失財物，凶；
後四太常土，主財物、金玉、酒食，吉；
後五白虎金，主死亡、哭泣、兵刃、道路，凶；
後六天空土，主萬物欺殆、奴婢欺詐，凶。
臣希明以為算術時計立五將，亦未能決定大小將之古凶，更以日度加時。因步六壬式，知天乙成敗之分。其主、客諸將在此吉神下者，吉；若在凶神下，凶；若門具將發遇吉神，則大吉；若門杜閉塞凶神，則先吉後凶；若門杜閉塞遇吉神，守固大利也。
假十月五日庚申時加戊寅，入立冬氣，六陰遁曰，入第六紀壬子元二十七局，太乙在九宮，大武為天目，午為計神，己為合神，主算得二十九，主大將在九宮，主參將在七宮。以計神加和德宮，天目下臨高叢卯，客算得單四，客大將在四宮，參將在二宮。因步天乙式，立冬六日，日在心宿，加寅庚日天乙，朝治大吉。太乙在青龍下，主大將在青龍下，主參將在太常下，客大將在六合下，客參將在天定下，以此觀之，諸將吉凶定矣。雖微有差，未可近而取之。
《推太乙玄命法》
天子玄命在天乙。皇後玄命在天後。
公侯玄命在太常。將軍玄命在勾陳。
九牧玄命在螣蛇。常侍玄命在天空。
二干石玄命在青龍。大夫、吏士玄命在朱雀。
庶人玄命在行年。
《推太公考時法》
有太乙左天日。假令太乙在一宮，天目臨在三宮，是右太乙、左天目，陰陽和順，上下無掩、擊、邊、囚、關、格、對，並不相四口郭固、杜，又不提挾，太乙不在陽絕之地，神將獨立吉道清虛。吉道，謂開、休、生三門是也。清虛，謂門無凶惡之神也。則三門具五將，發利以行兵，又合玄命，王相挾和。假令天子玄命於天乙，臨在旺相之鄉，上下相生，故曰合也。乙直使前三五、後二四合者，大吉。
《推八門用法》
張良云：陽遁冬至甲日夜半甲子以後開門直使，丙日日中甲午以後生門直使；己日夜半甲子以後驚門直使；辛日日中甲午以後休門直使，三十時移門。陰遁夏至甲日夜半甲子以後杜門直使；丙日日中甲午以後死門直使；己日夜半甲予以後傷門直使；辛日日中甲午以後景門直使，三十時一移門也。常以直門加太乙，及主、客大將隨數而行。太乙三時一移，大將一時一移也。臣今太乙冬至、夏至初臨之時，門則隨數起，時盡則移，不拘其甲、丙、己、辛日也。陽遁四門，開、生、驚、休；陰通四門，杜、死、傷、景。
《推冬至加時所直門法》
臣希明今置天正時實，以二百四十去之；不盡，以一百二十去之；不盡，以三十約之，為門數。命起開門，以次而行，即天正冬至加時所直門也。
《推夏至加時歷直門法》
置夏至時實，以一百二十去之，不盡者，以三十約之，為門數。命起開門依次而行之，即夏至加時所直門也。
《推八門占歲計法》
李淳風云：常以開門加大乙，即太乙之八門也。又以開門加主大將，即主大將之八門也。又以開門加客大將，即客大將之八門也。又以開門加定計大將，即定計大將八門也。本是太公考歲計定八門，立五將也。又云：客、主八門與太乙八門開、休、生台者，大利。太乙天目在主、客三門下者，閉塞不通。今雲窖、主八門與太乙八門開、休、生三門合者，大利。
臣今別立新術，置上元甲子以來距所求積年，求歲計八門，以大游紀法七百二十去之；不盡，以三分紀法二百四十除之；餘以三十約之，為直門致；不盡，即宣門所入年。命起開門，以次休、生門，左行八門，周而複始。假令今開元十二年甲子，即開門為宜使，至三十一年甲午歲即休門為直使，他皆仿此。
《太乙金鏡式經卷二》
《推太乙所在法》
《傳》曰：太乙者，天帝之神也。主使十六神，知風雨、水早、兵革、飢謹、疾疫、災害之國也。常考之，順行八官，不游中五，三年徒一宮。第一年治天，齊日月、星辰，使七曜無差其度，以明天道。所臨之分，承天道而行，則獲治天之考．第二年治地，調四氣、八風，能使風雨不愆其候，以明地道。所臨之分，無興土木之功、役人民、妨稼穡，則獲治地之考。第三年治民，使君臣、父子、長幼無失其序，以明人道。所臨之分，進忠良，察獄訟，恤孤寡，則獲治人之考。古太乙考治天下。若無道之國、失禮之君，恃干戈恣侵伐，則兵災、水早、飢（）、流亡以行其罰。若守道安民，（）兵禁暴，則五緯不愆度，四民無失業。故《經》云：太乙所臨之國，有道則昌，無道則殃。樂產云：能使日月無光，五緯孛現，山崩地震，川湧河竭者也。
《推五將所主法》
五將者，太乙監將，並上下二目、主客大小將也。監將者，東方歲星之精，受木德之正氣，王在春三月。
上目者，南方熒感之精，受火德之正氣，在天為陽，號始擊將，屬客，王在夏三月。
下目者，中宮鎮星之精，受土德之正氣，在地為陰，號文昌將，屬主，王在四季。
客大將者，北方辰星之精，受水德之正氣，主兵革，王在冬三月。
主大將者，西方太白之精，受金德之正氣，主戰鬥，王在秋三月。
又五將各應五方，隨四時備有休王。《經》云；主客兩陣相當，乘生氣者勝，乘死氣者敗。
假令八月攻東方，以太簇為始擊將，乘生氣也，大勝。若高叢為始擊將，乘死氣也．大負。他仿此。
歲汁者，歲星之使也，謂計歲、月、日、時之事也。
是故聖人則而像之，創法而制局。太乙為人君，二目法輔相五將，定主客八門，分勝負、運沉於機樽之間，突雄略於幃幄之內，蓋王佐之要道也。
推九宮之法
昔燧人氏仰觀北極而定方。包犧氏因畫八封。帝宣受命，使大撓造甲子，容成以造歷數，八封九宮之旨，自此興焉。九宮之義法以靈龜，以二、四為肩，六、八為足，左三右七，戴九履一，此為不易之常道也。黃帝又命風後為太乙式，九宮皆差一位，自晉以前，莫詳所以推。
郭醫《曜靈經》云：地缺東南，宮數多者不出於九，故差九以填之。樂產曰：太乙寄理，以明人事，後王得之以統一天下，所以差一官以就乾位。王希明曰：太乙統人事，以知未來之道。故聖人特差一宮，以明先知之義也。
一宮在乾，主冀州、並州。若文昌將關囚，必有迫肋君父之象矣。二宮在離，主荊州。若太乙臨之，君誅大臣、將相矣。三宮在艮，主青州。若始擊臨之，嬖寵進中宮，兵起。四宮在震，主徐州。若始擊臨之，主西戎來侵。六宮在兌，主雍州。若客大將臨之，南楚來侵。七官在坤，主梁、益州。若主大將臨之，梁、益二州兵起。八宮在坎，主兗州。若太乙臨之，臣欺君也．九宮在冀，主楊州。若客大將臨之，幽、冀二州來侵，
張良《經》云：八、三、四、九為陽，二、七、六、一為陰。一宮為純陽，九宮為純陰。五月一陰生，至戌月單陽，亥月絕陰，戌、亥在一宮之地，故曰純陽。十一月一陽生，至辰月單陰，巳月純陽，辰、巳在九宮之地，故曰絕陰。凡六、四為絕氣。二午八子，冬、夏之至位，阻陽交易之地，故曰絕氣。凡至陽絕之，氣與事皆凶也。
推八門所主法
玄女云：天有八門，以通八風也。地有八方，以應八卦之綱紀、四時，主於萬物者也。開門直幹，位在西北，主開向通達。休直坎，位正北，主休息、安居。生門直艮，位東北，主生育萬物。傷門直震，位正東，主疾病、災殃。杜門直巽，位東南，主閉塞不通。景門直離，正位南．主鬼怪亡遺、驚恐奔走。死門直坤，位在西南，主死喪、葬埋。驚門直兌，位正西，主驚恐奔走。開、休、生三門大吉，景門小吉，驚門小凶，死、傷、杜大凶。八節八門各主王四十五日．通王，以戰勝，吉；不王，凶。
推十六神所主法
《爾雅》云：四時和為玉燭。《律歷志》曰：太極運三辰五星於天，元氣轉三、五流行於下地也。
子神曰地主。建於之月，陽氣初發，萬物陰生，故曰地主也；
丑神曰陽德。建丑之月，二陽用事，布育萬物，故曰陽德也；
艮神曰和德。冬春將交，陰陽氣合，群物方生，故曰和德也；
寅神曰呂申。建寅之月，陽氣大申，草木甲拆，故曰呂申也；
卯神曰高叢。建卯之月，萬物皆出，自地叢生，故曰高叢也；
辰神曰太陽。建辰之月，雷出震勢，陽氣大盛，故曰太陽也；
巽神曰太靈。春夏將交，盛署方至，陽氣炎酷，故曰太靈；
巳神曰太神。建巳之月，少陰用事，陰陽不測，故曰太神；
午神曰大威。建午之月，陽附陰生，刑暴始行，故曰大威也；
末神曰天道。建末之月，火能生土，土王於未，故曰天道也；
坤神曰大武。夏秋將交，陰氣施令，殺傷萬物，故曰大武；
申神曰武德。建申之月，萬物欲死，葬麥將生，故曰武德也；
酉神曰太簇。建酉之月，萬物皆成，有大品蔟，故曰太簇也；
戍神曰陰主。建戍之月，陽氣不長，陰氣用事，故曰陰主也；
干神曰陰德。秋冬將交，陰前生陽，大有其情，故曰陰德也；
亥神曰大義。建亥之月，萬物懷垢，群陽欲盡，故曰大義。
黃帝受命，龍馬負因而出河，因體其象，而制太乙式，體有三重，上青法天，下黃法地，中體像人，即天、地、人三才悉備。天有十二辰，地有十二次，四維、八門、九宮、十二神，咸有象焉。
《經》云：運式之儀有八；一詳太歲所在，欲求計神，故先詳之；第二詳太乙所在宮，以立監將；第三詳何神為天目，以置文昌、始擊諸神也；第四詳何神為計神，以知主客計；第五詳何神為始擊，以計神加和德官，求文昌所臨宮，以艮為鬼門方，求幽冥吉凶，故加和德而計之；第六視天地二目各在何所，求主客之算，第七詳置算之數，以定主容大將之官；第八論主客置算，若得十，置一；若得二十四，棄二十，置四，餘皆以例而推之，各視天目所在宮而行算。若天日在正宮，則按本數。若天目間神，則加一數而行算，至太乙宮止矣。
假令太乙在九宮，大義為天目，後大義一算，地主八算，和德三，高叢四，計得十六。餘仿此。
《禮》設尊卑，《易》陳貴殘。臣行君道則政悖，子行父道則義乖，故用式之道，事各不同。《洪範》曰：洪者，大也。範者，法也。言天地之大法也。
王省維歲：
王所有歲，兼總群吏，如歲兼四時也。
卿士惟月：
卿士各有所掌，如月之有別也
師尹惟日：
象正官之吏，分治其職，如歲有日也。
歲、月、日、時無易，各順其常，故王者用歲計，卿士惟月計，師尹惟日計，故時通上下，則上白天子，下及庶士，時通用也。
張良《經》曰：陰陽和不和者，渭太乙及上、下二目就算數以相配。下目立正宮，為陽；立間神，為陰。立陽，算得奇為重陽；立陰，算得偶為重陰，則不和。上目所臨陽宮，算得重陽，為重臨正二官，算得奇也。臨陰宮，算得陰為重陰，為臨間神，算得偶也。若在陽，算得偶陰，算得奇為陰陽和，和則吉，算十一、十三、十七、十九、三十一、三十三、三十七、三十九為陽數。目臨為重陽，算中陰陽。若算得二十二、二十四、二十六、二十八為陰，皆不和也。太乙在陽宮，算得奇者為重陽之數，八、三、四、九為陽宮。太乙陰宮，算得偶者為重陰之數，二、七、六、一為陰宮，皆不和。若太乙在陰宮陽奇，算得偶數者，為陰陽和也。王希明曰：三、九寅辰為純陽；二、八巳丑為雜陽；二十六未亥為純陰，七、一戊申為雜陰；三十三、三十九為重陽，二十二、二十六為重陰；二十四、二十八為雜陰；十三、十九、二十一、三十七為雜陽。皆以次兇尤甚。太乙、天日在陰位，算得純陰在陽位，算得純陽為內外有謀，在純者勝。太乙、天目在陰位，算得重陽為內有謀。若算得十四、十八、三十三為上和，二十三、二十九、三十二為次和，十二、十六、二十七、三十四、三十八為
下和，若太乙、天目立陰陽位，而算陽多者，利為客；陰多者，利為主。更須考其深淺，以明勝負也。
黃帝受命，龍馬負因而出河，因體其象，而制太乙式，體有三重，上青法天，下黃法地，中體像人，即天、地、人三才悉備。天有十二辰，地有十二次，四維、八門、九宮、十二神，咸有象焉。
《經》云：運式之儀有八；一詳太歲所在，欲求計神，故先詳之；第二詳太乙所在宮，以立監將；第三詳何神為天目，以置文昌、始擊諸神也；第四詳何神為計神，以知主客計；第五詳何神為始擊，以計神加和德官，求文昌所臨宮，以艮為鬼門方，求幽冥吉凶，故加和德而計之；第六視天地二目各在何所，求主客之算，第七詳置算之數，以定主容大將之官；第八論主客置算，若得十，置一；若得二十四，棄二十，置四，餘皆以例而推之，各視天目所在宮而行算。若天日在正宮，則按本數。若天目間神，則加一數而行算，至太乙宮止矣。
假令太乙在九宮，大義為天目，後大義一算，地主八算，和德三，高叢四，計得十六。餘仿此。

《太乙金鏡式經》卷三
《經》曰：始擊將臨太乙宮，謂之掩。歲計遇之，王綱失序，臣張君弱，宜修德以禳之。蓋掩襲劫殺之義。若掩太乙在陽絕之地，君凶；陰絕之地，臣誅。掩主大將，主人算和，吉；不和，凶。參擊之勝。
《經》曰：太乙所在宮，客目在太乙前一辰，為前擊；在太乙後一辰，為後擊；在太乙前一宮，為外宮擊；在太乙後一官，為內宮擊。所為擊者，臣凌君卑。凌尊，下凌上，僭也。歲計遇之，將相相伐之義也。
《經》曰：前為外迫，後為內迫，為上、下二目，主、客、大小四將，在太乙左右為迫。王希明曰：上目無迫。若下目在太乙前一辰，為外辰迫；在後一辰，為內辰邊；在太乙前一宮，為外宮迫；後一宮，為內宮迫。宮迫，災微緩；辰迫，災急疾。歲計遇迫，人君慎之。
《經》曰：囚者，篡戮之義也。若文呂將並主、客、大、小四將俱與太乙同宮，總名曰囚。若在陽氣、絕氣之地，大凶；若在絕陽、絕陰之地，自敗，臣受誅。若諸將與太乙同宮，或近大將，謀在同類；近參將，謀在內也。算和者，利；算不和者，謀不成也。
《經》曰：客、主、大、小將目相宮齊為關。王希明曰：關之為義，但將相怕忌之事，不及於君也。主、客、大、小將同宮數齊，皆為關日。
《經》曰：客目大、小將與太乙對宮為格，言政事上下格也。若在陽絕之地，又與歲計遇格，不利。有為所格者，格易之義也。若格太乙者，盜侮其君。主、客算不和者，必敗。
《經》曰：下目文昌將與太乙衝而相當者，為對。若下目相對之時，皆為大臣懷二心，君逐良將，凶奸生，下臣欺上。
《經》曰：四郭固者，文昌將囚，大乙宮至，大將、參將又相關。或客目臨之，或容、大、小將相關，皆四郭固也。主人勝固者，憑勝不利，先起四郭之固。歲計遇之，主篡廢之禍，利以修德禳之也。
郭杜法
《經》曰：四郭杜者，為客參將與文昌將，並主大將與容大將並兼之掩、迫、關、格、提挾，以出兵，為閉杜不通，及謀諸事不成。歲計量之，無大禍也。
《經》曰：執提者，為開、生二門合衝，皆為不利。名為執提，對為提格，歲計遇之，不可舉事。所謂開、生二門合衝者，假令開門為直事，不可與開門合衝；生門為直事，不可與生門合衝，大凶。伍於胥曰：三門皆不可與太乙相衝。
李淳風云：客、主兩將或一將而共太乙，挾客、主目或大、小將於正宮者，為提挾。若客、主二目臨間神，客、主二將拱太乙，挾二目於間神，謂之挾閉。主人雖見提挾而在內，猶可戰。自一至四為內宮。若囚死在陽絕氣者，雖在外，亦凶。客雖提挾而在外，猶可戰。自九至六為外宮。若在囚死及陽絕之地者，雖在內，亦凶。歲計通提挾，凶。客、主有內、外迫者，不利先起。張良云：客目大將、參將挾主目，客勝；挾太乙，先勝後敗。主計目
囚迫太乙，客勝。
太乙三門五將立成勝敗鈐（省略）
古者言太乙主客相關者，以林虎、淵蛟而為喻。蓋取勢不兩立、物無雙存之義。大抵與敵相遇，事不得已，當看客關得主人，則客勝；主人關得客，則主勝。皆用日計納音以決之。所謂關者，取五行相制之道也。假令高叢為地目，木神也；太簇為天目，金神也。金制木，此為客關得主人，客勝也。假令陰主為地目，土神也；地主為天目，水神也。土能制水，此謂主人關得客，主人勝也。
《經》曰：主、客者，先後之理、動靜之義也。古法曰：陳兵原野，先動者為客，後應者為主。若安居之勢，先動者為主，後應者為客。若得三門具，五將發，陰陽和，稱兵所向必克，先勝後負。若三門不具，五將不發，陰陽不和，則不利舉兵，宜固守，吉。欲知主、客出入之者，東以陰德，南以和德，西以大顯，北以大武，為始發之神，以定主、客所起歸之神也。客欲知主，視其算所知也；主人欲知客，亦視其算所知也。
《經》曰：行師必出奇門，賂地並用其二。古法：人君須出其賂地，及安置諸軍者，算十二、二十二、三十二，五將發三門具，乃可出兵賂地，擇便處以出軍。故曰：賂地井用二奇門者，為出開、休、生三吉門也。
算得一，出軍宜西北，戰利東南，背深澗隱匿之地，用方陣，舉白旗；算得二，出軍宜正南，戰利向正北，邪道向西南，背山邑火光耀耀焦之地，用宜陣，舉育旗；算得四，出軍宜正東，戰利向正西，背林木窮邁曲堤之地，用銳陣，舉赤旗；算得五，出軍宜正北，戰利向正甫．背積土，負城邑、山林之地，用曲陣，舉黑旗。不然，探溝高壘固守，吉；算得六，出軍宜正酉，戰利向正東，背水澤，塹於丘纓之地，用方陣，舉白旗『算得九，出軍宜東南，戰利向西北，背高山、丘陵、積土之地，用銳陣，舉赤旗。今則太乙兵起鄉，陣隨於地，觀方制變，皆算稱神，此用兵之神道也。
《經》曰：置陣者，曲陣為水，銳陣為火，直陣為木，方陣為金，圓陣為土，皆取主、客置陣；次以五行相克而取勝負。不知置陣之法，皆取地形而且之。若地形後高前下，則為銳陣，利以進戰，以潰其敵也；前高后下，不便進退，利以近鬥，宜為直陣以守之，以疲敵力；若地污邪、不便於戰者，宜為圓陣，利以堅守；若地高而乎，宣為方陣，利以四向以通敵也，若左右勢高，則宜為曲胯以吞敵。若死順其向，則吉；若地反箕拘，則凶。今則太乙兵起之鄉，陣隨其地，雙方置變，運變稱神，此用兵之法也。
曰：善兵臨戰合用之急者有三：一曰士卒膿習；二曰隨其地形；三曰善用兵器。五丈之溝、居塹之水、山林積石、川澤丘阜、草木所臨，此步兵之地也，車騎三不當一；土水平陵，曼衍相屑，平原廣野，此車騎之地也、步兵十不當一；兩陣相近，平地線革可前可後，此長城之地，劍盾三不當一；蓮葦竹蕭，草木蒙籠，枝葉接茂，此矛錘之地也，弓彎三不當一；乾陽相遠，山谷幽澗，仰高臨下，此弓彎之地也，短兵百不當一；士不選練，卒不服習，起居不櫻，動饞不漿，避難不及，射擊後解，與金鼓之指相失，此多勤卒之過也，百不當一。兵不完利，與空手同；中不能入，與無骸同，此將不習兵之過也，十不當一。兵法曰：器械不利，以其卒與敵也；卒不可用，以其將與敵也；將不知兵，以其主與敵也；君不擇將，以其國與敵也。此四者，兵之要也。是以太乙用兵之道，克敵於未來，制勝於未兆*臨敵觀變，在於將也。故曰：出兵當從奇門，臨敵隨形制變，此之要也。推太乙在天外地內法
古法曰：太乙在八、三、四官者，為地內宮，助主人；太乙在九、二、七、六宮者，為天外宮，助於客。若助主人之時，原野不利先起；若助客時，安居不利先起。《經》曰：欲為客，待大乙在天外之時；欲為主，候太乙在地內之時。又須得門具將發，則決勝也。
《經》曰：能識奇伏，變禍為福，為釋五兵之義也。奇兵之法，若有百人，以三十人為奇兵；若有千人，以三百人為奇兵；若有萬人，以三千人為奇兵。隨地伏形，不可常也。古者，伏兵必敗大煞之地，望敵鼓噪而發。大煞之地，天目所臨之下也，得十二、二十二、三十二之時伏兵。《經》曰；伏藏隱跡，必居其一算，十一、二十—、三十一之時，藏於山林溝澗之中，人不能見也。《經》曰：伏兵必用俺迫之時也。故伏兵待敵來掩襲者，必取掩迫太乙，軍可發。若賊急，則伏兵於要害也。
《經》曰：助戰之法，常須觀風雲之勢，察飛烏之情。若太乙所在宮有風雲、飛鳥等來衝格、迫擊太乙者，大敗之兆。若追擊大將宮者，主敗。若從它日上去擊客，客敗。若從骼目上擊主，主敗。若從主人形上來，客敗。若有風雲、飛鳥從太歲、大陰、月建上來擊主人，主人敗：擊客，客敗。若有風雲、飛鳥扶主人陣者，主人勝；扶客陣者，客勝。若其日有回風起伏、飛烏旋轉，於陣中旗折，大敗之兆，若眾來噪陣者，及有風雲衝突主人陣，主人敗；衝突客陣，客敗也。
臣按：前篇但雲氣在敵上擊我，我敗者，大義如此。中不無至妙令世之言。
假令敵在北方，若有黑氣，氣在敵陣上，敵大勝；若壬癸日，彌佳。若白雲氣在敵陣上，敵欲罷陣求和。若青雲氣在敵陣上，將寬緩，急擊則平。若紅雲氣在敵陣上，客勝。若黃雲氣在敵陣上，大敗；壬癸彌惡也。
假令敵在南方，若有赤雲氣在敵陣上，大勝；丙丁日彌佳。若青雲氣在敵陣上，欲罷陣求解。若黃雲氣在敵陣上，敵將遲鈍，急擊則平。若白雲氣在敵陣上，失利。若黑雲氣在敵陣上，敵大敗；丙丁日彌惡。
假令敵在西方，有白雲氣在敵陣上，庚辛日彌佳。若得黃雲氣在敵陣上，欲求解。若黑雲氣在敵陣上，將寬緩，急擊平。若青雲氣在敵陣上，敵敗。若赤雲氣在敵陣上，放大敗；庚辛日彌惡。
假令敵在東方，若青雲氣在敵陣上，大勝；甲乙日彌佳。若黑雲氣在敵陣上，欲求和。若赤雲氣在敵陣上，敵將遲鈍，然不可擊。若黃雲氣在敵陣上，大敗；甲乙日彌惡。
此諸雲氣在敵陣上既然。若在我陣上亦爾。諸勝氣動利，大勝。雖得勝雲氣，若斷續不次，或南北潰亂，亦敗。若得敗雲氣堅實，動大利。則雖得敗氣，若斷續潰亂，不至全惡。若對陣之時，若勝雲氣在大將上，大勝；參將上，參將勝。若敗雲氣，反此。則前諸格、迫或太乙雲氣皆須約其方面，審候雲氣勝負，以定吉凶。若都無雲氣多少方分，無戰或複相勻也。
《太乙金鏡式經卷四》
自上元甲寅之歲至大唐開元十二年甲於歲積，很二十八萬五千一十一算。臣今恐速要自漢安帝元初甲寅為近至開元十二年甲子歲，積得六百十一算。
《經》曰：君基所臨之地，至宜服其地，或幸其方，以應兆也。
置上元以來，以大周三百六十去之；不盡，為入周以來年數。置入周以來年數，以三十除之，為邦數；不滿，為入邦以來年數。其邦數命起戍邦、順行十二邦算外，得君基所在也。
《經》曰：臣基所臨之分，宜進獻以供聖人也。
置上元積年以來，以大周法三百六十去之；不盡，為入周以來年數。置入周以來年，以小周法三十六除之；不盡，為入周以來年數。又以三約之，為邦數；不滿，為入邦以來年數。命起戌邦、順行十二邦算外，即臣基所在也。
置上元積年，以大周法三百六十去之；不盡，為入周以來年數，又以小周十二去之；不盡，為入小周以來年數。置小周以來年，命起戌邦、順行十二邦算外，即民基太乙所在也。
《經》曰：五福太乙所臨之分，無兵革、疾疫、飢荒、水早之災。行宮有五、四、十五年移一宮，二百二十五年一周。
其一曰黃秘宮，在西河之乾地，西北方也；其二曰黃始官，在遼東之艮地，東方也；其三曰黃室宮，在東吳之巽地，東南方也；其四曰黃庭宮，在西蜀之坤地，西南方也；其五曰玄師宮，在京都洛陽之地，中原也。
置上元積年以來至開元十二年甲子歲積，得一萬三乾三百三十一歲。若上考往古，每年減一；下檢將來，每年加一。
置積年，以大周法二百二十五去之；不盡，為入周以來年數。又以四、五約之，為宮之口；不滿，為入官以來年數。命起乾、艮、巽、坤、中宮算外，即五福所在也。今開元十二年甲子，在遼東十一年也。
紀法七百二十(以六紀通用，得紀法也)；
元法四千三百二十(是六紀法，亦名元紀也)
乘行率一百二十；
太乙小周二百八十八(以八乘三十六，得行率)
太乙行宮三十六(以三乘十二也)；
天目周率二百一十六(以十二乘十八)；
天目行率十八。
自上元甲寅歲，太乙在七官，天道為天目，子為計神(三十六年一移宮)。命起七宮，順行八宮，不游中五，為大游所在也。自上元甲寅歲距今開元十二年甲子，積一萬三乾三百三十一年。上元年以來，以元法除之，得無數也；不盡，為入元年也。以紀除之，得紀數；不盡，為人紀年也。
今從晉穆帝水和十年甲寅為上元，至今開元十二甲子，計三百七十一年也。不足，以紀法除之，十一年。
推大游太乙所在(天目、大煞時)
《經》曰：大游太乙者，巡考八宮，與小游同宮。一考三十六年，十二年治天，十二年治地，十二年治人，考較人君善惡。二百八十八年一周，而行其伐。太乙在陽宮，遼東不見兵；太乙在陰官，蜀漢可以全身。八、三、四、九為陽宮，二、十、七、六、一為陰宮。
置上元甲寅所求積年，以無法四千三百二十去之；不盡，為元以來年數。以大游小周法二百八十八去之，得周數，不盡，以三十六除之，為宮數；不盡，為入宮以來年數。其宮數命起七宮，順行八宮，不游中五，算外，即大游太乙所在宮。
推大游天目所在法
置上元以來積年，以天目元法七十二去之，不盡，以天目周法十八去之。命起天道，順行十六神，遇大武陰德，重留一算，外即天目所在也。
推小游太乙積年法（與四神、天乙、地乙、直符同用）
置演紀上元甲子歲至大唐開元十二年甲於歲積，得三千三百六十一算。
置積，以小游大周法二百四十去之；不盡，以小周二十四除之；不盡，以三約之，為宮數；不滿，入宮以來年數。命起一宮，順行八宮，不游中五，算外，即得小游太乙所在及入宮以來年數也。小游主事見在歲計中，自此不複載，天目亦然也。
《經》曰：四神太乙者，水神也。紀綱有道之代則昌，無道之代則殃。若臨克賊之鄉，兼君無道，則兵革、水旱、飢荒也。
置上元甲子所求積年，以一百八十去之；不盡，以三十六除之，為紀數。不滿算外，為入紀來年數。其紀數命起第一紀算外，即得四神太乙所在及入紀以來年數也。入紀有五、三、十、六為一紀：第一甲子；第二庚子；第三丙子；第四壬子；第五戊子。置人紀年，以三除之，為宮數；不滿，為入宮以來年數。命起一宮，順行盡九宮。又以絳宮明堂、玉堂接之，算外，即得四神太乙所在及入宮以來年數也。
《經》曰：天以太乙者，金神也。取六宮金氣，主兵革。若累年兵革相接者，天乙臨之，即有勝負。為金能決斷，主兵喪也。
置入紀年與四神同，以三除之，為宮數；不滿算外，為入宮以來年數。命起六宮，順行盡九宮。又以三宮接之，算外，即得天以太乙所在及入官以來年數也。
《經》曰；直符大乙者，火神也。乃天帝之使者，天遺觀察理道於萬民。若臨無道之邦，即兵革、水旱、疾疫、飢謹、流亡也。
置入紀年與四神、大一同，以三除之，為宮數；不滿，為入宮以來年數。命起五宮，順行盡九宮。又以三宮接之，算外，即直符太乙術所在及入宮以來年數也。
四神三元五紀立成（略）
《太乙金鏡式經卷五》
太乙術者，昔玄女傳授於黃帝，黃帝獲之，敗蚩尤於琢鹿，則前術也。其後範蠡習之，佐越王勾踐而平吳國，終成霸業，治平。嬴秦失道，炎漢將興，張良用輔沛公，西入關中；子嬰銜壁，東會該下，項羽摧鋒。若然，入則為師，出授將略，或攻或守，靡不喻茲。其法有心，故謂之七術焉。
臨津問道者，常以呂申加敵兵起年，當視大神之下，是破年；又以呂申加破年大神下，是破月；又以呂申加破月大神下，是破日；又以呂申下加破日大神下，是破時。
假令敵以甲子年起兵征，便以呂申加子，則大神臨卯，則敵當在丁卯年五月酉日子時破也。
獅子反擲者，常以呂申加敵起年，常視大神之下臨囚死休，合破，如在旺相間，則不破。
假令敵以甲戍年起兵，便以呂申加戍，則大神臨丑。醜且屬《艮》，在東北，即知其敵當在辛卯年破也。
白雲卷空者，謂兩陣相敵則課大乙，悉宜主客。便以呂申加主大將宮，看大神囚死休廢者。若展旗、交鋒、功戰，大敗；若臨冠帶，士卒戰死，若臨帝王，不可觸犯。
假令兩軍相見太乙上元第一紀第二局，太乙在一宮，武德為天目，主算七，大將七，參將一，寅為計神。始擊將臨大武，客算十三，大將三，參將九。先以呂申加主大將七宮，則大神臨一宮金神，火克金。《經》曰：我克者囚，此名主大將乘囚氣，則主大敗。次以呂申加客大將於三宮，則大神臨九宮木神。《經》曰：生我者為相，此名大神乘相氣，則大勝也。
猛虎相拒者，視敵下營日，以呂申加其日太乙。大神臨王相，其營不可攻擊；衰死兼墓，其營不久見破矣。
假令上元第一紀第七局庚午日下營其日，太乙在三宮，便以呂申加三宮，則大神臨九宮木神。《經》曰：生我為相．此名大神乘相氣，此宮不可攻也。
雷公入水者、常以呂申加大乙宮，看大神所臨之下官。若克主大將宮，將必死；克參將亦然。若克客大將，必厄；克參將亦然。不然，則士卒奔逃背叛矣。
假令上元第一紀第一甲子元十三局丙子日大乙在六宮，大靈為天目，主算十八，大將八，參將四，寅為計神，始擊將臨太陽；客算十九，大將九，參將七。便以呂申加大乙於六宮，則大神臨八官，屬水，主大將八宮，亦屬水。《經》曰：同類為王，此為主大將乘王氣，勝。客大將九宮，屬木；大神臨八宮，屬水。生我者為相，此名主大將乘相氣，亦主小勝。
白龍得云者，以呂申加其日太乙官，視大神、大將所臨下之官與主乘旺相，宜出軍下營。加臨囚死休墓，不可出軍，若被陣大將宮刑克我軍大將宮，出戰必死；克小將，亦然也。
假令上元第一甲子元二十二局乙酉日太乙在九宮，陰德為天目，主算十六，大將六，參將八，巳為計神，始擊將在天道；客計三十，大將三，參將九，便以呂申加大乙於九宮，則大神臨大武於七宮，主大將在六宮，屬金。大神下宮生，主大將宮。《經》曰：生我者為相，此名主大將乘相氣，於下營屯軍吉。客大將在三宮，屬土，與大神下營同類為旺。此名客大將乘旺氣，亦利屯軍下營，吉。
回軍無言者，常以呂申加彼軍初來時日太乙宮，看大神下。若彼軍臨旺相，其下有伏兵，宜備之。如臨囚死休廢，彼軍自破，無能為也，立可克之。如臨本軍旺相，亦自宜埋伏兵士。
假令上元第一紀第一甲子元二十八局辛卯日太乙在二宮，呂申為天目，主算十四，大將四，參將二，亥為計神，始擊將在大靈；客計得九，大將九，參將七，便以呂申加彼軍初來時日太乙在二宮，則大神臨太簇金神；客大將在九宮，屬木，大神屬金。金來克木，我克者為死。此客大將乘死氣，無伏兵，自破，立可克之。《經》曰：欲知諸將休旺者，常以同類為旺。生我為相，克我為死；我克為囚；我生為休。
假令高叢木以呂申、大靈同類為旺，以大義、地主為相，武德、大蔟為死，和德、大武、太陽、天道為囚，大神、大威為休。餘仿此。
推三才以占天地人八
三才者，天、地、人也。若算中無十者，無天。天變，則二曜虛蝕，五緯失度，慧孛飛流，霜雹為害也。此為算得一、二、三、四、五、六、七、八、九，為無天者也。《經》曰；算中無五者，為無地。地有變，由崩地震、川竭蝗蝻之象。此算得一、二、三、四、十一、十二、十三、十四、二十一、二十二、二十三、二十四、三十一、三十二、三十三、三十四，此無地也。《經》曰：若算得一十、二十、三十、四十，為無人。人有變，口舌襖言，更相殘賊，疾疫、遷移、流亡也。
《經》曰：天目所算主，以長算宜緩，短算宜急。十一以上為長，單九以下為短。長多利深入，短少利淺入。長為勝，短為負也。
《經》曰：算得一、二為宮。宮有變，占在君。《經》曰：一為宮；二為比宮。宮有變，占在君。《經》曰：算得三為徵；四為比徵。征有變，占在宗廟。《經》曰：算得五為羽。羽有變，占在後妃。《經》曰：五為比羽。羽有變，占在後紀。《經》曰：其得七為商。商有變，占在子孫。《經》曰：算得九為角；十為比角。角有變，占在疾病。
《經》曰：算孤單，以占主客成敗。一、三、七、九為單陽；二、四、六、八為單陰，一十、三十為孤陽；單陽並孤陽為重陽，單陰並孤陰為重陰。單陰算，並不利下，不利客；單陽算，不利上，不利主人也。
《經》曰：算有內外，以占攻擊者，為天目，前為內，可以攻外；後為外，可以攻內。天目外孤內虛，欲舉百事，於外欲得外算，於內欲得內算。陰德至太陽為內，大靈至陰為外也。
《經》曰；多少以占勝負者，客以多算臨少，主人敗；客以少算臨多，主人勝也。
《經》曰：太乙在陽宮，算得奇為重陽，厄在火；大乙在陰宮，算得偶為重陰，厄在水。若主人得，主厄；若客得，客厄也。
《經》曰：算有所主，以明吉凶。謂十為將軍，五為吏土，一為兵卒。無此算者，凶。若數得十六以上，將、吏、卒備，百事吉也。）

投擲爻象（只限3/2投擲，由初至上）：
${lines.join('\n')}`;

    conversationHistory = [

    document.getElementById('output').innerText = "系統正在嚴格推演排盤，核校《增刪卜易》與生剋路徑...";
    
    try {

      document.getElementById('output').innerText = response;

        // 存入 LocalStorage

        });

  }

  async function sendFollowUp() {
    const query = document.getElementById('followUpQuery').value.trim();
    if (!query) return;

    conversationHistory.push({ role: "user", parts: [{ text: `【原盤追問】：${query}。請在原卦盤基礎上分析，文末更新 File Record YAML。` }] });
    document.getElementById('output').innerText += `\n\n---\n\n【追問】：${query}\n推演中...`;
    document.getElementById('followUpQuery').value = '';

    try {
      const response = await callGemini(conversationHistory);
      conversationHistory.push({ role: "model", parts: [{ text: response }] });
      document.getElementById('output').innerText += `\n\n${response}`;

      const yamlMatch = response.match(/```yaml([\s\S]*?)```/);
      if (yamlMatch) {
        document.getElementById('fileRecordBlock').innerText = yamlMatch[1].trim();
      }
    } catch (e) {
      alert("追問錯誤: " + e.message);
    }
  }

  function saveToLocalStorage(record) {
    let records = JSON.parse(localStorage.getItem('divination_records') || '[]');
    records.unshift(record);
    localStorage.setItem('divination_records', JSON.stringify(records));
    renderHistory();
  }

  function renderHistory() {
    let records = JSON.parse(localStorage.getItem('divination_records') || '[]');
    const el = document.getElementById('historyList');
    if (records.length === 0) { el.innerHTML = '<span style="color:#666;">暫無存檔</span>'; return; }
    
    el.innerHTML = records.slice(0, 10).map(r => `
      <div class="history-card">
        <strong>${r.date}</strong> | ${r.name} (${r.gender})<br>
        <span style="color:#aaa;">事由: ${r.question}</span>
      </div>
    `).join('');
  }

  function exportRecords() {
    const records = localStorage.getItem('divination_records') || '[]';
    const blob = new Blob([records], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Divination_Records_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }
