  function getLinesData() {
    let lines = [];

    }
    return lines;

  async function callGemini(messages) {
    const key = localStorage.getItem('gemini_api_key');
    if (!key) throw new Error("請先輸入 Google Gemini API Key！");
    
    // 使用 Gemini 2.5 Flash
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
    const payload = {
      contents: messages,
      generationConfig: { temperature: 0.15 }
    };

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.candidates[0].content.parts[0].text;
  }

# Operational Workflow (四步嚴格解卦流程)

## 第一步：審核輸入與太極立極
- 確認 6 次投擲結果（只限 3 或 2）、起卦年月日時干支、問卦者姓名、性別及八字。
- 判定用神：自占看世爻與事由對應用神；代占執行太極轉換。

## 第二步：標準排盤與本變卦核驗
- 輸出標準盤面：本卦名、宮位、世應、六爻納甲地支與六親。
- 標註動爻（○ 老陽 / × 老陰）、變卦名、動變結果（化進、化退、回頭生、回頭剋、化墓、化絕、化空）。
- 檢索底層《周易本義》：精確提取對應之卦辭與動爻爻辭，不作無關發揮。

## 第三步：五行旺衰與作用線檢驗（依據《增刪卜易》）
- 檢驗用神與世爻在日月建下的狀態（旺相休囚、月破、旬空）。
- 檢驗動爻生剋路徑及有無外部貴人/救應。

## 第四步：直截斷語與落地結論
1. 【核心結論】：直斷「成 / 敗 / 得 / 不得 / 吉 / 凶」，一句話定性。
2. 【吉凶依據】：條列 2–3 點卦理依據（用神衰旺、動爻生剋、神煞有無）。
3. 【貴人/外力判定】：明確回答「有」或「無」。若有，指出特徵與方位；若無，直接寫「無貴人相助，全憑自身承擔或需暫停推進」。
4. 【應期預測】：若條件具備，給出具體年月日時；若無應期，直接寫「此事無成期」或「短期內無轉機」。
5. 【行動指引】：依據卦德給出 1–2 點現實防守或推進策略。

## 第五步：自動生成存檔代碼（File Record）

用九，見群龍無首，吉。用九，言凡筮得陽爻者，皆用九而不用七。蓋諸卦百九十二陽爻之通例也。以此卦純陽而居首，故於此發之，而聖{{人因系之辭，使遇此卦而六爻皆變者，即此占之。蓋六陽皆變，剛而能柔，吉之道也，故為「群龍無首」之象，而其占為如是，則吉也。《春秋傳》曰：「《乾》之《坤》，曰：『見群龍無首，吉。』」蓋即純《坤》卦辭「牝馬之貞，先迷後得，東北喪朋」之意。
《彖》曰：大哉乾元，萬物資始，乃統天。彖，吐亂反。「彖」，即文王所系之辭。「傳」者，孔子所以釋經之辭也。後凡言傳者，放此。此專以天道明乾義，又析「元亨利貞」為四德以發明之。而此一節，首釋元義也。大哉，歎辭。元，大也，始也。乾元，天德之大始。故萬物之生，皆資之以為始也。又為四德之首，而貫乎天德之始終，故曰統天。
雲行雨施，品物流形。施，始豉反。卦內同。此釋《乾》之「亨」也。
大明終始，六位時成，時乘六龍以御天。始，即元也。終，謂貞也。不終則無始，不貞則無以為元也。此言聖人大明乾道之終始，則見卦之六位各以時成，而乘此六陽以行天道，是乃聖人之元亨也。乾道變化，各正性命，保合太和，乃利貞。變者，化之漸。化者，變之成。物所受為性，天所賦為命。太和，陰陽會合沖和之氣也。各正者，得於有生之初。保合者，全於已生之後。此言乾道變化，無所不利，而萬物各得其性命以自全，以釋利貞之義也。
首出庶物，萬國咸寧。聖人在上，高出於物，猶乾道之變化也。萬國各得其所而咸寧，猶萬物之各正性命而保合、太和也。此言聖人之利貞也，蓋嘗統而論之。元者，物之始生，亨者，物之暢茂，利則向於實也，貞則實之成也。實之既成，則其根蒂脫落，可復種而生矣，此四德之所以循環而無端也。然而四者之間，生氣流行，初無間斷，此元之所以包四德而統天也。其以聖人而言，則孔子之意，蓋以此卦為聖人得天位，行天道，而致太平之占也。雖其文義有非文王之舊者，然讀者各以其意求之，則並行而不悖也。《坤》卦放此。
《象》曰：天行健，君子
以自彊不息。象者，卦之上下兩象，及兩象之六爻，周公所繫之辭也。天，《乾》卦之象也。凡重卦皆取重義，此獨不然者，天一而已。但言天行，則見其一日一周，而明日又一周。若重複之象，非至健不能也。君子法之，不以人欲害其天德之剛，則自彊而不息矣。
「潛龍勿用」，陽在下也。陽，謂九。下，謂潛。
「見龍在田」，德施普也。「終日乾乾」，反復道也。復，芳服反。本亦作「覆」。反復，重複踐行之意。
「或躍在淵」，進無咎也。可以進而不必進也。
「飛龍在天」，大人造也。造，徂早反。造，猶作也。
「亢龍有悔」，盈不可久也。「用九」，天德不可為首也。言陽剛不可為物先，故六陽皆變而吉。「天行」以下，先儒謂之《大象》。「潛龍」以下，先儒謂之《小象》。後放此。
《文言》曰：元者，善之長也亨者，嘉之會也，利者，義之和也，貞者，事之幹也。長，丁丈反。下「長人」同。幹，古旦反。此篇申《彖傳》、《象傳》之意，以盡《乾》、《坤》二卦之蘊，而餘卦之說，因可以例推云。元者，生物之始，天地之德，莫先於此，故於時為春，於人則為仁，而眾善之長也。亨者，生物之通，物至於此，莫不嘉美，故於時為夏，於人則為禮，而眾美之會也。利者，生物之遂，物各得宜，不相妨害，故於時為秋，於人則為義，而得其分之和。貞者，生物之成。實理具備，隨在各足，故於時為冬，於人則為智，而為眾事之幹。幹，木之身而枝葉所依以立者也。君子體仁足以長人，嘉會足以合禮，利物足以和義，貞固足以幹事。以仁為體，則無一物不在所愛之中，故足以長人。嘉其所會，則無不合禮。使物各得其所利，則義無不和。貞固者，知正之所在而固守之，所謂知而弗去者也，故足以為事之幹。君子行此四德者，故曰「乾：元、亨、利、貞」。非君子之至健，無以行此，故曰「乾：元、亨、利、貞」。此第一節，申《彖傳》之意，與《春秋傳》所載穆姜之言不異，疑古者已有此語。穆姜稱之，而夫子亦有取焉，故下文別以子曰表孔子之辭。蓋傳者欲以明此章之為古語也。
初九曰「潛龍勿用」，何謂也？子曰：「龍德而隱者也。不易乎世，不成乎名，遁世無悶，不見是而無悶，樂則行之，憂則違之，確乎其不可拔，潛龍也。」樂，音洛。確，苦學反。龍德，聖人之德也，在下故隱。易，謂變其所守。大抵《乾》卦六爻，《文言》皆以聖人明之，有隱顯而無淺深也。
九二曰「見龍在田，利見大人」，何謂也？子曰：「龍德而正中者也。庸言之信，庸行之謹，閑邪存其誠，善世而不伐，德博而化。《易》曰『見龍在田，利見大人』，君德也。」行，下孟反。邪，似嗟反。正中，不潛而未躍之時也。常言亦信，常行亦謹，盛德之至也。閑邪存其誠，無斁亦保之意。言君德也者，釋大人之為九二也。
九三曰「君子終日乾乾，夕惕若，厲無咎」，何謂也？子曰：「君子進德脩業。忠信，所以進德也。脩辭立其誠，所以居業也。知至至之，可與幾也。知終終之，可與存義也。是故居上位而不驕，在下位而不憂。故乾乾因其時而惕，雖危，無咎矣。」幾，音機。忠信，主於心者，無一念之不誠也。脩辭見於事者，無一言之不實也。雖有忠信之心，然非脩辭立誠，則無以居之。知至至之，進德之事，知終終之，居業之事，所以終日乾乾而夕猶惕若者，以此故也。可上可下，不驕不憂，所謂無咎也。
九四曰或曜在淵，無咎」，何謂也？子曰：「上下無常，非為邪也；進退無恒，非離群也。君子進德脩業，欲及時也，故無咎。」離，去聲。內卦以德學言，外卦以時位言。進德脩業，九三備矣。此則欲其及時而進也。
九五曰「飛龍在天，利見大人」，何謂也？子曰：「同聲相應，同氣相求。水流濕，火就燥，雲從龍，風從虎，聖人作而萬物覩。本乎天者親上，本乎地者親下，則各從其類也。」應，去聲。作，起也。物，猶人也。覩，釋利見之意也。本乎天者，謂動物，本乎地者，謂植物。物各從其類。聖人，人類之首也。故興起於上，則人皆見之。
上九曰「亢龍有悔」，何謂也？子曰：「貴而無位，高而無民，賢人在下位而無輔，是以動而有悔也。」賢人在下位，謂九五以下。無輔，以上九過高志滿，不來輔助之也。此第二節，申《象傳》之意。
「潛龍勿用」，下也。「見龍在田」，時舍也。舍，音捨。言未為時用也。
「終日乾乾」，行事也。「或躍在淵」，自試也。未遽有為，姑試其可。
「飛龍在天」，上治也。治，平聲。居上以治下。
「亢龍有悔」，窮之災也。乾元「用九」，天下治也。治，去聲。言乾元用九，見與他卦不同。君道剛而能柔，天下無不治矣。此第三節，再申前意。
「潛龍勿用」，陽氣潛藏。「見龍在田」，天下文明。雖不在上位，然天下已被其化。
「終日乾乾」，與時偕行。時，當然也。
「或躍在淵」，乾道乃革。離下而上，變革之時。
「飛龍在天」，乃位乎天德。天德，即天位也。蓋唯有是德，乃宜居是位，故以名之。
「亢龍有悔」，與時偕極。乾元「用九」，乃見天則。剛而能柔，天之法也。此第四節，又申前意。
《乾》「元」者，始而亨者也。始則必亨，理勢然也。
「利貞」者，性情也。收斂歸藏，乃見性情之實。
乾始能以美利利天下，不言所利，大矣哉。始者，元而亨也。利天下者，利也。不言所利者，貞也。或曰：《坤》利牝馬，則言所利矣。
大哉乾乎，剛健中正純粹精也。剛以體言，健兼用言中者，其行無過不及。正者，其立不偏。四者，乾之德也。純者，不雜於陰柔。粹者，不雜於邪惡。蓋剛健中正之至極而精者，又純粹之至極也。或疑乾剛無柔，不得言中正者，不然也。天地之間，本一氣之流行，而有動靜爾。以其流行之統體而言，則但謂之乾而無所不包矣；以其動靜分之，然後有陰陽剛柔之別也。
六爻發揮，旁通情也。旁通，猶言曲盡。
時乘六龍，以御天也。雲行雨施，天下平也。言聖人時乘六龍以御天，則如天之雲行雨施而天下平也。此第五節，復申首章之意。
君子以成德為行，日可見之行也。「潛」之為言也，隱而未見，行而未成，是以君子弗用也。行，並去聲。「未見」之見，音現。成德，已成之德也。初九固成德，但其行未可見爾。
君子學以聚之，問以辨之，寬以居之，仁以行之。《易》曰「見龍在田，利見大人」，君德也。蓋由四者以成大人之德。再言君德，以深明九二之為大人也。
九三，重剛而不中，上不在天，下不在田，故乾乾因其時而惕，雖危，無咎矣。重，平聲。下同。重剛，謂陽爻陽位。
九四，重剛而不中，上不在天，下不在田，中不在人，故或之。或之者，疑之也。故無咎。九四非重剛，重字疑衍。在人，謂三。或者，隨時而未定也。
夫大人者，與天地合其德，與日月合其明，與四時合其序，與鬼神合其吉凶；先天而天弗違，後天而奉天時。天且弗違，而況於人乎？況於鬼神乎？夫，音扶。先、後，並去聲。大人，即釋爻辭所利見之大人也。有是德而當其位，乃可以當之。人與天地鬼神，本無二理，特蔽於有我之私，是以梏於形體而不能相通。大人無私，以道為體，曾何彼此先後之可言哉？先天不違，謂意之所為，默與道契。後天、奉天，謂知理如是，奉而行之。回紇謂郭子儀曰：「蔔者言，此行當見一大人而還。」其占蓋與此合。若子儀者，雖未及乎夫子之所論，然其至公無我，亦可謂當時之大人矣。
〇「亢」之為言也，知進而不知退，知存而不知亡，知得而不知喪。喪，去聲。〇所以動而有悔也。其唯聖人乎。知進退存亡，而不失其正者，其唯聖人乎。知其理勢如是，而處之以道，則不至於有悔矣，固非計私以避害者也。再言其唯聖人乎，始若設問，而卒自應之也。此第六節，復申第二、第三、第四節之意。
䷁坤下，坤上。
坤：元亨，利牝馬之貞。君子有攸往，先迷後得，主利。西南得朋，東北喪朋。安貞吉。牝，頻忍反。喪，去聲。⚋者，耦也，陰之數也。坤者，順也，陰之性也。註中者，三畫卦之名也；經中者，六畫卦之名也。陰之成形，莫大於地。此卦三畫皆耦，故名坤而象地。重之又得坤焉，則是陰之純，順之至，故其名與象皆不易也。牝馬，順而健行者，陽先陰後，陽主義，陰主利。西南，陰方，東北，陽方。安，順之為也。貞，健之守也。遇此卦者，其占為大亨，而利以順健為正。如有所往，則先迷後得而主於利。往西南則得朋，往東北則喪朋，大抵能安於正則吉也。
〇《彖》曰：至哉坤元，萬物資生，乃順承天。此以地道明坤之義，而首言元也。至，極也，比大義差緩。始者，氣之始；生者，形之始。順承天施，地之道也。坤厚載物，德合無疆，含弘光大，品物咸亨。疆，居良反。下同。言亨也。德合無疆，謂配乾也。}牝馬地類，行地無疆，柔順利貞，君子攸行。言利貞也。馬，乾之象，而以為地類者。牝，陰物，而馬又行地之物也。行地無疆，則順而健矣。柔順利貞，坤之德也。「君子攸行」，人之所行如坤之德也。所行如是，則其占如下文所云也。先迷失道，後順得常，西南得朋，乃與類行，東北喪朋，乃終有慶。陽大陰小，陽得兼陰，陰不得兼陽。故坤之德，常減於乾之半也。東北雖喪朋，然反之西南，則終有慶矣。安貞之吉，應地無疆。安而且貞，地之德也。
《象》曰：地勢坤，君子以厚德載物。地，坤之象。亦一而已，故不言重，而言其勢之順，則見其高下相因之無窮，至順極厚而無所不載也。
初六，履霜，堅冰至。六，陰爻之名。陰數六老而八少，故謂陰爻為六也。霜，陰氣所結，盛則水凍而為冰。此爻陰始生於下，其端甚微，而其勢必盛，故其象如履霜，則知堅冰之將至也。夫陰陽者，造化之本，不能相無，而消長有常，亦非人所能損益也。然陽主生，陰主殺，則其類有淑慝之分焉。故聖人作《易》，於其不能相無者，既以健順仁義之屬明之，而無所偏主。至其消長之際，淑慝之分，則未嘗不致其扶陽抑陰之意焉。蓋所以贊化育而參天地者，其旨深矣。不言其占者，謹微之意，已可見於象中矣。《象》曰：履霜堅冰，陰始凝也。馴致其道，至堅冰也。凝，魚陵反。馴，似遵反。按，《魏志》作「初六，履霜」，今當從之。馴，順習也。
六二，直方大，不習無不利。柔順正固，坤之直也。賦形有定，坤之方也。德合無疆，坤之大也。六二柔順而中正，又得坤道之純者。故其德內直外方而又盛大，不待學習而無不利。占者有其德，則其占如是也。《象》曰：六二之動，直以方也。「不習無不利」，地道光也。
六三，含章可貞，或從王事，無成有終。六陰三陽，內含章美，可貞以守。然居下之上，不終含藏，故或時出而從上之事，則始雖無成，而後必有終。爻有此象，故戒占者有此德，則如此占也。《象》曰：「含章可貞」，以時發也。「或從王事」，知光大也。知，音智。
六四，括囊，無咎，無譽。括，古活反。譽，音餘，又音預。括囊，言結囊口而不出也。譽者，過實之名。謹密如是，則無咎而亦無譽矣。六四重陰不中，故其象占如此。蓋或事當謹密，或時當隱遁也。《象》曰：「括囊，無咎」，慎不害也。
六五，黃裳，元吉。黃，中色。裳，下飾。六五，以陰居尊，中順之德，充諸內而見於外，故其象如此。而其占為大善之吉也。占者德必如是，則其占亦如是矣。《春秋傳》：南蒯將叛，筮得此爻，以為大吉。子服惠伯曰：「忠信之事則可，不然必敗。外彊內溫，忠也，和以率貞，信也。故曰：黃裳，元吉。黃，中之色也。裳，下之飾也。元，善之長也。中不忠，不得其色，下不共，不得其飾，事不善，不得其極。且夫《易》不可以占險，三者有闕，筮雖當，未也。」後蒯果敗。此可以見占法矣。
《象》曰：「黃裳，元吉」，文在中也。文在中而見於外也。
上六，龍戰于野，其血玄黃。陰盛之極，至與陽爭，兩敗俱傷。其象如此，占者如是，其凶可知。《象》曰：「龍戰於野」，其道窮也。
用六，利永貞。用六，言凡筮得陰爻者，皆用六而不用八。亦通例也。以此卦純陰而居首，故發之。遇此卦而六爻俱變者，其占如此辭。蓋陰柔而不能固守，變而為陽，則能永貞矣。故戒占者以利永貞，即《乾》之利貞也。自《坤》而變，故不足於元亨云。《象》曰：用六永貞，以大終也。初陰後陽，故曰大終。
《文言》曰：坤，至柔而動也剛，至靜而德方。剛、方，釋牝馬之貞也。方，謂生物有常。後得主而有常程傳曰：主下當有利字。含萬物而化光。復明亨義。坤道其順乎，承天而時行。復明順承天之義。此以上，申《彖傳》之意。
積善之家，必有餘慶，積不善之家，必有餘殃。臣弒其君，子弒其父，非一朝一夕之故，其所由來者漸矣。由辯之不早辯也。《易》曰：「履霜，堅冰至」，蓋言順也。古字順、慎通用，按此當作慎，言當辯之於微也。
直其正也，方其義也。君子敬以直內，義以方外。敬義立而德不孤，「直方大，不習無不利」，則不疑其所行也。此以學而言之也。正，謂本體。義，謂裁制。敬，則本體之守也。直內、方外，《程傳》備矣。不孤，言大也。疑故習而後利，不疑則何假於習。傳曰：「直，言其正也，方，言其義也。君子主敬以直其內，守義以方其外。敬立而內直，義形而外方。義形於外，非在外也。敬義既立，其德盛矣。不期大而大矣，德不孤也。無所用而不周，無所施而不利，孰為疑乎？」
陰雖有美，含之以從王事，弗敢成也。地道也，妻道也，臣道也。地道無成，而代有終也。
天地變化，草木蕃；天地閉，賢人隱。《易》曰：「括囊，無咎，無譽。」蓋言謹也。
君子黃中通理黃中，言中德在內。釋「黃」字之義也。正位居體雖在尊位，而居下體。釋「裳」字之義也。美在其中，而暢於四支，發於事業，美之至也。美在其中，復釋黃中。暢于四支，復釋居體。
陰疑於陽必戰，為其嫌於無陽也故稱龍焉，猶未離其類也，故稱血焉。夫玄黃者，天地之雜也。天玄而地黃。為，於偽反。離，力智反。夫，音扶。疑，謂鈞敵而無小大之差也。坤雖無陽，然陽未嘗無也。血，陰屬，蓋氣陽而血陰也。玄黃，天地之正色，言陰陽皆傷也。此以上，申《象傳》之意。
屯震下，坎上。
屯：元亨，利貞。勿用有攸往，利建侯。屯，張倫反。震坎，皆三畫卦之名。震，一陽動于二陰之下，故其德為動，其象為雷。坎，一陽陷於二陰之間，故其德為陷、為險，其象為雲、為雨、為水。屯，六畫卦之名也，難也，物始生而未通之意。故其為字，象屮穿地始出而未申也。其卦以震遇坎，乾、坤始交而遇險陷，故其名為屯。震動在下，坎險在上，是能動乎險中。能動雖可以亨，而在險，則宜守正，而未可遽進。,故筮得之者，其占為大亨而利於正，但未可遽有所往耳。又，初九，陽居陰下，而為成卦之主，是能以賢下人，得民而可君之象。故筮立君者，遇之則吉也。
《彖》曰：「屯」，剛柔始交而難生。難，去聲。六二《象》同。以二體釋卦名義。始交，謂震。難生，謂坎。
動乎險中，大亨貞。以二體之德釋卦辭。動，震之為也。險，坎之地也。自此以下，釋「元亨利貞」，乃用文王本意。
雷雨之動滿盈，天造草昧，宜建侯而不寧。以二體之象釋卦辭。雷，震象。雨，坎象。天造，猶言天運。草，雜亂。昧，晦冥也。陰陽交而雷雨作，雜亂晦冥，塞乎兩間。天下未定，名分未明，宜立君以統治，而未可遽謂安寧之時也。不取初九爻義者，取義多端，姑舉其一也。
《象》曰：雲雷，屯，君子以經綸。坎不言水而言雲者，未通之意。經綸，治絲之事。經引之，綸理之也。屯難之世，君子有為之時也。
初九，磐桓，利居貞利建侯。磐，步幹反。磐桓，難進之貌。屯難之初，以陽在下，又居動體，而上應陰柔險陷之爻，故有磐桓之象。然居得其正，故其占利於居貞。又本成卦之主，以陽下陰，為民所歸，侯之象也。故其象又如此，而占者如是，則利建以為侯也。
《象》曰：雖磐桓，志行正也。以貴下賤，大得民也。下，遐嫁反。
六二，屯如邅如，乘馬班如，匪寇婚媾，女子貞不字，十年乃字。邅，張連反。乘，繩澄反，又音繩。班，分布不進之貌。字，許嫁也。《禮》曰：「女子許嫁，笄而字。」六二，陰柔中正，有應於上，而乘初剛，故為所難而邅回不進。然初非為寇也，乃求與己為婚媾耳。但己守正，故不之許，至於十年，數窮理極，則妄求者去，正應者合，而可許矣。爻有此象，故因以戒占者。
《象》曰：六二之難，乘剛也。「十年乃字」，反常也。
六三，即鹿無虞，惟入于林中，君子幾，不如舍，往吝。幾，音機。舍，音捨。《象》同。〇陰𣐱居下，不中不正，上無正應，妄行取困，為逐鹿無虞陷入林中之象。君子見幾，不如舍去。若往逐而不舍，必致羞吝。戒占者宜如是也。
《象》曰：「即鹿無虞」，以從禽也。君子舍之，往吝，窮也。
〇六四，乘馬班如，求婚媾，往吉，無不利。陰柔居屯，不能上進，故為乘馬班如之象。然初九守正居下，以應於己，故其占為下求婚媾則吉也。《象》曰：求而往，明也。
〇九五，屯其膏，小，貞吉，大，貞凶。九五雖以陽剛中正居尊位，然當屯之時，陷於險中，雖有六二正應，而陰柔才弱，不足以濟。初九得民於下，眾皆歸之。九五坎體，有膏潤而不得施，為屯其膏之象。占者以處小事，則守正猶可獲吉，以處大事，則雖正而不免於凶。《象》曰：「屯其膏」，施未光也。施，始豉反。
〇上六，乘馬班如，泣血漣如。陰柔無應，處屯之終。進無所之，憂懼而已。故其象如此。《象》曰：「泣血漣如」，何可長也。長，直良反。
䷃坎下，艮上。
蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。告，音谷。三，息暫反。瀆，音獨。艮，亦三畫卦之名。一陽止於二陰之上，故其德為止，其象為山。蒙，昧也，物生之初，蒙昧未明也。其卦以坎遇艮，山下有險，蒙之地也，內險外止，蒙之意也。故其名為蒙。「亨」以下，占辭也。九二，內卦之主，以剛居中，能發人之蒙者，而與六五陰陽相應。故遇此卦者，有亨道也。我，二也。童蒙，幼稚而蒙昧謂五也。筮者明，則人當求我而其亨在人。筮者暗，則我當求人而亨在人求我者，當視其可否而應之。我
求人者，當致其精一而扣之。而明者之養蒙，與蒙者之自養，又皆利於以正也。}}
《彖》曰：「蒙」，山下有險，險而止，蒙。以卦象，卦德釋卦名，有兩義。
「蒙，亨」，以亨行時中也。「匪我求童蒙，童蒙求我」，志應也。「初筮告」，以剛中也。「再三瀆，瀆則不告」，瀆蒙也。蒙以養正，聖功也。以卦體釋卦辭也。九二以可亨之道，發人之蒙，而又得其時之中，謂如下文所指之事，皆以亨行而當其可也。志應者，二剛明，五柔暗，故二不求五，而五求二，其志自相應也。以剛中者，以剛而中，故能告而有節也。瀆，筮者二三，則問者固瀆，而告者亦瀆矣。蒙以養正，乃作聖之功，所以釋「利貞」之義也。
《象》曰：山下出泉，蒙，君子以果行育德。行，下孟反。六三《象》同。泉，水之始出者，必行而有漸也。
初六，發蒙，利用刑人，用說桎梏，以往吝。說，吐活反。桎，音質。梏，古毒反。以陰居下，蒙之甚也。占者遇此，當發其蒙。然發之之道，當痛懲而暫舍之，以觀其後。若遂往而不舍，則致羞吝矣。戒占者當如是也。《象》曰：「利用刑人」，以正法也。發蒙之初，法不可不正。懲戒所以正法也。
九二，包蒙，吉，納婦，吉，子克家。九二以陽剛為內卦之主，統治群陰，當發蒙之任者。然所治既廣，物性不齊，不可一概取必。而爻之德剛而不過，為能有所包容之象。又，以陽受陰，為納婦之象。又，居下位而能任上事，為子克家之象。故占者有其德而當其事，則如是而吉也。《象》曰：「子克家」，剛柔接也。指二五之應。
六三，勿用取女，見金夫，不有躬，無攸利。取，七具反。六三陰柔，不中不正，女之見金夫而不能有其身之象也。占者遇之，則其取女必得如是之人，無所利矣。金夫，蓋以金賂己而挑之，若魯秋胡之為者。《象》曰：「勿用取女」，行不順也。順，當作「慎」。蓋「順」、「慎」古字通用。《荀子》「順墨」作「慎墨」，且「行不慎」，於經意尤親切，今當從之。
六四，困蒙，吝。既遠于陽，又無正應，為困於蒙之象。占者如是，可羞吝也。能求剛明之德而親近之，則可免矣。《象》曰：困蒙之吝，獨遠實也。遠，于萬反。實，葉韻去聲。
六五，童蒙，吉。柔中居尊，下應九二，純一未發，以聽於人，故其象為童蒙，而其占為如是，則吉也。《象》曰：童蒙之吉，順以巽也。
上九，擊蒙，不利為寇，利禦寇。以剛居上，治蒙過剛，故為擊蒙之象。然取必太過，攻治太深，則必反為之害。惟捍其外，誘以全其真純，則雖過於嚴密，乃為得宜。故戒占者如此。凡事皆然，不止為誨人也。《象》曰：利用禦寇，上下順也。禦寇以剛，上下皆得其道。
需乾下， 坎上需：有孚，光亨，貞吉，利涉大川。需，待也。以乾遇坎，乾健坎險，以剛遇險，而不遽進以陷於險，待之義也。孚，信之在中者也。其卦九五以坎體中實，陽剛中正而居尊位，為有孚得正之象。坎水在前，乾健臨之，將涉水而不輕進之象。故占者為有所待，而能有信，則光亨矣。若又得正，則吉，而利涉大川。正固無所不利，而涉川尤貴於能待，則不欲速而犯難也。
《彖》曰：「需」，須也，險在前也。剛健而不陷，其義不困窮矣。此以卦德釋卦名義。
「需，有孚，光亨，貞吉」，位乎天位，以正中也。「利涉大川」，往有功也。以卦體及兩象釋卦辭。
《象》曰：雲上於天，需，君子以飲食宴樂。上，上聲。樂，音洛。雲上於天，無所復為，待其陰陽之和而自雨爾。事之當需者，亦不容更有所為，但飲食宴樂，俟其自至而已。一有所為，則非需也。
初九，需于郊，利用恒，無咎。郊，曠遠之地，未近於險之象也，而初九陽剛，又有能恒於其所之象，故戒占者能如是，則無咎也。
《象》曰：「需于郊」，不犯難行也。「利用恒，無咎」，未失常也。難，去聲。
九二，需于沙，小有言，終吉。沙，則近於險矣。言語之傷，亦災害之小者。漸進，近坎，故有此象。剛中能需，故得終吉。戒占者當如是也。
《象》曰：「需于沙」，衍在中也，雖「小有言」，以吉終也。衍，以善反。衍，寬意。以寬居中，不急進也。
九三，需于泥，致寇至。泥，將陷於險矣。寇，則害之大者。九三去險愈近，而過剛不中，故其象如此。
《象》曰：「需于泥」，災在外也，自我致寇，敬慎不敗也。外，謂外卦。敬慎不敗，發明占外之占。聖人示人之意切矣。
六四，需于血，出自穴。血者，殺傷之地。穴者，險陷之所。四交坎體，入乎險矣，故為需于血之象。然柔得其正，需而不進，故又為出自穴之象。占者如是，則雖在傷地，而終得出也。
《象》曰：「需于血」，順以聽也。
九五，需于酒食，貞吉。酒食，宴樂之具，言安以待之。九五陽剛中正，需于尊位，故有此象。占者如是而貞固，則得吉也。
《象》曰：酒食，「貞吉」，以中正也。
上六，入于穴，有不速之客三人來，敬之，終吉。陰居險極，無復有需，有陷而入穴之象。下應九三。九三與下二陽需極並進，為不速客三人之象。柔不能禦而能順之，有敬之之象。占者當陷險中，然於非意之來，敬以待之，則得終吉也。
《象》曰：不速之客來，「敬之終吉」，雖不當位，未大失也。當，都浪反。後凡言「當位」、「不當位」者，仿此。以陰居上，是為當位。言不當位，未詳。
訟坎下， 乾上。訟：有孚窒，惕中吉，終凶，利見大人，不利涉大川。窒，張栗反。訟，爭辯也。上乾下坎，乾剛坎險，上剛以制其下，下險以伺其上，又為內險而外健，又為己險而彼健，皆訟之道也。九二中實，上無應與，又為加憂。且於卦變自遯而來，為剛來居二，而當下卦之中，有有孚而見窒，能懼而得中之象。上九過剛，居訟之極，有終極其訟之象。九五剛健中正，以居尊位，有大人之象。以剛乘險，以實履陷，有不利涉大川之象。故戒占者必有爭辯之事，而隨其所處為吉凶也。
《彖》曰：「訟」，上剛下險，險而健，訟。以卦德釋卦名義。
「訟，有孚窒，惕中吉」，剛來而得中也。「終凶」，訟不可成也。「利見大人」，尚中正也。「不利涉大川」，入于淵也。以卦變、卦體、卦象釋卦辭。
《象》曰：天與水違行，訟，君子以作事謀始。天上水下，其行相違。作事謀始，訟端絕矣。
初六，不永所事，小有言，終吉。陰柔居下，不能終訟，故其象占如此。
《象》曰：「不永所事」，訟不可長也。雖「小有言」，其辯明也。
九二，不克訟，歸而逋，其邑人三百戶，無眚。逋，補吳反眚，生領反。九二陽剛，為險之主，本欲訟者也。然以剛居柔，得下之中，而上應九五，陽剛居尊，勢不可敵，故其象占如此。邑人三百戶l，邑之小者。言自處卑約，以免災患。占者如是，則無眚矣。
《象》曰：不克訟，歸逋竄也，自下訟上，患至掇也。竄，七亂反。掇，都活反。掇，自取也。
六三，食舊德，貞，厲終吉。或從王事，無成。食，猶食邑之食，言所享也。六三陰柔，非能訟者。故守舊居正，則雖危而終吉。然或出而從上之事，則亦必無成功。占者守常而不出，則善也。
《象》曰：「食舊德」，從上吉也。從上吉，謂隨人則吉；明自主事，則無成功也。
九四，不克訟，復即命，渝，安貞，吉。渝，以朱反。即，就也。命，正理也。渝，變也。九四剛而不中，故有訟象。以其居柔，故又為不克，而復就正理，渝變其心，安處於正之象。占者如是，則吉也。
《象》曰：「復即命，渝，安貞」，不失也。
九五，訟，元吉。陽剛中正，以居尊位，聽訟而得其平者也。占者遇之，訟而有理，必獲伸矣。
《象》曰：「訟，元吉」，以中正也。中則聽不偏，正則斷合理。
上九，或錫之鞶帶，終朝三褫之。褫，敕紙反鞶帶，命服之飾。褫，奪也。以剛居訟極，終訟而能勝之，故有錫命受服之象。然以訟得之，豈能安久，故又有終朝三褫之象。其占為終訟無理，而或取勝，然其所得，終必失之。聖人為戒之意深矣。
《象》曰：以訟受服，亦不足敬也。
䷆坎下坤上。
師：貞，丈人吉，無咎。師，兵眾也。下坎上坤，坎險坤順，坎水坤地。古者寓兵於農，伏至險於大順，藏不測於至靜之中。又卦唯九二一陽居下卦之中，為將之象，上下五陰順而從之，為眾之象。九二以剛居下而用事，六五以柔居上而任之，為人君命將出師之象，故其卦之名曰師。丈人，長老之稱。用師之道，利於得正，而任老成之人，乃得吉而無咎。戒占者亦必如是也。
〇《彖》曰：「師」，眾也，「貞」，正也，能以眾正，可以王矣。王，往況反。此以卦體釋師、貞之義。以，謂能左右之也。一陽在下之中，而五陰皆為所以也。能以眾正，則王者之師矣。
剛中而應，行險而順，以此毒天下而民從之，吉又何咎矣。又以卦體、卦德釋「丈人吉，無咎」之義。剛中，謂九二。應，謂六五應之。行險，謂行危道。順，謂順人心。此非有老成之德者不能也。毒，害也。師旅之興，不無害於天下，然以其有是才德，是以民悅而從之也。
《象》曰：地中有水，師，君子以容民畜眾。畜，許六反。水不外於地，兵不外於民，故能養民，則可以得眾矣。
初六，師出以律，否臧凶。律，法也。否臧，謂不善也。晁氏曰，「否」字，先儒多作「不」是也。在卦之初，為師之始。出師之道，當謹其始，以律則吉，不臧則凶。戒占者當謹始而守法也。
《象》曰：「師出以律」，失律凶也。
九二，在師中，吉，無咎，王三錫命。九二在下，為眾陰所歸，而有剛中之德。上應於五，而為所寵任，故其象占如此。
《象》曰：「在師中，吉」，承天寵也。「王三錫命」，懷萬邦也。
六三，師或輿尸，凶。輿尸，謂師徒撓敗，輿尸而歸也。以陰居陽，才弱志剛，不中不正，而犯非其分，故其象占如此。
《象》曰：「師或輿尸」，大無功也。
六四，師左次，無咎。左次，謂退舍也。陰柔不中，而居陰得正，故其象如此。全師以退，賢於六三遠矣，故其占如此。
《象》曰：左次無咎，未失常也。知難而退，師之常也。
六五，田有禽，利執言，無咎，長子帥師，弟子輿尸，貞凶。長，之丈反。六五用師之主，柔順而中，不為兵端者也。敵加於己，不得已而應之，故為田有禽之象。而其占，利以搏執而無咎也。言，語辭也。長子，九二也。弟子，三四也。又戒占者專於委任，若使君子任事，而又使小人參之，則是使之輿尸而歸，故雖貞而亦不免於凶也。
《象》曰：「長子帥師」，以中行也，「弟子輿尸」，使不當也。當，去聲。
上六，大君有命，開國承家，小人勿用。師之終，順之極，論功行賞之時也。坤為土，故有開國承家之象。然小人則雖有功，亦不可使之得有爵士，但優以金帛可也。戒行賞之人，於小人則不可用此占，而小人遇之，亦不得用此爻也。
《象》曰：「大君有命」，以正功也。「小人勿用」，必亂邦也。聖人之戒深矣。坤下，坎上。
比：吉。原筮，元永貞，無咎。不寧方來，後夫凶。比，毗意反。比，親輔也。九五以陽剛居上之中，而得其正，上下五陰，比而從之，以一人而撫萬邦，以四海而仰一人之象。故筮者得之，則當為人所親輔。然必再筮以自審，有元善長永正固之德，然後可以當眾之歸而無咎。其未比而有所不安者，亦將皆來歸之。若又遲而後至，則此交已固，彼來已晚，而得凶矣。若欲比人，則亦以是而反觀之耳。
〇《彖》曰：「比」，吉也。此三字疑衍文。
「比」，輔也，下順從也。此以卦體釋卦名義。
「原筮，元永貞，無咎」，以剛中也。「不寧方來」，上下應也。「後夫凶」，其道窮也。亦以卦體釋卦辭。剛中，謂五。上下，謂五陰。
〇《象》曰：「地上有水，比，先王以建萬國，親諸侯。地上有水，水比於地，不容有間。建國親侯，亦先王所以比於天下而無間者也《彖》意，人來比我，此取我往比人。
〇初六，有孚比之，無咎。有孚盈缶，終來有他，吉。缶，俯九反。他，湯何反。比之初，貴乎有信，則可以無咎矣。若其充實，則又有他吉也。
《象》曰：比之初六，有他吉也。
六二，比之自內，貞吉。柔順中正，上應九五。自內比外，而得其貞，吉之道也。占者如是，則正而吉矣。
《象》曰：「比之自內」，不自失也。得正，則不自失矣。
六三，比之匪人。陰柔不中正，承、乘、應皆陰，所比皆非其人之象。其占大凶，不言可知。
《象》曰：「比之匪人」，不亦傷乎。
六四，外比之，貞吉。以柔居柔，外比九五，為得其正，吉之道也。占者如是，則正而吉矣。
《象》曰：外比於賢，以從上也。
九五，顯比，王用三驅，失前禽，邑人不誡，吉。一陽居尊，剛健中正，卦之群陰皆來比己，顯其比而無私，如天子不合圍，開一面之網，來者不拒，去者不追。故為用三驅失前禽，而邑人不誡之象。蓋雖私屬，亦喻上意，不相警備以求必得也。凡此皆吉之道，占者如是，則吉也。
《象》曰：顯比之吉，位正中也。舍逆取順，「失前禽」也。「邑人不誡」，上使中也。舍，音捨。由上之德使不偏也。
上六，比之無首，凶。陰柔居上，無以比下，凶之道也，故為無首之象，而其占則凶也。
《象》曰：「比之無首」，無所終也。以上下之象言之，則為無首，以終始之象言之，則為無終，無首則無終矣。乾下巽上。
小畜：亨。密雲不雨，自我西郊。畜，敕六反。《大畜》卦同。巽，亦三畫卦之名。一陰伏於二陽之下，故其德為巽、為入，其象為風、為木。小，陰也。畜，止之之義也。上巽下乾，以陰畜陽，又卦唯六四一陰，上下五陽皆為所畜，故為小畜。又以陰畜陽，能係而不能固，亦為所畜者小之象。內健外巽，二五皆陽，各居一卦之中而用事，有剛而能中，其志得行之象，故其占當得亨通。然畜未極而施未行，故有密雲不雨，自我西郊之象。蓋密雲，陰物；西郊，陰方。我者，文王自我也。文王演《易》於羑里，視岐周為西方，正小畜之時也。筮者得之，則占亦如其象云
《彖》曰：「小畜」，柔得位而上下應之，曰小畜。以卦體釋卦名義。柔得位，指六居四。上下，謂五陽。
健而巽，剛中而志行，乃亨。以卦德、卦體而言，陽猶可亨也。
「密雲不雨」，尚往也。「自我西郊」，施未行也。施，始豉反。尚往，言畜之未極，其氣猶上進也。
《象》曰：風行天上，小畜，君子以懿文德。風有氣而無質，能畜而不能久，故為小畜之象。懿文德，言未能厚積而遠施也。
初九，復自道，何其咎，吉。復，芳六反。二爻同。下卦乾體，本皆在上之物，志欲上進，而為陰所畜。然初九體乾，居下得正，前遠於陰，雖與四為正應，而能自守以正，不為所畜，故有進復自道之象。占者如是，則無咎而吉也。
《象》曰：「復自道」，其義吉也。
九二，牽復，吉。三陽志同，而九二漸近於陰，以其剛中，故能與初九牽連而復，亦吉道也。占者如是，則吉矣。
《象》曰：牽復在中，亦不自失也。亦者，承上爻義。
九三，輿說輻，夫妻反目。說，吐活反。九三，亦欲上進，然剛而不中，迫近於陰，而又非正應，但以陰陽相說而為所係畜，不能自進，故有輿說輻之象。然以志剛，故又不能平而與之爭，故又為夫妻反目之象。戒占者如是，則不得進而有所爭也。
《象》曰：「夫妻反目，不能正室也。程子曰：「『說輻』、『反目』，三自為也。」六四，有孚，血去惕出，無咎。去，上聲。以一陰畜眾陽，本有傷害憂懼。以其柔順得正，虛中巽體，二陽助之，是有孚而血去惕出之象也。無咎宜矣。故戒占者亦有其德，則無咎也。}}
《象》曰：有孚惕出，上合志也。
九五，有孚攣如，富以其鄰。攣，力專反。巽體三爻，同力畜乾，鄰之象也。而九五居中處尊，勢能有為，以兼乎上下，故為有孚攣固，用富厚之力而以其鄰之象。以，猶《春秋》「以某師」之「以」，言能左右之也。占者有孚，則能如是也。
《象》曰：「有孚攣如」，不獨富也。
上九，既雨既處，尚德載，婦貞厲，月幾望，君子征凶。幾，音機。《歸妹》卦同。畜極而成，陰陽和矣，故為既雨既處之象。蓋尊尚陰德，至於積滿而然也。陰加於陽，故雖正亦厲。然陰既盛而抗陽，則君子亦不可以有行矣。其占如此，為戒深矣。
《象》曰：「既雨既處」，德積載也。「君子征凶」，有所疑也。
䷉兌下，乾上。
履虎尾，不咥人，亨。咥，直結反。〇兌，亦三畫卦之名。一陰見於二陽之上，故其德為說，其象為澤。履，有所躡而進之義也。以兌遇乾，和說以躡剛強之後，有履虎尾而不見傷之象，故其卦為履，而占如是也。人能如是，則處危而不傷矣。
〇《彖》曰：履，柔履剛也。以二體釋卦名義。
說而應乎乾，是以「履虎尾，不咥人，亨」。說，音悅。〇以卦德釋《彖辭》。剛中正，履帝位而不疚，光明也。又以卦體明之，指九五也。〇《象》曰：上天下澤，履，君子以辯上下，定民志。《程傳》備矣。〇《傳》曰：「天在上，澤居下，上下之正理也。人之所履當如是，故取其象而為履。君子觀履之象，以辯別上下之分，以定其民志。夫上下之分明，然後民志有定。民志定，然後可以言治。民志不定，天下不可得而治也。古之時，公卿大夫而下，位各稱其德，終身居之，得其分也。位未稱德，則君舉而進之。士脩其學，學至而君求之。皆非有預於己也。農工商賈勤其事，而所享有限。故皆有定志，而天下之心可一。後世自庶士至於公卿，日志於尊榮；農工商賈，日志於富侈；億兆之心，交騖於利，天下紛然，如之何其可一也。欲其不亂，難矣。此由上下無定志也。君子觀履之象，而分辯上下，使各當其分，以定民之心志也。」
〇初九，素履，往無咎。以陽在下，居履之初，未為物遷，率其素履者也。占者如是，則往而无咎也。《象》曰：素履之往，獨行願也。
〇九二，履道坦坦，幽人貞吉。剛中在下，無應於上，故為履道平坦，幽獨守貞之象。幽人履道而遇其占，則貞而吉矣。
《象》曰：「幽人貞吉」，中不自亂也。
六三，眇能視，跛能履，履虎尾，咥人，凶，武人為于大君。跛，波我反。六三不中不正，柔而志剛，以此履乾，必見傷害，故其象如此，而占者凶。又為剛武之人，得志而肆暴之象，如秦政、項籍，豈能久也。
《象》曰：「眇能視」，不足以有明也。「跛能履」，不足以與行也。咥人之凶，位不當也。「武人為于大君」，志剛也。
九四，履虎尾，愬愬終吉。愬，山革反，音色。九四亦以不中不正，履九五之剛。然以剛居柔，故能戒懼而得終吉。
《象》曰：「愬愬，終吉」，志行也。
九五，夬履，貞厲。夬，古快反。九五以剛中正履帝位，而下以兌說應之，凡事必行，無所疑礙。故其象為夬決其履，雖使得正，亦危道也。故其占為雖正而危，為戒深矣。
《象》曰：「夬履，貞厲」，位正當也。傷於所恃。
上九，視履考祥，其旋元吉。視履之終，以考其祥，周旋無虧，則得元吉。占者禍福，視其所履而未定也。
《象》曰：元吉在上，大有慶也。若得元吉，則大有福慶也。
乾下，坤上。
泰：小往大來，吉亨。泰，通也。為卦天地交而二氣通，故為泰。正月之卦也。小，謂陰。大，謂陽。言坤往居外，乾來居內。又自《歸妹》來，則六往居四，九來居三也。占者有陽剛之德，則吉而享矣。
《彖》曰：「泰，小往大來，吉亨」，則是天地交而萬物通也，上下交而其志同也。內陽而外陰，內健而外順，內君子而外小人，君子道長，小人道消也。長，丁丈反。《否》卦同。
《象》曰：天地交，泰，后以財成天地之道，輔相天地之宜，以左右民。財、裁同。相，息亮反。左，音佐。右，音佑。財成以制其過，輔相以補其不及。
初九，拔茅茹以其彙，征吉。茹，人餘反。彙，于位反，音胃。《否》卦同。三陽在下，相連而進，拔茅連茹之象，征行之吉也。占者陽剛，則其征吉矣。郭璞《洞林》讀至「彙」字絕句，下卦放此。
《象》曰：拔茅征吉，志在外也。
九二，包荒，用馮河，不遐遺，朋亡，得尚于中行。馮，音憑。九二以剛居柔，在下之中，上有六五之應，主乎泰而得中道者也。占者能包容荒穢，而果斷剛決，不遺遐遠，而不昵朋比，則合乎此爻中行之道矣。
《象》曰：「包荒」、「得尚于中行」，以光大也。
九三，無平不陂，無往不復，艱貞無咎，勿恤其孚，于食有福。將過於中，泰將極而否欲來之時也。恤，憂也。孚，所期之信也。戒占者艱難守貞，則無咎而有福。
《象》曰：「無往不復」，天地際也。
六四，翩翩，不富以其鄰，不戒以孚。已過乎中，泰已極矣，故三陰翩然而下復，不待富而其類從之，不待戒令而信也。其占為有小人合交以害正道，君子所當戒也。陰虛陽實，故凡言不富者，皆陰爻也
《象》曰：翩翩不富，皆失實也。「不戒以孚」，中心願也。陰本居下，在上為失實。
六五，帝乙歸妹，以祉元吉。以陰居尊，為泰之主。柔中虛己，下應九二，吉之道也。而帝乙歸妹之時，亦嘗占得此爻。占者如是，則有祉而元吉矣。凡經以古人為言，如高宗、箕子之類者，皆放此。
《象》曰：「以祉元吉」，中以行願也。
上六，城復于隍。勿用師，自邑告命，貞吝。復，房六反。下同。泰極而否，城復于隍之象。戒占者不可力爭，但可自守，雖得其貞，亦不免於羞吝。
《象》曰：「城復于隍」，其命亂也。命亂故復否，告命，所以治之也。治，平聲。
否之坤下乾上。否之匪人，不利君子貞，大往小來。}}
否，備鄙反。否，閉塞也，七月之卦也。正與《泰》反，故曰匪人，謂非人道也。其占不利於君子之正道。蓋乾往居外，坤來居內，又自《漸》卦而來，則九往居四，六來居三也。或疑「之匪人」三字衍文，由《比》六三而誤也。《傳》不特解，其義亦可見。
《彖》曰：「否之匪人，不利君子貞，大往小來」，則是天地不交，而萬物不通也；上下不交，而天下無邦也。內陰而外陽，內柔而外剛，內小人而外君子，小人道長，君子道消也。《象》曰：天地不交，否，君子以儉德辟難，不可榮以祿。辟，音避。難，去聲。收斂其德，不形於外，以避小人之難。人不得以祿位榮之。
初六，拔茅茹以其彙，貞吉亨。三陰在下，當否之時，小人連類而進之象，而初之惡則未形也，故戒其貞則吉而亨。蓋能如是，則變而為君子矣。
《象》曰：拔茅貞吉，志在君也。小人而變為君子，則能以愛君為念，而不計其私矣。
六二，包承，小人吉，大人否，亨。陰柔而中正，小人而能包容承順乎君子之象，小人之吉道也。故占者小人如是則吉，大人則當安守其否而後道亨。蓋不可以彼包承於我，而自失其守也。
《象》曰：「大人否，亨」，不亂群也。言不亂於小人之群。
六三，包羞。以陰居陽而不中正，小人志於傷善而未能也，故為包羞之象。然以其未發，故無凶咎之戒。
《象》曰：「包羞」，位不當也。
九四，有命，無咎，疇離祉。否過中矣，將濟之時也。九四，以陽居陰，不極其剛，故其占為有命無咎，而疇類三陽，皆獲其福也。命，謂天命。
《象》曰：「有命，無咎」，志行也。
九五，休否，大人吉。其亡其亡，繫于苞桑。苞，與包同。古《易》作「包」。陽剛中正以居尊位，能休時之否，大人之事也。故此爻之占，大人遇之則吉。然又當戒懼如《繫辭傳》所云也。
《象》曰：大人之吉，位正當也。
上九，傾否。先否後喜。以陽剛居否極，能傾時之否者也。其占為先否後喜。
《象》曰：否終則傾，何可長也。
同人離下乾上同人于野，亨。利涉大川，利君子貞。離，亦三畫卦之名。一陰麗於二陽之間，故其德為麗、為文明；其象為火、為日、為電。同人，與人同也。以離遇乾，火上同於天，六二得位得中，而上應九五，又卦唯一陰而五陽同與之，故為同人。于野，謂曠遠而無私也，有亨道矣。以健而行，故能涉川。為卦內文明而外剛健，六二中正而有應，則君子之道也。占者能如是，則亨，而又可涉險。然必其所同合於君子之道，乃為利也.
《彖》曰：「同人」，柔得位得中而應乎乾，曰同人。以卦體釋卦名義。柔，謂六二。乾，謂九五。
同人曰。衍文。
「同人于野，亨，利涉大川」，乾行也。文明以健，中正而應，君子正也。唯君子為能通天下之志。以卦德、卦體釋卦辭。通天下之志，乃為大同；不然，則是私情之合而已，何以致亨而利涉哉？
《象》曰：天與火，同人，君子以類族辨物。天在上而火炎上，其性同也。類族辨物，所以審異而致同也。
初九，同人于門，無咎。同人之初，未有私主。以剛在下，上無係應，可以無咎。故其象占如此。《象》曰：出門同人，又誰咎也？
六二，同人于宗，吝。宗，黨也。六二雖中且正，然有應於上，不能大同而係於私，吝之道也。故其象占如此。
《象》曰：「同人于宗」，吝道也。
九三，伏戎于莽，升其高陵，三歲不興。莽，莫蕩反。剛而不中，上無正應，欲同於二而非其正，懼九五之見攻，故有此象。
《象》曰：「伏戎于莽」，敵剛也。「三歲不興」，安行也？言不能行。九四，乘其墉，弗克攻，吉。墉，音庸。剛不中正，又無應與，亦欲同於六二，而為三所隔，故為乘墉以攻之象。然以剛居柔，故有自反而不克攻之象。占者如是，則是能改過而得吉也。《象》曰：「乘其墉」，義弗克也。其吉，則困而反則也。乘其墉矣，則非其力之不足也，特以義之弗克而不攻耳。能以義斷，困而反於法則，故吉也。
九五，同人先號咷而後笑，大師克相遇。號，戶羔反。咷，道刀反。《旅》卦同。五剛中正，二以柔中正，相應於下，同心者也，而為三四所隔，不得其同。然義理所同，物不得而間之，故有此象。然六二柔弱而三四剛強，故必用大師以勝之，然後得相遇也。
《象》曰：同人之先，以中直也。大師相遇，言相克也。直，謂理直。
上九，同人于郊，無悔。居外無應，物莫與同，然亦可以無悔，故其象占如此。郊，在野之內，未至於曠遠，但荒僻無與同耳。
《象》曰：「同人于郊」，志未得也。
大有乾下，離上。< p>大有：元亨。大有，所有之大也。離居乾上，火在天上，無所不照。又，六五一陰居尊得中，而五陽應之，故為大有。乾健離明，居尊應天，有亨之道。占者有其德，則大善而亨也。
《彖》曰：「大有」，柔得尊位大中，而上下應之，曰大有。以卦體釋卦名義。柔，謂六五。上下，謂五陽。其德剛健而文明，應乎天而時行，是以元亨。以卦德、卦體釋卦辭。應天，指六五也。
《象》曰：火在天上，大有，君子以遏惡揚善，順天休命。火在天上，所照者廣，為大有之象。所有既大，無以治之，則釁蘖萌於其間矣。天命有善而無惡，故遏惡揚善，所以順天。反之於身，亦若是而已矣。
初九，無交害，匪咎，艱則無咎。雖當大有之時，然以陽居下，上無係應，而在事初，未涉乎害者也，何咎之有？然亦必艱以處之，則無咎。戒占者宜如是也。
《象》曰：《大有》初九，無交害也。
九二，大車以載，有攸往，無咎。剛中在下，得應乎上，為大車以載之象。有所往而如是，可以無咎矣。占者必有此德，乃應其占也。
《象》曰：「大車以載」，積中不敗也。
九三，公用亨於天子，小人弗克。亨，《春秋傳》作「享」，謂朝獻也。古者，亨通之亨，享獻之享，烹飪之烹，皆作「亨」字。九三居下之上，公侯之象。剛而得正，上有六五之君，虛中下賢，故為亨于天子之象。占者有其德，則其占如是。小人無剛正之德，則雖得此爻，{不能當也。
《象》曰：「公用亨于天子」，小人害也。
九四，匪其彭，無咎。彭，蒲光反，音旁。「彭」字，音義未詳。《程傳》曰「盛貌」，理或當然。六五柔中之君，九四以剛近之，有僭逼之嫌。然以其處柔也，故有不極其盛之象，而得無咎。戒占者宜如是也。
《象》曰：「匪其彭，無咎」，明辨皙也。皙，明貌。
〇六五，厥孚交如，威如，吉。大有之世，柔順而中，以處尊位。虛己以應九二之賢，而上下歸之，是其孚信之交也。然君道貴剛，太柔則廢，當以威濟之，則吉。如其象占如此，亦戒辭也。
《象》曰：「厥孚交如」，信以發志也。一人之信，足以發上下之志也。威如之吉，易而無備也。易，以豉反。太柔，則人將易之，而無畏備之心。
〇上九，自天祐之，吉，無不利。大有之世，以剛居上，而能下從六五，是能履信思順而尚賢也。滿而不溢，故其占如此。
《象》曰：《大有》上吉，自天祐也。
䷎艮下，坤上。
謙：亨，君子有終。謙者，有而不居之義。止乎內而順乎外，謙之意也。山至高而地至卑，乃屈而止於其下，謙之象也。占者如是，則亨通而有終矣。有終，謂先屈而後伸也。
〇《彖》曰：「謙，亨」，天道下濟而光明，地道卑而上行。上，時掌反。〇言謙之必亨。天道虧盈而益謙，地道變盈而流謙，鬼神害盈而福謙，人道惡盈而好謙。謙尊而光，卑而不可踰，君子之終也。惡，烏路反。好，呼報反。〇變，謂傾壞。流，謂聚而歸之。人能謙，則其居尊者，其德愈光，其居卑者，人亦莫能過。此君子所以有終也。
〇《象》曰：地中有山，謙，君子以裒多益寡。稱物平施。裒，蒲侯反。稱，尺證反。施，始豉反。〇以𤰞蘊高，謙之象也。裒多益寡，所以稱物之宜而平其施，損高增卑以趣於平，亦謙之意也。
〇初六，謙謙君子，用涉大川，吉。以柔處下，謙之至也。君子之行也，以此涉難，何往不濟？故占者如是，則利以涉川也。
《象》曰：「謙謙君子」，卑以自牧也。
〇六二，鳴謙，貞吉。柔順中正，以謙有聞，正而且吉者也。故其占如此。
《象》曰：「鳴謙，貞吉」，中心得也。
〇九三，勞謙君子，有終吉。卦唯一陽，居下之上，剛而得正，上下所歸，有功勞而能謙，尤人所難，故有終而吉。占者如是，則如其應矣。
《象》曰：「勞謙君子」，萬民服也。
〇六四，無不利，撝謙。撝，呼回反，與揮同。柔而得正，上而能下，其占無不利矣。然居九三之上，故戒以更當發揮其謙，以示不敢自安之意也。
《象》曰：「無不利，撝謙」，不違則也。言不為過。
六五，不富以其鄰。利用侵伐，無不利。以柔居尊，在上而能謙者也，故為不富而能以其鄰之象。蓋從之者眾矣，猶有未服者，則利以征之，而於他事亦{{無不利。人有是德，則如其占也。
《象》曰：「利用侵伐」，征不服也。
上六，鳴謙，利用行師，征邑國。謙極有聞，人之所與，故可用行師。然以其質柔而無位，故可以征己之邑國而已。
《象》曰：「鳴謙」，志未得也。可「用行師」，「征邑國」也。陰柔無位，才力不足，故其志未得。而至於行師，然亦適足以治其私邑而已。豫
坤下，震上。豫：利建侯行師。豫，和樂也。人心和樂以應其上也。九四一陽，上下應之，其志得行，又以坤遇震，為順以動，故其卦為豫，而其占利以立君用師也。
《彖》曰：「豫」，剛應而志行，順以動，豫。以卦體、卦德釋卦名義。豫順以動，故天地如之，而況建侯行師乎？以卦德釋卦辭。天地以順動，故日月不過而四時不忒，聖人以順動，則刑罰清而民服。豫之時義大矣哉。極言之而贊其大也。
《象》曰：雷出地奮，豫，先王以作樂崇德，殷薦之上帝，以配祖考。雷出地奮，和之至也。先王作樂，既象其聲，又取其義。殷，盛也。
初六，鳴豫，凶。陰柔小人，上有強援，得時主事，故不勝其豫而以自鳴，凶之道也。故其占如此。卦之得名，本為和樂，然卦辭為眾樂之義，爻辭除九四與卦同外，皆為自樂，所以有吉凶之異。
《象》曰：初六「鳴豫」，志窮凶也。窮，謂滿極。
六二，介于石，不終日，貞吉。豫雖主樂，然易以溺人，溺則反而憂矣。卦獨此爻中而得正，是上下皆溺於豫，而獨能以中正自守，其介如石也。其德安靜而堅確，故其思慮明審，不俟終日，而見凡事之幾微也。《大學》曰：「安而后能慮，慮而后能得。」意正如此。占者如是，則正而吉矣。
《象》曰：「不終日，貞吉」，以中正也。
六三，盱豫悔，遲有悔。盱，況于反。盱，上視也。陰不中正而近於四，四為卦主，故六三上視於四，而下溺於豫，宜有悔者也。故其象如此，而其占為事當速悔。若悔之遲，則必有悔也。《象》曰：盱豫有悔，位不當也。}
九四，由豫，大有得。勿疑，朋盍簪。簪，側林反。九四，卦之所由以為豫者也。故其象如此，而其占為大有得。然又當至誠不疑，則朋類合而從之矣。故又因而戒之。簪，聚也，又速也。
《象》曰：「由豫大 有得」，志大行也。
六五，貞疾，恒不死。當豫之時，以柔居尊，沈溺於豫，又乘九四之剛，眾不附而處勢危，故為貞疾之象。然以其得中，故又為恒不死之象。即象而觀，占在其中矣。
《象》曰：六五「貞疾」，乘剛也。「恒不死」，中未亡也。
上六，冥豫。成有渝，無咎。渝，以朱反。以陰柔居豫極，為昏冥於豫之象。以其動體，故又為其事雖成，而能有渝之象。戒占者如是，則能補過而無咎，所以廣遷善之門也。
《象》曰：冥豫在上，何可長也？隨
震下，兌上。隨：元亨，利貞，無咎。隨，從也。以卦變言之，本自《困》卦九來居初，又自《噬嗑》九來居五，而自《未濟》來者，兼此二變，皆剛來隨柔之義，以二體言之，為此動而彼說，亦隨之義，故為隨。己能隨物，物來隨己，彼此相從，其通易矣，故其占為元亨。然必利於貞，乃得無咎。若所隨不貞，則雖大亨而不免於有咎矣。《春秋傳》穆姜曰：「有是四德，隨而無咎；我皆無之，豈隨也哉？」今按四德雖非本義，然其下云云，深得占法之意。
《彖》曰：隨，剛來而下柔，動而說，隨。下，遐嫁反。說，音悅。以卦變、卦德釋卦名義。大亨，貞無咎，而天下隨時。王肅本「時」作「之」，今當從之。釋卦辭，言能如是，則天下之所從也。隨時之義大矣哉。王肅本「時」字在「之」字下，今當從之。
《象》曰：澤中有雷，隨，君子以嚮晦入宴息。雷藏澤中，隨時休息。
初九，官有渝，貞吉。出門交有功。卦以物隨為義，爻以隨物為義。初九，以陽居下，為震之主，卦之所以為隨者也。既有所隨，則有所偏主而變其常矣，惟得其正則吉。又當出門以交，不私其隨，則有功也。故其象占如此，亦因以戒之。
《象》曰：「官有渝」，從正吉也。「出門交有功」，不失也。
六二，係小子，失丈夫。初陽在下而近，五陽正應而遠，二陰柔不能自守以須正應，故其象如此，凶吝可知，不假言矣。
《象》曰：「係小子」，弗兼與也。
六三，係丈夫，失小子，隨有求得，利居貞。丈夫，謂九四。小子，亦謂初也。三近系四而失於初，其象與六二正相反。四陽當任而己隨之，有求必得，然非正應，故有不正而為邪媚之嫌。故其占如此，而又戒以居貞也。
《象》曰：「係丈夫」，志舍下也。舍，音捨。
九四，隨有獲，貞凶，有孚在道，以明，何咎？九四以剛居上之下，與五同德，故其占隨而有獲。然勢陵於五，故雖正而凶。惟有孚在道而明，則上安而下從之，可以無咎也。占者當時之任，宜審此戒。
《象》曰「隨有獲」，其義凶也。「有孚在道」，明功也。
九五，孚于嘉，吉。陽剛中正，下應中正，是信于善也。占者如是，其吉宜矣。《象》曰：「孚于嘉，吉」，位正中也。
上六，拘係之，乃從維之。王用亨于西山。居隨之極，隨之固結而不可解者也。誠意之極，可通神明，故其占為王用亨于西山。亨，亦當作祭享之享。自周而言，岐山在西，凡筮祭山川者得之。其誠意如是，則吉也。
《象》曰：「拘係之」，上窮也。窮，極也。蠱
巽下，艮上。蠱：元亨，利涉大川。先甲三日，後甲三日。先，息薦反。後，胡豆反。蠱，壞極而有事也。其卦艮剛居上，巽柔居下，上下不交。下卑巽而上苟止，故其卦為蠱。或曰，剛上柔下，謂卦變自《賁》來者，初上二下，自《井》來者，五上上下，自《既濟》來者兼之，亦剛上而柔下，皆所以為蠱也。蠱壞之極，亂當復治，故其占為元亨，而利涉大川。甲，日之始，事之端也。先甲三日，辛也，後甲三日，丁也。前事過中而將壞，則可自新以為後事之端，而不使至于大壞，後事方始而尚新。然更當致其丁寧之意，以監其前事之失，而不使至於速壞。聖人之戒深也。}}
《彖》曰：「蠱」，剛上而柔下，巽而止，蠱。以卦體、卦變、卦德釋卦名義，蓋如此，則積弊而至於蠱矣。
「蠱，元亨」，而天下治也。「利涉大川」，往有事也。「先甲三日，後甲三日」，終則有始，天行也。釋卦辭。治蠱至於元亨，則亂而復治之象也。亂之終，治之始，天運然也。
《象》曰：山下有風，蠱。君子以振民育德。山下有風，物壞而有事矣。而事莫大於二者，乃治己治人之道也。
初六，幹父之蠱，有子，考無咎，厲終吉。幹，如木之幹，枝葉之所附而立者也。蠱者，前人已壞之緒，故諸爻皆有父母之象。子能幹之，則飭治而振起矣。初六，蠱未深而事易濟，故其占為有子則能治蠱，而考得無咎，然亦危矣。戒占者宜如是，又知危而能戒，則終吉也。《象》曰：「幹父之蠱」，意承考也。
九二，幹母之蠱，不可貞。九二剛中，上應六五，子幹母蠱而得中之象，以剛承柔而治其壞，故又戒以不可堅貞。言當巽以入之也。《象》曰：「幹母之蠱」，得中道也。
九三，幹父之蠱，小有悔，無大咎。過剛不中，故小有悔，巽體得正，故無大咎。
《象》曰：「幹父之蠱」，終無咎也。
六四，裕父之蠱，往見吝。以陰居陰，不能有為，寬裕以治蠱之象也。如是，則蠱將日深，故往則見吝。戒占者不可如是也。
《象》曰：「裕父之蠱」，往未得也。
〇六五，幹父之蠱，用譽。柔中居尊，而九二承之以德，以此幹蠱，可致聞譽，故其象占如此。
《象》曰：幹父用譽，承以德也。
〇上九，不事王侯，高尚其事。剛陽居上，在事之外，故為此象，而占與戒，皆在其中矣。
《象》曰：「不事王侯」，志可則也。
䷒兌下，坤上。

《彖》曰：「臨」，剛浸而長，長，丁丈反。以卦體釋卦名
。說而順，剛中而應。說，音悅。又以卦德、卦體言卦之善。
大亨以正，天之道也。當剛長之時，又有此善，故其占如此也。
「至于八月有凶」，消不久也。言雖天運之當然，然君子宜知所戒。
《象》曰：澤上有地，臨，君子以教思無窮，容保民無疆。思，去聲。地臨於澤，上臨下也，二者皆臨下之事。教之無窮者，兌也，容之無疆者，坤也。
初九，咸臨，貞吉。卦唯二陽，徧臨四陰，故二爻皆有咸臨之象。初九剛而得正，故其占為貞吉。
《象》曰：「咸臨，貞吉」，志行正也。
九二，咸臨，吉，無不利。剛得中而勢上進，故其占吉而無不利也。
《象》曰：「咸臨，吉，無不利」，未順命也未祥_六三甘臨，無攸利，既憂之，無咎。陰柔不中正，而居下之上，為以甘說臨人之象。其占固無所利，然能憂而改之，則無咎也。勉人遷善，為教深矣。
《象》曰：「甘臨」，位不當也。「既憂之」，咎不長也。
六四，至臨，無咎。處得其位，下應初九，相臨之至，宜無咎者也。
《象》曰：「至臨，無咎」，位當也。
六五，知臨，大君之宜，吉。知，音智。以柔居中，下應九二，不自用而任人，乃知之事，而大君之宜，吉之道也。
《象》曰：「大君之宜」，行中之謂也。
上六，敦臨，吉，無咎。居卦之上，處臨之終，敦厚于臨，吉而無咎之道也，故其象占如此。
《象》曰：敦臨之吉，志在內也。觀坤下巽上。觀：盥而不薦，有孚顒若。觀，官奐反。下「大觀」、「以觀」之「觀」，《大象》「觀」字，並同。觀者，有以示人而為人所仰也。九五居上，四陰仰之，又內順外巽，而九五以中正示天下，所以為觀。盥，將祭而潔手也。薦，奉酒食以祭也。顒然，尊敬之貌。言致其潔清而不輕自用，則其孚信在中，而顒然可仰。戒占者當如是也。或曰：「有孚顒若」，謂在下之人，信而仰之也。此卦四陰長而二陽消，正為八月之卦，而名卦繫辭，更取他義，亦扶陽抑陰之意。
《彖》曰：大觀在上，順而巽，中正以觀天下。以卦體、卦德釋卦名義。
「觀，盥而不薦，有孚顒若」，下觀而化也。觀，如字。下「觀天」、《大象》「觀民」之「觀」、六爻「觀」字，並同。〇釋卦辭。
觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。極言觀之道也。四時不忒，天之所以為觀也。神道設教，聖人之所以為觀也。
〇《象》曰：風行地上，觀，先王以省方觀民設教。省，悉井反。〇省方以觀民，設教以為觀。
初六，童觀，小人無咎，君子吝。卦以觀示為義，據九五為主也，爻以觀瞻為義，皆觀乎九五也。〇初六，陰柔在下，不能遠見，童觀之象。小人之道，君子之羞也。故其占在小人則無咎，君子得之，則可羞矣。
《象》曰：初六「童觀」，小人道也。
〇六二，闚觀，利女貞。陰柔居內而觀乎外，闚觀之象，女子之正也。故其占如此。丈夫得之，則非所利矣。
《象》曰：闚觀女貞，亦可醜也。在丈夫則為醜也。
〇六三，觀我生，進退。我生，我之所行也。六三，居下之上，可進可退，故不觀九五，而獨觀己所行之通塞以為進退。』占者宜自審也。
《象》曰觀我生進退未失道也〇六四觀國之光，利用賓于王。六四，最近於五，故有此象。其占為利於朝覲仕進也。
《象》曰：「觀國之光」，尚賓也。
九五，觀我生，君子無咎。九五，陽剛中正，以居尊位，其下四陰，仰而觀之，君子之象也。故戒居此位、得此占者，當觀己所行，必其陽剛中正亦如是焉，則得無咎也。
《象》曰：「觀我生」，觀民也。此夫子以義言之，明人君觀己所行，不但一身之得失，又當觀民德之善否，以自省察也。
上九，觀其生}}，君子無咎。上九，陽剛居尊位之上，雖不當事任，而亦為下所觀，故其戒辭略與五同。但以「我」為「其」，小有主賓之異耳。
《象》曰：「觀其生」，志未平也。志未平，言雖不得位，未可忘戒懼也。震下，離上
噬嗑：亨，利用獄。噬，市利反。嗑，胡臘反。噬，齧也。嗑，合也。物有間者，齧而合之也。為卦上下兩陽而中虛，頤口之象，九四一陽，間於其中，必齧之而後合，故為噬嗑。其占當得亨通者，有間故不通，齧之而合，則亨通矣。又三陰三陽，剛柔中半，下動上明，下雷上電，本自《益》卦六四之柔，上行以至於五而得其中，是以陰居陽，雖不當位而利用獄。蓋治獄之道，唯威與明，而得其中之為貴。故筮得之者，有其德，則應其占也。
《彖》曰：頤中有物，曰噬嗑。以卦體釋卦名義。
噬嗑而亨，剛柔分，動而明，雷電合而章。柔得中而上行，雖不當位，利用獄也。上，時掌反。又以卦名、卦體、卦德、二象卦變釋卦辭。
《象》曰：雷電，噬嗑；先王以明罰勅法。雷電，當作「電雷」。
初九，屨校滅趾，無咎。校，音教。初、上無位，為受刑之象。中四爻為用刑之象。初在卦始，罪薄過小，又在卦下，故為屨校滅趾之象。止惡於初，故得無咎。占者小傷而無咎也。
《象》曰：「屨校滅趾」，不行也。滅趾，又有不進於惡之象。
六二，噬膚滅鼻，無咎。祭有膚鼎，蓋肉之柔脆，噬而易嗑者。六二中正，故其所治如噬膚之易。然以柔乘剛，故雖甚易，亦不免於傷滅其鼻。占者雖傷而終無咎也。< p>《象》曰：「噬膚滅鼻」，乘剛也。
六三，噬腊肉，遇毒，小吝，無咎。腊，音昔。腊肉，謂獸腊，全體骨而為之者，堅韌之物也。陰柔不中正，治人而人不服，為噬腊遇毒之象。占雖小吝，然時當噬嗑，於義為無咎也。
《象》曰：「遇毒」，位不當也。
九四，噬乾胏，得金矢，利艱貞，吉。乾，音幹。胏，緇美反。胏，肉之帶骨者，與「胾」通。《周禮》：獄訟，入鈞金束矢而後聽之。九四，以剛居柔，得用刑之道，故有此象。言所噬愈堅，而得聽訟之宜也。然必利於艱難正固，則吉。戒占者，宜如是也。
《象》曰：「利艱貞，吉」，未光也。
六五，噬幹肉，得黃金，貞厲，無咎。噬乾肉，難於膚而易於腊胏者也。黃，中色。金，亦謂鈞金。六五，柔順而中，以居尊位，用刑於人，人無不服，故有此象。然必貞厲，乃得無咎。亦戒占者之辭也。
《象》曰：「貞厲，無咎」，得當也。
上九，何校滅耳，凶。何，何可反。何，負也。過極之陽，在卦之上，惡極罪大，凶之道也。故其象占如此。
《象》曰：「何校滅耳」，聰不明也。滅耳，蓋罪其聽之不聰也。若能審聽而早圖之，則無此凶矣。{離下，艮上。

文明以止，人文也。又以卦德言之。止，謂各得其分。
觀乎天文，以察時變，觀乎人文，以化成天下。極言賁道之大也。
《象》曰：山下有火，賁，君子以明庶政，無敢折獄。山下有火，明不及遠。明庶政，事之小者。折獄，事之大者。內離明而外艮止，故取象如此。
初九，賁其趾，舍車而徒。舍，音捨。剛德明體，自賁於下，為舍非道之車，而安於徒步之象。占者自處，當如是也。
《象》曰：「舍車而徒」，義弗乘也。君子之取舍，決於義而已。
六二，賁其須。二以陰柔居中正，三以陽剛而得正，皆無應與。故二附三而動，有賁須之象。占者宜從上之陽剛而動也。
《象》曰：「賁其須」，與上興也。
九三，賁如濡如，永貞吉。一陽居二陰之間，得其賁而潤澤者也。然不可溺於所安，故有永貞之戒。
《象》曰：永貞之吉，終莫之陵也。
六四，賁如皤如，白馬翰如，匪寇，婚媾。皤，白波反。皤，白也。馬，人所乘，人白則馬亦白矣。四與初相賁者，乃為九三所隔而不得遂，故皤如，而其往求之心，如飛翰之疾也。然九三剛正，非為寇者也，乃求婚媾耳。故其象如此。
《象》曰：六四，當位疑也。「匪寇，婚媾」，終無尤也。當位疑，謂所當之位可疑也。終無尤，謂若守正而不與，亦無他患也。
六五，賁于丘園，束帛戔戔，吝，終吉。戔，在千反，又音箋。六五柔中，為賁之主，敦本尚實，得賁之道。故有丘園之象。然陰性吝嗇，故有束帛戔戔之象。束帛，薄物。戔戔，淺小之意。人而如此，雖可羞吝，然禮奢寧儉，故得終吉。
《象》曰：六五之吉，有喜也。上九，白賁，無咎。賁極反本，復於無色，善補過矣。故其象占如此
《象》曰：「白賁，無咎」，上得志也。
坤下，艮上。
剝：不利有攸往。剝，落也。五陰在下而方生，一陽在上而將盡，陰盛長而陽消落，九月之卦也。陰盛陽衰，小人壯而君子病。又內坤而外艮，有順時而止之象。故占得之者，不可有所往也。
《彖》曰：「剝」，剝也，柔變剛也。以卦體釋卦名義，言柔進于陽，變剛為柔也。
「不利有攸往」，小人長也。順而止之，觀象也。君子尚消息盈虛，天行也。長，丁丈反。以卦體、卦德釋卦辭。
《象》曰：山附於地，剝，上以厚下安宅。
初六，剝牀以足，蔑貞凶。剝自下起，滅正則凶，故其占如此。蔑，滅也。
《象》曰：「剝牀以足」，以滅下也。
六二，剝牀以辨，蔑貞凶。辨，音辦。辨，牀幹也。進而上矣。
《象》曰：「剝牀以辨」，未有與也。言未大盛。
六三，剝之，無咎。眾陰方剝陽，而己獨應之，去其黨而從正，無咎之道也。占者如是，則得無咎。
《象》曰：「剝之，無咎」，失上下也。上下，謂四陰。
六四，剝牀以膚，凶。陰禍切身，故不復言蔑貞，而直言凶
也。
《象》曰：「剝牀以膚」，切近災也。
六五，貫魚以宮人寵，無不利。魚，陰物。宮人，陰之美而受制於陽者也。五為眾陰之長，當率其類，受制於陽，故有此象。而占者如是，則無不利也。
《象》曰：以宮人寵，終無尤也。
上九，碩果不食，君子得輿，小人剝廬。一陽在上，剝未盡而能復生。君子在上，則為眾陰所載。小人居之，則剝極於上，自失所覆，而無復碩果得輿之象矣。取象既明，而君子、小人，其占不同，聖人之情，益可見矣。
《象》曰：「君子得輿」，民所載也。「小人剝廬」，終不可用也。
震下，坤上。
復：亨。出入無疾，朋來無咎。反復其道，七日來復。利有攸往。「反復」之復，方福反，又作覆。《彖》同。復，陽復生於下也。剝盡則為純坤，十月之卦，而陽氣已生於下矣。積之踰月，然後一陽之體始成而來復，故十有一月，其卦為復。以其陽既往而復反，故有亨道。又，內震外坤，有陽動於下而以順上行之象，故其占又為己之出入，既得無疾，朋類之來，亦得無咎。又，自五月
《姤》卦一陰始生，至此七爻，而一陽來復，乃天運之自然。故其占又為反復其道，至於七日，當得來復。又以剛德方長，故其占又為利有攸往也。反復其道，往而復來，來而復往之意。七日者，所占來復之期也。
《彖》曰：「復，亨」，剛反。剛反則亨。
動而以順行，是以「出入無疾，朋來無咎」。以卦德而言。
「反復其道，七日來復」，天行也。陰陽消息，天運然也。
「利有攸往」，剛長也。長，丁丈反。以卦體而言，既生則漸長矣。復其見天地之心乎。積陰之下，一陽復生，天地生物之心幾於滅息，而至此乃復可見。在人則為靜極而動，惡極而善，本心幾息而復見之端也。程子論之詳矣。而邵子之詩亦曰：「冬至子之半，天心無改移。一陽初動處，萬物未生時。玄酒味方淡，太音聲正希。此言如不信，更請問包羲。」至哉言也，學者宜盡心焉。
《象》曰：雷在地中，復，先王以至日閉關，商旅不行，后不省方。安靜以養微陽也。《月令》：「是月齋戒掩身，以待陰陽之所定。」
初九，不遠復，無祗悔，元吉。祗，音其。一陽復生於下，復之主也。祗，抵也。又居事初，失之未遠，能復於善，不抵於悔，大善而吉之道也，故其象占如此。
《象》曰：不遠之復，以脩身也。
六二，休復，吉。柔順中正，近於初九，而能下之，復之休美，吉之道也。
《象》曰：休復之吉，以下仁也。下，遐嫁反。
六三，頻復，厲無咎。以陰居陽，不中不正，又處動極，復而不固，屢失屢復之象。屢失故危，復則無咎，故其占又如此。
《象》曰：頻復之厲，義無咎也。
六四，中行獨復。四處群陰之中，而獨與初應，為與眾俱行，而獨能從善之象。當此之時，陽氣甚微，未足以有為，故不言吉。然理所當然，吉凶非所論也。董子曰：「仁人者，正其誼，不謀其利；明其道，不計其功。」於《剝》之六三及此爻見之。
《象》曰：「中行獨復」，以從道也。
六五，敦復，無悔。以中順居尊，而當復之時，敦復之象，「無悔」之道也。
《象》曰：「敦復，無悔」，中以自考也。考，成也。
上六，迷復，凶，有災眚，用行師，終有大敗，以其國，君凶，至于十年不克征。眚，生領反。以陰柔居復終，終迷不復之象，凶之道也。故其占如此。以，猶及也。
《象》曰：迷復之凶，反君道也。
震下乾上。
無妄：元亨，利貞。其匪正有眚，不利有攸往。無妄，實理自然之謂。《史記》作「無望」，謂無所期望而有得焉者，其義亦通。為卦自《訟》而變，九自二來而居於初，又為震主，動而不妄者也，故為無妄。又，二體震動而乾健，九五剛中而應六二，故其占大亨而利於正。若其不正，則有眚，而不利有所往也。
《彖》曰：「無妄」，剛自外來而為主於內，動而健，剛中而應。大亨以正，天之命也。「其匪正有眚，不利有攸往」，無妄之往，何之矣？天命不祐，行矣哉。以卦變、卦德、卦體言，卦之善如此，故其占當獲大亨而利於正，乃天命之當然也。其有不正，則不利有所往。欲何往哉？蓋其逆天之命而天不祐之，故不可以有行也。
《象》曰：天下雷行，物與無妄，先王以茂對時育萬物。天下雷行，震動發生，萬物各正其性命，是物物而與之以無妄也。先王法此以對時育物，因其所性而不為私焉。
初九，無妄，往吉。以剛在內，誠之主也。如是而往，其吉可知，故其象占如此。
《象》曰：無妄之往，得志也。
六二，不耕獲，不菑畬，則利有攸往。菑，側其反。畬，音餘。柔順中正，因時順理，而無私意期望之心，故有不耕獲、不菑畬之象。言其無所為於前，無所冀於後也。占者如是，則利有所往矣。
《象》曰：「不耕獲」，未富也。富，如「非富天下」之「富」。言非計其利而為之也。
六三，無妄之災，或系之牛，行人之得，邑人之災。卦之六爻，皆無妄者也。六三，處不得正，故遇其占者，無故而有災。如行人牽牛以去，而居者反遭詰捕之擾也。
《象》曰：行人得牛，邑人災也。
九四，可貞，無咎。陽剛乾體，下無應與，可固守而無咎，不可以有為之占也。
《象》曰：「可貞，無咎」，固有之也。有，猶守也。
九五，無妄之疾，勿藥有喜。乾剛中正以居尊位，而下應亦中正，無妄之至也。如是而有疾，勿藥而自愈矣。故其象占如此。
《象》曰：無妄之藥，不可試也。既已無妄而複藥之，則反為妄而生疾矣。試，謂少嘗之也。
上九，無妄，行有眚，無攸利。上九，非有妄也，但以其窮極而不可行耳，故其象占如此。
《象》曰：無妄之行，窮之災也。
乾下，艮上。
大畜：利貞。不家食，吉，利涉大川。畜，敕六反。大，陽也。以艮畜乾，又畜之大者也。又以內乾剛健，外艮篤實輝光，是以能日新其德，而為畜之大也。以卦變言，此卦自《需》而來，九自五而上，以卦體言，六五尊而尚之，以卦德言，又能止健。皆非大正不能。故其占為利貞而不家食，吉也。又六五下應於乾，為應乎天，故其占又為利涉大川也。不家食，謂食祿於朝，不食於家也。
《彖》曰：「大畜」，剛健篤實輝光，日新其德。以卦德釋卦名義。
剛上而尚賢，能止健，大正也。以卦變、卦體、卦德釋卦辭。
「不家食，吉」，養賢也。亦取尚賢之象。
「利涉大川」，應乎天也。亦以卦體而言。
《象》曰：天在山中，大畜，君子以多識前言往行，以畜其德。識，如字，又音志。行，下孟反。天在山中，不必實有是事，但以其象言之耳。
初九，有厲，利已。已，夷止反。乾之三陽，為艮所止，故內外之卦，各取其義。初九為六四所止，故其占往則有危，而利於止也。
《象》曰：「有厲，利已」，不犯災也。
九二，輿說輹。說，吐活反。輹，音服，又音福。九二亦為六五所畜。以其處中，故能自止而不進，有此象也。
《象》曰：「輿說輹」，中無尤也。
九三，良馬逐，利艱貞，曰閑輿衛，利有攸往。三以陽居健極，上以陽居畜極，極而通之時也。又皆陽爻，故不相畜而俱進，有良馬逐之象焉。然過剛銳進，故其占必戒以艱貞閑習，乃利於有往也。曰，當為日月之日。
《象》曰：「利有攸往」，上合志也。
六四，童牛之牿，元吉。牿，古毒反。童者，未角之稱。牿，施橫木於牛角，以防其觸。《詩》所謂「楅衡」者也。止之於未角之時，為力則易，大善之吉也。故其象占如此。《學記》曰：「禁於未發之謂豫。」正此意也。
《象》曰：六四「元吉」，有喜也。
六五，豶豕之牙，吉。豶，符云反。陽已進而止之，不若初之易矣。然以柔居中而當尊位，是以得其機會而可制。故其象如此。占雖吉，而不言元也。
《象》曰：「六五之吉，有慶也。
上九，何天之衢，亨。何天之衢，言何其通達之甚也。畜極而通，豁達無礙，故其象占如此。
《象》曰：「何天之衢」，道大行也。
頣震下，艮上。
頤：貞吉。觀頤，自求口實。頤，以之反。頤，口旁也。口食物以自養，故為養義。為卦上下二陽，內含四陰，外實內虛，上止下動，為頤之象，養之義也。貞吉者，占者得正則吉。觀頤，謂觀其所養之道。自求口實，謂觀其所以養身之術。皆得正則吉也。
《彖》曰：「頤，貞吉」，養正則吉也。「觀頤」，觀其所養也。「自求口實」，觀其自養也。釋卦辭。
天地養萬物聖人養賢以及萬民。頤之時大矣哉。極言養道而贊之。
《象》曰：山下有雷，頤，君子以慎言語，節飲食。二者養德、養身之切務。
初九，舍爾靈龜，觀我朵頤，凶。舍，音捨。朵，多果反。靈龜，不食之物。朵，垂也。朵頤，欲食之貌。初九陽剛在下，足以不食，乃上應六四之陰而動於欲，凶之道也。故其象占如此。
《象》曰：「觀我朵頤」，亦不足貴也。
六二，顛頤。拂經，于丘頤，征凶。求養於初，則顛倒而違於常理，求養於上，則往而得凶。丘，土之高者，上之象也。
《象》曰：六二「征凶」，行失類也。初、上皆非其類也。
六三，拂頤，貞凶，十年勿用，無攸利。陰柔不中正，以處動極，拂於頤矣。既拂於頤，雖正亦凶，故其象占如此。
《象》曰：「十年勿用」，道大悖也。
六四，顛頤，吉。虎視眈眈，其欲逐逐，無咎。眈，都含反。柔居上而得正，所應又正，而賴其養以施於下，故雖顛而吉。虎視眈眈，下而專也。其欲逐逐，求而繼也。又能如是，則無咎矣。
《象》曰：顛頤之吉，上施光也。施，始豉反。
六五，拂經。居貞吉，不可涉大川。六五，陰柔不正，居尊位而不能養人，反賴上九之養，故其象占如此。
《象》曰：居貞之吉，順以從上也。
上九，由頤，厲吉，利涉大川。六五，賴上九之養以養人，是物由上九以養也。位高任重，故厲而吉。陽剛在上，故利涉川。
《象》曰：「由頤，厲吉」，大有慶也。
巽下，兌上。
大過：棟橈。利有攸往，亨。橈，乃教反。大，陽也。四陽居中過盛，故為大過。上下二陰，不勝其重，故有棟橈之象。又以四陽雖過，而二五得中，內巽外說，有可行之道，故利有所往而得亨也。
《彖》曰：「大過」，大者過也。以卦體釋卦名義。
「棟橈」，本末弱也。復以卦體釋卦辭。本，謂初，末，謂上，弱，謂陰柔。
剛過而中，巽而說行，利有攸往，乃亨。說，音悅。又以卦體、卦德釋卦辭。
大過之時大矣哉。大過之時，非有大過人之材，不能濟也，故歎其大。
《象》曰：澤滅木，大過，君子以獨立不懼，遯世無悶。澤滅於木，大過之象也。不懼無悶，大過之行也。
初六，藉用白茅，無咎。藉，在夜反。
當大過之時，以陰柔居巽下，過於畏慎而無咎者也。故其象占如此。白茅，物之潔者。
《象》曰：「藉用白茅，柔在下也。
九二，枯楊生稊，老夫得其女妻，無不利。稊，杜兮反。陽過之始，而比初陰，故其象占如此。稊，根也，榮於下者也，榮於下，則生於上矣。夫雖老而得女妻，猶能成生育之功也。《象》曰：老夫女妻，過以相與也。
九三，棟橈，凶。三、四二爻，居卦之中，棟之象也。九三以剛居剛，不勝其重，故象橈而占凶。
《象》曰：棟橈之凶，不可以有輔也。
九四，棟隆，吉，有它吝。它，湯何反。以陽居陰，過而不過，故其象隆而占吉。然下應初六，以柔濟之，則過於柔矣，故又戒以有它則吝也。《象》曰：棟隆之吉，不橈乎下也。
九五，枯楊生華，老婦得其士夫，無咎無譽。華，如字。九五，陽過之極，又比過極之陰，故其象占皆與二反。《象》曰：「枯楊生華」，何可久也？老婦士夫，亦可醜也。
上六，過涉滅頂，凶，無咎。處過極之地，才弱不足以濟，然於義為無咎矣。蓋殺身成仁之事，故其象占如此。
《象》曰：過涉之凶，不可咎也。
習坎下，坎上。
習坎：有孚，維心亨，行有尚。習，重習也。坎，險陷也。其象為水，陽陷陰中，外虛而中實也。此卦上下皆坎，是為重險，中實為有孚心亨之象，以是而行，必有功矣。故其占如此。
《彖》曰：「習坎」，重險也。重，直龍反。釋卦名義。
水流而不盈，行險而不失其信。以卦象釋「有孚」之義，言內實而行有常也。
「維心亨」，乃以剛中也。「行有尚」，往有功也。以剛在中，心亨之象。如是而往，必有功也。
天險，不可升也；地險，山川丘陵也；王公設險，以守其國。險之時用大矣哉。極言之而贊其大也。
《象》曰：水洊至，習坎，君子以常德行，習教事。洊，在薦反。行，下孟反。治己治人，皆必重習，然後熟而安之。
初六，習坎，入于坎窞，凶。窞，徒坎、陵感二反。以陰柔居重險之下，其陷益深，故其象占如此。
《象》曰：習坎入坎，失道凶也。
九二，坎有險，求小得。處重險之中，未能自出，故為有險之象。然剛而得中，故其占可以求小得也。
《象》曰：「求小得」，未出中也。
六三，來之坎坎，險且枕，入于坎窞，勿用。枕，針甚反。
以陰柔不中正，而履重險之間，來往皆險。前險而後枕，其陷益深，不可用也。故其象占如此。枕，倚著未安之意。
《象》曰：「來之坎坎」，終無功也。
六四，樽酒簋，貳用缶，納約自牖，終無咎。簋，音軌。缶，俯九反。晁氏云：「先儒讀『樽酒簋』為一句，『貳用缶』為一句。」今從之。貳，益之也。《周禮》：「大祭三貳」，《弟子職》：「左執虛豆，右執挾匕，周旋而貳」是也。九五尊位，六四近之，在險之時，剛柔相際，故有但用薄禮，益以誠心，進結自牖之象。牖非所由之正，而室之所以受明也。始雖艱阻，終得無咎，故其占如此。
《象》曰：「樽酒簋，貳」，剛柔際也。晁氏曰：「陸氏《釋文》本無『貳』字。」今從之。
九五，坎不盈，祗既平，無咎。九五，雖在坎中，然以陽剛中正居尊位，而時亦將出矣，故其象占如此。
《象》曰：「坎不盈」，中未大也。有中德而未大。
上六，係用徽纆，寘于叢棘，三歲不得，凶。纆，音墨。寘，音置。以陰柔居險極，故其象占如此。
《象》曰：上六失道，凶三歲也。
䷝離下，離上。
離：利貞，亨。畜牝牛，吉。畜，許六反。離，麗也。陰麗於陽，其象為火，體陰而用陽也。物之所麗，貴乎得正。牝牛，柔順之物也。故占者能正則亨，而畜牝牛則吉也。
《彖》曰：「離」，麗也。日月麗乎天，百穀草木麗乎土，重明以麗乎正，乃化成天下。重，直龍反。釋卦名義。
柔麗乎中正，故亨，是以畜牝牛吉也。以卦體釋卦辭。
《象》曰：明兩作，離，大人以繼明照于四方。作，起也。
初九，履錯然，敬之，無咎。錯，七各反。以剛居下而處明體，志欲上進，故有履錯然之象。敬之則無咎矣。戒占者宜如是也。《象》曰：履錯之敬，以辟咎也。辟、避同。
六二，黃離，元吉。黃，中色。柔麗乎中而得其正，故其象占如此。《象》曰：「黃離，元吉」，得中道也。
九三，日昃之離，不鼓缶而歌，則大耋之嗟，凶。耋，田節反。重離之間，前明將盡，故有日昃之象。不安常以自樂，則不能自處而凶矣。戒占者宜如是也。《象》曰：「日昃之離」，何可久也？
九四，突如其來如，焚如，死如，棄如。突，徒忽反。後明將繼之時，而九四以剛迫之，故其象如此。《象》曰：「突如其來如」，無所容也。無所容，言焚死棄也。
六五，出涕沱若，戚嗟若，吉。沱，徒何反。以陰居尊，柔麗乎中。然不得其正而迫於上下之陽，故憂懼如此，然後得吉。戒占者宜如是也。《象》曰：六五之吉，離王公也。離，音麗。
上九，王用出征，有嘉，折首，獲匪其醜，無咎。剛明及遠，威震而刑不濫，無咎之道也。故其象占如此。
《象》曰：「王用出征」，以正邦也。
《周易本義卷二》
周易下經䷟恆艮下，兌上。咸：亨，利貞，取女吉。取，七具反。咸，交感也。兌柔在上，艮剛在下，而交相感應，又艮止則感之專，兌說則應之至，又艮以少男下於兌之少女，男先於女，得男女之正，婚姻之時，故其卦為咸。其占亨而利貞，取女則吉。蓋感有必通之理，然不以貞，則失其亨，而所為皆凶矣。
《彖》曰：「咸」，感也。釋卦名義。柔上而剛下，二氣感應以相與。止而說，男下女，是以「亨，利貞，取女吉」也。說，音悅。「男下」之下，遐嫁反。以卦體、德卦象釋卦辭。或以卦變言柔上剛下之義，曰：《咸》自《旅》來，柔上居六，剛下居五也。亦通。
天地感而萬物化生，聖人感人心而天下和平，觀其所感，而天地萬物之情可見矣。極言感通之理。
《象》曰：山上有澤，咸，君子以虛受人。山上有澤，以虛而通也。
初六，咸其拇。拇，茂后反。拇，足大指也。《咸》以人身取象，感於最下，咸拇之象也。感之尚淺，欲進未能，故不言吉凶。此卦雖主於感，然六爻皆宜靜而不宜動也。
《象》曰：「咸其拇」，志在外也。
六二，咸其腓，凶，居吉。腓，房非反。腓，足肚也。欲行則先自動，躁妄而不能固守者也。二當其處，又以陰柔不能固守，故取其象。然有中正之德，能居其所，故其占動凶而靜吉也。
《象》曰：雖「凶，居吉」，順不害也。
九三，咸其股，執其隨，往吝。股，隨足而動，不能自專者也。執者，主當持守之意。下二爻皆欲動者，三亦不能自守而隨之，往則吝矣。故其象占如此。
《象》曰：「咸其股」，亦不處也。志在隨人，所執下也。言亦者，因前二爻皆欲動而云也。二爻陰躁，其動也宜。九三陽剛，居止之極，宜靜而動，可吝之甚也。
九四，貞吉，悔亡，憧憧往來，朋從爾思。憧，昌容反，又音同。九四，居股之上，脢之下，又當三陽之中，心之象，咸之主也。心之感物，當正而固，乃得其理。今九四乃以陽居陰，為失其正而不能固，故因占設戒，以為能正而固，則吉而悔亡。若憧憧往來，不能正固而累於私感，則但其朋類從之，不復能及遠矣。
《象》曰：「貞吉，悔亡」，未感害也。「憧憧往來」，未光大也。感害，言不正而感，則有害也。
九五，咸其脢，無悔。脢，武杯反，又音每。脢，背肉，在心上而相背，不能感物而無私係。九五，適當其處，故取其象，而戒占者以能如是，則雖不能感物，而亦可以無悔也。
《象》曰：「咸其脢」，志末也。志末，謂不能感物。
上六，咸其輔頰舌。頰，古協反。輔頰舌，皆所以言者，而在身之上。上六，以陰居說之終，處鹹之極，感人以言而無其實。又兌為口舌，故其象如此，凶咎可知。
《象》曰：「咸其輔頰舌」，滕口說也。滕、騰通用。䷟恆巽下，震上。恒：亨，無咎，利貞，利有攸往。恒，常久也。為卦震剛在上，巽柔在下，震雷巽風，二物相與，巽順震動，為巽而動。二體六爻，陰陽相應。四者皆理之常，故為恒。其占為能久於其道，則亨而無咎。然又必利
於守貞，則乃為得所常久之道，而利有所往也。}}
《彖》曰：「恒」，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恒。以卦體、卦象、卦德釋卦名義。或以卦變言剛上柔下之義，曰：《恒》自《豐》來，剛上居二，柔下居初也。亦通。
「恒，亨，無咎，利貞」，久於其道也。天地之道，恒久而不已也。恒固能亨，且無咎矣。然必利於正，乃為久於其道，不正則久非其道矣。天地之道，所以長久，亦以正而已矣。
「利有攸往」，終則有始也。久於其道，終也，利有攸往，始也。動靜相生，循環之理，然必靜為主也。
日月得天而能久照，四時變化而能久成。聖人久於其道，而天下化成。觀其所恒，而天地萬物之情可見矣。極言恒久之道。
《象》曰：雷風，恒，君子以立不易方。
初六，浚恒，貞凶，無攸利。初與四為正應，理之常也，然初居下而在初，未可以深有所求。四震體而陽性，上而不下，又為二三所隔，應初之意，異乎常矣。初之柔暗，不能度勢，又以陰居巽下，為巽之主，其性務入，故深以常理求之，浚恒之象也。占者如此，則雖貞亦凶，而無所利矣。
《象》曰：浚恒之凶，始求深也。
九二，悔亡。以陽居陰，本當有悔，以其久中，故得亡也。
《象》曰：九二「悔亡」，能久中也。
九三，不恒其德，或承之羞，貞吝。位雖得正，然過剛不中，志從於上，不能久於其所，故為不恒其德，或承之羞之象。或者，不知其何人之辭。承，奉也，言人皆得奉而進之，不知其所自來也。貞吝者，正而不恒，為可羞吝。申戒占者之辭。
《象》曰：「不恒其德」，無所容也。
九四，田無禽。以陽居陰，久非其位，故為此象。占者田無所獲，而凡事亦不得其所求也。
《象》曰：久非其位，安得禽也？
六五，恒其德，貞，婦人吉，夫子凶。以柔中而應剛中，常久不易，正而固矣。然乃婦人之道，非夫子之宜也。故其象占如此。
《象》曰：婦人貞吉，從一而終也。夫子制義，從婦凶也。
上六，振恒，凶。振者，動之速也。上六，居恒之極，處震之終，恒極則不常，震終則過動，又陰柔不能固守，居上非其所安，故有振恒之象，而其占則凶也。
《象》曰：振恒在上，大無功也。䷠遯艮下，乾上。遯：亨，小利貞。，遯徒困反。遯，退避也。為卦二陰浸長，陽當退避，故為遯，六月之卦也。陽雖當遯，然九五當位，而下有六二之應，若猶可以有為。但二陰浸長於下，則其勢不可以不遯，故其占為君子能遯則身雖退而道亨；小人則利於守正，不可以浸長之故，而遂侵迫於陽也。小，謂陰柔小人也。此卦之占，與《否》之初二兩爻相類。
《彖》曰：「遯，亨」，遯而亨也。剛當位而應，與時行也。以九五一爻釋亨義。
「小利貞」，浸而長也。長，丁丈反。以下二陰釋小利貞。
遯之時義大矣哉。陰方浸長，處之為難，故其時義為尤大也。
《象》曰：天下有山，遯君子以遠小人，不惡而嚴。遠，袁萬反。天體無窮，山高有限，遯之象也。嚴者，君子自守之常，而小人自不能近。
初六，遯尾，厲，勿用有攸往。遯而在後，尾之象，危之道也。占者不可以有所往，但晦處靜俟，可免災耳。
《象》曰：遯尾之厲，不往，何災也？
六二，執之用黃牛之革，莫之勝說。勝，音升。說，吐活反。以中順自守，人莫能解，必遯之志也。占者固守，亦當如是。
《象》曰：執用黃牛，固志也。
九三，係遯，有疾厲，畜臣妾，吉。畜，許六反。下比二陰，當遯而有所係之象，有疾而危之道也。然以畜臣妾則吉，蓋君子之於小人，惟臣妾，則不必其賢而可畜耳。故其占如此。
《象》曰：係遯之厲，有疾憊也。「畜臣妾，吉」，不可大事也。憊，音敗。
九四，好，遯君子吉，小人否。好，呼報反。否，方有反。下應初六，而乾體剛健，有所好而能絕之以遯之象也。唯自克之君子能之，而小人不能。故占者君子則吉，而小人否也。
《象》曰：君子好遯，小人否也。
九五，嘉遯，貞吉。剛陽中正，下應六二，亦柔順而中正，遯之嘉美者也。占者如是，而正則吉矣。
《象》曰：「嘉遯，貞吉」，以正志也。
上九，肥遯，無不利。以剛陽居卦外，下無係應，遯之遠而處之裕者也。故其象占如此。肥者，寬裕自得之意。
《象》曰：「肥遯，無不利」，無所疑也。䷡大壯乾下，震上。大壯：利貞。大，謂陽也。四陽盛長，故為大壯，二月之卦也。陽壯，則占者吉亨，不假言，但利在正固而已。
《彖》曰：「大壯」，大者壯也。剛以動，故壯。釋卦名義。以卦體言，則陽長過中，大者壯也。以卦德言，則乾剛震動，所以壯也。
「大壯，利貞」，大者正也，正大而天地之情可見矣。釋利貞之義，而極言之。
《象》曰：雷在天上，大壯君子以非禮弗履。自勝者強。
初九，壯于趾，征凶，有孚。趾在下而進，動之物也。剛陽處下而當壯時，壯于進者也，故有此象。居下而壯於進，其凶必矣。故其占又如此。
《象》曰：「壯于趾」，其孚窮也。言必困窮。
九二，貞吉。以陽居陰，已不得其正矣。然所處得中，則猶可因以不失其正，故戒占者使因中以求正，然後可以得吉也
《象》曰：九二「貞吉」，以中也。
九三，小人用壯，君子用罔，貞厲，羝羊觸藩，羸其角。羝，音低。羸，力追反。過剛不中，當壯之時，是小人用壯，而君子則用罔也。罔，無也；視有如無，君子之過於勇者也。如此，則雖正亦危矣。羝羊，剛壯喜觸之物。藩，籬也。羸，困也。貞厲之占，其象如此。
《象》曰：「小人用壯」，君子罔也。小人以壯敗，君子以罔困。
九四，貞吉，悔亡，藩決不羸，壯于大輿之輹。輹音福。貞吉，悔亡，與《咸》九四同占。藩決不羸，承上文而言也。決，開也。三前有四，猶有藩焉。四前二陰，則藩決矣。壯于大輿之輹，亦可進之象也。以陽居陰，不極其剛，故其象如此。
《象》曰：「藩決不羸」，尚往也。尚、上通。
六五，喪羊于易，無悔。喪，息浪反。《象》同。易，以豉反，一音亦。《旅》卦同。卦體似《兌》，有羊象焉，外柔而內剛者也。獨六五以柔居中，不能抵觸，雖失其壯，然亦無所悔矣。故其象如此，而占亦與《咸》九五同。易，容易之易。言忽然不覺其亡也。或作疆埸之「埸」，亦通《漢食貨志》「埸」作「易」。
《象》曰：「喪羊于易」，位不當也。
上六，羝羊觸藩，不能退，不能遂，無攸利，艱則吉。壯終動極，故觸藩而不能退。然其質本柔，故又不能遂其進也。其象如此，其占可知。然猶幸其不剛，故能艱以處，則尚可以得吉也。
《象》曰：「不能退，不能遂」，不詳也。「艱則吉」，咎不長也。䷢晉坤下， 離上。晉：康侯用錫馬蕃庶，晝日三接。晉，進也。康侯，安國之侯也。錫馬蕃庶，晝日三接，言多受大賜，而顯被親禮也。蓋其為卦上離下坤，有日出地上之象，順而麗乎大明之德，又其變自《觀》而來，為六四之柔進而上行以至於五。占者有是三者，則亦當有是寵也。
《彖》曰：「晉」，進也。釋卦名義。明出地上，順而麗乎大明，柔進而上行，是以「康侯用錫馬蕃庶，晝日三接」也。「上行」之上，時掌反。以卦象、卦德、卦變釋卦辭。
《象》曰：明出地上，晉，君子以自昭明德。昭，明之也。
初六，晉如摧如，貞吉，罔孚，裕無咎。以陰居下，應不中正，有欲進見摧之象。占者如是，而能守正則吉。設不為人所信，亦當處以寬裕，則無咎也。
《象》曰：「晉如摧如」，獨行正也。「裕無咎」，未受命也。初居下位，未有官守之命。
六二，晉如愁如，貞吉，受茲介福于其王母。六二，中正，上無應援，故欲進而愁。占者如是，而能守正則吉，而受福于王母也。王母，指六五，蓋享先妣之吉占。而凡以陰居尊者，皆其類也。
《象》曰：「受茲介福」，以中正也。
六三，眾允，悔亡。三不中正，宜有悔者，以其與下二陰皆欲上進，是以為眾所信而悔亡也。
《象》曰：眾允之志，上行也。九四，晉如鼫鼠，貞厲。鼫，音石。不中不正，以竊高位，貪而畏人，蓋危道也。故為鼫鼠之象。占者如是，雖正亦危。
《象》曰：鼫鼠貞厲，位不當也。
六五，悔亡，失得勿恤，往吉，無不利。以陰居陽，宜有悔矣。以大明在上，而下皆順從，故占者得之，則其悔亡。又一切去其計功謀利之心，則往吉而無不利也。然亦必有其德，乃應其占耳。《象》曰：「失得勿恤」，往有慶也。
上九，晉其角，維用伐邑，厲吉無咎，貞吝。角剛而居上。上九剛進之極，有其象矣。占者得之，而以伐其私邑，則雖危而吉且無咎。然以極剛治小邑，雖得其正，亦可吝矣。
《象》曰：「維用伐邑」，道未光也。䷣明夷離下，坤上。明夷：利艱貞。夷，傷也。為卦下離上坤，日入地中，明而見傷之象，故為明夷。又其上六為暗之主，六五近之，故占者利於艱難以守正，而自晦其明也。
《彖》曰：明入地中，明夷，以卦象釋卦名。}}
內文明而外柔順，以蒙大難，文王以之。難，去聲。下同。以卦德釋卦義。蒙大難，謂遭紂之亂而見囚也。
「利艱貞」，晦其明也，內難而能正其志，箕子以之。以六五一爻之義釋卦辭。內難，謂為紂近親，在其國內，如六五之近於上六也。
《象》曰：明入地中，明夷，君子以蒞眾，用晦而明。
初九，明夷于飛，垂其翼，君子于行，三日不食。有攸往，主人有言。飛而垂翼，見傷之象，占者行而不食。所如不合，時義當然，不得而避也。
《象》曰：「君子于行」，義不食也。唯義所在，不食可也。
六二，明夷，夷于左股，用拯馬壯，吉。拯，之陵反。《渙》初爻同。傷而未切，救之速則免矣。故其象占如此。
《象》曰：六二之吉，順以則也。
九三，明夷于南狩，得其大首，不可疾貞。以剛居剛，又在明體之上，而屈於至暗之下，正與上六，闇主為應，故有向明除害，得其首惡之象。然不可以亟也，故有不可疾貞之戒。成湯起於夏臺，文王興於羑里，正合此爻之義，而小事亦有然者。
《象》曰：南狩之志，乃大得也。
六四，入于左腹，獲明夷之心，于出門庭。此爻之義未詳。竊疑左腹者，幽隱之處。獲明夷之心，于出門庭者，得意於遠去之義。言筮而得此者，其自處當如是也。蓋離體為至明之德，坤體為至闇之地，下三爻明在闇外，故隨其遠近高下而處之不同。六四，以柔正居闇地而尚淺，故猶可以得意於遠去。五以柔中居闇地而已迫，故為內難正志以晦其明之象。上則極乎闇矣，故為自傷其明以至於，闇而又足以傷人之明。蓋下五爻皆為君子，獨上一爻為闇君也。
《象》曰：「入于左腹」，獲心意也。意，葉音臆。
六五，箕子之明夷，利貞。居至闇之地，近至闇之君，而能正其志，箕子之象也，貞之至也。利貞，以戒占者
《象》曰：箕子之貞，明不可息也。
上六，不明晦，初登于天，後入于地。以陰居坤之極，不明其德以至於晦。始則處高位，以傷人之明。終必至於自傷，而墜厥命。故其象如此，而占亦在其中矣。
《象》曰：「初登於天」，照四國也。「後入于地」，失則也。照四國，以位言。䷤家人離下，巽上。家人：利女貞。家人者，一家之人。卦之九五、六二，外內各得其正，故為家人。利女貞者，欲先正乎內也。內正則外無不正矣。
《彖》曰：「家人」，女正位乎內，男正位乎外；男女正，天地之大義也。以卦體九五、六二，釋利女貞之義。
家人有嚴君焉，父母之謂也。亦謂二五。
父父、子子、兄兄、弟弟、夫夫、婦婦，而家道正，正家而天下定矣。上父初子，五三夫，四二婦，五兄三弟，以卦畫推之，又有此象。
《象》曰：風自火出，家人，君子以言有物，而行有恒。行，下孟反。身修則家治矣。
初九，閑有家，悔亡。初九以剛陽處有家之始，能防閑之，其悔亡矣。戒占者當如是也。
《象》曰：「閑有家」，志未變也。志未變而預防之。
六二，無攸遂，在中饋，貞吉。六二柔順中正，女之正位乎內者也，故其象占如此。
《象》曰：六二之吉，順以巽也。
九三，家人嗃嗃，悔厲吉，婦子嘻嘻，終吝。嗃，呼落反。嘻，喜悲反。《象》同。以剛居剛而不中，過乎 剛者也，故有嗃嗃嚴厲之象。如是，則雖有悔厲而吉也。嘻嘻者，嗃嗃之反，吝之道也。占者各以其德為應，故兩言之。
《象》曰：「家人嗃嗃」，未失也。「婦子嘻嘻」，失家節也。
六四，富家，大吉。陽主義，陰主利，以陰居陰而在上位，能富其家者也
《象》曰：「富家，大吉」，順在位也。
九五，王假有家，勿恤，吉。假，更白反。假，至也，如「假于太廟」之「假」。有家，猶言有國也。九五，剛健中正，下應六二之柔順中正，王者以是至于其家，則勿用憂恤而吉可必矣。蓋聘納后妃之吉占，而凡有是德者遇之，皆吉也。
《象》曰：「王假有家」，交相愛也。程子曰：「夫愛其內助，婦愛其刑家。」
上九，有孚威如，終吉。上九以剛居上，在卦之終，故言正家久遠之道。占者必有誠信嚴威，則終吉也。
《象》曰：威如之吉，反身之謂也。謂非作威也，反身自治，則人畏服之矣。䷥睽兌下離上睽：小事吉。睽，苦圭反。睽，乖異也。為卦上火下澤，性相違異；中女、少女，志不同歸，故為睽。然以卦德言之，內說而外明。以卦變言之，則自《離》來者，柔進居三，自《中孚》來者，柔進居五，自《家人》來者兼之。以卦體言之，則六五得中，而下應九二之剛。是以其占不可大事，而小事尚有吉之道也。
《彖》曰：「睽」，火動而上，澤動而下，二女同居，其志不同行。上、下俱上聲。下同。以卦象釋卦名義。
說而麗乎明，柔進而上行，得中而應乎剛，是以小事吉。說，音悅。以卦德、卦變、卦體釋卦辭。
天地睽而其事同也，男女睽而其志通也，萬物睽而其事類也。睽之時用大矣哉。極言其理而贊之。
《象》曰：上火下澤，睽，君子以同而異。二卦合體而性不同。
初九，悔亡，喪馬勿逐，自復，見惡人，無咎。喪，去聲。上無正應，有悔也。而居睽之時，同德相應，其悔亡矣。故有喪馬勿逐而自復之象。然亦必見惡人，然後可以辟咎，如孔子之於陽貨也。
《象》曰：「見惡人」，以辟咎也。辟，音避。
九二，遇主于巷，無咎。二、五陰陽正應，居睽之時，乖戾不合，必委曲相求而得會遇，乃為無咎，故其象占如此。
《象》曰：「遇主于巷」，未失道也。本其正應，非有邪也。
六三，見輿曳，其牛掣，其人天且劓。無初有終。曳，以制反。掣，昌逝反。劓，魚器反。六三、上九正應，而三居二陽之間，後為二所曳，前為四所掣，而當睽之時，上九猜很方深，故又有髡劓之傷。然邪不勝正，終必得合，故其象占如此。
《象》曰：「見輿曳」，位不當也。「無初有終」，遇剛也。
九四，睽孤，遇元夫，交孚，厲無咎。夫，如字。睽孤，謂無應。遇元夫，謂得初九。交孚，謂同德相信。然當睽時，故必危厲，乃得無咎。占者亦如是也。
《象》曰：交孚無咎，志行也。
六五，悔亡，厥宗噬膚，往何咎？噬，市制反。以陰居陽，悔也。居中得應，故能亡之。厥宗，指九二。噬膚，言易合。六五，有柔中之德，故其象占如是。
《象》曰：「厥宗噬膚」，往有慶也。
上九，睽孤；見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾。往遇雨則吉。弧，音胡。說，吐活反媾，古豆反睽孤，謂六三為二陽所制，而己以剛處明極睽極之地，又自猜很而乖離也。見豕負塗，見其污也。載鬼一車，以無為有也。張弧，欲射之也。說弧，疑稍釋也。匪寇婚媾，知其非寇而實親也。往遇雨則吉，疑盡釋而睽合也。上九之與六三，先睽後合，故其象占如此。
《象》曰：遇雨之吉，群疑亡也。䷦蹇艮下，坎上。蹇：利西南，不利東北，利見大人，貞吉。蹇，紀免反。蹇，難也；足不能進，行之難也。為卦艮下坎上，見險而止，故為蹇。西南平易，東北險阻。又，艮，方也，方在蹇中，不宜走險。又卦自《小過》而來，陽進則往居五而得中，退則入於艮而不進。故其占曰利西南，不利東北。當蹇之時，必見大人，然後可以濟難。又，必守正，然後得吉。而卦之九五，剛健中正，有大人之象。自二以上，五爻皆得正位，則又貞之義也。故其占又曰利見大人，貞吉。蓋見險者貴於能止，而又不可終於止。處險者利於進，而不可失其正也。
《彖》曰：「蹇」，難也，險在前也。見險而能止，知矣哉！難，乃旦反。知，音智。以卦德釋卦名義，而贊其美。
「蹇，利西南」，往得中也。「不利東北」，其道窮也。「利見大人」，往有功也。當位貞吉，以正邦也。蹇之時用大矣哉。以卦變、卦體釋卦辭，而贊其時用之大也。
《象》曰：山上有水，蹇，君子以反身修德。
初六，往蹇，來譽。往遇險，來得譽。
《象》曰：「往蹇，來譽」，宜待也。
六二，王臣蹇蹇，匪躬之故。柔順中正，正應在上，而在險中，故蹇而又蹇，以求濟之，非以其身之故也。不言吉凶者，占者但當鞠躬盡力而已，至於成敗利鈍，則非所論也。
《象》曰：「王臣蹇蹇」，終無尤也。事雖不濟，亦無可尤。
九三，往蹇，來反。反就二陰，得其所安。
《象》曰：「往蹇，來反」，內喜之也。
六四，往蹇，來連。連於九三，合力以濟。
《象》曰：「往蹇，來連」，當位實也。當，去聲。
九五，大蹇，朋來。大蹇者，非常之蹇也。九五居尊，而有剛健中正之德，必有朋來而助之者。占者有是德，則有是助矣。
《象》曰：「大蹇，朋來」，以中節也。
上六，往蹇，來碩，吉，利見大人。已在卦極，往無所之，益以蹇耳。來就九五，與之濟蹇，則有碩大之功。大人，指九五。曉占者宜如是也。
《象》曰：「往蹇，來碩」，志在內也。「利見大人」，以從貴也。 ䷧解坎下，震上。解：利西南，無所往，其來複吉，有攸往，夙吉。解，音蟹。《彖傳》、《大象》同。解，難之散也。居險能動，則出於險之外矣，解之象也。難之既解，利於平易安靜，不欲久為煩擾。且其卦自《升》來，三往居四，入於坤體，二居其所，而又得中，故利於西南平易之地。若無所往，則宜來復其所而安靜。若尚有所往，則宜早往早複，不可久煩擾也。
《彖》曰：「解」，險以動，動而免乎險，解。以卦德釋卦名義。
「解，利西南」，往得眾也。「其來複吉」，乃得中也。「有攸往，夙吉」，往有功也。以卦變釋卦辭。《坤》為眾，得眾，謂九四入坤體得中有功，皆指九二。
天地解而雷雨作，雷雨作而百果草木皆甲坼。解之時大矣哉。極言而贊其大也。
《象》曰：雷雨作，解，君子以赦過宥罪。
初六，無咎。難既解矣，以柔在下，上有正應，何咎之有？故其占如此。
《象》曰：剛柔之際，義無咎也。
九二，田獲三狐，得黃矢，貞吉。此爻取象之意未詳。或曰：卦凡四陰，除六五君位，余三陰，即三狐之象也。大抵此爻為卜田之吉占，亦為去邪媚而得中直之象。能守其正，則無不吉矣。
《象》曰：九二「貞吉」，得中道也。
六三，負且乘，致寇至，貞吝。乘，如字；又石證反。《繫辭》備矣。貞吝，言雖以正得之，亦可羞也，唯避而去之為可免耳。
《象》曰：「負且乘」，亦可醜也。自我致戎，又誰咎也？戎，古本作「寇」。
九四，解而拇，朋至斯孚。解，佳買反。《象》同。拇，茂后反。拇，指初。初與四，皆不得其位而相應，應之不以正者也。然四陽初陰，其類不同，若能解而去之，則君子之朋至而相信也。
《象》曰：「解而拇」，未當位也。
六五，君子維有解，吉，有孚于小人。解，音蟹。《象》同。卦凡四陰，而六五當君位，與三陰同類者，必解而去之則吉也。孚，驗也。君子有解，以小人之退為驗也。
《象》曰：君子有解，小人退也。
上六，公用射隼于高墉之上，獲之，無不利。射，食亦反。隼，荀尹反。《繫辭》備矣。
《象》曰：公用射隼，以解悖也。解，佳買反。䷨損兌下，艮上。損：有孚，元吉、無咎、可貞、利有攸往。損，減省也。為卦損下卦上畫之陽，益上卦上畫之陰，損兌澤之深，益艮山之高，損下益上，損內益外，剝民奉君之象，所以為損也。損所當損，而有孚信，則其占當有此下四者之應矣。曷之用？二簋可用享。簋，音軌。言當損時，則至薄無害。
《彖》曰：「損」，損下益上，其道上行。上行之上，時掌反。以卦體釋卦名義。
損而有孚，元吉、無咎、可貞、利有攸往。曷之用？二簋可用享。二簋應有時，損剛益柔有時，損益盈虛，與時偕行。此釋卦辭。時，謂當損之時。
《象》曰：山下有澤，損，君子以懲忿窒欲。懲，直升反。君子修身，所當損者，莫切於此。
初九，已事遄往，無咎，酌損之。已，音以。遄，市專反。四爻同。初九，當損下益上之時，上應六四之陰，輟所為之事，而速往以益之，無咎之道也。故其象占如此。然居下而益上，亦當斟酌其淺深也。
《象》曰：「已事遄往」，尚合志也。尚、上通。
九二，利貞，征凶，弗損益之。九二剛中，志在自守，不肯妄進，故占者利貞，而征則凶也。弗損益之，言不變其所守，乃所以益上也。
《象》曰：九二「利貞」，中以為志也。
六三，三人行，則損一人，一人行，則得其友。下卦本乾，而損上爻以益坤，三人行而損一人也。一陽上而一陰下，一人行而得其友也兩相與則專，三則雜而亂，卦有此象，故戒占者當致一也。
《象》曰：一人行，三則疑也。
六四，損其疾，使遄有喜，無咎。以初九之陽剛益己，而損其陰柔之疾，唯速則善。戒占者如是，則無咎矣。
《象》曰：「損其疾」，亦可喜也。
六五，或益之十朋之龜，弗克違，元吉。柔順虛中，以居尊位，當損之時，受天下之益者也。兩龜為朋，十朋之龜，大寶也。或以此益之而不能辭，其吉可知。占者有是德，則獲其應也。
《象》曰：六五「元吉」，自上祐也。
上九，弗損益之，無咎，貞吉，利有攸往，得臣無家。上九，當損下益上之時，居卦之上，受益之極，而欲自損以益人也。然居上而益下，有所謂惠而不費者，不待損己，然後可以益人也。能如是，則無咎，然亦必以正則吉，而利有所往。惠而不費，其惠廣矣，故又曰，得臣無家。
《象》曰：「弗損益之」，大得志也。䷩益震下，巽上。益：利有攸往，利涉大川。益，增益也。為卦損上卦初畫之陽，益下卦初畫之陰，自上卦而下於下卦之下，故為益。卦之九五、六二，皆得中正。下震上巽，皆木之象，故其占利有所往，而利涉大川也。
《彖》曰：「益」，損上益下，民說無疆；自上下下，其道大光。「上下」之下，去聲。以卦體釋卦名義。
「利有攸往」，中正有慶。「利涉大川」，木道乃行。以卦體、卦象釋卦辭。
益動而巽，日進無疆。天施地生，其益無方。凡益之道，與時偕行。施，始豉反。動、巽二卦之德，乾下施，坤上生，亦上文卦體之義。又以此極言贊益之大。
《象》曰：風雷，益，君子以見善則遷，有過則改。風雷之勢，交相助益。遷善改過，益之大者，而其相益亦猶是也。
初九，利用為大作，元吉，無咎。初雖居下，然當益下之時，受上之益者也，不可徒然無所報效。故利用為大作，必元吉，然後得無咎。
《象》曰：「元吉，無咎」，下不厚事也。下本不當任厚事，故不如是，不足以塞咎也。
」」
六二，或益之十朋之龜，弗克違，永貞吉，王用享于帝，吉。六二，當益下之時，虛中處下，故其象占與《損》六五同。然爻位皆陰，故以永貞為戒。以其居下而受上之益，故又為卜郊之吉占。
《象》曰：或益之，自外來也。或者，眾無定主之辭。
六三，益之用凶事，無咎。有孚中行，告公用圭。六三陰柔，不中不正，不當得益者也。然當益下之時，居下之上，故有益之以凶事者。蓋警戒震動，乃所以益之也。占者如此，然後可以無咎。又戒以有孚中行，而告公用圭也。用圭，所以通信。
《象》曰：益用凶事，固有之也。益用凶事，欲其困心衡慮而固有之也。
六四，中行告公從，利用為依遷國。三、四皆不得中，故皆以中行為戒。此言以益下為心，而合於中行，則告公而見從矣。《傳》曰：「周之東遷，晉、鄭焉依。」蓋古者遷國以益下，必有所依，然後能立。此爻又為遷國之吉占也。
《象》曰：告公從，以益志也。
九五，有孚惠心，勿問元吉，有孚惠我德。上有信以惠於下，則下亦有信以惠於上矣。不問而元吉可知。
《象》曰：「有孚惠心」，勿問之矣。惠我德，大得志也。
上九，莫益之，或擊之，立心勿恒，凶。以陽居益之極，求益不已，故莫益而或擊之。立心勿恒，戒之也。
《象》曰：「莫益之」，偏辭也。「或擊之」，自外來也。莫益之者，猶從其求益之偏辭而言也。若究而言之，則又有擊之者矣。䷪夬乾下，兌上。夬：揚于王庭，孚號有厲。告自邑，不利即戎，利有攸往。夬，古快反。號，戶羔反。卦內並同。夬，決也，陽決陰也，三月之卦也。以五陽去一陰，決之而已。然其決之也，必正名其罪，而盡誠以呼號其眾，相與合力，然亦尚有危厲，不可安肆。又，當先治其私，而不可專尚威武，則利有所往也。皆戒之之辭。
《彖》曰：「夬」，決也，剛決柔也。健而說，決而和。說，音悅。釋卦名義，而贊其德。
「揚于王庭」，柔乘五剛也。「孚號有厲」，其危乃光也。「告自邑，不利即戎」，所尚乃窮也。「利有攸往」，剛長乃終也。長，丁丈反。此釋卦辭。柔乘五剛，以卦體言，謂以一小人加於眾君子之上，是其罪也。剛長乃終，謂一變則為純乾也。
《象》曰：澤上於天，夬，君子以施祿及下，居德則忌。上，時掌反。施，始豉反。澤上於天，潰決之勢也。施祿及下，潰決之意也。居德則忌，未詳。
初九，壯于前趾，往不勝為咎。前，猶進也。當決之時，居下任壯，不勝宜矣。故其象占如此。
《象》曰：不勝而往，咎也。
九二，惕號，莫夜有戎，勿恤。莫，音暮。九二，當決之時，剛而居柔，又得中道，故能憂惕號呼，以自戒備，而莫夜有戎，亦可無患也。
《象》曰：有戎勿恤，得中道也。
九三，壯于頄，有凶，君子夬夬，獨行遇雨，若濡有慍，無咎。頄，求龜反。頄，顴也。九三，當決之時，以剛而過乎中，是欲決小人，而剛壯見于面目也，如是則有凶道矣。然在眾陽之中，獨與上六為應，若能果決其決，不係私愛，則雖合於上六，如獨行遇雨。至於若濡而為君子所慍，然終必能決去小人而無所咎也。溫嶠之於王敦，其事類此。
《象》曰：「君子夬夬」，終無咎也。
九四，臀無膚，其行次且；牽羊悔亡，聞言不信。臀，徒敦反。次，七私反。且，七餘反。《姤》卦同。以陽居陰，不中不正，居則不安，行則不進。若不與眾陽競進，而安出其後，則可以亡其悔。然當決之時，志在上進，必不能也。占者聞言而信，則轉凶而吉矣。牽羊者，當其前則不進，縱之使前而隨其後，則可以行矣。
《象》曰：「其行次且」，位不當也。「聞言不信」，聰不明也。
九五，莧陸夬夬，中行無咎。莧，閑辨反。莧陸，今馬齒莧，感陰氣之多者。九五，當決之時，為決之主，而切近上六之陰，如莧陸然。若決而決之，而又不為過暴，合於中行，則無咎矣。戒占者當如是也。
《象》曰：「中行無咎」，中未光也。《程傳》備矣。《傳》曰：「卦辭言『夬夬』，則於中行為無咎矣。《象》復盡其義，云中未光也。夫人心正意誠，乃能極中正之道，而充實光輝。五，心有所比，以義之不可而決之，雖行於外，不失中正之義，可以無咎，然於中道未得為光大也。蓋人心一有所欲，則離道矣。夫子於此，示人之意深矣。」
上六，無號，終有凶。陰柔小人，居窮極之時，黨類已盡，無所號呼，終必有凶也。占者有君子之德，則其敵當之，不然反是。
《象》曰：無號之凶，終不可長也䷫姤巽下乾上姤：女壯，勿用取女。姤，古后反。取，七喻反。姤，遇也。決盡則為純乾，四月之卦。至姤然後一陰可見，而為五月之卦。以其本非所望，而卒然值之，如不期而遇者，故為遇。遇已非正，又一陰而遇五陽，則女德不貞而壯之甚也。取以自配，必害乎陽，故其象占如此。
《彖》曰：「姤」，遇也，柔遇剛也。釋卦名。「勿用取女」，不可與長也。釋卦辭。天地相遇，品物咸章也。以卦體言。剛遇中正，天下大行也。指九五。姤之時義大矣哉。幾微之際，聖人所謹。《象》曰：天下有風，姤，后以施命誥四方。
初六，繫于金柅，貞吉，有攸往，見凶，羸豕孚蹢躅。柅，乃李反，又女紀反。〇柅，所以止車，以金為之，其剛可知。一陰始生，靜正則吉，往進則凶。故以二義戒小人，使不害於君子，則有吉而無凶。然其勢不可止也，故以羸豕蹢躅曉君子，使深為之備云。
《象》曰：「繫于金柅」，柔道牽也。牽，進也，以其進，故止之。
九二，包有魚，無咎，不利賓。魚，陰物。二與初遇，為包有魚之象。然制之在己，故猶可以無咎。若不制而使遇於眾，則其為害廣矣。故其象占如此。
《象》曰：「包有魚」，義不及賓也。
九三，臀無膚，其行次且，厲，無大咎。九三過剛不中，下不遇於初，上無應於上，居則不安，行則不進，故其象占如此。然既無所遇，則無陰邪之傷。故雖危厲，而無大咎也。《象》曰：「其行次且」，行未牽也。
九四，包無魚，起凶。初六正應，已遇於二而不及於己，故其象占如此。《象》曰：無魚之凶，遠民也。遠，袁萬反。民之去己，猶己遠之。
九五，以杞包瓜，含章，有隕自天。瓜，陰物之在下者，甘美而善潰。杞，高大堅實之木也。五以陽剛中正，主卦於上，而下防始生必潰之陰，其象如此。然陰陽迭勝，時運之常，若能含晦章美，靜以制之，則可以回造化矣。有隕自天，本無而倏有之象也。
《象》曰：九五「含章」，中正也。「有隕自天」，志不舍命也。舍，音捨。
上九，姤其角，吝，無咎。角，剛乎上者也。上九，以剛居上而無位，不得其遇，故其象占與九三類。
《象》曰：「姤其角」，上窮吝也。
䷬萃坤下，兌上。萃：亨，王假有廟，利見大人，亨。利貞，用大牲吉，利有攸往。假，更白反。萃，聚也。坤順兌說，九五剛中，而二應之，又為澤上於地，萬物萃聚之象，故為萃。「亨」字衍文。王假有廟，言王者可以至于宗廟之中，王者卜祭之吉占也。《祭義》曰「公假于太廟」是也。廟所以聚祖考之精神，又人必能聚己之精神，則可以至于廟而承祖考也。物既聚，則必見大人，而後可以得亨。然又必利於正，所聚不正，則亦不能亨也。大牲必聚而後有，聚則可以有所往，皆占吉而有戒之辭。
《彖》曰：「萃」，聚也。順以說，剛中而應，故聚也。說，音悅。以卦德、卦體釋卦名義。
「王假有廟」，致孝享也。「利見大人，亨」，聚以正也。「用大牲吉，利有攸往」，順天命也。釋卦辭。
觀其所聚，而天地萬物之情可見矣。極言其理而贊之。
《象》曰：澤上於地，萃，君子以除戎器，戒不虞。上，時掌反。除者，脩而聚之之謂。
初六，有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往無咎。號，平聲。初六，上應九四，而隔於二陰，當萃之時，不能自守，是有孚而不終，志亂而妄聚也。若呼號正應，則眾以為笑；但勿恤而往從正應，則無咎矣。戒占者當如是也。
《象》曰：「乃亂乃萃」，其志亂也。
六二，引吉，無咎，孚乃利用禴。禴，羊略反。二應五而雜於二陰之間，必牽引以萃，乃吉而無咎。又二中正柔順，虛中以上應，九五剛健中正，誠實而下交。故卜祭者有其孚誠，則雖薄物，亦可以祭矣。
《象》曰：「引吉，無咎」，中未變也。
六三，萃如嗟如，無攸利，往無咎，小吝。六三陰柔，不中不正，上無應與，欲求萃於近而不得，故嗟如而無所利，唯往從於上，可以無咎，然不得其萃。困然後往，復得陰極無位元之爻，亦可小羞矣。戒占者當近捨不正之強援，而遠結正應之窮交，則無咎也。
《象》曰：「往無咎」，上巽也。
九四，大吉，無咎。上比九五，下比眾陰，得其萃矣。然以陽居陰不正，故戒占者必大吉，然後得無咎也。
《象》曰：「大吉，無咎」，位不當也。
九五，萃有位，無咎，匪孚，元永貞，悔亡。九五剛陽中正，當萃之時而居尊，固無咎矣。若有未信，則亦脩其元永貞之德，而悔亡矣。戒占者當如是也。
《象》曰：「萃有位」，志未光也。未光，謂匪孚。
上六，齎咨涕洟，無咎。齎，音咨，又，將啼反。洟，音夷《象》同。處萃之終，陰柔無位，求萃不得，故戒占者必如是，而後可以無咎也。
《象》曰：「齎咨涕洟」，未安上也。䷭升巽下，坤上升：元亨，用見大人，勿恤；南征，吉。升，進而上也。卦自《解》來，柔上居四，內巽外順，九二剛中而五應之，是以其占如此。南征，前進也。
《彖》曰：柔以時升，以卦變釋卦名
。巽而順，剛中而應，是以大亨。以卦德、卦體釋卦辭。
「用見大人，勿恤」，有慶也南征，吉」，志行也。
《象》曰：地中生木，升，君子以順德，積小以高大。王肅本「順」作「慎」。今按他書引此，亦多作「慎」，意尤明白，蓋古字通用也。說見上篇《蒙》卦。
初六，允升，大吉。初以柔順居下，巽之主也。當升之時，巽于二陽，占者如之，則信能升而大吉矣。
《象》曰：「允升，大吉」，上合志也。
九二，孚乃利用禴，無咎。義見《萃》卦。
《象》曰：九二之孚，有喜也。
九三，升虛邑。陽實陰虛，而坤有國邑之象。九三，以陽剛當升時，而進臨於坤，故其象占如此。
《象》曰：「升虛邑」，無所疑也。
六四，王用亨于岐山，吉，無咎。義見《隨》卦。
《象》曰：「王用亨于岐山」，順事也。以順而升，登祭于山之象。
六五，貞吉，升階。以陰居陽，當升而居尊位，必能正固，則可以得吉而升階矣。階，升之易者。
《象》曰：「貞吉，升階」，大得志也。
上六，冥升，利于不息之貞。以陰居升極，昏冥不已者也。占者遇此，無適而利，但可反其不已於外之心，施之於不息之正而已。
《象》曰：冥升在上，消不富也。
䷮困坎下，兌上困：亨，貞，大人吉，無咎，有言不信。困者，窮而不能自振之義。坎剛，為兌柔所掩，九二，為二陰所掩，四五，為上六所掩，所以為困。坎險、兌說，處險而說，是身雖困而道則亨也。二五剛中，又有大人之象，占者處困能亨，則得其正矣。非大人其孰能之？故曰貞。又曰大人者，明不正之小人不能當也。有言不信，又戒以當務晦默，不可尚口，益取困窮。
《彖》曰：「困」，剛掩也。以卦體釋卦名。
險以說，困而不失其所亨，其唯君子乎。「貞，大人吉」，以剛中也。「有言不信」，尚口乃窮也。說，音悅。以卦德、卦體釋卦辭。
《象》曰：澤無水，困；君子以致命遂志。水下漏，則澤上枯，故曰澤無水。致命，猶言授命，言持以與人而不之有也。能如是，則雖困而亨矣。
初六，臀困于株木，入于幽谷，三歲不覿。臀，物之底也。困于株木，傷而不能安也。初六以陰柔處困之底，居暗之甚，故其象占如此。
《象》曰：「入于幽谷」，幽不明也。
九二，困于酒食，朱紱方來，利用亨祀，征凶，無咎。紱，音弗。亨，讀作享。困于酒食，厭飫苦惱之意。酒食，人之所欲，然醉飽過宜，則是反為所困矣。朱紱方來，上應之也。九二有剛中之德，以處困時，雖無凶害，而反困于得其所欲之多，故其象如此。而其占利以享祀，若征行則非其時，故凶，而於義為無咎也。
《象》曰：「困于酒食」，中有慶也。
六三，困于石，據于蒺藜，入于其宮，不見其妻，凶。陰柔而不中正，故有此象，而其占則凶。石，指四，蒺藜，指二，宮，謂三，而妻，則六也。其義則《繫辭》備矣。
《象》曰：「據于蒺藜」，乘剛也。「入于其宮，不見其妻」，不祥也。九四，來徐徐，困于金車，吝，有終。初六、九四之正應。九四，處位不當，不能濟物，而初六方困于下，又為九二所隔，故其象如此。然邪不勝正，故其占雖為可吝，而必有終也。金車為九二象，未詳。疑坎有輪象也。
《象》曰：「來徐徐」，志在下也。雖不當位，有與也。
九五，劓刖，困于赤紱，乃徐有說，利用祭祀。劓，音見《睽》。刖，音月。說，音悅。劓刖者，傷於上下。上下既傷，則赤紱無所用，而反為困矣。九五當困之時，上為陰揜，下則乘剛，故有此象。然剛中而說體，故能遲久而有說也。占具象中，又利用祭祀，久當獲福。
《象》曰：「劓刖」，志未得也。「乃徐有說」，以中直也。「利用祭祀」，受福也。上六，困于葛藟，于臲卼，曰動悔有悔，征吉。藟，力軌反。臲，五結反。卼，五骨反。以陰柔處困極，故有困于葛藟，于臲卼，曰動悔之象。然物窮則變，故其占曰，若能有悔，則可以征而吉矣。
《象》曰：「困于葛藟」，未當也。「動悔有悔」，吉行也。䷯井巽下，坎上。井：改邑不改井，無喪無得，往來井井。汔至亦未繘井，羸其瓶，凶。喪，息浪反。汔，許訖反。繘音橘。羸，律裴反。井者，穴地出水之處。以巽木入乎坎水之下，而上出其水，故為井。改邑不改井，故無喪無得，而往者來者，皆井其井也。汔，幾也。繘綆也。羸，敗也。汲井幾至，未盡綆而敗其瓶，則凶也。其占為事仍舊無得喪，而又當敬勉，不可幾成而敗也。
《彖》曰：巽乎水而上水，井，井養而不窮也。上，時掌反。以卦象釋卦名義。
「改邑不改井」，乃以剛中也。「汔至亦未繘井」，未有功也。「羸其瓶」，是以凶也。以卦體釋卦辭。「無喪無得，往來井井」兩句，意與不改井同，故不復出。剛中，以二五而言。未有功而敗其瓶，所以凶也。
《象》曰：木上有水，井，君子以勞民勸相。上，如宇，又時掌反。勞，力報反。相，息亮反。木上有水，津潤上行，井之象也。勞民者，以君養民；勸相者，使民相養，皆取井養之意。
初六：井泥不食，舊井無禽。泥，乃計反。井以陽剛為泉，上出為功。初六，以陰居下，故為此象。蓋井不泉而泥，則人所不食，而禽鳥亦莫之顧也。
《象》曰：「井泥不食」，下也。「舊井無禽」，時舍也。舍，音捨。言為時所棄。
九二，井谷射鮒，甕敝漏。谷，余六反，音育。射，石亦反。鮒，音附。九二剛中，有泉之象。然上無正應，下比初六，功不上行，故其象如此。
《象》曰：「井谷射鮒」，無與也。
九三，井渫不食，為我心惻。可用汲，王明並受其福。渫，息列反。渫，不停污也。井渫不食，而使人心惻，可用汲矣。王明，則汲井以及物，而施者、受者，並受其福也。九三，以陽居陽，在下之上，而未為時用，故其象占如此。
《，象》曰：「井渫不食」，行惻也。求王明，受福也。行惻者，行道之人，皆以為惻也。
六四，井甃，無咎。甃，側救反。以六居四，雖得其正，然陰柔不泉，則但能脩治,而無及物之功，故其象為井甃，而占則無咎。占者能自脩治，則雖無及物之功，而亦可以無咎矣。
《象》曰：「井甃，無咎」，脩井也。
九五，井洌，寒泉食。洌，音列。洌，潔也。陽剛中正，功及於物，故為此象。占者有其德，則契其象也。
《象》曰：寒泉之食，中正也。
上六，井收勿幕，有孚元吉。收，詩救反，又如字。幕，音莫。收，汲取也。晁氏云：「收，鹿盧收繘者也。」亦通。幕，蔽覆也。有孚，謂其出有源而不窮也。井以上出為功，而坎口不掩，故上六雖非陽剛，而其象如此。然占者應之，必有孚乃元吉也。
《象》曰：元吉在上，大成也。䷰革離下，兌上。革：巳日乃孚，元亨，利貞，悔亡。革，變革也。兌澤在上，離火在下，火然則水幹，水決則火滅，中、少二女，合為一卦，而少上、中下，志不相得，故其卦為革也。變革之初，人未之信，故必巳日而後信。又，以其內有文明之德，而外有和說之氣，故其占為有所更革，皆大亨而得其正，所革皆當，而所革之悔亡也。一有不正，則所革不信不通，而反有悔矣。
《彖》曰：「革」，水火相息，二女同居，其志不相得，曰革。以卦象釋卦名義，大略與《睽》相似，然以相違而為睽，相息而為革也。息，滅息也，又為生息之義。滅息而後生息也。
「巳日乃孚」，革而信之。文明以說，大亨以正，革而當，其悔乃亡。說，音悅，當去聲。以卦德釋卦辭。
天地革而四時成，湯武革命，順乎天而應乎人。革之時大矣哉。極言而贊其大也。
《象》曰：澤中有火，革，君子以治曆明時。治，平聲。四時之變，革之大者。
初九，鞏用黃牛之革。鞏，九勇反。雖當革時，居初無應，未可有為，故為此象。鞏，固也。黃，中色。牛，順物。革，所以固物，亦取卦名而義不同也。其占為當堅確固守，而不可以有為。聖人之於變革，其謹如此。
《象》曰：鞏用黃牛，不可以有為也。
六二，已日乃革之，征吉，無咎。六二，柔順中正，而為文明之主，有應於上，於是可以革矣。然必已日然後革之，則征吉而無咎。戒占者猶未可遽變也。
《象》曰：巳日革之，行有嘉也。
九三，征凶，貞厲，革言三就，有孚。過剛不中，居離之極，躁動於革者也，故其佔有征凶貞厲之戒。然其時則當革，故至於革言三就，則亦有孚而可革也。
《象》曰：「革言三就」，又何之矣？言已審。
九四，悔亡，有孚，改命，吉。以陽居陰，故有悔。然卦已過中，水火之際，乃革之時，而剛柔不偏，又革之用也，是以悔亡。然又必有孚，然後革，乃可獲吉。明占者有其德而當其時，又必有信，乃悔亡而得吉也。《象》曰：改命之吉，信志也。}}
九五，大人虎變，未占有孚。虎，大人之象。變，謂希革而毛毨也。在大人則自新新民之極，順天應人之時也。九五，以陽剛中正為革之主，故有此象。占而得此，則有此應。然亦必自其未占之時，人已信其如此，乃足以當之耳。
《象》曰：「大人虎變」，其文炳也。
上六，君子豹變，小人革面，征凶，居貞吉。革道已成，君子如豹之變，小人亦革面以聽從矣。不可以征，而居正則吉。變革之事，非得已者，不可以過，而上六之才，亦不可以有行也。故占者如之。
《象》曰：「君子豹變」，其文蔚也。「小人革面」，順以從君也。蔚，紆胃反。
鼎巽下，離上。
鼎：元吉亨。鼎，烹飪之器。為卦下陰為足，二三四陽為腹，五陰為耳，上陽為鉉，有鼎之象。又以巽木入離火，而致烹飪，鼎之用也。故其卦為鼎。下巽，巽也，上離為目，而五為耳，又內巽順而外聰明之象。卦自《巽》來，陰進居五，而下應九二之陽，故其占曰元亨。吉，衍文也。
《彖》曰：「鼎」，象也。以木巽火，亨飪也。聖人亨以享上帝，而大亨以養聖賢。亨，普庚反。飪，入甚反。以卦體二象釋卦名義，因極其大而言之。享帝貴誠，用犢而巳。養賢則饔飧牢禮，當極其盛，故曰大亨。
巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。上，時掌反。以卦象、卦變、卦體釋卦辭。
《象》曰：木上有火，鼎，君子以正位凝命。鼎，重器也，故有正位凝命之意。凝，猶至道不凝之凝，《傳》所謂「協于上下，以承天休」者也。
初六，鼎顛趾，利出否，得妾以其子，無咎。出，尺遂反，又如字。否，音鄙。居鼎之下，鼎趾之象也，上應九四則顛矣。然當卦初，鼎未有實，而舊有否惡之積焉，因其顛而出之，則為利矣。得妾而因得其子，亦猶是也。此爻之象如此。而其占無咎，蓋因敗以為功，因賤以致貴也。
《象》曰：「鼎顛趾」，未悖也。「利出否」，以從貴也。鼎而顛趾，悖道也。而因可出否以從貴，則未為悖也。從貴，謂應四，亦為取新之意。
九二，鼎有實，我仇有疾，不我能即，吉。仇，音求。以剛居中，鼎有實之象也。我仇，謂初。陰陽相求而非正，則相陷於惡而為仇矣。二能以剛中自守，則初雖近，不能以就之，是以其象如此。而其占為如是，則吉也。
《象》曰：「鼎有實」，慎所之也。「我仇有疾」，終無尤也。有實而不慎其所往，則為仇所即而陷於惡矣。
九三，鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。行，下孟反。塞，悉則反。以陽居鼎腹之中，本有美實者也。然以過剛失中，越五應上，又居下之極，為變革之時，故為鼎耳方革，而不可舉移。雖承上卦文明之腴，有雉膏之美，而不得以為人之食。然以陽居陽，為得其正，苟能自守，則陰陽將和，而失其悔矣。占者如是，則初雖不利，而終得吉也。
《象》曰：「鼎耳革」，失其義也。
九四，鼎折足，覆公餗，其形渥，凶。折，之舌反。覆，方服反。餗，送六反。渥，乙角反。晁氏曰「形渥」，諸本作「刑剭」，謂重刑也。今從之。九四居上，任重者也，而下應初六之陰，則不勝其任矣。故其象如此，而其占凶也。
《象》曰：「覆公餗」，信如何也！言失信也。
六五，鼎黃耳、金鉉，利貞。鉉，玄典反。五於象為耳，而有中德，故云黃耳。金，堅剛之物。鉉，貫耳以舉鼎者也。五虛中以應九二之堅剛，故其象如此，而其占則利在貞固而巳。或曰，金鉉以上九而言，更詳之。
《象》曰：「鼎黃耳」，中以為實也。
上九，鼎玉鉉，大吉，無不利。上於象為鉉，而以陽居陰，剛而能溫。故有玉鉉之象，而其占為大吉，無不利。蓋有是德，則如其占也。
《象》曰：玉鉉在上，剛柔節也。
䷲震震下震上。震：亨。震來，虩虩笑言啞啞，震驚百里，不喪匕鬯。虩許逆反。啞，烏客反。喪，息浪反。匕，必以反。鬯，敕亮反。震，動也。一陽始生於二陰之下，震而動也。其象為雷，其屬為長子。震有亨道。震來，當震之來時也虩虩恐懼驚顧之貌。震驚百里，以雷言。匕，所以舉鼎實。鬯，以禾巨黍酒和鬱金，所以灌地降神者也。不喪匕鬯，以長子言也。此卦之占，為能恐懼則致福，而不失其所主之重。

「震驚百里」，驚遠而懼邇也。出，可以守宗廟社稷，以為祭主也。程子以為，「邇也」下脫「不喪匕鬯」四字，今從之。出，謂繼世而主祭也。或云「出」即「鬯」字之誤。
《象》曰：洊雷，震，君子以恐懼脩省。洊，在薦反。省，悉井反。
初九，震來虩虩，後笑言啞啞，吉。成震之主，處震之初，故其占如此。
《象》曰：「震來」虩虩，恐致福也。「笑言啞啞」，後有則也。
六二，震來，厲，億喪貝，躋于九陵，勿逐，七日得。躋，子西反。六二乘初九之剛，故當震之來而危厲也。「億」字未詳。又當喪其貨貝，而升於九陵之上。然柔順中正，足以自守，故不求而自獲也。此爻占具象中，但九陵、七日之象，則未詳耳。
《象》曰：「震來，厲」，乘剛也。
六三，震蘇蘇，震行無眚。蘇蘇，緩散自失之狀。以陰居陽，當震時而居不正，是以如此。占者若因懼而能行，以去其不正，則可以無眚矣。
《象》曰：「震蘇蘇」，位不當也。
九四，震遂泥。泥，乃計反。以剛處柔，不中不正，陷於二陰之間，不能自震也。遂者，無反之意。泥，滯溺也。
《象》曰，「震遂泥」，未光也。
六五，震往來，厲，億無喪，有事。喪，息浪反。以六居五，而處震時，無時而不危也。以其得中，故無所喪而能有事也。占者不失其中，則雖危無喪矣。
《象》曰：「震往來，厲」，危行也。其事在中，大無喪也。
上六，震索索，視矍矍，征凶。震不于其躬，于其鄰，無咎。婚媾有言。索，桑落反。矍，俱縛反。以陰柔處震極，故為索索，矍矍之象，以是而行，其凶必矣。然能及其震未及其身之時，恐懼脩省，則可以無咎，而亦不能免於婚媾之有言。戒占者當如是也。
《象》曰：「震索索」，中未得也。雖凶無咎，畏鄰戒也。中，謂中心。
䷳艮艮下艮上艮其背，不獲其身，行其庭，不見其人，無咎。艮，止也。一陽止於二陰之上，陽自下升，極上而止也。其象為山，取坤地而隆其上之狀，亦止於極而不進之意也。其占則必能止于背而不有其身，行其庭而不見其人，乃無咎也。蓋身，動物也，唯背為止。艮其背，則止於所當止也。止於所當止，則不隨身而動矣，是不有其身也。如是，則雖行於庭除有人之地，而亦不見其人矣。蓋艮其背而不獲其身者，止而止也，行其庭而不見其人者，行而止也。動靜各止其所，而皆主夫靜焉，所以得無咎也。
《彖》曰：艮止也。時止則止，時行則行，動靜不失其時，其道光明。此釋卦名。艮之義則止也。然行止各有其時，故時止而止，止也；時行而行，亦止也。艮體篤實，故又有光明之義。大畜於艮，亦以輝光言之。
「艮其止」，止其所也。上下敵應，不相與也，是以「不獲其身，行其庭，不見其人，無咎」也。此釋卦辭。易「背」為「止」，以明背即止也。背者，止之所也。以卦體言，內外之卦，陰陽敵應而不相與也。不相與，則內不見己，外不見人，而無咎矣。晁氏云：「『艮其止』，當依卦辭作『背』。」
《象》曰：兼山，艮，君子以思不出其位。
初六，艮其趾，無咎，利永貞。以陰柔居艮初，其隨，其心不快。{拯，之淩反。
六二居中得正，既止其腓矣。三為限，則腓所隨也，而過剛不中以止乎上。二雖中正，而體柔弱，不能往而拯之，是以其心不快也。此爻占在象中，下爻放此。
《象》曰：「不拯其隨」，未退聽也。三止乎上，亦不肯退而聽乎二也。
九三，艮其限，列其夤，厲熏心。夤，引真反。限，身上下之際，即腰胯也。夤，膂也。止于腓，則不進而已。九三，以過剛不中，當限之處，而艮其限，則不得屈伸，而上下判隔，如列其夤矣。危厲熏心，不安之甚也。
《象》曰：「艮其限」，危熏心也。
六四，艮其身，無咎。以陰居陰，時止而止，故為艮其身之象，而占得無咎矣。
《象》曰：「艮其身」，止諸躬也。
六五，艮其輔，言有序，悔亡。六五當輔之處，故其象如此，而其占悔亡也。悔，謂以陰居陽。
《象》曰：「艮其輔」，以中正也。「正」字羨文，葉韻可見。
上九，敦艮，吉。以陽剛居止之極，敦厚於止者也。
《象》曰：敦艮之吉，以厚終也。䷴漸艮下巽上。漸：女歸吉，利貞。漸，漸進也。為卦止於下，而巽於上，為不遽進之義，有女歸之象焉。又自二至五，位皆得正，故其占為女歸吉，而又戒以利貞也。
《彖》曰：漸之進也，女歸吉也。「之」字疑衍，或是「漸」字。
進得位，往有功也，進以正，可以正邦也。以卦變釋利貞之意。蓋此卦之變，自《渙》而來，九進居三，自《旅》而來，九進居五，皆為得位之正。
其位，剛得中也。以卦體言，謂九五。
止而巽，動不窮也。以卦德言，漸進之義。
《象》曰：山上有木，漸，君子以居賢德善俗。二者皆當以漸而進。疑「賢」字衍，或「善」下有脫字。
初六，鴻漸于干，小子厲，有言，無咎。鴻之行有序而進有漸。幹，水涯也。始進於下，未得所安，而上復無應，故其象如此。而其占則為小子厲，雖有言，而於義則無咎也。
《象》曰：小子之厲，義無咎也。
六二，鴻漸于磐，飲食衎衎，吉。衎，苦旦反。磐，大石也。漸遠於水，進於磐而益安矣。衎衎，和樂意。六二柔順中正，進以其漸，而上有九五之應，故其象如此，而占則吉也。
《象》曰：「飲食衎衎」，不素飽也。素飽，如《詩》言「素餐」。得之以道，則不為徒飽，而處之安矣。
九三，鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。復，房六反。鴻，水鳥，陸非所安也。九三過剛不中而無應，故其象如此。而其占夫征則不復，婦孕則不育，凶莫甚焉。然以其過剛也，故利禦寇。
《象》曰：「夫征不復」，雖群醜也。「婦孕不育」，失其道也。利用禦寇，順相保也。離，力智反。
六四，鴻漸于木，或得其桷，無咎。桷，音角。鴻不木棲。桷，平柯也。或得平柯，則可以安矣。六四乘剛而順巽，故其象如此。占者如之，則無咎也。
《象》曰：「或得其桷」，順以巽也。
九五，鴻漸于陵，婦三歲不孕，終莫之勝，吉。陵，高阜也。九五居尊，六二正應在下，而為三四所隔，然終不能奪其正也。故其象如此，而占者如是，則吉也。
《象》曰：「終莫之勝，吉」，得所願也。
上九，鴻漸于陸；其羽可用為儀，吉。胡氏、程氏皆云：「『陸』當作『逵』，謂雲路也。」今以韻讀之，良是。儀，羽旄旌纛之飾也。上九至高，出乎人位之外，而其羽毛可用以為儀飾。位雖極高，而不為無用之象，故其占為如是則吉也。
《象》曰：「其羽可用為儀，吉」，不可亂也。漸進愈高，而不為無用。其志卓然，豈可得而亂哉。
䷵歸妹}兌下震上。歸妹：征凶，無攸利。婦人謂嫁曰歸。妹，少女也。兌以少女而從震之長男，而其情又為以說而動，皆非正也，故卦為歸妹。而卦之諸爻，自二至五，皆不得正，三五又皆以柔乘剛，故其占征凶，而無所利也。
《彖》曰：「歸妹」，天地之大義也。天地不交，而萬物不興。歸妹，人之終始也。釋卦名義也。歸者，女之終，生育者，人之始。
說以動，所歸妹也。說，音悅。又以卦德言之。
「征凶」，位不當也。「無攸利」，柔乘剛也。又以卦體釋卦辭。男女之交，本皆正理，唯若此卦，則不得其正也。
《象》曰：澤上有雷，歸妹，君子以永終知敝。雷動澤隨，歸妹之象。君子觀其合之不正，知其終之有敝也。推之事物，莫不皆然。
初九，歸妹以娣，跛能履，征吉。娣，音弟。跛，波我反。初九，居下而無正應，故為娣象。然陽剛在女子為賢正之德，但為娣之賤，僅能承助其君而已，故又為跛能履之象，而其占則征吉也。
《象》曰：「歸妹以娣」，以恒也。「跛能履」，吉相承也。恒，謂有常久之德。
九二，眇能視，利幽人之貞。眇能視，承上爻而言。九二陽剛得中，女之賢也。上有正應，而反陰柔不正，乃女賢而配不良，不能大成內助之功，故為眇能視之象，而其占則利幽人之貞也。幽人，亦抱道守正而不偶者也。
《象》曰：「利幽人之貞」，未變常也。
六三，歸妹以須，反歸以娣。六三，陰柔而不中正，又為說之主。女之不正，人莫之取者也，故為未得所適，而反歸為娣之象。或曰：須，女之賤者。
《象》曰：「歸妹以須」，未當也。
九四，歸妹愆期，遲歸有時。九四，以陽居上體而無正應，賢女不輕從人，而愆期以待所歸之象，正與六三相反。
《象》曰：愆期之志，有待而行也。
六五，帝乙歸妹，其君之袂，不如其娣之袂良。月幾望，吉。袂，彌計反。六五，柔中居尊，下應九二，尚德而不貴飾，故為帝女下嫁而服不盛之象。然女德之盛，無以加此，故又為月幾望之象。而占者如之，則吉也。
《象》曰：「帝乙歸妹」，「不如其娣之袂良」也，其位在中，以貴行也。以其有中德之貴而行，故不尚飾。
上六，女承筐無實，士刲羊無血無攸利。刲，苦圭反。上六以陰柔居歸妹之終而無應，約婚而不終者也。故其象如此，而於占為無所利也。
《象》曰：上六「無實」，承虛筐也。
䷶豐離下震上。豐：亨，王假之，勿憂，宜日中。假，更白反。豐，大也。以明而動，盛大之勢也，故其占有亨道焉。然王者至此，盛極當衰，則又有憂道焉。聖人以為徒憂無益，但能守常，不至於過盛則可矣，故戒以勿憂，宜日中也。
《彖》曰：「豐」，大也。明以動，故豐。以卦德釋卦名義。
「王假之」，尚大也。「勿憂，宜日中」，"
宜照天下也。釋卦辭。
日中則昃，月盈則食。天地盈虛，與時消息，而況於人乎，況於鬼神乎？此又發明卦辭外意，言不可過中也。
《象》曰：雷電皆至，豐，君子以折獄致刑。折，之舌反。取其威照並行之象。
初九，遇其配主，雖旬無咎，往有尚。配主，謂四，旬，均也，謂皆陽也。當豐之時，明動相資，故初九之遇九四，雖皆陽剛，而其占如此也。
《象》曰：「雖旬無咎」，過旬災也。戒占者不可求勝其配，亦爻辭外意。
六二，豐其蔀，日中見斗，往得疑疾，有孚發若，吉。蔀，音部。六二居豐之時，為離之主，至明者也。而上應六五之柔暗，故為豐蔀見斗之象。蔀，障蔽也。大其障蔽，故中而昏也。往而從之，則昏暗之主，必反見疑，唯在積其誠意以感發之，則吉。戒占者宜如是也。虛中，有孚之象。《象》曰：「有孚發若」，信以發志也。
九三，豐其沛，日中見沬，折其右肱，無咎。沬、昧同，莫佩反。折，食列反。沛，一作「旆」，謂幡幔也，其蔽甚於蔀矣。沬，小星也。三處明極，而應上六，雖不可用，而非咎也。故其象占如此。
《象》曰：「豐其沛」，不可大事也。「折其右肱」，終不可用也。
九四，豐其蔀，日中見斗，遇其夷主，吉。《象》與六二同。夷，等夷也，謂初九也。其占為當豐而遇暗主，下就同德則吉也。
《象》曰：「豐其蔀」，位不當也。「日中見斗」，幽不明也。「遇其夷主」，吉行也。六五，來章，有慶譽，吉。質雖柔暗，若能來致天下之明，則有慶譽而吉矣。蓋因其柔暗而設此以開之。占者能如是，則如其占矣。
《象》曰：六五之吉，有慶也。上六，豐其屋，蔀其家，窺其戶，闃其無人，三歲不覿，凶。闃，苦具鳥反。以陰柔居豐極，處動終，明極而反暗者也。故為豐大其屋而反以自蔽之象。無人、不覿，亦言障蔽之深，其凶甚矣。
《象》曰：「豐其屋」，天際翔也。「闚其戶，闃其無人」，自藏也。藏，謂障蔽。䷷旅艮下，離上。旅：小亨，旅貞吉。旅，羇旅也。山止於下，火炎於上，為去其所止而不處之象，故為旅。以六五得中於外，而順乎上下之二陽，艮止而離麗於明，故其占可以小亨，而能守其旅之貞，則吉。旅非常居，若可苟者。然道無不在，故自有其正，不可須臾離也。
《彖》曰：「旅，小亨」，柔得中乎外而順乎剛，止而麗乎明，是以「小亨，旅貞吉」也。以卦體、卦德釋卦辭。
旅之時義大矣哉。旅之時為難處。
《象》曰：山上有火，旅，君子以明慎用刑，而不留獄。慎刑如山，不留如火。
初六，旅瑣瑣，斯其所取災。當旅之時，以陰柔居下位，故其象占如此。
《象》曰：「旅瑣瑣」，志窮災也。
六二，旅即次，懷其資，得童僕貞。即次則安，懷資則裕，得其童僕之貞信，則無欺而有賴，旅之最吉者也。二有柔順中正之德，故其象占如此。
《象》曰：「得童僕貞」，終無尤也。
九三，旅焚其次，喪其童僕，貞厲。喪，息浪反。《象》同。過剛不中，居下之上，故其象占如此。喪其童僕，則不止於失其心矣。故貞字連下句為義。
《象》曰：「旅焚其次」，亦以傷矣。以旅與下，其義喪也。以旅之時，而與下之道如此，義當喪也。
九四，旅于處，得其資斧，我心不快。以陽居陰，處上之下，用柔能下，故其象占如此。然非其正位，又上無剛陽之與，下唯陰柔之應，故其心有所不快也。
《象》曰：「旅于處」，未得位也。「得其資斧」，心未快也。
六五，射雉，一矢亡，終以譽命。射，石亦反。雉，文明之物，離之象也。六五柔順文明，又得中道，為離之主，故得此爻者，為射雉之象。雖不無亡矢之費，而所喪不多，終有譽命也。
《象》曰：「終以譽命」，上逮也。上逮，言其譽命聞於上也。
上九，鳥焚其巢，旅人先笑後號咷，喪牛于易，凶。喪、易，並去聲。上九過剛，處旅之上，離之極，驕而不順，凶之道也。故其象占如此。
《象》曰：以旅在上，其義焚也。「喪牛于易」，終莫之聞也。
䷸巽巽下，巽上。
巽：小亨，利有攸往，利見大人。巽，入也。一陰伏于二陽之下，其性能巽以入也，其象為風，亦取入義。陰為主，故其占為小亨；以陰從陽，故又利有所往。然必知所從，乃得其正，故又曰利見大人也。
《彖》曰：重巽以申命，釋卦義也。巽順而入，必究乎下，命令之象。重巽，故為申命也。
剛巽乎中正而志行，柔皆順乎剛，是以「小亨，利有攸往，利見大人」。以卦體釋卦辭。剛巽乎中正而志行，指九五。柔，謂初四。
《象》曰：隨風，巽，君子以申命行事。隨，相繼之義。
初六，進退，利武人之貞。初以陰居下，為巽之主，卑巽之過，故為進退不果之象。若以武人之貞處之，則有以濟其所不及，而得所宜矣。
《象》曰：「進退」，志疑也。「利武人之貞」，志治也。
九二，巽在床下，用史、巫紛若，吉，無咎。二以陽處陰而居下，有不安之意。然當巽之時，不厭其卑，而二又居中，不至已甚，故其占為能過於巽，而丁寧煩悉其辭，以自道達，則可以吉而無咎，亦竭誠意以祭祀之吉占也。
《象》曰：紛若之吉，得中也。
九三，頻巽，吝。過剛不中，居下之上，非能巽者，勉為屢失，吝之道也，故其象占如此。
《象》曰：頻巽之吝，志窮也。
六四，悔亡，田獲三品。陰柔無應，承乘皆剛，宜有悔也。而以陰居陰，處上之下，故得悔亡，而又為卜田之吉占也。三品者，一為乾豆，一為賓客，一以充庖。
《象》曰：田獲三品，有功也。
九五，貞吉，悔亡，無不利。無初有終。先庚三日，後庚三日，吉。先，西薦反。後，胡豆反。九五，剛健中正，而居巽體，故有悔，以有貞而吉也，故得亡其悔而无不利。有悔，是無初也，亡之，是有終也。庚，更也，事之變也。先庚三日，丁也，後庚三日，癸也。丁，所以丁甯於其變之前，癸，所以揆度於其變之後。有所變更而得此占者，如是則吉也。
《象》曰：九五之吉，位正中也。
上九，巽在床下，喪其資斧，貞凶。喪，息浪反。下同。巽在床下，過於巽者也。喪其資斧，失所以斷也。如是，則雖貞亦凶矣。居巽之極，失其陽剛之德，故其象占如此。
《象》曰：「巽在床下」，上窮也。「喪其資斧」，正乎凶也。正乎凶，言必凶。
䷹兌兌下，兌上。
兌：亨，利貞。兌，說也。一陰進乎二陽之上，喜之見乎外也。其象為澤，取其說萬物，又取坎水而塞其下流之象。卦體剛中而柔外，剛中故說而亨，柔外故利於貞。蓋說有亨道，而其妄說不可以不戒，故其占如此。又，柔外故為說亨，剛中故利於貞，亦一義也。
《彖》曰：「兌」，說也。說，音悅。下同。釋卦名義。
剛中而柔外，說以利貞，是以順乎天而應乎人。說以先民，民忘其勞；說以犯難，民忘其死。說之大，民勸矣哉。先，西薦反，又如字。難，乃旦反。以卦體釋卦辭，而極言之。
《象》曰：麗澤，兌，君子以朋友講習。兩澤相麗，互相滋益。朋友講習，其象如此。
初九，和兌，吉。以陽爻居說體，而處最下，又無系應，故其象占如此。
《象》曰：和兌之吉，行未疑也。居卦之初，其說也正，未有所疑也。
九二，孚兌，吉，悔亡。剛中為孚，居陰為悔。占者以孚而說，則吉而悔亡矣。
《象》曰：孚兌之吉，信志也。
六三，來兌，凶。陰柔不中正，為兌之主，上無所應，而反來就二陽以求說，凶之道也。
《象》曰：來兌之凶，位不當也。
九四，商兌未寧，介疾有喜。四上承九五之中正，而下比六三之柔邪，故不能決，而商度所說，未能有定。然質本陽剛，故能介然守正，而疾惡柔邪也。如此則有喜矣。象占如此，為戒深矣。
《象》曰：九四之喜，有慶也。
九五，孚于剝，有厲。剝，謂陰能剝陽者也。九五，陽剛中正，然當說之時，而居尊位，密近上六。上六陰柔，為說之主，處說之極，能妄說以剝陽者也。故其占但戒以信于上六，則有危也。
《象》曰：「孚于剝」，位正當也。 與《履》九五同。
上六，引兌。上六成說之主，以陰居說之極，引下二陽相與為說，而不能必其從也。故九五當戒，而此爻不言其吉凶。
《象》曰：上六「引兌」，未光也。
䷺渙坎下，巽上。
渙：亨，王假有廟，利涉大川，利貞。渙，呼亂反。假，庚白反。渙，散也。為卦下坎上巽，風行水上，離披解散之象，故為渙。其變則本自《漸》卦，九來居二而得中，六往居三得九之位，而上同於四，故其占可亨。又以祖考之精神既散，故王者當至於廟以聚之。又以巽木坎水，舟楫之象，故利涉大川。其曰「利貞」，則占者之深戒也。
《彖》曰：「渙，亨」，剛來而不窮，柔得位乎外而上同。上，如字，又，時掌反。以卦變釋卦辭。
「王假有廟」，王乃在中也。中，謂廟中。
「利涉大川」，乘木有功也。《象》曰：「風行水上，渙，先王以享于帝立廟。皆所以合其散。
初六，用拯，馬壯，吉。居卦之初，渙之始也。始渙而拯之，為力既易，又有壯馬，其吉可知。初六非有濟渙之才，但能順乎九二，故其象占如此。
《象》曰：初六之吉，順也。
九二，渙奔其機，悔亡。機，音几。九而居二，宜有悔也，然當渙之時，來而不窮，能亡其悔者也，故其象占如此。蓋九奔而二機也。
《象》曰：「渙奔其機」，得願也。
六三，渙其躬，無悔。陰柔而不中正，有私於己之象也。然居得陽位，志在濟時，能散其私以得無悔，故其占如此。大率此上四爻，皆因渙以濟渙者也。
《象》曰：「渙其躬」，志在外也。
六四，渙其群，元吉，渙有丘，匪夷所思。居陰得正，上承九五，當濟渙之任者也。下無應與，為能散其朋黨之象。占者如是，則大善而吉。又言能散其小群以成大群，使所散者聚而若丘，則非常人思慮之所及也。
《象》曰：「渙其群，元吉」，光大也。
九五，渙汗其大號，渙王居，無咎。陽剛中正，以居尊位。當渙之時，能散其號令，與其居積，則可以濟渙而無咎矣，故其象占如此。九五巽體，有號令之象。汗，謂如汗之出而不反也。渙王居，如陸贄所謂「散小儲而成大儲」之意。
《象》曰：王居無咎，正位也。
上九，渙其血去，逖出，無咎。去，起呂反。上九以陽居渙極，能出乎渙，故其象占如此。血，謂傷害。逖，當作「惕」，與《小畜》六四同。言渙其血則去，渙其惕則出也。
《象》曰：「渙其血」，遠害也。遠，袁萬反。
䷻節兌下，坎上。
節：亨，苦節，不可貞。節，有限而止也。為卦下兌上坎，澤上有水，其容有限，故為節。節固自有亨道矣。又其體陰陽各半而二五皆陽，故其占得亨。然至於太甚，則苦矣，故又戒以不可守以為貞也。
《彖》曰：「節，亨」，剛柔分而剛得中。以卦體釋卦辭。
「苦節，不可貞」，其道窮也。又以理言。
說以行險，當位以節，中正以通。說，音悅。又以卦德、卦體言之。當位、中正，指五。又坎為通。
天地節而四時成，節以制度，不傷財，不害民。極言節道。
《象》曰：澤上有水，節，君子以制數度，議德行。行，下孟反。
初九，不出戶庭，無咎。戶庭，戶外之庭也。陽剛得正，居節之初，未可以行，能節而止者也。故其象占如此。
《象》曰：「不出戶庭」，知通塞也。塞，悉則反。
九二，不出門庭，凶。門庭，門內之庭也。九二當可行之時，而失剛不正，上無應與，知節而不知通，故其象占如此。
《象》曰：「不出門庭，凶」，失時極也。
六三，不節若，則嗟諾若無咎。陰柔而不中正，以當節時，非能節者，故其象占如此。
《象》曰：不節之嗟，又誰咎也？此「無咎」與諸爻異，言無所歸咎也。
六四，安節，亨。柔順得正，上承九五，自然有節者也。故其象占如此。
《象》曰：安節之亨，承上道也。
九五，甘節，吉。往有尚。所謂當位以節，中正以通者也。故其象占如此。
《象》曰：甘節之吉，居位中也。
上六，苦節，貞凶，悔亡。居節之極，故為苦節。既處過極，故雖得正，而不免於凶。然禮奢寧儉，故雖有悔，而終得亡之也。
《象》曰：「苦節，貞凶」，其道窮也
䷼中孚兌下，巽上。
中孚：豚魚吉，利涉大川，利貞。孚，信也。為卦二陰在內，四陽在外，而二五之陽，皆得其中。以一卦言之為中虛，以二體言之為中實，皆孚信之象也。又，下說以應上，上巽以順下，亦為孚義。豚魚，無知之物。又，木在澤上，外實內虛，皆舟楫之象。至信可感豚魚，涉險難，而不可以失其貞。故占者能致豚魚之應，則吉而利涉大川，又必利於貞也。
《彖》曰：「中孚」，柔在內而剛得中，說而巽，孚乃化邦也。說，音悅。以卦體、卦德釋卦名義。
「豚魚吉」，信及豚魚也。「利涉大川」，乘木舟虛也。以卦象言。
中孚以利貞。乃應乎天也。信而正，則應乎天矣。
《象》曰：澤上有風，中孚，君子以議獄緩死。風感水受，中孚之象。議獄緩死，中孚之意。
初九，虞吉，有他，不燕。他，湯何反。當中孚之初，上應六四，能度其可信而信之，則吉。復有他焉，則失其所以度之之正，而不得其所安矣。戒占者之辭也。
《象》曰：初九「虞吉」，志未變也。
九二，鳴鶴在陰，其子和之。我有好爵，吾與爾靡之。和，胡臥反。靡，亡池反。九二，中孚之實，而九五亦以中孚之實應之，故有鶴鳴子和、我爵爾靡之象。鶴在陰，謂九居二。好爵，謂得中。靡與縻同。言懿德人之所好，故好爵雖我之所獨有，而彼亦係戀之也。
《象》曰：「其子和之」，中心願也。
六三，得敵，或鼓或罷，或泣或歌。敵，謂上九，信之窮者。六三，陰柔不中正，以居說極，而與之為應，故不能自主。而其象如此。
《象》曰：「或鼓或罷」，位不當也。
六四，月幾望，馬匹亡，無咎。幾，音機。望，無方反。六四，居陰得正，位近於君，為月幾望之象。馬匹，謂初與己為匹，四乃絕之，而上以信於五，故為馬匹亡之象。占者如是，則無咎也。
《象》曰：「馬匹亡」，絕類上也。上，上聲。
九五，有孚攣如，無咎。攣，力圓反。九五，剛健中正，中孚之實，而居尊位，為孚之主者也。下應九二，與之同德，故其象占如此。
《象》曰：「有孚攣如」，位正當也。
上九，翰音登于天，貞凶。居信之極，而不知變，雖得其貞，亦凶道也。故其象占如此。雞曰翰音，乃巽之象。居巽之極，為登于天。雞非登天之物，而欲登天，信非所信，而不知變，亦猶是也。
《象》曰：「翰音登于天」，何可長也！}}
䷽小過艮下，震上。
小過：亨，利貞。可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。小，謂陰也。為卦四陰在外，二陽在內，陰多於陽，小者過也。既過於陽，可以亨矣。然必利於守貞，則又不可以不戒也。卦之二五，皆以柔而得中，故可小事。三四皆以剛失位而不中，故不可大事。卦體內實外虛，如鳥之飛，其聲下而不上，故能致飛鳥遺音之應，則宜下而大吉，亦不可大事之類也。
《彖》曰：「小過」，小者過而亨也。以卦體釋卦名義與其辭。
過以利貞，與時行也。柔得中，是以小事吉也。以二五言。
剛失位而不中，是以不可大事也。以三四言。
有飛鳥之象焉，「飛鳥遺之音，不宜上，宜下，大吉」，上逆而下順也。以卦體言。
《象》曰：山上有雷，小過。君子以行過乎恭，喪過乎哀，用過乎儉。山上有雷，其聲小過。三者之過，皆小者之過。可過於小，而不可過於大，可以小過，而不可甚過。《彖》所謂可小事而宜下者也。
初六飛鳥以凶。初六陰柔，上應九四，又居過時，上而不下者也。「飛鳥遺音，不宜上，宜下」，故其象占如此。郭璞《洞林》：「占得此者，或致羽蟲之孽。」
《象》曰：「飛鳥以凶」，不可如何也。
六二，過其祖，遇其妣，不及其君，遇其臣，無咎。六二柔順中正，進則過三四而遇六五，是過陽而反遇陰也。如此，則不及六五而自得其分，是不及君而適遇其臣也。皆過而不過，守正得中之意，無咎之道也。故其象占如此。
《象》曰：「不及其君」，臣不可過也。所以不及君而還遇臣者，以臣不可過故也。
九三，弗過防之，從或戕之，凶。戕，在良反。小過之時，事每當過，然後得中。九三以剛居正，眾陰所欲害者也。而自恃其剛，不肯過為之備，故其象占如此。若占者能過防之，則可以免矣。
《象》曰：「從或戕之」，凶如何也！九四，無咎，弗過遇之，往厲必戒，勿用永貞。當過之時，以剛處柔，過乎恭矣，無咎之道也。弗過遇之，言弗過於剛而適合其宜也。往則過矣，故有厲而當戒；陽性堅剛，故又戒以勿用永貞。言當隨時之宜，不可固守也。或曰：弗過遇之，若以六二爻例，則當如此說，若依九三爻例，則過遇當如過防之義。未詳孰是，當闕以俟知者。
《象》曰：「弗過遇之」，位不當也。「往厲必戒」，終不可長也。爻義未明，此亦當闕。
六五，密雲不雨，自我西郊，公弋取彼在穴。弋，餘職反。以陰居尊，又當陰過之時，不能有為，而弋取六二以為助，故有此象。在穴，陰物也。兩陰相得，其不能濟大事可知。
《象》曰：「密雲不雨」，已上也。已上，太高也。
上六，弗遇過之，飛鳥離之，凶，是謂災眚。眚，生領反。六以陰居動體之上，處陰過之極，過之已高而甚遠者也，故其象占如此。或曰：遇過，恐亦只當作「過遇」，義同九四。未知是否。
《象》曰：「弗遇過之」，已亢也。䷾既濟離下坎上。既濟：亨小，利貞。初吉，終亂。既濟，事之既成也。為卦水火相交，各得其用，六爻之位，各得其正，故為既濟。亨小，當為小亨，大抵此卦及六爻占辭，皆有警戒之意，時當然也。
《彖》曰：「既濟，亨」，小者亨也。「濟」下疑脫「小」字。
「利貞」，剛柔正而位當也。以卦體言。
「初吉」，柔得中也。指六二。
終止則亂，其道窮也。
《象》曰：水在火上，既濟，君子以思患而預防之。
初九，曳其輪，濡其尾，無咎。曳，以制反。濡，音如。輪在下，尾在後，初之象也。曳輪則車不前，濡尾則狐不濟。既濟之初，謹戒如是，無咎之道。占者如是，則無咎矣。
《象》曰：「曳其輪」，義無咎也。
六二，婦喪其茀，勿逐，七日得。喪，息浪反。茀，力佛反。二以文明中正之德，上應九五剛陽中正之君，宜得行其志。而九五居既濟之時，不能下賢以行其道，故二有婦喪其茀之象。茀，婦車之蔽，言失其所以行也。然中正之道，不可終廢，時過則行矣。故又有勿逐而自得之戒。
《象》曰：「七日得」，以中道也。
九三，高宗伐鬼方，三年克之，小人勿用。既濟之時，以剛居剛，高宗伐鬼方之象也。三年克之，言其久而後克，戒占者不可輕動之意。小人勿用，占法與《師》上六同。《象》曰：三年克之，憊也。憊，蒲拜反。六四，繻有衣袽，終日戒。繻，而朱反。袽，女居反。既濟之時，以柔居柔，能預備而戒懼者也，故其象如此。程子曰：「糸需，當作濡。衣袽，所以塞舟之罅漏。」
《象》曰：「終日戒」，有所疑也。
九五，東鄰殺牛，不如西鄰之禴祭，實受其福。東陽西陰，言九五居尊，而時已過，不如六二之在下，而始得時也。又當文王與紂之事，故其象占如此。《彖辭》初吉終亂，亦此意也。
《象》曰：「東鄰殺牛」，不如西鄰之時也。「實受其福」，吉大來也。上六，濡其首，厲。既濟之極，險體之上，而以陰柔處之，為狐涉水而濡其首之象。占者不戒，危之道也。
《象》曰：「濡其首，厲」，何可久也！䷿未濟坎下，離上。未濟：亨。小狐汔濟，濡其尾，無攸利。汔，許訖反。未濟，事未成之時也。水火不交，不相為用，卦之六爻，皆失其位，故為未濟。汔，幾也。幾濟而濡尾，猶未濟也。占者如此，何所利哉？
《彖》曰：「未濟，亨」，柔得中也。指六五言。
「小狐汔濟」，未出中也。「濡其尾，無攸利」，不續終也。雖不當位，剛柔應也。
《象》曰：火在水上，未濟，君子以慎辨物居方。水火異物，各居其所，故君子觀象而審辨之。
初六，濡其尾，吝。以陰居下，當未濟之初，未能自進，故其象占如此。
《象》曰：「濡其尾」，亦不知極也。「極」字未詳，考上下韻亦不葉，或恐是「敬」字，今且闕之。
九二，曳其輪，貞吉。以九二應六五，而居柔得中，為能自止而不進，得為下之正也。故其象占如此。
《象》曰：九二「貞吉」，中以行正也。九居二，本非正，以中故得正也。
六三，未濟，征凶，利涉大川。陰柔不中正，居未濟之時，以征則凶，然以柔乘剛，將出乎坎，有利涉之象，故其占如此。蓋行者可以水浮，而不可以陸走也。或疑「利」字上當有「不」字。
《象》曰：「未濟，征凶」，位不當也。
九四，貞吉，悔亡。震用伐鬼方，三年有賞于大國。以九居四，不正而有悔也。能勉而貞，則悔亡矣。然以不貞之資，欲勉而貞，非極其陽剛用力之久不能也。故為伐鬼方，三年而受賞之象。
《象》曰：「貞吉，悔亡」，志行也。
六五，貞吉，無悔。君子之光，有孚，吉。以六居五，亦非正也。然文明之主，居中應剛，虛心以求下之助，故得貞而吉，且無悔。又有光輝之盛，信實而不妄，吉而又吉也。
《象》曰：「君子之光」，其暉吉也。暉者，光之散也。
上九，有孚于飲酒，無咎。濡其首，有孚失是。以剛明居未濟之極，時將可以有為，而自信自養以俟命，無咎之道也。若縱而不反，如狐之涉水而濡其首，則過於自信，而失其義矣。
《象》曰：飲酒濡首，亦不知節也。

《繫辭上傳》
傳去聲，後同。
繫辭本謂文王周公所作之辭，繫于卦爻之下者，即今經文。此篇乃孔子所述《繫辭》之「傳」也，以其通論一經之大體凡例，故無經可附，而自分上下云。
天尊地𤰞，乾坤定矣，卑高以陳，貴賤位矣，動靜有常，剛柔斷矣，方以類聚，物以群分，吉凶生矣，在天成象，在地成形，變化見矣。斷，丁亂反。見，賢遍反。天地者，陰陽形氣之實體。乾坤者，《易》中純陰、純陽之卦名也。卑高者，天地萬物上下之位。貴賤者，《易》中卦爻上下之位也。動者，陽之常。靜者，陰之常。剛柔者，《易》中卦爻陰陽之稱也。方，謂事情所向，言事物善惡，各以類分。而吉凶者，《易》中卦爻占決之辭也。象者，日月星辰之屬。形者，山川動植之屬。變化者，《易》中蓍策卦爻，陰變為陽，陽化為陰者也。此言聖人作《易》，因陰陽之實體，為卦爻之法象。莊周所謂「《易》以道陰陽」，此之謂也。
是故剛柔相摩，八卦相盪。蕩，徒浪反。此言《易》卦之變化也。六十四卦之初，剛柔兩畫而已。兩相摩而為四，四相摩而為八，八相盪而為六十四。鼓之以雷霆，潤之以風雨。日月運行，一寒一暑。此變化之成象者。乾道成男，坤道成女。此變化之成形者。此兩節，又明《易》之見於實體者，與上文相發明也。乾知大始，坤作成物。知，猶主也。乾主始物，而坤作成之，承上文男女而言乾坤之理。蓋凡物之屬乎陰陽者，莫不如此。大抵陽先陰後，陽施陰受。陽之輕清未形，而陰之重濁有跡也。乾以易知，坤以簡能。易，以豉反。乾健而動，即其所知，便能始物而無所難，故為以易而知大始。坤順而靜，凡其所能，皆從乎陽而不自作，故為以簡而能成物。易則易知，簡則易從。易知則有親，易從則有功。有親則可久，有功則可大。可久則賢人之德，可大則賢人之業。人之所為，如乾之易，則其心明白而人易知，如坤之簡，則其事要約而人易從。易知則與之同心者多，故有親。易從則與之協力者眾，故有功。有親則一於內，故可久。有功則兼於外，故可大。德，謂得於己者。業，謂成於事者。上言乾、坤之德不同，此言人法乾、坤之道。至此則可以為賢矣。易簡，而天下之理得矣，天下之理得，而成位乎其中矣。成位，謂成人之位。其中，謂天地之中。至此則體道之極功，聖人之能事，可以與天地參矣。
右第一章。此章以造化之實，明作經之理。又言乾、坤之理，分見於天、地，而人兼體之也。
聖人設卦，觀象繫辭焉，而明吉凶，象者，物之似也。此言聖人作《易》，觀卦爻之象而系以辭也。剛柔相推，而生變化。言卦爻陰、陽迭相推盪，而陰或變陽，陽或化陰，聖人所以觀象而繫辭，眾人所以因蓍而求卦者也。是故吉凶者，失得之象也，悔吝者，憂虞之象也，吉凶、悔吝者，《易》之辭也。得失、憂虞者，事之變也。得則吉，失則凶。憂虞雖未至凶，然已足以致悔而取羞矣。蓋吉凶相對，而悔吝居其中間。悔自凶而趨吉，吝自吉而向凶也。故聖人觀卦爻之中，或有此象，則繫之以此辭也。變化者，進退之象也，剛柔者，晝夜之象也。六爻之動，三極之道也。柔變而趨於剛者，退極而進也。剛化而趨於柔者，進極而退也。既變而剛，則晝而陽矣。既化而柔，則夜而陰矣。六爻：初二為地，三四為人，五上為天。動，即變化也。極，至也。三極，天地人之至理。三才，各一太極也。此明剛柔相推以生變化，而變化之極，復為剛柔。流行於一卦六爻之間，而占者得因所值，以斷吉凶也。是故君子所居而安者，《易》之序也，所樂而玩者，爻之辭也。樂，音洛。《易》之序，謂卦爻所著事理當然之次第。玩者，觀之詳。是故君子居則觀其象而玩其辭，動則觀其變而玩其占，是以「自天祐之，吉無不利」。《象辭》變已見上。凡單言變者，化在其中。占，謂其所值吉凶之決也。
右第二章。此章言聖人作《易》，君子學《易》之事。
彖者，言乎象者也，爻者，言乎變者也，彖，謂卦辭，文王所作者。爻，謂爻辭，周公所作者。象，指全體而言。變，指一節而言。吉凶者，言乎其失得也，悔吝者，言乎其小疵也。無咎者，善補過也。此卦爻辭之通例。是故列貴賤者存乎位，齊小大者存乎卦，辯吉凶者存乎辭，位，謂六爻之位。齊，猶定也。小，謂陰。大，謂陽。憂悔吝者存乎介，震無咎者存乎悔。上「悔」，乎罪反。下「悔」，呼對反。介，謂辯別之端，蓋善惡已動而未形之時也。於此憂之，則不至於悔吝矣。震，動也。知悔則有以動其補過之心，而可以無咎矣。是故卦有小大，辭有險易。辭也者，各指其所之。易，以豉反。〇小險大易，各隨所向。
右第三章。此章釋卦爻辭之通例。
《易》與天地准，故能彌綸天地之道。《易》書卦爻，具有天地之道，與之齊準。彌，如彌縫之彌，有終竟聯合之意。綸，有選擇條理之意。仰以觀於天文，俯以察於地理，是故知幽明之故。原始反終，故知死生之說。精氣為物，游魂為變，是故知鬼神之情狀。此窮理之事。以者，聖人以《易》之書也。易者，陰陽而已。幽明、死生、鬼神，皆陰陽之變，天地之道也。天文，則有晝夜上下。地理，則有南北高深。原者，推之於前。反者，要之於後。陰精陽氣，聚而成物，神之伸也。魂游魄降，散而為變，鬼之歸也。與天地相似，故不違。知周乎萬物，而道濟天下，故不過。旁行而不流，樂天知命，故不憂。安土敦乎仁，故能愛。知，音智。樂，音洛。「知命」之知，如字。〇此聖人盡性之事也。天地之道，知仁而已。知周萬物者，天也，道濟天下者，地也。知且仁，則知而不過矣。旁行者，行權之知也。不流者，守正之仁也。既樂天理，而又知天命，故能無憂，而其知益深。隨處皆安，而無一息之不仁，故能不忘其濟物之心，而仁益篤。蓋仁者，愛之理，愛者，仁之用。故其相為表裏如此。範圍天地之化而不過，曲成萬物而不遺，通乎晝夜之道而知，故神無方而《易》無體。此聖人至命之事也。範，如鑄金之有模範。圍，匡郭也。天地之化無窮，而聖人為之範圍，不使過於中道，所謂裁成者也。通，猶兼也。晝夜，即幽明、生死、鬼神之謂。如此，然後可見至神之妙，無有方所；《易》之變化，無有形體也。
右第四章。此章言《易》道之大，聖人用之如此。
一陰一陽之謂道。陰陽迭運者，氣也；其理則所謂道。繼之者善也，成之者性也。道具於陰而行乎陽。繼，言其發也。善，謂化育之功，陽之事也。成，言其具也。性，謂物之所受，言物生則有性，而各具是道也，陰之事也。周子、程子之書，言之備矣。仁者見之謂之仁，知者見之謂之知，百姓日用而不知，故君子之道鮮矣。知，音智。「不知」之知，如字。鮮，息淺反。〇仁陽知陰，各得是道之一隅，故隨其所見而目為全體也。日用不知，則莫不飲食，鮮能知味者，又其每下者也，然亦莫不有是道焉。或曰：上章以知屬乎天，仁屬乎地，與此不同，何也？曰：彼以清濁言，此以動靜言。}}顯諸仁，藏諸用，鼓萬物而不與聖人同憂。盛德大業，至矣哉。顯，自內而外也。仁，謂造化之功，德之發也。藏，自外而內也。用，謂機緘之妙，業之本也。程子曰：「天地無心而成化，聖人有心而無為。」富有之謂大業，日新之謂盛德。張子曰：「富有者，大而無外；日新者，久而無窮。」生生之謂易，陰生陽，陽生陰，其變無窮，理與書皆然也。成象之謂乾，效法之謂坤，效，呈也。法，謂造化之詳密而可見者。極數知來之謂占，通變之謂事，占，筮也，事之未定者，屬乎陽也。事，行事也，占之已決者，屬乎陰也。極數知來，所以通事之變。張忠定公言公事有陰陽，意蓋如此。陰陽不測之謂神。張子曰，兩在，故不測。
右第五章。此章言道之體用，不外乎陰陽。而其所以然者，則未嘗倚於陰陽也。
夫《易》，廣矣，大矣。以言乎遠則不禦，以言乎邇則靜而正，以言乎天地之間則備矣。夫，音扶。下同。〇不禦，言無盡。靜而正，言即物而理存。備，言无所不有。夫乾，其靜也專，其動也直，是以大生焉。夫坤，其靜也翕，其動也闢，是以廣生焉。翕，虛級反。辟，婢亦反。〇乾坤各有動靜，於其四德見之。靜體而動用，靜別而動交也。乾一而實，故以質言而曰大；坤二而虛，故以量言而曰廣。蓋天之形雖包於地之外，而其氣常行乎地之中也。《易》之所以廣大者以此。廣大配天地，變通配四時，陰陽之義配日月，易簡之善配至德。易，以豉反。〇《易》之廣大變通，與其所言陰陽之說，易簡之德，配之天道人事，則如此。
右第六章。
子曰：《易》，其至矣乎。夫《易》，聖人所以崇德而廣業也。知崇禮𤰞，崇效天，𤰞法地。知，音智。〇十翼皆夫子所作，不應自著「子曰」字，疑皆後人所加也。窮理則知崇如天而德崇，循理則禮𤰞如地而業廣。此其取類，又以清濁言也。天地設位，而《易》行乎其中矣。成性存存，道義之門。天地設位而變化行，猶知禮存性而道義出也。成性，本成之性也。存存，謂存而又存，不已之意也。
右第七章。
聖人有以見天下之𧷤，而擬諸其形容，象其物宜，是故謂之象。𧷤，雜亂也。象，卦之象，如《說卦》所列者。聖人有以見天下之動，而觀其會通，以行其典禮，繫辭焉以斷其吉凶，是故謂之爻。斷，丁玩反。〇會，謂理之所聚而不可遺處。通，謂理之可行而無所礙處。如庖丁解牛，會則其族，而通則其虛也。言天下之至𧷤而不可惡也，言天下之至動而不可亂也。惡，烏路反。〇惡，猶厭也。擬之而後言，議之而後動，擬議以成其變化。觀象玩辭，觀變玩占，而法行之，此下七爻則其例也。「鳴鶴在陰，其子和之。我有好爵，吾與爾靡之」。子曰：「君子居其室，出其言善，則千里之外應之，況其邇者乎？居其室，出其言不善，則千里之外違之，況其邇者乎？言出乎身，加乎民；行發乎邇，見乎遠。言行，君子之樞機。樞機之發，榮辱之主也。言行，君子之所以動天地也，可不慎乎。」和，胡臥反。靡，音縻。行，下孟反。見，賢遍反。釋《中孚》九二爻義。「同人，先號咷而後笑」。子曰：「君子之道，或出或處，或默或語。二人同心，其利斷金，同心之言，其臭如蘭。」斷，丁管反。臭，昌又反。釋《同人》九五爻義。言君子之道，初若不同，而後實無間。斷金、如蘭，言物莫能間，而其言有味也。
「初六，藉用白茅，無咎」。子曰：「苟錯諸地而可矣。藉之用茅，何咎之有？慎之至也。夫茅之為物薄，而用可重也。慎斯術也以往，其無所失矣。」藉，在夜反。錯，音措。夫，音扶。釋《大過》初六爻義。「勞謙，君子有終，吉」。子曰：「勞而不伐，有功而不德，厚之至也。語以其功下人者也。德言盛，禮言恭。謙也者，致恭以存其位者也。」釋《謙》九三爻義。德言盛，禮言恭，言德欲其盛，禮欲其恭也。「亢龍有悔」。子曰：「貴而無位，高而無民，賢人在下位而無輔，是以動而有悔也。」釋《乾》上九爻義。當屬《文言》，此蓋重出。「不出戶庭，無咎」。子曰：「亂之所生也，則言語以為階。君不密則失臣，臣不密則失身，幾事不密則害成。是以君子慎密而不出也。」幾，音機。〇釋《節》初九爻義。子曰：「作《易》者，其知盜乎？《易》曰：『負且乘，致寇至。』負也者，小人之事也，乘也者，君子之器也。小人而乘君子之器，盜思奪之矣。上慢下暴，盜思伐之矣。慢藏誨盜，冶容誨淫。《易》曰『負且乘，致寇至』，盜之招也。」藏，才浪反。〇釋《解》六三爻義。
右第八章。此章言卦、爻之用。
天一、地二；天三、地四；天五、地六；天七、地八；天九、地十。此簡本在第十章之首，程子曰宜在此，今從之。此言天地之數，陽奇陰偶，即所謂《河圖》者也。其位一、六居下，二、七居上，三、八居左，四、九居右，五、十居中。就此章而言之，則中五為衍母，次十為衍子，次一、二、三、四為四象之位，次六、七、八、九為四象之數。二老位於西北，二少位於東南，其數則各以其類交錯於外也。天數五，地數五，五位相得而各有合。天數二十有五，地數三十，凡天地之數五十有五。此所以成變化而行鬼神也。此簡本在「大衍」之後，今按宜在此。天數五者，一、三、五、七、九皆奇也，地數五者，二、四、六、八、十皆偶也。相得，謂一與二，三與四，五與六，七與八，九與十，各以奇偶為類而自相得。有合，謂一與六，二與七，三與八，四與九，五與十，皆兩相合。二十有五者，五奇之積也。三十者，五偶之積也。變化，謂一變生水，而六化成之；二化生火，而七變成之；三變生木，而八化成之；四化生金，而九變成之；五變生土，而十化成之。鬼神，謂凡奇偶生成之屈伸往來者。大衍之數五十，其用四十有九，分而為二，以象兩，掛一以象三，揲之以四以象四時，歸奇於扐以象閏，五歲再閏，故再扐而後掛。揲，時設反。奇，紀宜反。扐，郎得反。〇大衍之數五十，蓋以《河圖》中宮天五乘地十而得之，至用以筮，則又止用四十有九。蓋皆出於理勢之自然，而非人之知力所能損益也。兩，謂天地也。掛，懸其一於左手小指之間也。三，三才也。揲，間而數之也。奇，所揲四數之餘也。扐，勒於左手中三指之兩間也。閏，積月之餘日而成月者也。五歲之間，再積日而再成月，故五歲之中，凡有再閏，然後別起積分。如一掛之後，左右各一揲而一扐，故五者之中，凡有再扐，然後別起一掛也。《乾》之策，二百一十有六。《坤》之策，百四十有四，凡三百有六十。當期之日。期，音基。〇凡此策數生於四象，蓋《河圖》四面，太陽居一而連九，少陰居二而連八，少陽居三而連七，太陰居四而連六。揲蓍之法，則通計三變之餘，去其初掛之一。凡四為奇，凡八為偶，奇圓圍三，偶方圍四。三用其全，四用其半。積而數之，則為六、七、八、九，而第三變揲數策數，亦皆符會。蓋餘三奇則九，而其揲亦九，策亦四九三十六，是為居一之太陽。餘二奇一偶則八，而其揲亦八，策亦四八三十二，是為居二之少陰。二偶一奇則七，而其揲亦七，策亦四七二十八，是為居三之少陽。三偶則六，而其揲亦六，策亦四六二十四，是為居四之老陰。是其變化往來、進退離合之妙，皆出自然，非人之所能為也。少陰退而未極乎虛，少陽進而未極乎盈，故此獨以老陽、老陰計《乾》《坤》六爻之策數，餘可推而知也。期，周一歲也，凡三百六十五日四分日之一，此特舉成數而概言之耳。二篇之策，萬有一千五百二十，當萬物之數也。二篇，謂上、下經。凡陽爻百九十二，得六千九百一十二策；陰爻百九十二，得四千六百八策，合之得此數。是故四營而成易，十有八變而成卦。四營，謂分二掛一揲四歸奇也。易，變易也。謂一變也。三變成爻，十八變則成六爻也。八卦而小成。謂九變而成三畫，得內卦也。引而伸之，觸類而長之，天下之能事畢矣。長，丁丈反。〇謂已成六爻，而視其爻之變與不變以為動靜，則一卦可變而為六十四卦以定吉凶，凡四千九十六卦也。顯道神德行，是故可與酬酢，可與祐神矣。行，下孟反。〇道因辭顯，行以數神。酬酢，謂應對。祐神，謂助神化之功。子曰：「知變化之道者，其知神之所為乎？」變化之道，即上文數法是也，皆非人之所能為，故夫子歎之。而門人加「子曰」以別上文也。
右第九章。此章言天地大衍之數，揲蓍求卦之法，然亦略矣。意其詳具於大蔔筮人之官，而今不可考耳。其可推者，《啟蒙》備言之。
《易》有聖人之道四焉：以言者尚其辭，以動者尚其變，以制器者尚其象，以卜筮者尚其占。四者皆變化之道，神之所為者也。是以君子將有為也，將有行也，問焉而以言，其受命也如嚮，無有遠近幽深，遂知來物。非天下之至精，其孰能與於此！向，許兩反，古文響字。與，音預，下同。〇此尚辭、尚占之事，言人以蓍問《易》，求其卦爻之辭，而以之發言處事，則易受人之命而有以告之。如向之應聲，以決其未來之吉凶也。以言，與「以言者尚其辭」之「以言」義同。命，則將筮而告蓍之語。《冠禮》「筮日宰自右贊命」是也。
參伍以變，錯綜其數。通其變，遂成天地之文，極其數，遂定天下之象，非天下之至變，其孰能與於此？參，七南反。錯，七各反。綜，作弄反。此尚象之事，變則象之未定者也。參者，三數之也。伍者，五數之也。既參以變，又伍以變，一先一後，更相考覈，以審其多寡之實也。錯者，交而互之，一左一右之謂也。綜者，總而挈之，一低一昂之謂也。此亦皆謂揲蓍求卦之事。蓋通三揲兩手之策，以成陰、陽、老、少之畫，究七、八、九、六之數，以定卦爻動靜之象也。參伍、錯綜，皆古語，而參伍尤難曉。按《荀子》云：「窺敵制變，欲伍以參。」《韓非》曰：「省同異之言，以知朋黨之分；偶參伍之驗，以責陳言之實。」又曰：「參之以比物，伍之以合參。」《史記》曰：「必參而伍之。」又曰：「參伍不失。」《漢書》曰：「參伍其賈，以類相準。」此足以相發明矣。《易》，無思也，無為也，寂然不動，感而遂通天下之故。非天下之至神，其孰能與於此？此四者，易之體所以立，而用所以行者也。易，指蓍卦。無思、無為，言其無心也。寂然者，感之體。感通者，寂之用。人心之妙，其動靜亦如此。夫《易》，聖人之所以極深而研幾也。幾，音機。下同。研，猶審也。幾，微也。所以極深者，至精也。所以研幾者，至變也。唯深也，故能通天下之志；唯幾也，故能成天下之務；唯神也，故不疾而速，不行而至。所以通志而成務者，神之所為也。子曰「《易》有聖人之道四焉」者，此之謂也。
右第十章。此章承上章之意，言《易》之用，有此四者。
子曰：「夫《易》，何為者也？夫《易》，開物成務，冒天下之道，如斯而已者也。」是故聖人以通天下之志，以定天下之業，以斷天下之疑。夫，音扶。冒，莫報反。斷，丁亂反。〇開物成務，謂使人卜筮以知吉凶，而成事業。冒天下之道，謂卦爻既設，而天下之道皆在其中。是故蓍之德圓而神，卦之德方以知，六爻之義易以貢。聖人以此洗心，退藏於密，吉凶與民同患。神以知來，知以藏往，其孰能與於此哉？古之聰明睿知，神武而不殺者夫。「方以知」之知，音智。下「知以」、「睿知」，並同。易，音亦。與，音預。夫，音扶。〇圓神，謂變化無方。方知，謂事有定理。易以貢，謂變易以告人。聖人體具三者之德，而無一塵之累。無事，則其心寂然，人莫能窺；有事，則神知之用，隨感而應，所謂無蔔筮而知吉凶也。神武不殺，得其理而不假其物之謂。是以明於天之道，而察於民之故，是興神物以前民用。聖人以此齋戒，以神明其德夫。夫，音扶。神物，謂蓍龜。湛然純一之謂齋，肅然警惕之謂戒。明天道，故知神物之可興；察民故，故知其用之不可不有以開其先。是以作為蔔筮以教人，而於此焉齋戒以考其占，使其心神明不測，如鬼神之能知來也。是故闔戶謂之坤，闢戶謂之乾，一闔一闢謂之變，往來不窮謂之通，見乃謂之象，形乃謂之器，制而用之謂之法，利用出入，民咸用之謂之神。見，賢遍反。闔闢，動靜之機也。先言坤者，由靜而動也。乾、坤、變、通者，化育之功也。見象、形器者，生物之序也。法者，聖人修道之所為。而神者，百姓自然之日用也。是故《易》有大極，是生兩儀。兩儀生四象，四象生八卦。大，音泰。一每生二，自然之理也。《易》者，陰陽之變。大極者，其理也。兩儀者，始為一畫以分陰陽。四象者，次為二畫以分大少。八卦者，次為三畫而三才之象始備。此數言者，實聖人作《易》自然之次第，有不假絲毫智力而成者。畫卦揲蓍，其序皆然。詳見序例、《啟蒙》。八卦定吉凶，吉凶生大業。有吉有凶，是生大業。是故法象，莫大乎天地，變通，莫大乎四時，縣象著明，莫大乎日月，崇高，莫大乎富貴，備物致用，立成器以為天下利，莫大乎聖人，探賾索隱，鉤深致遠，以定天下之吉凶，成天下之亹亹者，莫大乎蓍龜。縣，音玄。探，吐南反。索，色白反。亹，亡偉反。富貴，謂有天下、履帝位。「立」下疑有闕文。亹亹，猶勉勉也。疑則怠，決故勉。是故天生神物，聖人則之，天地變化，聖人效之，天垂象，見吉凶，聖人象之，河出《圖》，洛出《書》，聖人則之。見，賢遍反。此四者，聖人作《易》之所由也。《河圖》、《洛書》，詳見《啟蒙》。《易》有四象，所以示也；《繫辭》焉，所以告也；定之以吉凶，所以斷也。斷，丁亂反。四象，謂陰、陽、老、少。示，謂示人以所值之卦爻。
右第十一章。此章專言卜筮。
《易》曰：「自天祐之，吉，無不利。」子曰：「祐者，助也。天之所助者，順也；人之所助者，信也。履信思乎順，又以尚賢也。是以『自天祐之，吉，無不利』也。」釋《大有》上九爻義。然在此無所屬，或恐是錯簡，宜在第八章之末。子曰：「書不盡言，言不盡意。」然則聖人之意，其不可見乎！子曰：「聖人立象以盡意，設卦以盡情偽，繫辭焉以盡其言，變而通之以盡利，鼓之舞之以盡神。」言之所傳者淺，象之所示者深，觀奇偶二畫，包含變化，無有窮盡，則可見矣。變通、鼓舞，以事而言。兩「子曰」字，疑衍其一。蓋「子曰」字，皆後人所加，故有此誤。如近世《通書》，乃周子所自作，亦為後人每章加以「周子曰」字，其設問答處，正如此也乾坤，其《易》之縕邪？乾坤成列，而《易》立乎其中矣，乾坤毀，則無以見《易》。《易》不可見，則乾坤或幾乎息矣！縕，與蘊同。邪，於遮反。幾，音機。縕，所包蓄者，猶衣之著也。《易》之所有，陰陽而已。凡陽皆乾，凡陰皆坤，畫卦定位，則二者成列，而《易》之體立矣。乾坤毀，謂卦畫不立；乾坤息，謂變化不行。是故形而上者謂之道，形而下者謂之器，化而裁之謂之變，推而行之謂之通，舉而措之天下之民，謂之事業。卦爻陰陽，皆形而下者，其理則道也。因其自然之化而裁制之，變之義也。「變通」二字，上章以天言，此章以人言。是故夫象，聖人有以見天下之賾，而擬諸其形容，象其物宜，是故謂之象。聖人有以見天下之動，而觀其會通以行其典禮，繫辭焉以斷其吉凶，是故謂之爻。重出，以起下文。極天下之賾者存乎卦，鼓天下之動者存乎辭，卦，即象也；辭，即爻也。化而裁之存乎變，推而行之存乎通，神而明之存乎其人，默而成之，不言而信，存乎德行。行，下孟反。〇卦爻所以變通者在人人之所以能神而明之者在德
右第十二章
《繫辭下傳》
八卦成列，象在其中矣，因而重之，爻在其中矣，重，直龍反。〇成列，謂《乾》一，《兌》二，《離》三，《震》四，《巽》五，《坎》六，《艮》七，《坤》八之類。象，謂卦之形體也。因而重之，謂各因一卦而以八卦次第加之，為六十四也。爻，六爻也。既重而後卦有六爻也。剛柔相推，變在其中矣，繫辭焉而命之，動在其中矣。剛柔相推，而卦爻之變，往來交錯，無不可見，聖人因其如此，而皆繫之辭以命其吉凶，則占者所值當動之爻象，亦不出乎此矣。吉凶悔吝者，生乎動者也，吉、凶、悔、吝，皆辭之所命也。然必因卦爻之動而後見。剛柔者，立本者也，變通者，趣時者也。趣，七樹反。一剛一柔，各有定位，自此而彼，變以從時。吉凶者，貞勝者也，貞，正也，常也，物以其所正為常者也。天下之事，非吉則凶，非凶則吉，常相勝而不已也。天地之道，貞觀者也，日月之道，貞明者也，天下之動，貞夫一者也。觀，官換反。夫，音扶。觀，示也。天下之動，其變無窮，然順理則吉，逆理則凶，則其所正而常者，亦一理而已矣。夫乾，確然示人易矣，夫坤，隤然示人簡矣。確，苦角反。易，音異。隤，音頹。確然，健貌。隤然，順貌，所謂「貞觀」者也。爻也者，效此者也，象也者，像此者也。此謂上文乾、坤所示之理，爻之奇偶，卦之消息，所以效而象之。爻象動乎內，吉凶見乎外，功業見乎變，聖人之情見乎辭。內，謂蓍卦之中。外，謂蓍卦之外。變，即動乎內之變。辭，即見乎外之辭。天地之大德曰生，聖人之大寶曰位。何以守位？曰仁。何以聚人？曰財。理財正辭，禁民為非，曰義。「曰人」之人，今本作「仁」。呂氏從古，蓋所謂「非眾罔與守邦」。
右第一章。此章言卦爻吉凶，造化功業。
古者包犧氏之王天下也，仰則觀象於天，俯則觀法於地，觀鳥獸之文，與地之宜，近取諸身，遠取諸物，於是始作八卦，以通神明之德，以類萬物之情。包，蒲交反。王，于況反。王昭素曰：「『與地』之間，諸本多有『天』字。」俯仰遠近，所取不一，然不過以驗陰陽消息兩端而已。神明之德，如健順動止之性，萬物之情，如雷風山澤之象。作結繩而為罔罟，以佃以漁，蓋取諸《離》。罔，與網同。罟，音古。佃，音田。兩目相承，而物麗焉。包犧氏沒，神農氏作。斲木為耜，揉木為耒，耒耨之利，以教天下，蓋取諸《益》。斲，涉角反。耜，音似。耒，力對反。耨，奴豆反。二體皆木，上入下動，天下之益，莫大於此。日中為市，致天下之民，聚天下之貨，交易而退，各得其所，蓋取諸《噬嗑》。日中為市，上明而下動，又借噬為市，嗑為合也。神農氏沒，黃帝、堯、舜氏作。通其變，使民不倦，神而化之，使民宜之。《易》：窮則變，變則通，通則久。是以「自天祐之，吉無不利」。黃帝、堯、舜垂衣裳而天下治，蓋取諸《乾》、《坤》。《乾》、《坤》變化而無為。刳木為舟，剡木為楫，舟楫之利，以濟不通，致遠以利天下，蓋取諸《渙》。刳，口姑反。剡，以冉反。木在水上也。「致遠以利天下」，疑衍。服牛乘馬，引重致遠，以利天下，蓋取諸《隨》。下動，上說。重門擊柝，以待暴客，蓋取諸《豫》。重，直龍反。柝，他各反。預備之意。斷木為杵，掘地為臼，臼杵之利，萬民以濟，蓋取諸《小過》。斷，丁緩反。杵，昌呂反。掘，其月反。下止，上動。弦木為弧，剡木為矢，弧矢之利，以威天下，蓋取諸《睽》。睽，乖然後威以服之。上古穴居而野處，後世聖人易之以宮室，上棟下宇，以待風雨，蓋取諸《大壯》。處，上聲。壯固之意。古之葬者，厚衣之以薪，葬之中野，不封不樹，喪期無數，後世聖人易之以棺槨，蓋取諸《大過》。衣，去聲。送死大事，而過於厚。上古結繩而治，後世聖人易之以書契，百官以治，萬民以察，蓋取諸《夬》。明決之意。
右第二章。此章言聖人制器尚象之事。
是故《易》者，象也。象也者，像也。《易》卦之形，理之似也。彖者，材也。彖言一卦之材。爻也者，效天下之動者也。效，放也。是故吉凶生而悔吝著也。悔吝本微，因此而著。
右第三章。
陽卦多陰，陰卦多陽。《震》、《坎》、《艮》為陽卦，皆一陽二陰；《巽》、《離》、《兌》為陰卦，皆一陰二陽。其故何也？陽卦奇，陰卦耦。奇，紀宜反。〇凡陽卦皆五畫，凡陰卦皆四畫。其德行何也？陽一君而二民，君子之道也。陰二君而一民，小人之道也。行，下孟反。君，謂陽。民，謂陰。
右第四章。
《易》曰：「憧憧往來，朋從爾思。」子曰：「天下何思何慮？天下同歸而殊塗，一致而百慮。天下何思何慮？此引《咸》九四爻辭而釋之。言理本無二，而殊塗百慮，莫非自然，何以思慮為哉？必思而從，則所從者亦狹矣。日往則月來，月往則日來，日月相推而明生焉。寒往則暑來，暑往則寒來，寒暑相推而歲成焉。往者屈也，來者信也，屈信相感而利生焉。信，音申。言往來屈信，皆感應自然之常理，加憧憧焉，則入於私矣，所以必思而後有從也。尺蠖之屈，以求信也。龍蛇之蟄，以存身也。精義之神，以致用也。利用安身，以崇德也。蠖，紆縛反。蟄，真立反。〇因言屈信往來之理，而又推以言學，亦有自然之機也。精研其義，至於入神，屈之至也。然乃所以為出而致用之本，利其施用，無適不安，信之極也。然乃所以為入而崇德之資，內外交相養，互相發也。過此以往，未之或知也。窮神知化，德之盛也。」下學之事，盡力於精義利用，而交養互發之機，自不能已。自是以上，則亦無所用其力矣。至於窮神知化，乃德盛仁熟而自致耳。然不知者，往而屈也；自致者，來而信也，是亦感應自然之理而已。張子曰：「氣有陰陽。推行有漸為化，合一不測為神。」此上四節，皆以釋《咸》九四爻義。《易》曰：「困于石，據于蒺藜，入于其宮，不見其妻，凶。」子曰：「非所困而困焉，名必辱，非所據而據焉，身必危。既辱且危，死期將至，妻其可得見邪？」釋《困》六三爻義。《易》曰：「公用射隼于高墉之上，𫉬之，无不利。」子曰：「隼者，禽也。弓矢者，器也。射之者，人也。君子藏器於身，待時而動，何不利之有？動而不括，是以出而有獲，語成器而動者也。」射，石亦反。隼，恤允反。括，古活反。〇括，結礙也。此釋《解》上六爻義。子曰：「小人不恥不仁，不畏不義，不見利不勸，不威不懲。小懲而大誡，此小人之福也。《易》曰：『屨校滅趾，无咎。』此之謂也。」校，音教。〇此釋《噬嗑》初九爻義。「善不積不足以成名，惡不積不足以滅身。小人以小善為無益而弗為也，以小惡為無傷而弗去也，故惡積而不可掩，罪大而不可解。《易》曰：『何校滅耳，凶。』」何，河可反。去，羌呂反。此釋《噬嗑》上九爻義。子曰：「危者，安其位者也。亡者，保其存者也。亂者，有其治者也。是故君子安而不忘危，存而不忘亡，治而不忘亂。是以身安而國家可保也。《易》曰：『其亡其亡，繫于苞桑。』」此釋《否》九五爻義。子曰：「德薄而位尊，知小而謀大，力小而任重，鮮不及矣。《易》曰：『鼎折足，覆公餗，其形渥，凶。』言不勝其任也。」知，音智。鮮，仙善反。折，之設反。餗，音速。渥，烏角反。勝，音升。此釋《鼎》九四爻義。子曰：「知幾其神乎？君子上交不諂，下交不瀆，其知幾乎？幾者，動之微，吉之先見者也。君子見幾而作，不俟終日。《易》曰：『介于石，不終日，貞吉。』介如石焉，寧用終日？斷可識矣。君子知微知彰，知柔知剛，萬夫之望。」幾，音機。「先見」之見，音現。斷，丁玩反。望，無方反。此釋《豫》六二爻義。《漢書》「吉之」之間，有「凶」字。子曰：「顏氏之子，其殆庶幾乎？有不善，未嘗不知，知之，未嘗復行也。《易》曰：『不遠復，無只悔，元吉。』」幾，音機。「復行」之複，芳服反。只，音其。殆，危也。庶幾，近意，言近道也。此釋《復》初九爻義。「天地絪縕，萬物化醇。男女構精，萬物化生。《易》曰：『三人行，則損一人。一人行，則得其友。』言致一也。」絪，音因。縕，紆云反。絪縕，〇交密之狀。醇，謂厚而凝也，言氣化者也。化生，形化者也。此釋《損》六三爻義。子曰：「君子安其身而後動，易其心而後語，定其交而後求。君子修此三者，故全也。危以動，則民不與也。懼以語，則民不應也。無交而求，則民不與也。莫之與，則傷之者至矣。《易》曰：『莫益之，或擊之，立心勿恒，凶。』」易其」之易，去聲。〇此釋《益》，上九爻義。
右第五章。
子曰：「乾坤，其《易》之門邪？」乾，陽物也，坤，陰物也。陰陽合德，而剛柔有體，以體天地之撰，以通神明之德。邪，於遮反。撰，仕免反。諸卦剛柔之體，皆以乾、坤合德而成，故曰「乾坤，《易》之門」。撰，猶事也。其稱名也，雜而不越，於稽其類，其衰世之意邪？萬物雖多，無不出於陰陽之變。故卦爻之義，雖雜出而不差繆，然非上古淳質之時思慮所及也。故以為衰世之意，蓋指文王與紂之時也。夫《易》，彰往而察來，而微顯闡幽，開而當名辨物，正言斷辭則備矣。夫，音扶。當，去聲。斷，丁玩反。而微顯，恐當作「微顯而」。「開而」之而，亦疑有誤。其稱名也小，其取類也大。其旨遠，其辭文，其言曲而中，其事肆而隱。因貳以濟民行，以明失得之報。中，丁仲反。行，下孟反。肆，陳也。貳，疑也。
右第六章。此章多闕文疑字，不可盡通。後皆放此。
《易》之興也，其於中古乎？作《易》者，其有憂患乎？夏、商之末，《易》道中微；文王拘於羑里而繫《彖辭》，《易》道復興。是故《履》，德之基也。《謙》，德之柄也。《復》，德之本也。《恒》，德之固也。《損》，德之脩也。《益》，德之裕也。《困》，德之辨也。《井》，德之地也。《巽》，德之制也。履，禮也。上天下澤，定分不易，必謹乎此，然後其德有以為基而立也。謙者，自卑而尊人，又為禮者之所當執持而不可失者也。九卦皆反身脩德以處憂患之事也，而有序焉。基，所以立。柄，所以持。復者，必不外而善端存。恒者，守不變而常且久。懲忿窒慾以修身，遷善改過以長善，困以自驗其力，井以不變其所，然後能巽順於理，以制事變也。《履》，和而至。《謙》，尊而光。《復》，小而辨於物。《恒》，雜而不厭。《損》，先難而後易。《益》，長裕而不設。《困》，窮而通。《井》，居其所而遷。《巽》，稱而隱。易，以豉反。長，丁丈反。稱，尺證反。此如書之九德，禮非強世，然事皆至極。《謙》以自卑而尊且光，《復》陽微而不亂於群陰，《恒》處雜而常德不厭，《損》欲先難，習熟則易，《益》但充長而不造作，《困》身困而道亨，《井》不動而及物，《巽》稱物之宜，而潛隱不露。《履》以和行，《謙》以制禮，《復》以自知，《恒》以一德，《損》以遠害，《益》以興利，《困》以寡怨，《井》以辨義，《巽》以行權。「和行」之行，下孟反。遠，袁萬反。寡怨，謂少所怨尤。辨義，謂安而能慮。
右第七章。此章三陳九卦，以明處憂患之道。
《易》之為書也，不可遠，為道也，屢遷。變動不居，周流六虛，上下無常，剛柔相易。不可為典要，唯變所適。遠，袁萬反。上，上聲。下，去聲。〇遠，猶忘也。周流六虛，謂陰陽流行於卦之六位。其出入以度，外內使知懼。此句未詳，疑有脫誤。又明於憂患與故，無有師保，如臨父母。雖無師保，而常若父母臨之，戒懼之至。初率其辭，而揆其方，既有典常。苟非其人，道不虛行。揆，葵癸反。〇方，道也。始由辭以度其理，則見其有典常矣。然神而明之，則存乎其人也。
右第八章
易之為書也，原始要終，以為質也。六爻相雜，唯其時物也。要，一遙反。下同。〇質，謂卦體。卦必舉其始終而後成體，爻則唯其時物而已。其初難知，其上易知，本末也，初辭擬之，卒成之終。易，去聲。此言初、上二爻。若夫雜物撰德，辨是與非，則非其中爻不備。夫，音扶。〇此謂卦中四爻。噫，亦要存亡吉凶，則居可知矣。知者觀其《彖辭》，則思過半矣。「知者」之知，音智。〇《彖》，統論一卦六爻之體。二與四，同功而異位，其善不同。二多譽，四多俱，近也。柔之為道，不利遠者。其要無咎，其用柔中也。要，如字，又一遙反。下章同。〇此以下論中爻。同功，謂皆陰位。異位，謂遠近不同。四近君，故多懼。柔不利遠，而二多譽者，以其柔中也。三與五，同功而異位。三多凶，五多功，貴賤之等也。其柔危，其剛勝邪。勝，音升。〇三五同陽位，而貴賤不同。然以柔居之則危，唯剛則能勝之。
右第九章。
易之為書也，廣大悉備。有天道焉，有人道焉，有地道焉。兼三才而兩之，故六。六者，非它也，三才之道也。三畫已具三才，重之故六，而以上二爻為天，中二爻為人，下二爻為地。道有變動，故曰爻。爻有等，故曰物。物相雜，故曰文。文不當，故吉凶生焉。當，去聲。道有變動，謂卦之一體。等，謂遠近貴賤之差。相雜，謂剛柔之位相同。不當，謂爻不當位。
右第十章。
易之興也，其當殷之末世，周之盛德邪？當文王與紂之事邪？是故其辭危。危者使平，易者使傾。其道甚大，百物不廢。懼以終始，其要無咎。此之謂《易》之道也。邪，于遮反。「易者」之易，去聲。要，平聲。危懼故得平安，慢易則必傾覆，《易》之道也。
右第十一章。
夫乾，天下之至健也，德行恒易以知險。夫坤，天下之至順也，德行恒簡以知阻。夫，音扶。行、易，並去聲。阻，莊呂反。至健則所行無難，故易。至順則所行不煩，故簡，然其於事，皆有以知其難，而不敢易以處之也。是以其有憂患，則健者如自高臨下而知其險，順者如自下趨上而知其阻。蓋雖易而能知險，則不陷於險矣。既簡而又知阻，則不困於阻矣。所以能危能懼，而無易者之傾也。能說諸心，能研諸侯之慮，定天下之吉凶，成天下之亹亹者。說，音悅。「侯之」二字衍。說諸心者，心與理會，乾之事也。研諸慮者，理因慮審，坤之事也。說諸心，故有以定吉凶。研諸慮，故有以成亹亹。是故變化云為，吉事有祥，象事知器，占事知來。變化云為，故象事可以知器。吉事有祥，故占事可以知來。天地設位，聖人成能，人謀鬼謀，百姓與能。與，音預。天地設位，而聖人作《易》以成其功。於是人謀鬼謀，雖百姓之愚，皆得以與其能。八卦以象告，爻彖以情言，剛柔雜居而吉凶可見矣。象，謂卦畫。爻彖，謂卦爻辭。變動以利言，吉凶以情遷。是故愛惡相攻而吉凶生，遠近相取而悔吝生，情偽相感而利害生。凡《易》之情，近而不相得，則凶，或害之，悔且吝。惡，烏路反。不相得，謂相惡也。凶害悔吝，皆由此生。將叛者其辭慙，中心疑者其辭枝，吉人之辭寡，躁人之辭多，誣善之人其辭遊，失其守者其辭屈。卦爻之辭，亦猶是也。　　右第十二章。
