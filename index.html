《說卦傳》
昔者，聖人之作《易》也，幽贊於神明而生蓍，幽贊神明，猶言贊化育。《龜筴傳》曰：「天下和平，王道得，而蓍莖長丈，其叢生滿百莖。」參天兩地而𠋣數，參，七南反。天圓地方，圓者一而圍三，三各一奇，故參天而為三。方者一而圍四，四合二偶，故兩地而為二。數皆𠋣此而起，故揲蓍三變之末，其餘三奇則三三而九，三耦則三二而六，兩二一三則為七，兩三一二則為八。觀變於陰陽而立卦，發揮於剛柔而生爻，和順于道德而理於義，窮理盡性以至於命。和順，從容無所乖逆，統言之也。理，謂隨事得其條理，析言之也。窮天下之理，盡人物之性，而合於天道，此聖人作《易》之極功也。
右第一章。
昔者，聖人之作《易》也，將以順性命之理。是以立天之道，曰陰與陽，立地之道，曰柔與剛，立人之道，曰仁與義。兼三才而兩之，故《易》六畫而成卦，分陰分陽，迭用柔剛，故《易》六位而成章。兼三才而兩之，總言六畫。又細分之，則陰陽之位，間雜而成文章也。
右第二章。
天地定位，山澤通氣，雷風相薄，水火不相射，八卦相錯。薄，音博。〇邵子曰：「此伏羲八卦之位。《乾》南，《坤》北，《離》東，《坎》西，《兌》居東南，《震》居東北，《巽》居西南，《艮》居西北。於是八卦相交而成六十四卦，所謂先天之學也。」數往者順，知來者逆，是故《易》逆數也。數，並上聲。〇起《震》而厯《離》、《兌》，以至於《乾》，數已生之卦也；自《巽》而厯《坎》、《艮》，以至於《坤》，推未生之卦也。《易》之生卦，則以《乾》、《兌》、《離》、《震》、《巽》、《坎》、《艮》、《坤》為次，故皆逆數也。
右第三章。
雷以動之，風以散之。雨以潤之，日以烜之。艮以止之，兌以說之。乾以君之，坤以藏之。烜，與晅同。說，音悅。此卦位相對，與上章同。
右第四章。
帝出乎震，齊乎巽，相見乎離，致役乎坤，說言乎兌，戰乎乾，勞乎坎，成言乎艮。說，音悅。下同。〇帝者，天之主宰。邵子曰：「此卦位乃文王所定，所謂後天之學也。」萬物出乎震，震，東方也。齊乎巽，巽，東南也。齊也者，言萬物之潔齊也。離也者，明也，萬物皆相見，南方之卦也。聖人南面而聽天下，嚮明而治，蓋取諸此也。坤也者，地也，萬物皆致養焉，故曰致役乎坤。兌，正秋也，萬物之所說也，故曰說言乎兌。戰乎乾，乾，西北之卦也，言陰陽相薄也。坎者，水也，正北方之卦也，勞卦也，萬物之所歸也，故曰勞乎坎。艮，東北之卦也，萬物之所成終而所成始也，故曰成言乎艮。向，讀作向。說，音悅。下同。薄，音博。〇上言帝，此言萬物之隨帝以出入也。
右第五章。此章所推卦位之說，多未詳者。
神也者，妙萬物而為言者也。動萬物者，莫疾乎雷；橈萬物者，莫疾乎風；燥萬物者，莫熯乎火；說萬物者，莫說乎澤；潤萬物者，莫潤乎水；終萬物、始萬物者，莫盛乎艮。故水火相逮，雷風不相悖，山澤通氣，然後能變化，既成萬物也。橈，乃飽反。熯，呼但反。悖，必內反。〇此去《乾》《坤》而專言六子，以見神之所為，然其位序亦用上章之說，未詳其義。
右第六章。
乾，健也。坤，順也。震，動也。巽，入也。坎，陷也離，麗也。艮，止也。兌，說也。說，音悅。〇此言八卦之性情
右第七章。
乾為馬，坤為牛，震為龍，巽為雞，坎為豕，離為雉，艮為狗，兑為羊。遠取諸物如此。
右第八章。
乾為首，坤為腹，震為足，巽為股，坎為耳，離為目，艮為手，兑為口。近取諸身如此。
右第九章。
乾，天也，故稱乎父。坤，地也，故稱乎母。震一索而得男，故謂之長男。巽一索而得女，故謂之長女。坎再索而得男，故謂之中男。離再索而得女，故謂之中女。艮三索而得男，故謂之少男。兌三索而得女，故謂之少女。索，色白反。長，之丈反。少，詩照反。下章同。〇索，求也，謂揲蓍以求爻也。男女，指卦中一陰一陽之爻而言。
右第十章。
乾為天，為圜，為君，為父，為玉，為金，為寒，為冰，為大赤，為良馬，為老馬，為瘠馬，為駁馬，為木果。圜，音圓。駁，邦角反。〇荀九家此下有「為龍，為直，為衣，為言」。坤為地，為母，為布，為釜，為吝嗇，為均，為子母牛，為大輿，為文，為眾，為柄。其於地也為黑。釜，房甫反。嗇，音色。〇荀九家有「為牝，為迷，為方，為囊，為裳，為黃，為帛，為漿」。震為雷，為龍，為玄黃，為旉，為大塗，為長子，為決躁，為蒼筤竹，為萑葦。其於馬也，為善鳴，為馵足，為作足，為的顙；其於稼也，為反生；其究為健，為蕃鮮。旉，音孚。筤，音郎。萑，音丸。馵，主樹反。蕃，音煩。〇荀九家有「為玉，為鵠，為鼓」。
巽為木，為風，為長女，為繩直，為工，為白，為長，為高，為進退，為不果，為臭，其於人也，為寡髮，為廣顙，為多白眼，為近利市三倍，其究為躁卦。下「為長」之長，如字。〇荀九家有「為楊，為鸛」。
坎為水，為溝瀆，為隱伏，為矯車柔，為弓輪。其於人也，為加憂，為心病，為耳痛，為血卦，為赤；其於馬也，為美脊，為亟心，為下首，為薄蹄，為曳；其於輿也，為多眚，為通，為月，為盜；其於木也，為堅多心。車柔，如九反。亟，紀力反。曳，以制反。〇荀九家有「為宮，為律，為可，為棟，為叢棘，為狐，為蒺藜，為桎梏」。
離為火，為日，為電，為中女，為甲胄，為戈兵。其於人也，為大腹，為乾卦，為鱉，為蟹，為蠃，為蚌，為龜；其於木也，為科上槁。乾，音干。蟹，戶買反。蠃，力禾反。蚌，步項反。〇荀九家，有「為牝牛」。
艮為山，為徑路，為小石，為門闕，為果蓏，為閽寺，為指，為狗，為鼠，為黔喙之屬。其於木也，為堅多節。蓏，力果反。黔，其堅反。喙，況廢反；又音咒。〇荀九家有「為鼻，為虎，為狐」。
兑為澤，為少女，為巫，為口舌，為毀折，為附決。其於地也，為剛鹵，為妾，為羊。折，之列反。鹵，力杜反。〇荀九家有「為常，為輔頰」。
右第十一章。此章廣八卦之象，其間多不可曉者，求之於經，亦不盡合也。
《序卦傳》
《序卦傳·上篇》
有天地，然後萬物生焉。盈天地之間者，唯萬物，故受之以《屯》。屯者，盈也，屯者，物之始生也。物生必蒙，故受之以《蒙》。蒙者，蒙也，物之稺也。物稺不可不養也，故受之以《需》。需者，飲食之道也。飲食必有訟，故受之以《訟》。訟必有眾起，故受之以《師》。師者，眾也。眾必有所比，故受之以《比》。比者，比也。比必有所畜，故受之以《小畜》。物畜然後有禮，故受之以《履》。履而泰，然後安，故受之以《泰》。晁氏曰：「鄭本無『而泰』二字。」泰者，通也。物不可以終通，故受之以《否》。物不可以終否，故受之以《同人》。與人同者，物必歸焉，故受之以《大有》。有大者不可以盈，故受之以《謙》。有大而能謙，必豫，故受之以《豫》。豫必有隨，故受之以《隨》。以喜隨人者，必有事，故受之以《蠱》。蠱者，事也。有事而後可大，故受之以《臨》。臨者，大也。物大然後可觀，故受之以《觀》。可觀而後有所合，故受之以《噬嗑》。嗑者，合也。物不可以苟合而已，故受之以《賁》。賁者，飾也。致飾然後亨則盡矣，故受之以《剝》。剝者，剝也。物不可以終盡，剝窮上反下，故受之以《復》。復則不妄矣，故受之以《无妄》。有无妄然後可畜，故受之以《大畜》。物畜然後可養，故受之以《頤》。頤者，養也。不養則不可動，故受之以《大過》。物不可以終過，故受之以《坎》。坎者，陷也。陷必有所麗，故受之以《離》。離者，麗也。
右上篇
《序卦傳·下篇》
有天地，然後有萬物；有萬物，然後有男女；有男女，然後有夫婦；有夫婦，然後有父子；有父子，然後有君臣；有君臣，然後有上下；有上下，然後禮義有所錯。夫婦之道，不可以不久也，故受之以《恒》。恒者，久也。物不可以久居其所，故受之以《遁》。遁者，退也。物不可以終遁，故受之以《大壯》。物不可以終壯，故受之以《晉》。晉者，進也。進必有所傷，故受之以《明夷》。夷者，傷也。傷於外者，必反其家，故受之以《家人》。家道窮必乖，故受之以《睽》。睽者，乖也。乖必有難，故受之以《蹇》。蹇者，難也。物不可以終難，故受之以《解》。解者，緩也。緩必有所失，故受之以《損》。損而不已必益，故受之以《益》。益而不已必決，故受之以《夬》。夬者，決也。決必有所遇，故受之以《姤》。姤者，遇也。物相遇而後聚，故受之以《萃》。萃者，聚也。聚而上者謂之升，故受之以《升》。升而不已必困，故受之以《困》。困乎上者必反下，故受之以《井》。井道不可不革，故受之以《革》。革物者莫若鼎，故受之以《鼎》。主器者莫若長子，故受之以《震》。震者，動也。物不可以終動，止之，故受之以《艮》。艮者，止也。物不可以終止，故受之以《漸》。漸者，進也。進必有所歸，故受之以《歸妹》。得其所歸者必大，故受之以《豐》。豐者，大也。窮大者必失其居，故受之以《旅》。旅而無所容，故受之以《巽》。巽者，入也。入而後說之，故受之以《兌》。兌者，說也。說而後散之，故受之以《渙》。渙者，離也。物不可以終離，故受之以《節》。節而信之，故受之以《中孚》。有其信者必行之，故受之以《小過》。有過物者必濟，故受之以《既濟》。物不可窮也，故受之以《未濟》終焉。　　右下篇
《雜卦傳》
《乾》剛《坤》柔，《比》樂《師》憂，樂，音洛。《臨》、《觀》之義，或與或求。以我臨物曰與，物來觀我曰求。或曰：二卦互有與求之義。《屯》見而不失其居，《蒙》雜而著。見，賢遍反。著，陟慮反。〇屯，震遇坎；震動故見，坎險不行也。蒙，坎遇艮；坎幽昧，艮光明也。或曰：《屯》以初言，《蒙》以二言。《震》，起也，《艮》，止也。《損》、《益》，盛衰之始也。
《大畜》，時也，《无妄》，災也。止健者時有適然，无妄而災自外至。《萃》聚而《升》不來也，《謙》輕而《豫》怠也。
《噬嗑》，食也，《賁》，无色也。白受采。《兑》見而《巽》伏也。見，賢遍反。〇《兑》陰外見，《巽》陰內伏。《隨》，无故也，《蠱》，則飭也。飭，與敕同。〇隨前无故，蠱後當飭。《剝》，爛也，《復》，反也。
《晉》，晝也，《明夷》，誅也。誅，傷也。《井》通而《困》相遇也。剛柔相遇，而剛見掩也。《咸》，速也，《恒》，久也。《咸》，速。《恒》，久。《渙》，離也，《節》，止也。《解》，緩也，《蹇》，難也。《睽》，外也，《家人》，內也。《否》、《泰》，反其類也。難，乃旦反。《大壯》則止，《遁》則退也。止，謂不進。《大有》，眾也，《同人》，親也。《革》，去故也，《鼎》，取新也。《小過》，過也，《中孚》，信也。《豐》，多故也，親寡，《旅》也。去，起呂反。〇既明且動，其故多矣。《離》上而《坎》下也。上，時掌反。下，遐嫁反。〇火炎上，水潤下。《小畜》，寡也，《履》，不處也。處，上聲。〇不處，行進之義。《需》，不進也，《訟》，不親也。《大過》，顛也，《姤》，遇也，柔遇剛也。《漸》，女歸待男行也，《頤》，養正也。《既濟》，定也，《歸妹》，女之終也。《未濟》，男之窮也，《夬》，決也，剛決柔也。君子道長，小人道憂也。長，丁丈反。〇自《大過》以下，卦不反對，或疑其錯簡。今以韻協之，又似非誤，未詳何義。）

<text name="增刪卜易" author="野鶴老人">
（增刪卜易序
野鶴曰：卜易之道﹐乃伏羲、文王、周公、孔子四大聖人之心法也。得其精者可以參天量地；粗知其理亦可趨吉避凶。凡學卜者可以深求﹐亦可淺學。淺學者只要先學裝卦﹐知道動變及卦之六沖﹐卦變六沖看熟用神章中占何人占何事以何爻為用神；再看何為旬空、月破及春夏秋冬四時衰旺、生克沖刑卽知決斷禍福。
假令占功名者得旺官持世﹐或動爻作官星生合世爻﹐求名如拾芥耳。倘遇子孫持世﹐或子孫動于卦中﹐不拘占入場占升遷悉如水中撈月。占求財若得財星持世﹐或日月動爻作子孫生合世爻﹐或官鬼持世﹐財動生之﹐或父母持世﹐財動克之﹐皆許求財之易如摘枝耳。若遇兄弟持世及兄弟爻動于卦中﹐或世臨旬空月破﹐何異緣木求魚。
如占一年月令現任官者﹐宜官星持世﹐財動生之﹐皆許吉慶。若遇官鬼相克﹐日月動爻作子孫沖克世爻﹐或作官鬼沖克世爻﹐或世空世、官破官空﹐或世動化回頭克及子孫持世皆為凶兆。
士民而占流年者﹐最喜財爻及子孫爻持世﹐管許一歲亨通。若遇官鬼持世﹐得日月動爻作財星生合世爻者﹐必見災非。倘世破世空及鬼動克世多見凶災。兄動克世﹐口舌破財。
以上官府士民占流年者﹐合世之月則吉﹐沖世之月則凶。皆不宜世爻變鬼及化回頭之克定見凶危。又不宜財動化父﹐父化財爻﹐鬼化父母必有長上之災。弟兄變鬼﹐鬼變弟兄﹐防手足之厄。財化鬼﹐鬼化財﹐財化兄﹐兄化財﹐主傷克妻妾婢僕。子化鬼﹐鬼化子﹐父化子﹐子化父﹐小口有傷。靑龍天喜持世生世而有喜。虎鬼發動主孝服。騰蛇朱雀臨兄﹐鬼動而克世者﹐須防口舌。元武臨兄﹐鬼動而克世者﹐防賊盜及陰人。
如占避訟防非、仇人為害及行江漂海、深入險地旅店孤眠﹐窮鄕僻壤﹐投寺宿廟﹐或營中貿易﹐錯買盜物﹐或見鄰家火起﹐或聞瘟疫流行﹐防虎狼﹐防盜寇﹐或夜行早起﹐或險偸關﹐或已入是非之場﹐心憂禍患﹐或欲管閒事﹐恐惹災非﹐或人病家以防沾染﹐或誤服毒物恐致傷生﹐或已定重罪而盼赦﹐或已得險病病而防危﹐或問此物此藥可以服否﹐或問歹人烈馬傷害我否﹐凡遇一切防火慮患者﹐但得子孫持世及子孫動于卦中﹐或世動變出子孫﹐或世動化回頭相生﹐或官鬼動以相生﹐卽使身坐虎口﹐管許安如泰山﹐惟忌官鬼持世﹐憂疑不解。鬼克世災禍必侵。世動化鬼及化回頭克者﹐禍已及身﹐避之不及﹐惟世爻空者無憂﹐世爻破者不利。
占病者如自占病﹐若得世爻旺相或日月動爻生合世爻﹐或子孫持世﹐或子孫動于卦中﹐不拘久病近病﹐或求神或服藥﹐立保安康。近病者世值旬空或世動化空﹐或卦逢六沖及卦變六沖﹐不須服藥﹐卽許安痊。久病者官鬼持世﹐遇休囚﹐或遇日月動爻克世﹐或值旬空月破﹐世動化空化破或卦逢六沖﹐卦變六沖﹐或世動化鬼及化回頭克者﹐速宜救治﹐遲者扁鵲難醫。
占父母病以父母爻為用神。若得父爻旺相﹐或日月動爻生父母﹐或父動化旺﹐不拘久病近病﹐求神服藥立見安寧﹐近病者父爻值旬空﹐父動化空﹐或卦逢六沖﹐不藥而痊。久病者父爻值旬空月破﹐父動化空、化破﹐父動化財﹐財化父母﹐卦逢六沖﹐卦變六沖﹐或父爻休囚又出被日月動爻沖克﹐為子者須宜急急求醫﹐親嘗湯﹐勿遠離也。
占兄弟病者﹐若得兄爻旺相﹐或臨日月動爻相生﹐或動化旺化生﹐不拘病之遠近﹐立許全安。近病者﹐兄爻值旬空及動而化空﹐卦逢六沖﹐服藥卽愈。久病者兄爻值旬空月破及動而化空化破﹐卦逢六沖﹐卦變六沖﹐兄動化鬼﹐鬼動化兄﹐或兄爻休囚被日月動爻沖克﹐急急服藥求神﹐遲則難調理。
占子孫病者﹐子孫爻旺相﹐或臨日月﹐或日月動爻生合﹐或子孫爻化回頭生﹐化旺﹐不拘病之新久﹐服藥求神卽愈﹐近病者子孫爻值旬空及動而化空﹐卦逢六沖﹐卦變六沖﹐不藥而愈﹐出痘者不宜六沖﹐久病者子孫逢旬空月破及動而化空化破﹐卦逢六沖﹐卦變六沖﹐子孫動而化鬼﹐鬼化子孫﹐父化子﹐子化父及日月動爻沖克者﹐速宜服藥﹐遲則難于治矣。
占妻妾病者﹐以財爻為用神﹐財爻旺相或臨日月﹐或日月動爻相生﹐或財爻化子孫及化帝旺者﹐不拘久病近病﹐治之卽愈﹐近病者妻財逢旬空及動而化空﹐或爻逢六沖﹐卦變六沖﹐何須服藥﹐卽許災除。久病者財爻逢旬空月破及動而化空化破﹐卦逢六沖﹐卦變六沖﹐或財動化鬼﹐鬼化財爻﹐兄動化財﹐財化兄弟﹐名醫亦難取效。
凡占三黨六親及官長、師生、婢僕諸人之病﹐皆于用神章內以取用神。
占朋友、外人以應爻為用神﹐理之常也﹐往往多有不驗者何也？疑因不甚關切﹐不誠之故耳。
野鶴曰：客有問于予曰：「據爾之言﹐占卜極易事也﹐卽如占功名得旺官持世以成名﹐子孫持世而失望。占疾病近病逢沖逢空﹐不藥而愈；久病逢沖逢空靈丹莫救。如若得此﹐顯然者自是不難知矣。倘占疾病不逢六沖﹐用神不遇旬空﹐旺不旺而衰不衰﹐凶不凶而吉不吉。又如占功名﹐官與子孫皆不持世﹐六爻亂動﹐財父同興﹐何以決之？」予曰：爾若垂廉賣卜﹐每日數卜之占﹐未必盡得顯而易見之卦﹐凶中藏吉﹐吉處藏凶者有之﹐必須奧理深求﹐細心參悟﹐爾欲自知趨避者﹐必然卦不亂占﹐心無雜念﹐每遇一事﹐卽刻卜之﹐神不欺人。如若間有卦之恍惚﹐次早竭誠再卜﹐再遇恍惚﹐還可再卜﹐自然響應﹐只不可心懷兩事而占﹐一念至誠則應﹐若占兩三事者﹐則不靈也。又如占疾病更容易耳﹐一人有病﹐一家俱可代占﹐但有一卦爻逢六沖或卦變六沖﹐或用神值旬空或用神動而化空者卽愈﹐久病逢此者難治。又如防災慮患﹐但得子孫持世﹐便與霹靂同居﹐管許安然無恙﹐有何難耶？客曰：再占有瀆之﹐不敢再三﹐何敢連占幾日？予曰：因此一語﹐誤盡卜卦之人﹐豈不聞三人占聽二人之言﹐一事旣可三處而占﹐何妨再占？然亦有不可再瀆者﹐以此一事一刻而再占也﹐須于次日再卜可也。又有連日亦不可再瀆者﹐如占功名﹐已得子孫持世﹐我心不悅﹐必欲求其官鬼持世而後已﹐此則謂之再三瀆也。然予亦有見其再三瀆者﹐未見神之不應也﹐予因少年復功名占過七次﹐竟有六次而得子孫持世﹐此乃神不厭我多問而屢報也。又有厭予多問者﹐如我問求財卦已明﹐現有財我心知矣﹐我再問之神不告矣﹐而又以我未占之事告我也。如一日占求財﹐旺財持世﹐是我明知辰日得財﹐次日再占一卦﹐果于辰日得財否？卦得申金兄動而不得﹐是何說耶？及到辰日得財﹐至申日因他事而破財。而悟辰日之得財﹐次日而再問之﹐神不告矣﹐報我申日而破財也。故知再三瀆者﹐神亦不見責而又報我未問之事也﹐此事極多。予著此書傳後賢之祕法者﹐無他法也﹐教學者凡遇卦之恍惚﹐心若未明﹐多占無礙﹐倘卦中已明現﹐不可再瀆。至于占病者﹐一人有病﹐一家俱可代占﹐自有顯然之卦﹐再者遇事卽占﹐乘此心而未亂﹐不可多積事情于心﹐事多心亂卽非一念之誠也。教其深學卜者﹐後有分占之法及予所辟諸書之謬﹐宜細味之﹐此皆予四十餘年須臾不離以得之也﹐實先賢之所未傳。須宜通前徹尾﹐細心詳悟﹐自然巧奪天工﹐參天地之化育﹐測鬼神之隱微而不難矣！

反吟伏吟
卦有卦之反吟﹐爻有爻之反吟。反吟者﹐實際上是卦變沖克、爻變沖克。卦之反吟者﹐內外動而反吟。有乾變巽﹐巽變乾；坎變離﹐離變坎；震變兌﹐兌變震；坤變艮﹐艮變坤。坤艮兩卦皆土﹐為何相沖？《卜筮正宗》云：「艮卦坐于東北﹐艮右有丑﹐左有寅；坤卦坐于西南﹐右有未﹐左有申。二卦相對﹐有丑未相沖﹐寅申相沖。」
爻之反吟者﹐內外卦之反吟。如子變午﹐午變子﹐丑變未﹐未變丑；巳變亥﹐亥變巳；辰變戌﹐戌變辰。爻之反吟﹐與卦之反吟的不同之處是：卦變反吟﹐就是卦變相克。如乾變巽﹐為金克木﹐而卦中六个爻互相之間並不一定者變為相沖相克。而爻之反吟﹐就是卦和爻同時變為相沖相克。如坤變巽、巽變坤、觀變升、升變觀等。其卦中之爻﹐互相發生你沖我克。
卦之伏吟﹐則是卦變﹐其六爻地支五行不變。卦有內外伏吟、外卦伏吟和內卦伏吟三種。

占卦法：
占卦時。首先將三个銅錢平入于手心﹐兩手合扣﹐問事之人要集中意念﹐腦子只準專想所要預測之事﹐反覆搖動手中銅錢﹐然後將銅錢擲于盤中﹐看銅錢的背和字的情況。
一个背﹐兩个字﹐稱作「單」。畫作「⚊」為少陽。
兩个背﹐一个字﹐稱作「拆」﹐畫作「⚋」為少陰。
三个背﹐沒有字﹐稱作「重」﹐畫作「○」為老陽﹐是變爻。
三个字﹐沒有背﹐稱作「交」﹐畫作「ㄨ」為老陰﹐是變爻。
共搖六次﹐第一次為初爻﹐畫在卦的最下面﹐依次上升﹐第六次為第六爻﹐畫在卦的最上𨘢。如遇有ㄨ、○﹐再畫出變卦來。

當年有一朋友宦遊之時﹐野鶴老人以此全圖相送﹐友說：我不知五行焉能斷卦？答曰：先學點卦﹐點出卦象看是何卦﹐卽出全圖內尋出此卦﹐照樣裝排「世」「應」「五行」「六親」﹐不用念卦書﹐不知五行生克之理﹐亦能決斷四宗大事﹐不管卦中動與不動卽照此圖內單看世爻。
如占防憂慮患者﹐若得子孫持世無憂﹐官鬼持世憂疑難解﹐須加意防之。占功名者若得官鬼持世卽許成名﹐子孫持世且待時。占求財妻財持世者必得﹐兄弟持世者難求。占病者若得六沖卦近病不藥而愈﹐久病妙藥難調。
友問：何以謂之子孫持世？
答：子孫與世字同在一爻者卽是子孫持世。倘得官鬼與世字同在一爻者卽是官鬼持世﹐其餘兄弟、妻財持世皆由此說。
或問：何謂六沖卦？答：六沖卦者﹐乾為天、坎為水、艮為山、震為雷、巽為風、離為火、坤為地、兌為澤﹐此八宮第一卦皆是六沖卦﹐再者天雷無妄、雷天大壯也是六沖卦一共十卦﹐其餘不是。
或問：求官者若得官鬼持世﹐求名必成﹐求財者得妻財持世﹐求財必得﹐倘若官鬼爻與妻財爻或值旬空月破或被卦中子孫發動以傷官﹐兄弟發動以傷財﹐𨿽遇官鬼持世、妻財持世有何益也。答：你知五行之理﹐神早知之﹐所得之卦﹐若非凶中藏吉﹐定是吉中藏凶。此乃神聖引人以知其奧﹐自然要看旬空、月破﹐生克、沖刑﹐今吾友不知五行之理﹐神亦早知﹐如若求名﹐禱于神曰：功名若成﹐賜我于官鬼持世。倘若無望﹐賜我子孫持世。如占防憂患﹐禱于神曰：目下若有禍者﹐卦得官鬼持世﹐若能免禍逃災者﹐賜我于子孫持世。所得之卦自然顯而易見﹐若有隱微者卽是神變欺人﹐何以為神？況我作此一段簡易之法﹐單欲教其全不知五行之理者學會點卦﹐卽照全圖裝排就知決斷四宗大事。倘若稍知五行之理者﹐不可以此為法﹐務必細讀此書卷後何謂空而不空﹐破而不破﹐何為墓而不墓﹐絕而不絕。何為眞反吟假反吟﹐何謂進不進。退不退﹐何為回頭克者生﹐何為回頭克者死。何處可看用神﹐何處不看用神﹐何為占此而應彼﹐何為占遠而應近﹐何為得其法者百占百靈﹐何為不得其法者百占不驗。何為元神不生用神﹐何為忌神無力能害用神。何處辟諸占者之謬﹐何處增巧驗之奇。細觀種種祕法﹐方能決事如神。
又問：假令占防災、慮、患﹐若得子孫持世自是無憂﹐若得官鬼持世驚恐必見﹐若卦中並不現者何以決之？
答：一卦不見再占一卦﹐再若不見他日又占﹐昔人泥其不敢再占﹐所以無法。我見易經有：「三人占聽二人之言。」古人一事旣可決于三處﹐今人何妨再占﹐予生平以來稍得其奧者全賴多占之力也﹐事之緩者﹐遲遲再占﹐事急者歇歇又占。不管早晚﹐不必焚香。深更半夜亦可占之。只要單為此事而占﹐不可又占他事﹐但有心懷兩三事而占卦者﹐非一念之誠﹐絕無靈驗。假令占功名或是官鬼持世﹐或是子孫持世﹐得其一者得失已知。不必占矣﹐不必厭其子孫持世﹐務求其官鬼持世而後已﹐此非理也。如占求財或是妻財持世或是兄弟持世﹐得其一者則止﹐不必再占。倘一事而與眾人同其禍福者﹐各占一卦決之更易。卽如行舟遇暴風﹐家中防火燭﹐人人俱可占之。
但有一卦若得子孫持世皆同無患。又如占疾病﹐病人自占﹐若不得六沖卦者一家俱可代占﹐但有一人得六沖之卦﹐或系近病或系久病吉凶合了然矣？
世人凡有疑難﹐開口則說求神問卜。可見欲知未來之吉凶﹐除卜之外﹐無他矣。我習周易有年﹐所卜之事﹐感應之理﹐就如神聖開口說話。眞令人毛骨悚然。因而不知周易之妙﹐不念卦書﹐不得不送此祕訣﹐試去行之﹐覓見其靈﹐從此自肯念書學卜﹐此法甚善。你亦可以傳人縉紳、士民、行商、坐賈﹐無人不可。不用須要全不知五行生克之人方用此法﹐倘若稍知五行者﹐神必現隱微之卦﹐須要先念渾天甲子、六親歌﹐占出卦來會裝五行六親。再學變動﹐卦中必有動爻﹐動則必變。卽知動變然後再看用神、元神、忌神﹐知此者卽如入周易之門也。再看四時旺相章、五行相生相克章、五行相沖相合章、旬空月破生旺墓絕章﹐又如進周易之堂也。再看後卷各門各類占何事以何法斷之﹐漸漸由淺入深﹐以得其奧﹐不須半載工夫﹐得予數十年之眞學也。今予先點一卦﹐教爾學看用神及五行生克旺衰之理。
凡問事先寫年月日辰﹐再照六神章中寫出六神然後占卦。

自占吉凶者以世爻為用神﹐此卦世臨戌土﹐卽以此戌土自己之身。宜于旺相﹐最怕休囚。宜逢巳午之火相生﹐忌寅卯之木而相克﹐又不宜世爻落空﹐更不宜世爻臨月破。此世爻戌土有四處生克沖合。
1、月建能生克沖合
此卦世爻戌土如在寅卯月占卦﹐被寅卯之木傷克﹐卽為世爻受傷。自占吉凶者謂之休囚不利。若在辰月占卦﹐辰沖戌土﹐戌為月破﹐此謂之世爻逢月破﹐卽如自己身子如破格也﹐百無所為。若在巳午月占卦﹐巳午之火乃是官鬼﹐能生戌土﹐謂之火旺土相﹐世爻逢旺相﹐諸事可為。若在未丑月占卦﹐此兩月土旺之時亦能幫扶戌土﹐此世爻戌土亦謂之旺相﹐亦以為吉。若在戌月占卦﹐世爻戌土而為月建﹐此旺相以當時也﹐自占吉凶﹐諸事享通。若在申、酉﹐亥、子月占卦此戌土皆為泄气之時﹐謂之世爻休囚無力。此謂之月建能生克、沖合世爻戌土之用神也。要知何以謂之用神者﹐自占吉凶用此世爻為主﹐不說世爻而曰用神﹐占父母以父母爻為用神。
2、日辰能生克沖合
此卦世爻戌土﹐若在寅卯日占卦﹐寅卯之木能克戌土﹐此世爻受日辰傷克不利之象。若在辰日占卦﹐辰沖戌土﹐謂之世爻暗動。若在巳午日占卦﹐巳午之火卽是官鬼能生戌土。此謂之世爻逢官鬼而生旺﹐諸事皆吉。若在未丑日占卦﹐土遇土而幫扶﹐此戌土亦為得助。若在戌日占卦﹐謂之世爻臨日建當令得權。若在申酉亥子日占卦﹐此戌土無克無生。此謂之日建能生克沖合用神也。
3、卦中之動爻能生克沖合
此卦世爻戌土﹐倘卦中第二爻寅木發動能克戌土﹐第四爻午火官鬼發動能生戌土﹐第三爻辰土發動能沖戌土﹐此謂之卦中之動爻能生克沖合用神。
4、世爻發動變出之爻能回頭生克沖合
世爻發動﹐動而必變﹐變出巳午之火謂之回頭生世。變出寅卯之木謂之回頭克世﹐變出辰土謂之回頭沖世﹐變出卯木謂之合世。此謂之用神自動變出之爻能生克沖合用神也。
以上四處若得全來生合用神者﹐諸占全吉。倘有三處相生一處相克﹐也以吉斷。若有兩處克兩處生者﹐須看旺衰。生用神之神旺相者則以吉斷﹐克用神之神旺相者可以凶推。尚遇三處相克一處相生﹐若得相生之爻旺相者也可斷為克處逢凶中得解。若值休囚者有生之名無生之實﹐與四處俱來克者同斷﹐諸占大凶。
或問：此卦世爻戌土並無變出寅卯巳午之理？
答：他爻多有變出回頭生克﹐借此以為法也。
又問：卯木能克戌土又與戌合﹐還是以之為合還是以之為克？
答：五行相合章注解極明。
又問：此卦乾為天﹐卦中午火作官星﹐如何午月午日占卦也以午火作官星何也？
答：不拘占得何卦﹐卦內若以巳午火作官星者﹐如遇巳午月日占卦﹐此巳午日也作官星﹐卦中若以巳午之火作財星者﹐而巳午月日也作財星﹐餘仿此。旺相休囚者﹐四時旺相查之。空破者旬空月破章查之。沖合者五行相合章查之。暗動者在暗動查之。回頭生回頭克者在動變生克章查之。日辰月建者在日辰月建章查之﹐生克者五行相生﹐五行相克章查之。生克者五行相生、五行相克章查之。元神者元神章查之。用神、官星者在用神章查之。
占父母者以卦中父母爻為用神。此卦辰、戌兩爻俱是父母﹐若兩爻俱動或都不發動﹐擇其旺者為用神。如一爻動者擇其動者為用神。父母卽臨辰戌兩爻二土﹐卽以土為父母﹐宜火相生﹐怕木相克、忌臨旬空、月破亦有四處生克沖合﹐但宜生多克少為吉。與前世爻相參看。占室舍、車舟、文章、章奏、都以父母爻為用神﹐須在用神章細看。占他人者以應爻為用神﹐此卦用臨辰土﹐欲其吉者宜四處相生﹐欲其衰者宜四處沖克。
占兄弟者以兄弟爻為用神。此卦申金兄弟卽為此爻﹐宜土相生﹐怕火相克﹐忌臨月破、旬空﹐也有四處生克﹐都是多生少克為吉﹐克多生少為凶。又云：兄弟爻乃劫財之神。如占弟兄姐妹之否泰者﹐宜其生旺不宜臨月破旬空。如占妻、妾、婢、僕及財物者宜克多生少。更喜逢空逢破﹐使其不能劫我之財﹐克我之妻妾、婢、僕。
占妻、妾、婢、僕及占財物都以妻財爻為用神﹐此卦寅木妻財就是用神。忌臨旬空月破﹐宜水相生﹐怕金相克﹐也有四處生克﹐多生少克為吉與前同看。凡占金銀、買賣都以妻財為用神﹐須在用神章中細看。
占子孫者以子孫爻為用神﹐此卦子水就是用神。忌臨月破、自空﹐喜金相生、怕土相克。也有四處生克沖合﹐宜其克少生多﹐與前同看。占他事者以子孫爻為用神者﹐也從用神章查之。
占功名者以官鬼爻為用神﹐此卦午火官星卽為用神。此爻最忌逢空、逢破﹐怕水相克﹐宜木相生。也有四處生克與前同看。占鬼祟、妖孽、亂臣、賊盜都以官鬼爻為用神﹐須在用神章細看。
以上所論諸事﹐後卷都有細法。恐爾不得其門而入﹐寫此以為綱領﹐引爾入門也。知此綱領再細詳後卷﹐各章由淺入深﹐自入佳境。
前八宮全圖都是靜爻﹐然而卦﹐必有動﹐動則必變﹐後篇𨿽有動變章﹐恐爾不明﹐再排一變卦為例﹐爾宜細詳。卦有「○」變出﹐「○」為重重為陽﹐陽動變陰。卦有「ㄨ」變出﹐「ㄨ」為交﹐交為陰﹐陰動變陽。

澤天夬﹐上三爻外卦乃是兌卦﹐兌為澤﹐下三爻內卦乃是乾卦﹐乾為天﹐澤在上﹐天在下﹐卽是澤天夬卦。從全圖內找出澤天夬卦﹐照樣裝出世應、五行、六親然後再看動爻。上三爻兌卦﹐第六爻「交」動變出「一」爻﹐卽是兌卦變乾卦為乾為天。下三爻乾卦初爻動「○」變為「⚋」爻﹐卽是乾卦變巽卦為巽為風。天在上﹐風在下卽為天風姤卦。在全圖內找出天風姤卦﹐以姤卦初爻之丑土﹐寫在前卦初爻發動　子水之旁謂之子孫變出丑土。以姤卦第六爻之戌土寫在前卦六爻發動之旁﹐卽是未土變出戌土。予爻不動不變不必寫出。按六親者姤卦之丑土⚊戌土原是父母﹐今俱寫兄弟何也？六親須照前卦而按前卦澤天夬土為兄弟﹐所以變卦之丑、戌二土也寫兄弟。餘卦仿此。

用神章第八
父母爻：占父母卽以卦中之父母爻為神。祖父母伯、叔、姑、姨、父母﹐凡在我父母之上﹐或與我父母同輩之親及師長、妻父母、乳釋之父母﹐三父、人母或僕占主人皆以父母爻為用神。占天地、城池、墻垣﹐宅舍、屋宇﹐舟車、衣服、雨具、綢緞﹐布匹、章奏、文書及書館文契也以父母爻為用神﹐物類亦多在變通﹐一切庇護我身者是也。
官鬼爻：占功名、官府、雷霆鬼神、妻占夫皆以官鬼爻為用神。占亂臣賊盜邪崇也以官鬼爻為用神﹐物類亦多﹐一切拘束我身者是也。
兄弟爻：占兄弟、姐妹、族中兄弟、姑姨、妹夫及結拜兄弟都以兄弟爻為用神。兄弟乃同類之人﹐彼得志則欺淩﹐見財則奪﹐所以占財物以此為劫神﹐占謀事以此為阻神、占妻妾、婢僕以此為刑傷克害之神。占姊丈妹夫以世爻為用神﹐予屢得驗。
妻財爻；占妻妾、婢、僕、役﹐我驅使之人皆以要財爻為用神。占貨財、珠寶、倉庫一切使用之財物亦以妻財爻為用神。
子孫爻；占子孫、占女、女婿、侄、甥、門生凡在我子孫輩中皆以子孫爻為用神。占忠臣、良將、醫藥、僧、道、兵卒皆以子孫爻為用神。占六畜、禽獸亦以子孫爻為用神。子孫福德之神。為制鬼之神、為解憂之神、為剝官之神﹐諸事見之為喜﹐獨占功名者忌之。

四時旺相章第又十五
正月寅為月建﹐寅木旺﹐卯木次之。二月卯當月建﹐卯木旺﹐寅木次之。正二月木為旺、火為相﹐其餘金火土作休囚。三月辰為月建辰土旺﹐丑未之土次之﹐土生金﹐金為相﹐相𨿽不旺﹐還有餘气。其餘俱作休囚﹐四月巳為月建﹐巳火旺、午火次之。五月午為月建﹐午火旺﹐巳火次之﹐四五月火為旺﹐土相其餘俱作休囚。六月未為月建﹐未土旺﹐辰戌次之﹐土生金﹐金為相﹐火𨿽衰﹐但有餘气﹐其餘俱作休囚。七月申為月建﹐申金旺﹐酉金次之。八月酉為月建﹐酉金旺﹐申金次之。七八月金旺﹐金生水﹐水為相﹐其餘俱作休囚﹐九月戌為月建﹐戌土旺﹐丑未次之﹐土生金﹐金為相﹐其餘俱作休囚。十月亥為月建﹐亥水旺、子水次之。十一月為月建子水旺、亥水次之。十月十一月水旺﹐水生木﹐木為相﹐其餘俱作休囚。十二月丑為月建﹐丑土旺﹐辰戌之土次之﹐土生金﹐金為相﹐水𨿽衰﹐還有餘气﹐其餘俱作休囚。
月將章第十六
月將卽是月建又為月令。掌一月之權﹐司三旬之令。一月三十日內當權得令。操持萬人之提綱﹐巡察六爻之善惡﹐能助卦爻之衰弱﹐能挫爻象之旺彊﹐制服動變之爻﹐扶起飛伏之用。月將乃當權之帥﹐萬卜以之為綱領。爻之衰弱者能生之合之、比之、拱之、扶之﹐衰而亦旺。爻之彊旺者能沖之克之、刑之、破之﹐旺而亦衰。卦有變爻克制動爻者﹐月建能制變爻。卦有動爻克制靜爻者﹐月建亦能制服動爻。用神伏藏被飛神壓住者﹐月建能沖克飛神﹐生助伏神而為用也﹐爻逢月合而有用﹐爻逢月破而無功。月建合爻為月合﹐乃有用之爻也。月建沖爻卽為月破﹐乃無用之爻也。月建不入爻亦為有用﹐月建一入卦愈見剛彊。卦無用神卽以月建為用神﹐不必尋伏神也。月建入卦動而作元神者為福更大﹐動而作忌神者為禍更深﹐不入卦者緩之。爻值月建旺相﹐當謂逢空不空﹐逢傷無害。古有此說﹐予試不然﹐在旬內者畢竟為空。

六合章第十九
子與丑合、寅與亥合、卯與戌合、辰與酉合、巳與申合﹐午與未合。相合法有六：日月合爻者一也。爻與爻合者二也。爻動化合者三也﹐卦逢六合四也。六沖卦變六合卦五也。六合卦變六合卦六也。日、月合爻者﹐假令丑月占得坎卦﹐世爻子水與月建作合是也。爻與爻合者﹐假令得天風姤卦、世爻丑動化出子水作合是也。卦逢六合者卽如天地否卦內外六爻自相和合是也﹐不動亦是。六沖卦變六和卦者﹐假令得乾為天乃是八純六沖卦﹐若外卦三爻值動﹐乃是乾之泰卦﹐謂之六沖變六合是了。六合卦變六合者卽如占得旅卦變賁卦是也。
爻之合者﹐靜而逢合﹐謂之合起。動而逢合﹐合謂之合絆。爻與爻合謂之合好﹐爻動化合謂之化扶。爻靜或與日月動爻合者得合而起。卽使爻值休囚亦有旺相之意。爻動或與日月動爻合者謂之動逢合而絆住﹐反不能動之意。爻動與動爻相合﹐乃得他來合我﹐與我和好﹐相助之意。爻動化出之爻回頭相合者﹐謂之化扶﹐得他扶助之意。
凡得諸合﹐諸占皆以為吉﹐占名成﹐占利利就﹐占婚必成﹐占身發福﹐占宅興旺﹐占風水聚气藏風、占求謀遂心合意﹐然必用神有气相宜﹐用若失陷無益。卜書曰：萬事若得三六合﹐諸事必得久遠﹐有始有終。但宜吉事逢之﹐事必就﹐不宜凶事逢之﹐事之難結。

予曰：占祖塋必有其故﹐自葬後何事不亨？今日之念因何而起？明以告我﹐方敢決斷。彼曰：自葬之後功名屢困﹐年近五旬﹐尚無子息﹐是以問之曰：此塋之有疑否？予曰：龍自右脈來﹐水亦從左而還源﹐流水不歸漕之故耳。彼曰：何以知之﹐予曰：亥水子孫化申金生之﹐申為源流﹐寅日沖之﹐若能使水歸漕﹐不至傍流者﹐明年起用﹐再拜丹墀﹐申年定生鱗種﹐彼曰：長久安泰否？予曰；六合萬載安然。
申子辰合成水局、巳酉丑合成金局、寅午戌合成火局、亥卯未合成木局。此三合者有四。一卦之內有一爻動而合局者一也。若兩爻動一爻不動亦成合局者二也。有內卦初爻、三爻、動而變出爻成三合者三也。又有外四爻、六爻動、動而變出之爻成三合者四也。然此三合者有凶有吉。如占功名合成官局謂之官旺﹐合成財局財旺生官﹐倘若合成子孫局者乃傷煞之神也。如占求財合成財局者謂之財庫；合成子孫局者謂之子局生財；倘若合成兄弟局者乃破財、耗財、阻隔之神也。如占祖塋、家宅宜父母爻而合局也。如占婚姻、夫婦、宜財官旺而合局。凡占求謀喜慶之事宜于成局﹐永遠堅牢。
若占官訟、憂疑而合局者﹐終身團結﹐其心難于消釋﹐但三合其局者必要世爻在局者為美﹐若世爻不在于局內﹐須要局生世爻為吉﹐局克世爻為凶﹐三爻若有兩爻動﹐不成局﹐須待後之補湊合成其局﹐謂之虛三待用。一爻明動一爻暗動亦作兩爻動。三合局中若有一空破者﹐待塡滿之日月成之。有一爻入墓者待沖開之日成之。凡得三合名利婚姻、家宅、風水﹐用神旺者無不為吉﹐必要世爻在局為美、若不在于局內須要局生世爻為吉﹐局克世爻為凶。如占財﹐財局生世利于我財﹐局生應利于他。占出行用神在三合內被合而畱。占行人用神在三合之內被合不回。又有內卦外卦而成三合者須分內外。如占家宅若屬外宅不宜外卦克內﹐若居內宅須宜內卦生外卦﹐又如占彼此之形者﹐內卦為我﹐外卦為他。外卦合局而內卦者為吉﹐克內卦者為凶。

相沖之法有六。日月沖爻者一也﹐卦逢六沖二也﹐六合卦變六沖三也﹐沖變六沖四也。動爻變沖五也、爻與爻沖六也。
沖者散也﹐凡占凶事宜于沖散、占吉事而不宜﹐必兼用神而言﹐用神旺𨿽沖不破﹐用神失陷凶而又凶﹐六合卦變六沖卦者﹐用神旺者始吉終凶﹐圖事難成﹐有始無終也。爻沖有五：爻與月沖謂月破。爻遇日沖為暗動。休囚而遇日沖謂之日破。動爻化回頭沖。如逢仇敵。爻遇爻沖謂之相殺也。

卦變生克墓絕章第二十四
卦變者：變生、變克、變墓、變絕、比和。予得驗者﹐凡遇卦化克者﹐不論用神之衰旺皆以凶推。
此乃巽卦變坎卦﹐巽木變坎水謂之化生﹐水回頭以生木﹐也卽以吉斷。
此乃震卦化乾卦﹐震木變乾金謂之化克﹐金回頭以克木﹐也卽以凶推。
卯月辛巳日來人不言所事。占得巽卦變乾卦。問之所占何事？伊曰：代卜長輩功名。予曰：功名須要親占﹐代占難取用神﹐從不敢斷﹐幸此卦而易見﹐巽木化乾金﹐卽為化回頭克﹐為絕卦也﹐不必問名﹐壽命不長﹐果于削職後七月而終。
又如午月丙寅日占主病﹐得離卦變坎卦﹐離火變坎水﹐回頭來克﹐但因午月火旺﹐許之冬令必危。果卒于九月丁亥日。此皆不看用神之衰旺也。李我平曰：易冒墓絕章云﹐日月當令非眞﹐卻不知凶事將來﹐神機早兆﹐日月當時𨿽旺﹐過時則有消﹐卽如此篇﹐占主病午月得離變坎﹐目今夏火𨿽旺﹐冬來火衰命絕。易冒反伏章云：「日月非空破﹐徒往則重。又曰：半徒往徒未半凶吉」﹐種種疑論﹐皆非經驗。卦體如人之根本﹐卦變刑克絕﹐如樹連根出土﹐目前枝葉𨿽靑﹐能保長不朽乎？當時旺﹐過時而衰﹐空破𨿽虛﹐塡實則應﹐且半凶半吉之論﹐難作後人法﹐此書只以回頭克者為凶﹐見易胃反伏章中之占驗﹐明是回頭之克﹐誤作反復休囚。如寅月癸酉日占長子病。得震之兌﹐此非震木化兌金回頭之克耶？此二卦竟未看出﹐土遭木克﹐木被金傷﹐以震為長男﹐占長子所以不吉。殊不知卦變回頭之克﹐少女亦難保也﹐今以彼之占驗而謂彼之錯誤﹐無他說也。
反伏章第二十五
卦有卦變﹐爻有爻變。卦變者內外動而反伏者同一卦也。如乾卦變坤卦。
爻變者內外爻動而反伏者﹐非同一卦也。如升之觀是也。
又有外卦反伏而內卦不動者﹐如觀之坤是也。
又有內卦反伏而外卦不動者如巽之觀是也
內卦反伏﹐內則不安。外卦反伏﹐外則不寧。內外反伏者﹐內外不寧之象也。皆主成而敗﹐敗而成﹐有而卽無﹐無而卽有﹐得而失﹐失而得﹐來而去﹐去而來﹐散而聚﹐聚而散﹐動而思靜﹐靜而思動。
占功名者﹐用爻旺相﹐遷而又行往他處﹐去而仍復來。用神失陷有或降或升﹐或得或失矣。占財物聚散不常﹐買賣經營興衰往來不定。占墳墓宅舍﹐欲遷不遷﹐或遷之而再遷﹐或目下就有遷移之事﹐占以久遠之事者目前就有變動。占天時晴而卽雨﹐雨而又睛。占婚姻反復難成。占疾病愈而有病。占盜賊官非﹐見而又見。占出行﹐行至中途變反﹐卽使到彼﹐一事無成。占行人外卦反伏者﹐用神旺相必歸﹐不然變他處。在外之人而占家宅者﹐內卦反伏﹐家庭人口不安。占彼此之形勢者﹐內卦反伏﹐我亂他定﹐外卦反伏﹐他亂我定。反伏卦用神旺相不變沖克者𨿽則反復﹐事之必成﹐第恐用神而化回頭之沖克者﹐卽是卦變大凶之象﹐如卯月壬申日占隨官府上任。得比之井

何謂旬空？如甲子至癸酉日為一旬﹐此十日之內﹐並無戌亥﹐以爻逢戌亥為空亡﹐又名旬空﹐餘仿此。旬空之法﹐諸書論太煩﹐有眞空、假空、動空、沖空、塡空、無故自空、有散而空、墓空、絕空、害空、安空、破空。
野鶴曰：旺不為空﹐動不為空﹐有日建動爻生扶者不為空﹐動而化空、伏而旺相皆不為空。月破為空。有卦不動為空﹐爻反伏而被克為空﹐眞空為空﹐眞空卽春土、夏金、秋木、三冬逢火是眞空。
夫予初學卜﹐凡遇旬空﹐無法而斷﹐欲以之為到底全空﹐卻又應乎塡實之日﹐而不空以之為不空﹐卻有到底全空。後得多占之法﹐凡遇旬空﹐命之再占﹐卦吉者許之出旬而不空﹐卦得凶者許之空矣。

長生、沐浴、冠帶、臨官、帝旺、衰、病、死、墓、絕、胎、養。予得驗者﹐只驗生旺墓絕﹐其餘不驗﹐不必用之。
金長生在巳﹐旺在酉﹐墓在丑﹐絕在寅。
木長生在亥﹐旺在卯﹐墓在未﹐絕在申。
土水長生在申﹐旺在子﹐墓在辰﹐絕在巳。
且如主事爻屬木﹐若在亥日占卦卽主事爻長生于亥日。若在卯日占卦﹐木旺于卯。若在未日占卦﹐木墓于未。若在申日占卦﹐木絕于申﹐其餘仿此。又如主事爻屬木﹐動而變出亥水者﹐謂之化長生﹐動而變出卯木者謂之化旺﹐動而變出未土者謂之化墓﹐動而變出申金者謂之化絕﹐餘仿此。
覺子曰：金𨿽長生在巳﹐且宜金爻旺相﹐或日月動爻生扶﹐再遇巳日占卦﹐或是卦中動出巳爻﹐或是金爻動而化出巳火﹐皆謂長生。倘若金爻休囚無气﹐再遇巳午火多者﹐烈火煎金﹐論克不論生也。金爻𨿽墓于丑土﹐若得未土沖動﹐或卦中土多生金﹐論生不論墓也。土爻𨿽絕于巳﹐必須休囚無气﹐又逢巳爻謂之絕。若土爻旺相﹐或得日月動爻生扶﹐再遇巳爻﹐巳火反能生土﹐論生不論絕也。巳爻𨿽長生于寅﹐倘日月動爻及變出之爻又逢申金者﹐謂之三刑﹐論刑不論生也。古以土爻長生在申﹐又曰土長生在寅﹐無處考證﹐予以天時考之﹐常見土臨父母。有申日雨者﹐亦有子日雨者；又見土臨子孫﹐有申日晴者﹐亦有子日晴者。故知土長生于申﹐旺于子﹐實知土寄生于申而無疑也。

伏神有用者有六：伏神得日月生者一也；伏神旺相者二也；伏神得飛神生者三也；伏神得動爻生者四；伏神得遇日月動爻沖克飛神者五也；伏神得遇飛神空破休囚墓絕者六也。
黃金策曰：空下伏神﹐易于引撥﹐此論近理﹐但有不獨飛神空亡而伏神得出﹐但得飛神臨破休囚入墓而伏神皆易出也﹐何也？飛神逢破墓衰空﹐𨿽有若無﹐所以伏神易于出現。
此六皆有用之伏神也﹐𨿽曰不現亦如現矣。
又伏神終不得出者有五。伏神休囚無气者一也；伏神被日月沖克者二也；伏神被旺相之飛神克者三也；伏神墓絕于日月飛爻者四也；伏神伏囚值空月破者五也。
此五者乃無用之伏神也﹐𨿽有如無﹐終不能出。
黃金策曰：伏居空地﹐事與心違。予得驗者﹐非此論也。凡用神旺相而遇旬空﹐出空之日則出矣。

隨鬼入墓章第三十
古有日墓、動墓、化墓之三墓。世爻隨鬼入墓、本命隨鬼入墓、卦身隨鬼入墓、世身隨鬼入墓。
覺子曰：執此數論﹐若逢辰戌丑未之日﹐竟不敢占卦﹐非世臨鬼、卽卦身臨鬼、卽本命臨鬼﹐然又不獨辰戌丑未日而他日亦不敢占﹐何也？卜卦之中不免有二三墓爻發動﹐非世命而入、卽二身而入、及動而化墓、非世爻動化、卽二身動化﹐再不然難保其本命不化墓也﹐一卦之中不必看刑沖克害破散絕空﹐凡占疾病凶危之事﹐只以隨鬼入墓卽知凶吉也﹐予屢于疾病之占卦﹐卦卦畱神﹐見世爻旺者二身隨鬼入墓而不死也。本命隨鬼入墓而不死也﹐存畱驗﹐不驗又試﹐試之不驗﹐而再試之﹐一而十﹐十而百﹐全不驗者﹐始盡刪之﹐便是世爻用爻隨鬼入日墓入動墓或動而化墓﹐亦是休囚無气始見危﹐若旺而有扶亦有求解。

太過者損之斯成。舊注主事爻重復太多﹐事不專一﹐故宜損之。且如土為主事爻多﹐卦中多逢丑戌辰未﹐謂之大過﹐須待寅卯月日克制土爻﹐然彼成事﹐或占時得遇寅卯日月亦好。
野鶴曰：不獨後逢寅卯月日﹐得逢辰月辰日者﹐或許成事﹐何也？辰乃土之墓庫﹐謂之用爻重疊﹐須墓庫以收藏是也﹐餘仿此。
不及者益之則利。何為不及？若主事爻只有一位﹐又不旺﹐謂之不及﹐其事難成。且如金為主事爻﹐若在夏天占得休囚死煞﹐若得日辰動爻生之﹐或得後來逢生助之日月﹐皆有利益﹐其事亦成。予以此論是理。但要主事爻原有根蒂﹐衰而逢生者﹐如旱苗得雨也﹐勃然而興﹐故謂之有扶有助﹐衰弱休囚亦吉。只恐衰弱無助﹐休囚失陷﹐𨿽逢生合﹐亦難生矣﹐豈不聞制中弱主﹐難以為持。

最惡者歲君﹐宜靜不宜動。歲君乃當年之太歲是也。或旺動暗沖克世爻﹐占年運者﹐必須是一年中的大事。占官事的﹐一定得是朝廷的大事﹐占卜升遷官運以及占卜面聖朝君﹐或者占卜向聖上請功的﹐皆宜太歲生合世爻﹐動而生世更吉。最忌刑沖克世。除此數占之外﹐皆與他要等也。何也？太歲𨿽司一年之令﹐尊而不親﹐難仰吉凶﹐皆不及日月。古以太歲不理家庭瑣事﹐此理是也。所以太歲沖爻為歲破不以為凶﹐合爻為歲合不以為吉。爻之衰者﹐太歲不能生之﹐爻旺者太歲不能制之﹐遇月破者卽破﹐逢旬空者旬空﹐此非月建日建力也？

野鶴曰：吾不敢以之為是﹐亦不敢以為非。此乃用不旺﹐象不成之說也。若用爻得地﹐大象當成﹐世動不受克制﹐應動三合世爻﹐圖事成之更速。

爻遇旬空﹐逢沖而有用。旬空得遇日辰沖者﹐謂之沖空﹐實不為空﹐反為有用。倘動爻空者﹐日辰沖之更實。
合遭破以無功。舊注爻相合﹐如兩人同心﹐事必克濟。若日月動爻沖克者﹐則為合處逢沖。須防小人挑唆﹐合好之中﹐以生疑忌。只在自為之事者﹐亦被旁人挑阻﹐我事難成。予得驗者﹐凡三合六合﹐𨿽不宜目下日月動爻沖克﹐又宜後來之月沖開。正所謂如逢合住﹐沖破成功。且如爻中寅與亥合﹐事若在申巳之日月方成其事﹐餘仿此。古之不動﹐宜為之合﹐非也﹐兩爻皆動﹐始為合。
動空化空﹐皆成凶吉。舊系必成凶。予得驗者﹐動不為空﹐動而化空﹐亦不為空﹐吉凶皆應沖空實空之日﹐予故更之。
刑合克合﹐終見乖淫。舊注合者﹐和合也。見之為吉﹐殊不知合中有刑有克﹐畢竟不合。用午字為財爻﹐寅為福神﹐因午字帶自刑﹐名為刑合﹐不以為合﹐而為刑也。
野鶴曰：午旣自刑﹐乃自有刑害之禍﹐得福神而作合﹐是救解其禍矣﹐反不為吉者﹐非也。予嘗得驗﹐世爻午火﹐化未相合﹐已定重刑﹐後竟得釋放﹐免于災禍。
動逢合而絆住。舊注忌神動逢日月相合﹐則不成凶。元神動逢日月合住則不濟事。此亦有理﹐予得驗者﹐後逢沖開之日月﹐吉凶俱成。

有助有扶﹐衰弱休囚亦吉。此指主事爻而言﹐且如主事爻無气本為不美﹐若得日辰與動爻生扶拱合﹐卽為得助﹐與前不及者益之則利相同。
貪生貪合﹐刑沖克害皆忘。此亦指主事爻而言﹐且如主象臨卯木﹐遇申爻動而克之﹐卦中動出亥水﹐申金貪水之生﹐不來克木。又如主事爻臨子水欲卯木動而相刑﹐若得旁爻動出戌字﹐卯與戌合﹐不來刑子﹐此乃貪合忘刑。
又如用爻臨巳字﹐卦中動出亥水﹐動克一火﹐若得卯木同動﹐亥卯未合成木局﹐反來生火﹐亦謂之貪合忘克忘沖﹐餘皆仿此。
別衰旺以明克合﹐辧動靜以定刑沖。衰旺克合﹐前五行生克章及四時旺相章中已注明白。動靜刑沖﹐前動變章已注明。
並不並因多字眼﹐合非合因少支神。舊注卦爻旣成﹐未免有刑沖並合﹐然多一字不成其名﹐少一字亦不成刑沖並合之名也。且如子日卜卦﹐卦中有一子字而謂之並﹐若有二字則分開而太過也﹐名𨿽為並﹐其實不能並之﹐二午則不沖﹐二卯則不刑﹐二巳則不克﹐此多一字﹐不成刑沖克害之名。
野鶴曰：若爻中二子不合二丑﹐名為合﹐不成者﹐亦有理也。若以日辰不能並爻出之二子不能沖爻中之二午者非也﹐日月如天﹐無處不沾雨露﹐不然何以為之巡查六爻之善惡。

野鶴曰：鬼谷三才論含爻辭以五行以定禍福者乃用地支。旣用地支﹐不得不以天干為配﹐未聞以天干而定吉凶。以天干配于地支者﹐欲全用周天甲子卦﹐又止于四十八爻。所以乾之內卦用甲﹐坤之內卦用乙﹐乃十干之首﹐乾之外卦用壬﹐坤之外卦用癸﹐皆十干之尾。乾之內卦用子﹐與坤之外卦相合﹐坤之內卦用未﹐與乾之外卦相合。二老上下相映﹐陰陽相配﹐中包六子﹐甲乙之次者丙丁﹐用之于少男少女﹐艮與兌也。戊己用之于中男中女﹐坎與離也﹐庚辛用之于長男長女﹐震與巽矣﹐以全上下干支﹐此乃配偶之法也。故謂之渾天甲子。而禍福吉凶皆地支生克制化克合刑沖以判之。今又以天干而判休囚者﹐每卦皆宜用也。何獨于此﹐況小畜變蠱五爻朱雀為文書﹐動臨巳火變出子水文書﹐而世爻臨子水父母﹐又為文書﹐酉日生之﹐化丑合之﹐疊疊文書旺動于卦中﹐便非干支相合﹐亦不能說無成﹐故曰多事之論。
忌臨身而多阻無成。忌卽忌神﹐占不宜持世。如占官子孫為忌神﹐子孫持世求名不成﹐占財兄爻為忌神﹐兄爻持世﹐求財不獲。
野鶴曰：此論極是。然予得有驗者﹐兄爻持世化出財爻而得財﹐世臨財爻化出父母而見父。

謂父母旺動﹐用爻亥水子孫而無气﹐本為凶兆﹐喜得用爻值旬空而避之﹐至丙子日而愈﹐蓋丙子者﹐則前面已過﹐又是亥水子孫值子日而臨帝旺故耳。
野鶴曰：此論非理﹐諸占最惡者忌神﹐旣動于卦中﹐禍已兆矣。用神靜者逢沖之日遭害；用神動者﹐逢合之日遭傷；用神破者﹐實破之日而遇；用神空者﹐出空之日相逢。是乃未曾出一可以避之﹐出空必遇其害﹐豈曰出空則前面已過﹐反不受其禍﹐此說悖也﹐謬也﹐予得其驗者﹐元神動于卦中﹐用神空者﹐出空之日而得。忌神動于卦中﹐而用神空者﹐出空之日逢殃﹐屢占屢驗﹐獨近病逢空不論。凡占近病﹐用神得遇旬空者﹐不拘日月動爻克害﹐用神出空之日卽愈。卽獨此一事﹐論空不論克也。他占皆忌。此姤之大過﹐定是占于近病﹐不悟近病逢空﹐繼而曰諸事皆可避之﹐此誤後人也。
爻逢忌殺敵之無傷。舊注忌爻發動﹐心事不利﹐若得日月動爻幫助用爻﹐可以敵之﹐不傷于彼﹐事亦可成﹐予以此論是理。

世爻辰土﹐月建助之﹐丑土動而化回頭之生﹐又來扶助。𨿽則寅木鬼動而世爻旺相有助有扶可以相敵﹐然此後至辛丑日尚亦見其凶非﹐因一言觸怒上司﹐幾乎危殆﹐幸得解救。應解救者﹐因得日月之土幫扶也。
主象休囚怕見刑沖克害。主象旺相﹐尚難敵乎刑沖克害之爻﹐況休囚耶？
用爻變動忌遭死墓絕空。舊注死墓絕乃陷阱之地﹐若用爻動而化墓化絕化死化空者﹐不問公私大小之事﹐皆主不成。占病逢之﹐必死無疑。予得驗者﹐化墓化絕﹐若動爻旺相﹐或臨日月幫助﹐亦無大害﹐化墓者﹐沖開之日月而成﹐化絕者逢生旺之日月而就。至于化空之說﹐更得多驗﹐占謀事﹐實空之日必成。占近病﹐出空之日卽愈。
用化用有用無用。舊主旣有用爻﹐不可動而又化出來。謂之化去﹐或旁發出﹐皆不濟事。故𨿽有用﹐卽如無用。一般占病尢忌。
野鶴曰：此論非理。用爻若化進神﹐諸占皆吉。卽使他爻動出者﹐再得此助幫扶﹐何謂無用。豈不知太過者損之斯成﹐有曰用爻重疊﹐得墓庫以收藏。如果用爻太多﹐待至傷損之日﹐墓庫之日﹐成之更穩﹐反曰無用。非也當刪。
空化空𨿽空不空。予得驗者﹐不獨空化空則不為空﹐動亦不為空。動不為空﹐為禍為福﹐沖空實空之月日必應。
養主狐疑﹐墓多曖昧。此亦長生沐浴之中之二位星是也。予用生旺墓絕﹐其餘不驗。今之驗化出者亦驗生旺墓絕。墓者﹐滯也。用神動而化墓者﹐近病久病遇之﹐主昏迷之象。用神旺者﹐沖開墓庫之日則安。用神休囚﹐又被刑沖克害者﹐難愈。逢空者﹐近病者愈﹐久病者凶。捕獲遇之﹐深藏難保。身命遇之﹐愚蒙不振。失脫遇之﹐暗藏不見。婚姻遇之﹐皆暗昧不明之象。若動爻化墓﹐墓神回頭克動爻﹐勿以暗昧論﹐乃凶兆也。忌回頭克我者是也。如若墓神為鬼﹐回頭克用﹐更凶。化養化病化胎又化沐浴俱不驗者刪之。
化生旺兮禍福有三。生者動爻化長生也。如亥水動化出申金﹐卽化長生又回頭之生﹐化酉金者不曰化沐浴而曰化回頭之生﹐此二者動爻有气化爻旺相﹐諸占皆吉﹐旺者﹐長生之第五位者是也。金木水火而化旺卽是化進神﹐且如申金化酉金﹐亥水化子水﹐寅木化卯木﹐巳火化午火﹐主占無不亨吉。惟土寄生于申﹐旺于子水為進神﹐辰未土動而化出子爻者﹐乃為化旺﹐丑土化出子爻者﹐卽為化旺﹐又為化合﹐諸占皆吉。
化官鬼兮吉凶有二。動爻變出官﹐吉凶有二﹐何也？占功名者﹐世爻旺相﹐或臨日月或日月生扶動而變出官星﹐又無破損﹐乃為得官之兆也。世若休囚﹐受克動而變出官星者乃為變鬼﹐不惟難于王家食祿﹐須憂夢沈黃梁。

諸書占身命﹐謂妻財子祿一卦﹐能包壽夭窮通﹐六爻兼斷。殊不知父子財官兄弟﹐各有相忌相傷﹐若以一卦而兼斷者﹐卽如父母旺相﹐變應之微﹐又曰父旺傷子﹐豈世之有父母者﹐皆無子嗣之人也？又曰見兄則財莫能得﹐又為克妻之神﹐又曰兄弟爻與紫荊並茂﹐倘值旺兄持世﹐克妻耶？耗財耶？手足外傷耶？易林補遺有曰兄動妻亡財相﹐故執此論者﹐世之貧人寒士﹐皆失偶之人耶？至于財官子孫皆同此論﹐不暇細辧。必兼而斷者﹐卽先醫猶在﹐執此問之﹐知亦無從置喙。覺子曰予今得其法﹐乃分占之法也﹐占父母占兄弟﹐另占—卦終身財福何如？占終身功名有無？占終身夫妻偕老否？占終身子嗣及幫元俱宜分占。
終身財福章第三十七
福財旺相﹐鐘鳴鼎食之家。世爻旺相無傷﹐旣富且壽。覺子曰：占財宜于財旺﹐占壽獨重世爻﹐未聞財福不旺而世爻獨旺﹐卽許富與壽也。執此論者世之多壽者皆富貴之人也。凡占終身財福﹐世爻財爻子孫爻三者無一失陷﹐定是家殷戶足、福祿綿長。財世旺相而福神不旺者﹐乃先富後貧之人也。何也？子孫者﹐財之源也。水無源流﹐終須枯涸﹐謂之財旺福空榮華不久。世與福爻旺相而財爻不旺者﹐乃無財享福之人也。旣曰無財﹐焉能享福？此人心有現成之事業﹐只知坐享﹐不知生發；或是財托他人掌管﹐只知花費﹐不試艱難。財與福爻旺相而世爻不旺者﹐乃富屋之貧人也。覺子曰：以上之論﹐不旺所句者﹐無气失陷謂之不旺﹐得地有气亦謂之不旺﹐空破墓絕亦謂之不旺。財福旺而世爻不旺而有气者﹐從逢生之年復旺相。故謂之財福司權﹐榮華有日。財福兩旺﹐世爻無气者﹐不為吉也﹐𨿽旺財豐衣足食﹐不免癡瘂暗聾、或遭疾病官非、或系吝澀鄙俗。財福兩旺而世爻失陷者﹐更為凶也﹐𨿽有萬斛金銀﹐難買長生藥丹。前論財與福神﹐𨿽則不旺﹐亦宜有气﹐若失陷者﹐更為凶兆﹐財福失陷﹐立見傾家﹐惟動空及動而破者﹐不妨定﹝應實﹞破實空之年月也。
財世休囚﹐龜釜生塵之宅。世爻財爻福爻三者無气、或空破墓絕、或動而變凶﹐乃無衣乏食之人也。世爻得地、而財福失陷者﹐此人身彊力健、或有小謀小技﹐亦可支撐度日。世爻福爻有气、財爻無气者﹐𨿽則貧寒樂享淸福。世爻財爻有气、福爻而無气者﹐此人𨿽無積蓄﹐手頭常過金銀、或代人掌財﹐再得日月動爻生扶者﹐亦許小成。

要知創業喜六合以成爻。舊注：占身命得六合卦﹐主其人春風和气﹐交結善友﹐百事如心。交遊春風者有理﹐若以百事如心未必然﹐世必以用神兼之﹐爻象吉者﹐吉而又吉﹐爻象凶者﹐合亦無益。

斷曰：卯木之財﹐而入未日之墓﹐巳火之官﹐休囚無气﹐名不能成﹐利不能就﹐惜乎旺父臨身﹐才愈高而和愈寡﹐況得卦遇六沖﹐一事無成之象。後屢見逢顯貴聘之﹐才高气傲﹐皆不待瓜期辭矣。目摯十餘載﹐貧寒淡泊﹐後隨表弟升任云南﹐不知所終。
兄父臨世財耗貧寒。舊系遇兄則財莫能聚。解注有云：世逢兄爻必克妻妾﹐一生必不聚財﹐旣以之為克妻﹐又以之為破耗﹐執此而論﹐世之傷妻者﹐皆貧困之人也。假使貧者偕老﹐富者斷弦﹐何以決之？故予以分占之法﹐實得理也。覺子曰：凡占財福﹐兄爻持世﹐𨿽不許之富足﹐亦看旺衰﹐旺則貧而好義﹐衰則多疾病官非﹐得日月生扶﹐貧而樂。得日月作財而合世﹐富而驕。旺臨蛇虎元武﹐姦盜詐為之凶頑。衰遇勾陳雀武﹐背負肩挑之躬漢﹐受克受制﹐下賤隸卒。得合得扶﹐上人擡舉。全在人之通變﹐人觀其輕重而言。
官衰無破公門異行資生。官鬼持世﹐休囚無气者﹐乃纏綿病疾殘疾之人也。若有气者﹐或入公門或挾術行道﹐再遇日月動爻貴人扶助﹐皆得貴客相親﹐從此成家立業﹐財若無气﹐空有虛名而已。
財弱有商賈百工事業。財爻福爻自來旺相者﹐或商或賈或守農生﹐成之富足﹐樂享豐饒﹐倘遇衰財持世﹐或得日月動爻生扶合助者﹐暴發興家﹐守農莊年時豐稔﹐習工藝巧奪天工。
慕道修持皆為子孫持世。子孫乃恬淡之神﹐如若持世﹐孤立無助﹐又遇財爻陷者﹐若有高尚之志﹐許之為道為僧。若無出家之志﹐不可妄斷﹐殊不知見子﹐則身不犯刑﹐許之生平﹐不犯官刑可也。
家傾名喪乃因官鬼傷身。凡遇官鬼克世﹐世多旺者﹐生平多招刑憲﹐或招嫉妒、或小人暗害、或殘疾纏綿。若鬼旺身衰﹐乃身傷家傾之兆﹐動之不必以財福為問﹐速尋趨避之法可也。如世爻動而變鬼克世﹐及日月作官鬼而克世者﹐更凶。

學業章第四十五
儒業者﹐父母世爻同旺﹐終須變化成龍。日月動爻相生﹐定是王家儲器。世爻父母皆宜旺相﹐或動而變吉、或父母持世、日月動爻生合世﹐攀龍附鳳﹐指日可期。
財動卦中﹐靑燈不久。子孫持世﹐自首無成。財動克文章﹐讀書中道而廢。子動無官之象﹐皓首必不成功名。
九流者﹐財興官旺﹐道重人欽。兄動世衰﹐有毀無譽。財持世﹐官持世﹐財官世爻皆宜得地。卦中兄爻持世﹐只可糊口﹐難許成家。覺子曰：古以九流﹐皆以官鬼為吉﹐殊不知天師家及驅邪治鬼之家﹐巫師醫家﹐皆以子旺﹐能于治鬼﹐必以子孫持世及子孫發動而為吉也。
百工皆以財為用神﹐子孫元神﹐最忌兄爻持世及兄爻旺動者﹐勞碌終身﹐予以求財章同斷。以上皆不宜世爻空破墓絕休囚諸事無成。世若休囚﹐而又隨鬼入墓及受日月動爻沖克﹐或動而化鬼化絕化克者﹐不惟學業難成﹐且防不測。

增稟章第五十一
覺子曰：占稟若不得其祕﹐而望靈者少也﹐何也？占稟用財﹐財乃文章之忌神﹐不知其竅﹐卜歲焉而兼問稟﹐財爻若旺﹐父母受傷﹐則如休囚如何得稟？予有法也﹐先占歲科之吉凶﹐再占一卦而問稟﹐卽其祕也。
稟以財爻為用神﹐財爻持世或動而生世為吉﹐與求財章同斷。有稟而恐換者﹐忌兄弟持世﹐兄爻發動及財逢空破墓絕﹐動而變凶者﹐有失也﹐如官鬼兄爻克世者﹐輕則艸糧﹐重則道罰﹐倘卦中三合兄局者﹐亦主艸糧。
考道才章第五十二
官爻持世生世﹐我必業收。父母空破墓絕﹐他不見用。如世爻受克及空破墓絕﹐或動而變凶、或子孫持身動于卦中﹐皆不錄之。父母生世持世者吉﹐休囚空破者凶。
發案持榜章第五十三
父為用神﹐衰者宜生旺之日；旺而靜者﹐逢值沖之日；動而逢值逢合之日；空與入墓﹐必待沖開；破與旬空﹐須期塡實。予又得驗﹐心有憂懼﹐若得子孫持世﹐值子孫之日而發案。心有歡喜﹐若得官星持世﹐逢官鬼之日而掛榜。
延試章第五十四
典會場斷﹐官星為用﹐父爻次之。若持世爻得日月歲五生合者﹐定蒙道拔。官爻世爻三合﹐定蒙異寵隆恩。世與官爻有一而逢空墓絕刑沖克害及動而變凶者﹐不祥之兆。歲五官鬼沖無世爻者不測之災。
鄕試章第五十五
父旺官興﹐姓標虎榜。父官持世而旺相﹐或臨日月、或日月動爻生扶、及動而變生﹐名登龍虎。
子搖財動﹐名落孫山。子孫財爻持世﹐及動于卦中﹐終須下第。
兄弟乃奪標之惡客。俗傳兄弟爻興難上榜﹐凡見兄爻持世及動者﹐皆以為之不吉﹐殊不知有喜有忌﹐所喜者卦中財爻同興﹐喜其兄動以制財也。卦中父官兩動者﹐又喜兄爻持世﹐父動以生世也。兄弟持世﹐若臨日月或旺相﹐再得官父兩旺、或官動生父、父動生世﹐必添科名。兄不能掄元而奪魁也﹐故謂之兄弟乃奪標之客。覺子曰：卦中官鬼子孫同動﹐官臨旺相遇生扶﹐子孫弱而被克﹐再宜父動﹐最怕兄興。
日月為制煞之將軍。官星父母世爻有一而被動爻克制﹐或化回頭克﹐若得日月沖制克神﹐亦許得意﹐故謂制惡煞將軍。又如﹐世爻旺相而官父兩爻有一而伏藏不現﹐倘得日月沖制飛神﹐提出伏神者﹐許高發。又如官父世爻有一而不生者﹐若得日月生扶亦同此意。
二合無沖﹐定登甲第。官父世爻合成父局官局﹐不遇日月沖破者﹐定許連登﹐倘若合成兄局﹐得遇日月生扶﹐官星亦旺者﹐亦許得意。惟忌合成子孫局者﹐不為吉也。合成財局𨿽不為美。然亦得驗于吉者。

福世孫搖身化福﹐官空鬼破變爻克。子孫持世、子孫動于卦、世動化子孫、官空及動化回頭之克﹐皆主罷職休官。
子動財空﹐減祿罰俸。兄弟持世、兄弟發動、或財破及財動化凶﹐倘得官爻旺相﹐罰俸而已﹐官爻失陷﹐利名雙失。
身衰鬼克﹐貶責淩辱。世衰不遇生扶﹐又有歲五日月動爻刑沖克世﹐或世隨鬼入墓、動化鬼化克、及虎蛇刑克世爻者﹐輕則貶罰﹐重則刑獄。或曰：何以謂之輕重？予曰：輕者乃世爻有救﹐重者乃世爻休囚﹐又被刑傷沖克也。
卦靜世空官又陷﹐林下閒人。世空者退休之兆﹐官又空破休囚者削職無疑。
世陷逢殺興何礙。古有身空殺動避禍之徵﹐予以為非。殊不知世者動于卦中世爻空者﹐持世爻出空之月日必遭其害﹐豈能避之？惟世空逢六神動而相生﹐卦中𨿽有忌神發動亦無礙矣。待世爻出空之日﹐忌神反生六神而生世也。
官隆世陷﹐身辱官存。古有身𨘢伏鬼若非空﹐官職猶在﹐謂凡遇凶兆﹐若得官爻持世或官伏世下而旺﹐𨿽見責罰而官職猶存。
野鶴曰：世遇五爻之克﹐若得旺官持世﹐𨿽受辱﹐仍可為官。
身旺官陷﹐位去身安。世爻旺相不受傷克﹐官破官空及被刑沖克害或動而變凶者﹐官祿𨿽失﹐身不逢傷。
養親告病辭官章第六十三
子旺子興﹐必能遂願﹐官旺克世﹐總不如心。子孫持世﹐子孫發動﹐乃無官之果﹐必能遂我偸閒。若官星持世或官動克世合世﹐難脫利名韁鎖。
告假不忌反吟﹐休致須宜化退。告病及養親乃暫歸之事﹐得反吟卦者﹐乃應將來再任﹐故不忌之﹐惟辭官者﹐不宜見之﹐非目下屢辭反復﹐乃將來遠入畱臺﹐若得伏吟必不能行。世與官星化退神者如願﹐世與官星而化進神者﹐五事羈身﹐難于歇手。
修陵修河一切營造公務防患章第六十四
福搖子動無尢﹐鬼克兄沖有患。子孫持世子動卦中事無尢慮﹐有始有終。官鬼克世而受累﹐兄動以賠財﹐鬼兄持世同推。
父世官生因公加爵。父母持世﹐官星動而生合世爻者﹐必因公事加官。
財興官旺獲利榮名。旺官持世﹐財動而相生﹐不獨因公得利﹐遠許名榮旺﹐財爻持世世動化財生世﹐皆同此斷。
六沖不久六合堅牢。工程皆以父爻為用神﹐不旺或受沖克又得六沖卦者必不堅久﹐化沖者亦然﹐又看世爻旺相﹐又得六合卦者永遠堅。野鶴日：凡占公務﹐初入工程而防患﹐宜子孫動搖無尢﹐倘若已見疏憂而防患者﹐必有功名之慮﹐子動以傷官也。豈曰：子動而無尢耶？初入工程﹐兄動以防賠財﹐已見疏憂兄動而防罰俸。
僧官道紀醫官雜職陰陽寺官章第六十五
僧官醫官亦喜官爻發動。舊系豈可爻書發動﹐謂僧道醫官占功名﹐乃以子孫為用神﹐不宜父動而克子也。
野鶴曰：此非理也﹐若他占僧道醫人﹐乃以子孫旺相﹐道業高彊﹐父母興隆﹐庸愚懦弱。若僧道醫家自占道藝﹐亦以子孫為用神﹐子孫旺相﹐鬼服龍降。今以自占功名﹐子動而克官也﹐如何反為用？非也﹐仍看官爻。官星持世或日月動爻以相生﹐父母持世或得旺官相生﹐其名必成。
陰陽雜職俱以子動為嫌。子孫動子持世皆許必不成名﹐篤則以俗家求名同斷。
功名到何品級章第六十六
占法：水一火二木三金四土五﹐官臨火者﹐官居二品﹐官星屬水﹐一品之尊。
野鶴曰：水至二數位至公侯者﹐何以定之？官設九品﹐數止于五六七品者﹐何以定之？予得其法者﹐指占之法也。我能公侯否？我能將相否？我能一品否？我能八座否？旺官臨日月﹐指日可期﹐官破及刑沖終生失望﹐子孫持世﹐猶如止渴望梅﹐官動生身﹐恰似探囊取物。

求財章第六十八
諸書之論求財﹐弗如黃金策裏眞論﹐予屢試驗﹐惜乎未經分別﹐今以前段為總論﹐以後賢易曉﹐內有屢試而不驗者﹐刪之﹐予另得驗者﹐增之。
財旺福興﹐公私稱意。財空福絕﹐上下連心。上至國計﹐下至營謀﹐無不以財為用。公私占卜皆以財為用神﹐子孫者乃生助財爻之元神也﹐俱宜旺而化吉﹐又宜生合世爻﹐公私皆得如意。若逢衰墓絕空刑沖克害﹐動而變凶﹐日月沖克破者﹐上下皆連心矣。
有福無財﹐兄弟交重偏有望。兄弟乃劫財之神﹐占財之忌也﹐財與兄爻同動﹐必主阻隔破耗﹐倘若得子孫與兄弟同動﹐又為可喜﹐兄動生子﹐故謂之有望。財爻兄爻子孫爻俱動于卦中者﹐更為可喜﹐其故何也？兄動生子﹐子動生財﹐其利甚厚且有久遠源流長之利益也。
兄與財振﹐官爻發動亦堪求。兄爻與財爻同動而官鬼亦動者﹐亦許得財﹐以官鬼克制兄爻之故耳。
財福俱無﹐莫若守株待兔。財與子孫爻俱不現于卦中﹐或現于卦中又值休囚空破墓絕﹐或被刑沖克害﹐求則無益﹐不如守株待兔。覺子曰：倘得日月為財﹐或伏而旺者﹐亦可求也。
父兄爻動﹐無殊緣木求魚。父動克福神﹐兄動克財爻﹐此二爻動于卦中﹐凡有所圖﹐水中撈月。

斷曰：卦中財爻不現﹐亥水兄爻持世﹐父臨月建生助兄爻﹐如緣木以求魚也。
多財反覆﹐必須墓庫以收藏。卦中財臨日月﹐謂之重疊﹐若許求謀得意之時﹐須待財爻入墓之日。且如水作財神辰日而得﹐餘仿此。
無鬼分爭﹐又怕友重而阻滯。兄弟乃爭奪阻隔耗財之神﹐宜官鬼動而制之﹐以免分爭之患。覺子曰：兄爻發動﹐喜鬼動以制之﹐倘卦中兄爻安靜者﹐又不宜乎鬼動﹐反曳財爻之气也。且有口舌。
兄如太過﹐反不克財。舊注卦中一位兄爻動者﹐最為利害﹐如若兄弟爻多動者﹐反不劫財。覺子曰：非也﹐兄爻多者﹐待兄爻入墓之日﹐及克損爻之日﹐必劫其財﹐謂之太旺者損之斯成。
世遇兄臨﹐必難求望。古以卦身臨兄爻﹐難于求望﹐予因卦身不驗﹐以兄爻持世﹐難遂圖謀。
野鶴曰：全在人立通變﹐兄弟而持世者﹐𨿽則為忌亦有不當忌者。

斷曰：若逢久遠之財有否﹐則無財。若問目下之財﹐明日戊午必得﹐其故何也？兄臨世爻日破月破﹐不克變出之財﹐日月俱作財來沖世﹐只因應爻而逢空﹐明日沖實﹐定送財來﹐果于次日送來。
財來就我終須易﹐我去尋財必是難。舊注凡遇財爻生世合世克世持世﹐皆謂之財來就我﹐若卦中𨿽有財爻﹐不來生合世爻亦非我之財也。
野鶴曰：此說財不生合世爻﹐非我之財﹐卽如前二卦兄爻持世﹐何當財來生合﹐總要斷卦之靈機應變﹐徹悟其理﹐自然觸類旁通﹐不可拘執。
福變財生利源滚滚。財得子動生之﹐如財之有源也﹐其利豐厚﹐倘得子動化財﹐財動化子﹐皆同此斷。
兄傷鬼克﹐口舌紛紛。財爻持世﹐兄爻亦動者﹐不獨劫財﹐還防傷已﹐如若鬼動克世者更凶。
覺子曰：黃金策云﹐兄連鬼克﹐口舌難逃﹐謂兄動變鬼沖克世爻者﹐不獨無財﹐還防口舌﹐殊不知兄動變鬼﹐卽是兄化回頭之克﹐自顧不暇又焉能沖克世爻耶？
財局合福德﹐萬倍利源可追。世與財爻或與子孫爻三合成局﹐諸占物追財豐。
野鶴曰：須要在局中或是合成子孫財局生世﹐方為全美﹐倘如合成父局﹐勞碌卒苦﹐合成兄局破耗多端﹐合成鬼局﹐口舌災非﹐克世者更凶。
歲君逢劫殺﹐一年生意無聊。劫殺者乃兄弟之爻也﹐兄臨太歲一年破耗。

世克官﹐官生世﹐須宜謁見；財臨破﹐鬼克世﹐枉費奔馳。
野鶴曰：見貴有兩間也﹐為名者用官﹐為利者用財﹐皆宜持世及生合世爻為吉﹐如逢空破﹐墓絕及動而變凶者﹐徒勞奔馳之力耳。倘若世爻化鬼化克及隨墓助傷者﹐更不宜行﹐若非到彼之凶﹐定在中途遇禍﹐凡謁貴者同斷。世動遇空﹐身興遇破﹐世動化空破者﹐勿曰不吉﹐乃應到彼之月日也。

斷曰：官星持世而空﹐出亥日得見﹐官府財利如心﹐果于出空之日見官﹐財利得意﹐月建財爻生世之故耳﹐官世相合﹐財動相生﹐財持世﹐官無缺陷﹐再得日月照臨﹐彼此緣投有幸。日月照臨者﹐日月生世生財﹐或世爻財爻而臨日月是也。
為名宜父動﹐因利忌兄興。凡與謁貴旣得世與官星相合相生﹐必然得見﹐若為名利﹐須宜另占﹐不可此卦而斷之﹐為名者宜父官兩旺﹐為利者宜財福兩旺。
六合六沖須看用﹐反吟化退枉奔馳。爻逢六合亦要用神旺相﹐世與財官相合乃為吉兆﹐卦逢六沖必須用神受克失陷始作凶徵。卦得反吟及世動化退多見難于行動﹐勉彊而去﹐空返而歸。
貴人謁貴宜世應以相生﹐平人見貴宜官貴而相合。貴人謁貴人﹐宜于世應相合相生﹐平人見貴人﹐宜官貴相合相生及官星持世
覺子曰：有心而問見貴求名者﹐官星持世生世必得官。有心問謁貴者﹐官星生世合世而得見﹐切勿以此得見貴人之官星換作成名而斷也。
貴人謁貴﹐世應若相沖克﹐財伏而空﹐去之何益？
平人見貴﹐官克世世變鬼變克更凶。平人見貴﹐官克世變鬼變克勿去﹐去則須防不測﹐財官生世合世為吉。凡出行求財謁貴出行章參看。
為貴人奔走效力財章第七十
最重財官兩旺﹐不宜世應皆空。世遇財應臨福﹐我益他損；應臨官世逢破﹐他益我損。兄爻持世﹐不如閒處安身；應克世爻﹐防慮他人反目。世遇財官臨應﹐無不遂也。世逢空破墓及動而變凶﹐皆非吉也。應克世兄克世﹐見災還淺。鬼克世世化鬼﹐得禍不輕。
開行開店及各色鋪面章第七十一
世為己﹐應為人﹐大宜相合。財為本﹐福為基﹐最喜同興。古法應為夥計﹐又為下顧之客。黃金策曰：開行定主有人投。覺子曰：須在來人之念；有心而問夥計﹐應為夥計﹐若得世應相生相合﹐彼此同心。應生世﹐他益于我。世生應﹐我益于他。相克相沖而情有變﹐應爻克世﹐我被他瞞；世克應爻﹐他從我願；應臨元武兄爻﹐暗中盜騙；應臨官鬼克世﹐明降災非；世財應兄﹐受他之累；世財應子﹐得他之力。世應空合﹐彼此有虛詐之心也。來人之念重在買賣者﹐須以應爻為下顧之客﹐應爻生合于世﹐生客來交成故舊；世應相沖相克﹐熟人終久變成仇。
鬼作災非須忌動﹐財為活計畏刑沖。鬼動招非克世最忌﹐古云：鬼現爻中見非﹐日有鬼搖克世災禍連系﹐須看鬼值何神克世﹐須于家室章內詳之。財為資本﹐忌衰墓空破及動而變凶﹐或日月刑沖克﹐更忌世與財空﹐俱開不成。
鬼兄發動有制何妨﹐隨墓助傷多凶少吉。鬼動招非﹐若得子孫制鬼﹐或日月沖克鬼爻﹐謂之有制。覺子曰：凡遇兄鬼同動者﹐不可曰鬼動招非﹐以鬼能制兄爻﹐不劫財也。兄弟又為陰隔破耗之小人﹐得此鬼動可以制服﹐獨不宜乃為助鬼以傷身也。
卦得反吟多反復。卦得反吟﹐欲行不行﹐行而又止。才開而又剪﹐剪而又開﹐倘店開久矣﹐遇此一定更遷。
沖中變合再重興。爻逢六合及六沖卦變六合或世財爻子孫共成三合﹐定是前後重興﹐惟六合變沖則不宜也﹐眼前熱鬧﹐終久蕭條。
合夥不嫌兄弟﹐蝕本內外無財。世應臨兄不吉﹐兄爻發動不吉﹐倘若世臨兄爻﹐日月作財星沖克世者﹐反為吉也。內外無財伏而又空﹐必然之蝕本﹐屢驗。
投行損益章第七十二
官若興隆﹐行主可千金之托；應如空破﹐牙人無毫忽之能；官旺應旺﹐生合世爻﹐其人可托﹐如靜衰空破﹐卽是姦險小人。倘若交財﹐定遭欺騙。世被應傷﹐遭他陷害﹐財逢兄克﹐慮彼相瞞；應克世爻﹐帳目難淸﹐兄克財爻已入套矣。兄動貨難脫卸﹐子興物宜交共；兄雀並搖﹐難逃口舌﹐武鬼同發﹐須慮盜賊；

財爻衰者須停脫﹐妻旺當時可脫之；積貨賣貨皆不宜財逢空破及動而變克；財衰宜囤﹐財旺宜脫；如春天占得財爻屬木﹐謂之旺﹐宜速發賣；若臨金水土者﹐宜堆積也。臨火為旺﹐亦不宜堆；此論四時之衰旺也。覺子曰：衰𨿽可買﹐須查其根底﹐𨿽衰宜有根﹐將來再發﹐若無根底﹐終久難于出脫﹐不可不知。

賣貨宜守宜動章第七十四

應財外而世財內﹐須查動靜；應爻以外財爻持世者﹐最好收財﹐必須待應爻發動而與世爻相生相合﹐不然的話﹐應財再旺﹐我也收不到好處。
六沖須宜別圖﹐六合還宜坐守。卦得六沖﹐𨿽宜改圖﹐予屢試之財旺者何須更改﹐財衰者改亦無益。

財衰變旺﹐先屈後生﹐財旺變衰﹐先金後土。謂財爻動而變也﹐財衰變旺﹐目下𨿽賤﹐將來必長。財旺而變衰絕﹐如若賣貨宜于急賣﹐倘若收貨﹐切不可收。買貨與賣貨相反﹐財爻旺而可賣﹐衰者宜買﹐內卦財衰﹐宜于外賣﹐世爻財旺﹐近地相宜﹐財化進神﹐宜往外方發賣﹐世爻化退﹐宜回近地出脫。

行險求財章第八十二
覺子曰：古以靑龍財爻為吉﹐予以此非營生之本﹐乃喪心之事也。行此喪心之事﹐亦敢告之于神耶？旣告之于神而神若以吉凶而報者﹐乃神之教人而作喪心之事也﹐可謂之大道之易卦耶？可謂之伏羲之大神耶？然不獨此﹐凡占非禮非義之事﹐不忠不孝之謀﹐一念之惡﹐神隨知之﹐卽不告之于神﹐亦遭天譴。書曰：惠迪吉﹐從逆凶﹐何須問卜？
婚姻章第八十二
覺子曰：男家占女﹐不拘父母親朋而代占者﹐無不以財為用。女家占男﹐皆以官為用。用官者﹐官有生扶。用財者﹐財爻旺相﹐卽許婚。今見古今諸書文﹐以財旺傷克父母爻﹐不知宜財之旺而為吉也？宜財不旺而為吉也？或曰：黃金策云﹐翁姑不睦﹐皆因妻位交重。海底眼曰：財動喪雙親。易冒亦曰：妻財動父母參商。俱以財動傷克父母﹐未說旺也。予曰：動能傷父母﹐旺則不能傷耶？假令春天占卦﹐財爻屬木﹐謂之女命旺而可取﹐但父母爻定然屬土﹐如此當權得令之財爻不克休囚之父母耶？何必曰動？殊不知者人言動而不言旺者﹐正恐後人駁論﹐所以不言其旺﹐不得己而言動也﹐豈知亦被看破。或曰：據爾之論﹐何以為法？予曰：分占之法也。先要財官旺相﹐旣得吉卦﹐再占妨克父母﹐是其法也。黃金策專以應為妻位﹐易冒亦以應為妻﹐欲其旺相乃為賢良發福之女﹐又以應為女家父母﹐謂之應爻旺相﹐必是富貴之家﹐若休囚必宅貧寒之宅。執此論﹐則旺相賢良之女皆出于富貴之家？種種悖謬﹐予不知何以千百年來竟無一人道破。
男卜女﹐姻財要旺。女占男﹐配鬼宜興。男家代占女﹐專以財為用神﹐以應爻為女家﹐財宜旺相動而化吉﹐應爻不宜空破又克世爻。女家代占男﹐專以官為用神﹐以應爻為男家﹐宜官生旺相動而化吉﹐應爻不宜空破墓絕﹐不宜克世。男人自占妻者﹐亦以財爻為用神﹐以應爻為女身﹐財與應爻皆宜生世持世合世﹐必忌破墓絕空。財旺生身﹐應值破空當取﹐應爻生世﹐財爻破絕勿求。
野鶴曰：財爻應爻同來生合世爻者更吉﹐大抵以財爻為重﹐他爻為附和耳。黃金策曰：應為白髮之妻﹐重應而又重財﹐謬也。

登舟問何日至﹐世爻發動﹐合日值日而到。若得子孫持世及子孫他爻發動者﹐值日而到。世化退及反吟卦﹐中途而返。問舟行平安否？子孫持世克世生世合世﹐一路平安。官鬼持世憂鬱驚恐﹐官鬼沖克世爻災非必見﹐兄動破財。風阻者勿以兄弟為風云﹐乃以子孫為順風﹐動而逢合逢值﹐靜而逢沖之日﹐空逢沖實之日﹐與天時章陰晴同斷。
同舟共行章第九十三

行人章第九十四
問行人之歸期﹐有遠有近﹐遠則應月﹐近則應日﹐亦有去久﹐若在日下當歸﹐又可以日斷也。問行人之否泰﹐另占一卦﹐不可一卦而兼斷也。
世克用兮人未動﹐用爻克世必然歸。占親人在用神章中求之﹐疏者以應爻為用神﹐世克用神且無歸志﹐用神克世近日回家。予試果驗。墓絕空破﹐歸信杳然﹐明搖暗動﹐歸鞭發矣。伏藏才出現之日﹐動而逢合之日﹐動化進神不返﹐用神化退而歸﹐動逢合有事阻隔﹐動化鬼在外危災﹐最怕動而化克﹐還防卦變反吟。世爻空者行人卽至﹐用神靜逢休囚空破者且不思歸﹐動空旺空者實空沖空之月日必歸﹐惟恐卦變克絕及反吟卦﹐用神被克被沖者﹐皆難望其歸也。用神三合﹐沖開之月日而來。卦逢六沖﹐行人無定而不返。用爻墓者開墓之日﹐用爻無病可斷歸期﹐用爻有病在外不安。
野鶴曰：用神墓絕空破受傷﹐謂之有病。來人問行人在外平安否﹐須看有病無病。若問歸期﹐只可看卦象來與不來而斷也。

疾病章第九十九
野鶴曰：人有七情﹐致生百病﹐急于問卜﹐以慰其心﹐柰何卜筮諸書舛錯悖謬﹐柰人反無定見﹐旣取用卦身世身﹐兼用本命﹐又有不看身命用神﹐單看卦驗﹐卦得明夷、大過、觀﹐賁、蠱、夬、豐、同人、大畜、需卦﹐斷之必死。又云：死气喪門臨本命﹐早備衾棺。又云：蛇動主死﹐虎動主喪﹐以星煞六神而斷生死﹐獨不思假使惡煞凶神臨身守舍﹐若得用神二身旺相﹐斷之生耶？死耶？予試多年或生或死﹐全憑用神﹐予皆不驗﹐人有不看用神而斷生死者﹐卦變為六沖是也。
六沖變沖﹐久病難于調治。久病者﹐卦逢六沖﹐卦變六沖﹐不論用神之衰旺﹐乃不治之疾也﹐近病逢之﹐不藥而愈。卦變克新病亦主危亡。卦變者﹐亦六沖而變六沖﹐何其近病亦危？乃因化回頭之克也。如巽木變乾金﹐艮坤化震巽﹐皆謂之回頭相克﹐𨿽非墓絕﹐亦主危亡﹐若化比和、化克去、及化回頭相生﹐近病吉久病凶﹐六沖之故耳。除此沖克之外﹐必看用神。
用遇旬空﹐近病何須憂慮﹐用逢月破﹐久病難許安寧。自占病﹐世為用神﹐占父母弟兄取用神者皆在用神章內詳之﹐用神動靜而值旬空﹐及化空者﹐若無日月動爻沖克﹐許之沖空實空之日卽愈﹐倘逢沖克病𨿽重而不死﹐若值月破須看用神之衰旺﹐旺則愈于實破之日及出月而愈﹐衰而受克者必危。久病用神值旬空月破者﹐卽使用神旺相﹐亦無法以治之。
野鶴曰：海底眼黃金策皆云﹐主空無救中殂﹐不分近病久病﹐非經驗也。覺子曰：予得驗者﹐近病值旬空﹐若逢三合六合者必成久病而終。
用化鬼鬼化用愼防不測﹐忌化用用化忌最難調醫。自占病﹐不宜世爻變鬼及化回頭克﹐占兄弟妻子皆不宜鬼變弟兄妻子及弟兄妻子而變鬼﹐又不宜兄變財財化兄﹐父化子子化父。
野鶴曰：鬼乃父母之元神﹐父動化鬼乃為化生﹐輕病者卽愈﹐久病者鬼化父﹐父化鬼皆主危亡﹐或曰：用神化鬼卽為凶兆﹐假使又值旬空﹐近病者何以斷之？予曰：曾有占驗請試詳
申月庚寅日占子近病得恆之解卦

痘疹章第一百
平時而問男女何時出花鬼﹐鬼爻為用﹐鬼爻靜者逢值逢沖﹐鬼爻動者逢值逢合﹐鬼衰逢生旺之年﹐鬼旺鬼多逢墓庫之歲。
鬼空鬼破塡實之時﹐鬼若伏藏出現之歲。出花而問吉凶﹐卦忌六沖兼忌子孫化鬼及鬼化子孫﹐父化子孫、子孫化父、子孫伏而空破﹐皆非吉兆。問花之密者﹐鬼動而臨日月及動爻生扶﹐花必稠密﹐如值空破休囚墓絕﹐痘必來朗。鬼動乾宮﹐多生頭上。鬼搖坤卦﹐腹上多叢。艮宮多于手﹐兌宮多于口﹐坎離上身﹐震巽下身。火鬼其色紅紫﹐金鬼其色虛白﹐水鬼頌防痘﹐木鬼雜細﹐土鬼腫大。以上四條﹐分占四卦﹐不可一卦而斷之﹐大抵全在子孫爻也。子孫臨日月及日月動爻相生﹐動而化吉不受刑傷沖克﹐爻不亂動﹐花中密以全生﹐痘𨿽暗仍收功。
病源章第一百零一
火屬心經﹐發熱咽漧口燥。水歸腎部﹐惡寒盜汁遺精。金肺、木肝、土為病歸脾胃。衰輕旺重﹐動則牽連身軀﹐騰蛇心驚﹐靑龍則酒色過度﹐勾陳腫脹﹐朱雀則言語顚狂﹐白虎有損傷﹐女子則血崩血暈。元武憂鬱﹐男人則陰癥臨虛。
野鶴曰：此乃黃金策占疾病之首論也﹐予以為之撞門槌﹐對俗人而言﹐不得不以此而斷之。若知分占之法﹐另占一卦以定吉凶﹐庶有後驗﹐若卽以此卦﹐兼斷其生死者﹐如若有靈﹐吾不信也。要知來人而問病﹐有何所犯？何以治愈？及問吉凶何如？我且以發寒發熱而妄猜﹐而病人不得趨避之旨﹐問卦何益？今見此章﹐單言病癥﹐並不言及何法治之﹐如果心經發熱﹐來人豈不知也？請問治其熱者是何法也？無益之論﹐故書刪之。
予嘗以來人問病﹐先命占其吉凶﹐卦得吉者﹐許之調理卽愈﹐不必服藥求神﹐卦得凶者﹐命之延醫﹐卦得鬼動克用神者﹐命之再占﹐或占家宅、或占墳墓、務必求其是何所犯？何法治之？庶不負來人之問也。
鬼神章一百零二
凡占鬼神﹐卦中鬼值休囚及空破墓絕﹐非鬼神之害也。官鬼屬金旺相者﹐武神及西方之神。休囚者﹐刀劍身之鬼。鬼臨木者﹐旺則文神及東方之神。衰則倚艸附木之妖﹐或是刑杖懸梁之鬼。水為河海及北方之神﹐休囚者池井江湖水死之鬼。火鬼火神及雷公电母窯之神﹐休囚者湯火焚燒之鬼也。土鬼土神及中央之朝及掌管山川社稷之神﹐休囚者墻倒屋塌土死之鬼。古以金木水火土各有其神﹐卽如金官者﹐謂之天將辟公金剛伍公嶽公等神﹐予以為非武神者不可﹐書斷之神也有敕卦者有來卦者﹐各方土俗不同﹐書之未載者更多﹐何得各朝而祭之？須問病人或于某武神朝中許願信而未還？或于何朝城穢污作踐？心有所疑者﹐指其神而占之﹐鬼爻或旺或動﹐是此神也。如不上卦﹐再占他處之神可也。鬼值木火水土者﹐皆用此法﹐得罪于正神者﹐香花紙馬祭之。勾惹邪祟之鬼者﹐用漿紙錢夜靜之時金鬼者向西送之﹐水鬼者向北送之﹐餘仿此。
野鶴曰：凡得時災瘟癖﹐照此法而祭送者﹐予屢驗之。倘系瘋癆气蠱﹐旣失調于前﹐酒色傷身﹐又失愼重于後﹐與鬼神何干？發之送之皆無益矣﹐惟節飽食、遠色欲、息气養神﹐其病自減。予遊遍江湖﹐曾至黔蜀粵﹐見其病不服藥﹐專祭祀鬼神﹐先用三牲五牲﹐後至殺牛宰馬一次不愈﹐甚至二三十次﹐因病致窮者多矣﹐殊不知害他命而救命﹐其罪愈彰﹐所以屢見割性命之多者﹐終不能救其死﹐可不戒與？今下路讀書人亦信此邪神者﹐予實不解。神農嘗百艸遺救生靈﹐未聞有何聖賢﹐教人宰牲命以救命也。
李我平曰：易冒以鬼臨金者為關公﹐嶽王補遺﹐又以靑龍神為寺亭候第﹐不知關公之前﹐金鬼與靑龍﹐是何神也？又曰祭者降之以福﹐不祭者降災﹐豈非邪神與？正直之神豈能為此事？此書前後無一不合于理﹐獨此疾病章中﹐亦言鬼神之事﹐予實不服﹐因今人問病﹐開口先問鬼神﹐不得不從俗耳﹐智者察之。
延醫章第一百零三
野鶴曰：有人而問予曰﹐問卜以求神延醫而服藥﹐有是理乎？予曰：若無此理﹐伏羲書卦﹐神農嘗藥﹐作何事耶？彼曰：然則又有不能救者﹐何也？予曰：有根者可以救之﹐無根者則不能也。人之星辰過宮或是交運脫運﹐謂之移花接木之年﹐移其有根之花木者﹐上則遮蓋﹐下宜澆漑則活矣﹐不澆不漑﹐見日則枯﹐服藥求神者卽此意也。若使無根之木無蒂之花﹐𨿽澆𨿽蓋﹐亦無用矣。
自占求醫﹐應爻為醫人﹐代六親而求醫者﹐亦以應為醫人。鬼作憂神休妄動﹐福為喜悅而生扶。自占代占﹐鬼𨿽憂疑之神也﹐若持世及動于卦中﹐得子孫動而制之﹐此醫可請﹐手到成功。若得子孫臨應爻者乃明醫也﹐其故何也？子孫乃制鬼之神﹐非眞正能制法魔之鬼也﹐乃先去憂神﹐我無優也。
應作醫人﹐不宜空破墓絕。應爻空破墓絕休囚衰弱﹐或旺相而被日月動爻沖克﹐或動而化鬼化絕化回頭克﹐藥不見效。
子孫制鬼﹐最喜旺相生扶。子孫臨在應或發動于卦中亦要旺相﹐不受刑沖克害破墓絕空﹐藥必見效。子動化鬼化克﹐其藥不精﹐子動化空實空之日有效。子動化生化旺化進神者﹐其藥更靈。古以子動化子孫﹐其藥必雜﹐非也﹐子動化子孫而旺相者另改藥品﹐卽比仙丹。
醫克用爻近病卽愈。自占病﹐應爻克世者制我之病也﹐應爻克用神亦如此斷。惟不宜乎久病及體弱之人﹐非得克病身亦受其傷矣。應爻臨兄鬼而克用神及克世爻者不拘久病近病必遭其殃。
父爻持世妙藥難調。自占病﹐父持世藥不見功﹐宜于靜養﹐遠色欲息气惱可也。兄弟持世有子孫動于卦中者﹐醫再延之﹐惟嫌鬼旺鬼興誤服藥餌。財爻持世切莫誤食肥甘﹐旺相遇生扶良醫有見﹐休囚逢沖克無藥可醫。
子不代父以占藥﹐妻不代夫而卜醫。子占父宜父爻旺相﹐占藥占醫又以子孫為用神﹐父旺以傷子也﹐一爻不能兩用。妻占夫宜官鬼旺相占醫占藥亦以子孫為用神﹐子旺又能傷夫﹐所以不能代占醫也。
延醫于子孫方﹐治病以應爻定。卦中子孫爻旺者﹐延醫于子孫之方。且如午火子孫或旺或動﹐請南方之醫﹐餘仿此。卦中子孫休囚空破者又看應爻旺否﹐若得應爻旺相生合用神卽于應爻之方請之。且如應爻臨申金﹐延醫必在西南﹐餘仿此。如卦中有一爻獨發而生用神者又以此方而延醫。以五行而定名姓﹐水爻動黠水之姓﹐火爻動姓名像火﹐木爻艸頭木﹐傍土爻姓氏有土。且如占妻病﹐妻爻屬水﹐得申金發動以相生﹐請錢姓之醫以治之﹐予仿比。
不起之病﹐卦中不現其醫。立愈之災﹐爻中不見服藥。屢見占醫之卦﹐無藥可醫之病者﹐神不現其醫矣。若非用神化鬼、鬼化用神﹐卽是忌神化六親、六親化忌神﹐及用神化絕、化克、化墓﹐久病逢沖、逢空、隨鬼入墓﹐此皆無藥而醫也。病之卽愈﹐神亦不現其醫。近病者﹐若非卦得六沖﹐卽觀用值旬空﹐或用神化回頭生。自占者﹐子孫持世﹐此皆不藥而愈也。
醫卜往治章第一百零四
大抵與醫卜相仿。世為己﹐應爻為病人﹐若得世爻旺相﹐子孫財爻持世﹐世生應爻﹐世爻動化進神﹐化回頭生﹐日月動爻臨財星子孫而生﹐在此皆手到病除。近病者應值旬空﹐或動而化空、化回頭生、化旺、化退﹐日月動爻生應爻﹐及卦逢六沖、卦變六沖﹐此皆速宜往救﹐莫令他人先到以成功也。久病者應爻旺相﹐或逢日月動爻相生﹐或動而化生化旺﹐應臨子孫﹐應臨財動生世﹐𨿽然久病﹐我必除根﹐除此之外﹐皆不宜往﹐徒累盛名。
野鶴曰：諸書無不以官為鬼為病﹐應為醫人﹐子孫為藥﹐理固然也﹐但此宜鬼者非鬼非病﹐乃憂神耳。占子病者﹐父母愛子之心﹐未病憂疾﹐況已病乎？自占病者﹐性命在呼吸之間﹐且一人不起﹐舉室驚惶﹐誰不憂乎？此官鬼者﹐卽一家之憂神也﹐惟除此憂者﹐乃賴子孫爻也。如午月甲寅日一人病在危篤﹐醫家不治﹐迎予到宅﹐見有三十餘人至親﹐淚眼不干﹐密友愁容可掬﹐此非一家之憂乎？
及至弟占兄病得屯之中孚卦。

子孫臨日辰﹐酉金兄動以相生﹐服用一劑﹐保管立愈。醫家先用漧薑湯試之﹐少刻開言肚疼之甚。予曰：何如快服此藥。醫家加減調理一夜﹐次日曰愈﹐此人之不死也。因我出門子孫發動一卦而斷定矣。厥後連占數卦﹐皆合前象﹐方敢用大熱之劑﹐起死回生﹐不然一劑涼藥﹐寒上加寒﹐能于治耶？覺子曰：此卦酉金兄動以生子孫﹐服此熱藥而病愈者。使前賢見之﹐又以酉金兄爻而為藥也。凡卜藥亦有當卜之道﹐或醫家看臨危之癥﹐欲投此藥﹐可以起死回生﹐惟恐一失﹐系不少得子孫動者必喜悅也﹐卽可用之﹐用而必效﹐或泛詢行用﹐或長途穹旅﹐無處得寺醫﹐有人傳一奇方占得子孫動者其方必效﹐或半夜更深﹐延醫不及﹐檢黠古方﹐及家藏凡藥﹐實對此癥﹐不敢擅用﹐不可不占﹐皆以子孫為用神﹐但得子孫持世﹐子孫發動﹐服之立可解憂﹐此諸占之子孫者﹐不拘金木水火土也﹐或旺或動﹐卽為喜悅之神。用此方而見效不爻﹐何喜之有。切不可又以金臨子孫而用鍼﹐火屬子孫而用炙﹐錯也誤也。
一日到一府中﹐眾客告曰：老先生昨日在後園僕倒﹐扶起出狂言﹐至今不知人事﹐諸位醫者內有曰：不服人參不能提气。有曰：幸無痰上﹐若喫人參﹐痰上則難治矣。予曰：就卜人參喫得否。

斷曰：此醫不可用之﹐𨿽系子孫持世﹐應為醫人﹐不宜應爻與巳火克申金﹐又有卯木生火﹐世爻𨿽旺﹐巳日一定添災﹐不聽﹐竟延此醫治之﹐卯辰日服藥還保平常﹐巳日忽然變癥﹐遍身疼痛難當﹐病人著急而問予曰：可傷命否？予曰：世值日建﹐何如傷命？快服解藥﹐過此巳午日則止疼矣﹐卽服解藥至申日其病如常。
野鶴曰：前篇俱言子孫持世﹐其病卽愈﹐必要子孫不受克可也﹐後賢不可不知。李我平曰：此論官鬼為憂神﹐子孫為喜悅解憂之神﹐𨿽系古法﹐用之得當﹐非合鬼神之機﹐不能幻想至此﹐然又有不以鬼作憂神者﹐全在來人念之所指﹐彼問病之吉凶﹐若得鬼爻持世﹐鬼動卦中﹐豈為憂神？子孫持世﹐子孫發動則為解憂喜悅之神是也。彼問犯何鬼神者﹐卦現金鬼﹐必沖犯于武神。水鬼者犯罪于河神也。彼問病原﹐火鬼必屬心經﹐水鬼必腎部﹐子孫旺而動者不藥而愈﹐非教人以此子孫爻為治病之藥﹐金為子孫而用鍼﹐火持子孫而用炙﹐殊不知子孫若旺﹐其病自痊﹐何用鍼炙？子孫者值空破﹐用鍼炙而何益？諸書皆曰：土鬼忌熱﹐水鬼忌寒﹐水鬼若生旺之地﹐須用大熱之藥以治之。水鬼寒者﹐宜大寒之藥以功之﹐予不知從何見此。假使用神屬土及子占父病﹐父爻臨土﹐若得火爻發動﹐乃生用爻之元神也﹐豈可以大寒之藥而治元神耶？又如妻占夫病﹐鬼為用神﹐假令夫臨水鬼﹐又可以大熱之藥以攻夫爻之用神耶？常見窮鄕僻壤﹐無處覓醫﹐只謂周易乃大聖大賢之書﹐遵之必靈﹐以此大寒大熱之藥﹐不知坑陷如許之命﹐言及發指﹐此書一出﹐寒熱之藥不可輕用﹐從此泉下無冤鬼矣。

蓋造買宅賃宅第一百零六
父旺持世﹐此處淸安宜久住。父爻旺相持世、生世、合世、及世爻動而化父相生﹐或得日月作父母生合世爻﹐皆為發福之兆。
財爻發動﹐他方仁里另宜求。財動以克父爻﹐另于他處圖之。
爻逢六合﹐終見享通。卦遇反吟﹐多于愁嘆。世爻父爻旺相﹐又得六合卦者事之必成﹐成而久遠﹐但不喜其六沖﹐六沖不久之象。
卦遇反吟﹐倘加世破﹐沖克大凶之兆。
世動而化進﹐綿長百代﹐父興不化退﹐增置千間。世動化退﹐勉彊成之﹐終須退悔。世動而化進神者﹐成後長遠興隆﹐名高利厚。
父動化退神﹐成後凋零破敗﹐倘得化進﹐此後再置千間。
最忌隨官入墓﹐須防鬼動傷身。世爻隨鬼入墓﹐財爻助鬼克世﹐及世爻動而變凶﹐或日月動爻克世﹐皆不宜行。父動克世及世爻父爻空破墓絕者﹐亦不宜行。
野鶴曰：凡蓋造買宅賃宅﹐世與父爻旺相不犯沖克者卽宜成之﹐自是榮華昌盛。如問一家之吉凶﹐𨿽則須宜分占﹐亦待遷居入火之時﹐擇其吉日而占之﹐告于神曰：今某日遷居﹐有礙于父母妻子否？若有妨礙﹐須另擇一時以入門者可也。朝遷以便民間之用者此也。如若蓋造買造占問一家俱宜吉慶﹐假令家有百口﹐欲使人人合其吉者百年買不成矣。
創造宮室章第一百零七
創造興工﹐卦忌六沖﹐鬼動克世最凶﹐隨鬼入墓﹐禍事多逢。父爻旺相﹐世位興隆﹐世父兩爻發動化吉大安宅盛﹐事事享通。
修方動土章第一百零八
世臨福德最相宜﹐官鬼交重有禍基。世旺逢生宜化吉﹐世衰受克且停工。子孫之方宜起手﹐官鬼之位莫挑泥。
譬如子孫屬水﹐起手動工宜于北方。官鬼屬火﹐不可動土于南方。鬼在辰戌丑未﹐此方切忌動土。
豈嫌子象發﹐偏忌父爻虛﹐造成屋宇憂沖散﹐父爻旺相久長居。
遷居過火章第一百零九
占以內三爻為久居之宅﹐外三爻為未居之房。內克外者外宅不利﹐不宜遷之﹐內生外者﹐外宅興隆﹐過遷為吉。
野鶴曰：予以此法不善﹐宅已蓋造買成﹐今欲入火﹐假使占得外宅不吉而不遷耶？旣有新宅成﹐舊宅或已棄矣﹐倘若占得內卦吉者﹐豈可仍居舊宅耶？覺子曰：此法亦有使處﹐來人有問欲棄舊宅而買新宅可乎？用此法者宜也。
歸宅入火章第一百一十
宅之吉凶﹐已于蓋造買宅卦中卜就之矣﹐今占入火之日﹐須將父母兄弟妻兒各為分占﹐宜于此日者用之﹐不宜此日者改之﹐或改日﹐或另擇一時以入門﹐皆可化凶為吉。
入宅六親凶吉章第一百十一
擇于某日入宅﹐宜于父母否？再占一卦﹐宜于兄弟否？再占一卦﹐宜于妻兒否？占父母﹐父母宜于旺相。占兄弟妻兒﹐皆宜旺相而遇生扶﹐不宜變動而化鬼﹐及刑沖克害。或兄弟或妻子內有一卦不利者卽令另擇一日或另擇一時俱可。
野鶴曰：予得周公克制之法﹐凡六親所犯之神﹐令之趨避﹐無一不驗。且如木臨父母命爻﹐財動以傷之父母﹐入宅須擇克制金爻之日﹐安父母之牀榻宜克制金爻之方﹐屢試屢驗。

野鶴曰：以前之卜宅者乃卜蓋造買宅之新居也。常見來人而占久住之家宅﹐古法亦以一卦兼斷諸般之吉凶﹐先論官鬼次論八宮﹐以十二生相定六畜之災﹐午鬼而夭良馬﹐丑鬼而傷耕牛。又以之定人口之匹﹐午爻臨鬼馬命者夭﹐巳鬼爻興蛇命有難。假使午爻臨鬼馬之人不祿耶？悖謬不堪﹐難以數說﹐予不知昔人其何以回復來人之問也﹐要知彼之來意﹐或因連年破耗﹐疑家宅之不安﹐或因屢科之不第﹐或因有子求名﹐疑此宅能興旺子孫否﹐必用子孫親卜﹐或因官不升轉﹐或因子女不孝﹐或因官災火盜﹐或因父母六親多病﹐或因前後左右他人造疑其沖犯﹐或因家有響動﹐邪崇鬼形。須問來人而判﹐曾因官府十載不升﹐疑其家宅有礙。予曰：若以一卦而斷全家之事者予則不能﹐須指其所疑之事而占之﹐其應如是。公曰：何也？予曰：卦中不過干支五行𨿽有現出﹐難以直指一處﹐卽如火鬼發動為竈神﹐府上二百餘間﹐其竈不少﹐誰知何竈而不安。又如卯木鬼﹐門戶不安﹐古以四爻為門﹐尊府門戶不少﹐卽以六爻全為門戶﹐不過定得六重﹐難知何門而不利﹐所以指其所疑之處而占之﹐無不響應﹐公曰：予疑院內不宜有井﹐占問是否。

斷曰：修補之後﹐包爾今科必中﹐財動生官﹐官動生世﹐大吉之兆。果中經魁﹐下科胞弟又發。
福德臨身﹐轉災為福。旺財持世﹐寶藏興焉。子孫持世﹐子孫發動者﹐鬼祟潛行﹐卽有活鬼出現﹐可保平安。子動無憂﹐神藏兔沒。旺相之財持世﹐財動生世合世﹐必有古窖。若問在于何方﹐財來尋我﹐我莫尋他﹐是我之財﹐自然出現。若問何時可得﹐卽以此財爻應期章內斷之。
鬼動爻中眞祟眞妖。鬼臨白虎﹐必有伏屍。鬼臨元武﹐水怪山魑。蛇主虫蛇為妖。雀是官非火盜。勾陳鬼牢獄羈身。靑龍鬼色欲而喪。亥子鬼投河溺井之魂﹐或因水溝池塘之患。辰戌丑未之鬼墻倒屋塌﹐或因墻垣獸頭之犯。寅卯鬼懸梁自縊﹐又為門戶棟梁。巳午鬼火傷窯死﹐兼為鑪竈不安。鬼臨申酉之鄕﹐刀劍之身之魄﹐或因金錢為怪﹐又為狐貍為精。鬼在變爻冤家債主﹐鬼臨日月供養正神﹐受克者必受其殃﹐生世者反得其濟。古法制鬼于庚申日甲子日﹐或于除夕日﹐黃錢數張﹐漿水一碗﹐卦現金鬼者向西送之﹐水鬼者向北送之﹐在人靜處送。屢驗平安﹐餘仿此。覺子曰：予有泊云之法﹐一正可奪百邪﹐見怪不怪﹐其怪自滅。
官克在位﹐為災為禍。鬼動克世﹐或世爻隨鬼入墓﹐及世動變鬼克世﹐乃是冤家債主﹐難免禍殃﹐宜修德作福﹐自然改禍為祥。
財動克父﹐財化父﹐父化財﹐堂上之憂。父動克子﹐鬼化子﹐子化鬼﹐膝前有損。兄弟變鬼﹐鬼變兄弟﹐鬼動克兄﹐妻財變鬼﹐鬼變妻財﹐兄動化財﹐財化兄弟﹐旣防手足刑傷﹐又主分衾折枕。
同居章第一百十四
與六親同居用六親﹐與外人同居看應爻。世為己﹐應為人﹐世應相合相生﹐日月動爻生合世應者﹐彼此俱祥。克世我遭喪﹐克應他遭害﹐世克應﹐他畏于我﹐應克世我被他欺﹐刑沖者同。與六親同居﹐宜于財興用神相生﹐不宜相沖相克。
蓋造官衙章第一百十五
官府自占﹐世與官星皆宜旺相﹐子孫持世及子孫動者且勿行﹐變克變絕反招奇禍﹐六沖化合﹐必獲奇祥。
占衙宇章第一百十六
野鶴曰：凡占舊衙署者﹐與占舊家宅者同斷﹐有因人口多病﹐有因連任不得升遷﹐有因鬼祟顯見其形﹐皆可指其疑者而占。曾有一官因連任不得升遷﹐疑官衙有不利﹐迎于府中﹐卜過半月﹐但有所疑﹐俱曾占過﹐皆不現爻﹐又卜後溝從後流宜否。

蓋造寺院章第一百十七
大抵與家宅同推﹐不宜六沖、卦變墓絕及反吟﹐住持或山主占者皆宜世旺日月動爻相生﹐宜子孫爻動﹐忌官鬼爻與兄爻持世﹐多費無益之事。官鬼持世疾病災殃之累﹐兄爻動而克世者欲造福反成禍胎﹐財官生世者𨿽錢少自有增助﹐子孫旺相而化進神﹐多招徒弟﹐財爻休囚而化退者﹐有始無終。
李我平曰：卜筮諸書﹐二十餘種﹐所論家宅﹐理不歸一﹐不知昔賢是何宅見。卜筮大全：初井二竈三牀四門五爻為人六爻棟宇。黃金策：初爻是宅二爻宅舍三爻為門四為父母五兄弟六妻財。易冒以初爻為幼二爻為妻三弟四母五爻為父上爻為老。他書俱各不同﹐不暇細具。易冒又云：鬼動于內﹐宅室之災。鬼動于外﹐人口之咎。旣以二爻為妻﹐三爻為弟﹐假令內爻鬼動﹐宅室之災乎？弟妻之咎乎？至于五行之鬼﹐八宮之鬼﹐旣以之定禍災炎盜﹐又以之定頭目﹐定病災﹐彼謂炎鬼主回祿﹐鬼在乾宮主頭目之患﹐若以一卦而兼斷﹐豈失火盜之家﹐必染頭目之病耶？有曰：合為門﹐沖為路﹐不論卦內之有無﹐但有暗沖與暗合﹐也應作數。假使有沖無合﹐有合無沖﹐豈有門無路之家耶？殊不知占家宅之趨避﹐願人口以為安﹐財福旺﹐而宅與鬼安靜而家寧﹐于斯而已﹐何必多生枝條﹐以亂後人耳目。
墓葬章第一百十八
野鶴曰：卜墓卜穴﹐古法之謬與家宅相同﹐後賢放諸書而自曉﹐予因求驗之法﹐每遇拜掃之時﹐到各家﹐命伊占之﹐或知人覓地而占之﹐如此多年﹐始得其祕。
尋地章第一百十九
世爻旺相﹐祖父魂安。福德興隆﹐兒孫縮杞。古以二爻為穴﹐內卦為穴﹐騰蛇為穴﹐屢試不驗﹐所驗者﹐世為穴也﹐世宜旺相﹐或臨日月﹐或日月動爻生扶﹐乃吉地也。兒孫乃祭杞之裔﹐宜于持世﹐或在他爻旺相﹐振振螽斯。
三合六合﹐聚气藏風。世沖六沖﹐飛砂走石。卦逢六合或世與子孫爻作六合﹐乃藏風吉穴﹐代代興隆。若得六沖卦﹐或六沖變六沖﹐或世應相沖﹐沖者散也﹐必無气耳。
六沖變六合﹐吉地失而復得；六合變六沖﹐吉地得而復失；此亦有二說：六沖變六合﹐尋得吉地﹐先欲買而不成﹐後又買成﹐或是地運已衰﹐眞龍去後今復重來﹐凡得此者﹐再得世遇子孫旺相﹐急宜用之。曾驗數占﹐綿綿科甲。六合變六沖者﹐或是已得之地而復失﹐或是地運將衰﹐龍將去矣﹐不宜用之。
世旺而化絕破﹐吉處藏凶。世衰而化生合﹐凶中有吉。世爻𨿽旺不宜化破及化墓絕化回頭克﹐主先得吉地﹐後有破綻﹐若非將來下葬﹐不得吉日﹐定因葬後被人傷根﹐吉變為凶之象。世若衰弱﹐動而化回頭相生化長生帝旺化日月化合化進神者﹐先否後喜之兆﹐目下觀其形勢﹐𨿽是不宜下葬之地﹐將來地運興隆﹐變成富貴之大地也；
寅月戊午日占地得頤變無妄卦

斷曰：世爻戌土﹐春天休囚﹐化出午火子孫回頭生世﹐日月世爻其成三合﹐靑龍戲水﹐以化長生﹐水源極遠﹐只因申為月破﹐戌土克子水﹐又被日神沖散﹐春夏有水﹐秋冬必動。彼曰：正是如此。予曰：不妨﹐不可求全責備﹐卦中日月世與子孫共成三合﹐死者安而生者樂﹐子孫昌盛﹐何愁不發﹐後竟葬之﹐辰年下葬﹐酉年孫中亞魁﹐及至子年﹐次孫又登鄕榜。
世化進神﹐千秋綿遠。福德化進﹐百代興旺﹐世宜旺相化進神、化日月、化回頭生、化合、化長生帝旺﹐龍安水源地脈長。
子孫旺相化進神、或化吉、化生、化日月﹐賢孫貴子布滿朝堂。世化退神﹐終須遷改﹐子孫化退﹐代代不如。
日月宜生福德﹐動爻不可傷身。世與子孫爻宜日月動爻生扶﹐不宜日月沖克。
旺世臨虎﹐棺上加棺。旺福逢龍﹐寅葬卯發。世臨白虎鬼爻﹐或是隨鬼入墓﹐皆主地有伏屍。世爻旺相又遇生扶﹐乃為棺上加棺。曾見兩人葬者後竟大發。休囚者則不可耳。子孫旺相又遇日月生扶又遇靑龍﹐卽為吉地﹐寅年葬而卯年發也﹐皆言其發旺之速。
散絕墓空﹐世與子孫勿見。化克化鬼﹐弟兄妻子休逢。世爻子孫爻﹐不宜休囚墓絕空破﹐不宜動逢破散及化破散、化絕、化墓、化鬼、化退神、化回頭克﹐但逢一者皆非吉地。六親不宜化鬼、父化子﹐子化父﹐鬼化子﹐子化鬼﹐兄化鬼﹐鬼化兄﹐兄化財﹐財化兄﹐財化鬼﹐鬼化財﹐此不宜于兄弟妻子。有父母在堂亦不宜鬼化父、父化財、財化父。
應沖世合處逢沖﹐流移遷徒。反伏卦變化克﹐洪泛陵墓。擇地不但不喜六沖卦﹐應沖世者亦非吉也﹐倘應世相合﹐爻逢六合﹐世應子孫三合成局﹐卽為美地。卦得反吟﹐遇沖開之年月必遷。卦得反吟﹐遇沖年沖月必變。內外反吟者乃卦變也﹐如巽變乾﹐坤變震之類﹐名為化絕化克得此卦者﹐重則沖決﹐輕則遷徙。

占地形勢章第一百二十
世旺遇長生﹐來龍甚遠。世衰逢應克﹐對案山欺。兩間旺而明堂寬﹐龍虎衰而左右陷﹐左山旺頭角崢嶸﹐右山衰爪牙埋伏。朱雀遇刑沖前山雜亂﹐元武逢破散後脈空虛﹐龍虎世爻合局﹐虎踞龍蟠之地。
世應相合﹐山環水繞。水口不固﹐上爻一定逢空。道路參差﹐騰蛇必然破散。
世爻當令又長生帝旺于日辰﹐來龍遠大。倘若應爻沖克世爻者﹐必因對山高聳﹐或因臨葬錯對向山﹐如應爻受克者無礙﹐改向可也。世爻應爻中間兩間爻以為明堂﹐旺相者明堂寬大﹐休囚者明堂下陷﹐近世之爻而為案山﹐亦不可克世。龍為左山﹐虎為右山﹐兩山旺者﹐有環抱之勢。俱衰者﹐不能環抱。大抵靑龍宜旺扶頭角軒昂﹐虎山宜衰宜克爪牙埋伏﹐朱雀遇刑克沖散及破墓絕空者﹐前山雜亂。元武逢破散後脈空虛。若得世應龍虎子孫共成三合者乃虎踞龍蟠之大地也。第六爻為上爻﹐若逢空破﹐水口不固﹐逢絕者水涸泉枯。看河道之水者﹐非論水口﹐須看卦中之水爻休囚被克﹐漲退不長。逢生化生長流源遠﹐再遇靑龍源長。看騰蛇為路﹐如逢沖散小路必多﹐旺相者必有官道。勾陳為田坡﹐旺相則有﹐衰破則無。

靑龍持世﹐日辰臨世﹐來龍由左而至﹐旺而有气﹐左右皆無傷克﹐龍虎環抱﹐向山未土𨿽臨月破﹐朱雀亥水為前山﹐申日生之必有朝水﹐或是帶水﹐水有其源。騰蛇為路﹐上爻為水口﹐俱臨月破﹐道路參差﹐水口散亂﹐兩間爻旺相﹐明堂寬大﹐彼曰：果一一無錯﹐此地吉否？予曰：此乃占地穴之形勢耳﹐非關吉凶禍福﹐予笑前賢以一卦而斷父子弟兄妻財官祿﹐予豈效顰耶。若問功名﹐再占一卦﹐禱于神曰：安葬此地﹐我名成否？以官祿章中斷之。發財否？以求財章內斷之。子孫旺否？傷克父母兄弟妻妾否？皆在身命章中父母兄弟章內斷之。若以占形勢之卦兼斷六親及名利者﹐卽如此卦﹐兄弟持世乃貧乏艱難無衣而短食矣﹐請試思之﹐旣得如此吉地﹐若使家徒壁立﹐抱衾孤眠﹐亦可謂之吉地耶？所以予得分占之法﹐實則可以醒世﹐作千古不易之法也。或曰：前說父不宜旺﹐不宜父動化父﹐是何說也？予曰：占地以世爻子孫爻為主﹐父動克子﹐如何不忌？或又問曰：前說化克化鬼兄弟妻子休逢﹐又何說也？予曰：凡占地者﹐世與子孫爻旺﹐卽可用之﹐至于父母兄弟妻財功名﹐須宜另占一卦﹐不可兼斷﹐倘若得地之凶﹐不待另占﹐卽此占地之卦而先現出六親化鬼、鬼化六親﹐卽是刑傷之地耳。只看六親動而化克化鬼﹐不必看衰旺空破刑沖﹐神兆機于動﹐動而化凶﹐願益而告我也﹐我豈能不看又另占耶？

世為用神﹐靜者逢沖逢值﹐動者逢值逢合﹐世空者沖實之秋﹐世破者塡實之候﹐逢合入墓﹐須待沖開﹐獨靜獨發值之而遇﹐世若休囚須旺相﹐若逢旺相待休囚。世為墳地﹐靜者逢沖逢值之年月。卽如世值子水﹐靜者應在于午年月﹐動者應在丑年月亦有應子年﹐餘仿此。世空者沖空實空之年﹐世破者實破之年﹐世逢三合六合﹐或世爻化合﹐或墓于日辰或化墓﹐皆應沖開之日。卦中一爻獨發﹐一爻獨靜﹐亦應逢值之動逢合靜逢沖﹐卽如卦中子爻獨動﹐應在于丑年﹐如子爻獨靜﹐應在于午年﹐餘仿此。

野鶴曰：卜得地于何時﹐還以世爻為用﹐卜得地于何方﹐當以父爻為用也。已葬之後﹐皆以父爻為用可也。父值亥子﹐北方自有吉穴。父臨巳午﹐東南必獲牛眼。父值土爻﹐得地于辰戌丑未之方。父爻臨木﹐東北寅卯堪壽。夫臨申酉地在西南。間有驗于墓方者卽如父母爻屬木得地于未方﹐父母爻屬金得地于丑方﹐餘仿此。
占地師章第一百二十三
應為用神﹐旺相生合世爻﹐𨿽愚亦用。休囚沖克世爻﹐賢亦不宜。世應俱空莫用﹐應臨空破非奇。應爻旺相與世爻相生相合﹐或與世爻作三合﹐不論應臨才鬼兄父﹐人惡之而無才﹐我喜之而有緣。休囚沖克世爻者﹐曾使應臨官父﹐他有博學﹐我被他愚。世應皆空﹐彼此無緣。應逢空破﹐無大無從。
點穴章第一百二十四
世在初二爻穴宜下﹐在五六爻穴在上﹐三四爻穴宜于中。水持世爻穴近于水﹐或是坑高之地。世臨土者﹐卽于高堆點穴。世臨寅木﹐從木盛艸之方。申酉持世﹐有塊石堆。火乃枯焦﹐紅泥焦土及艸木枯焦之處是也。

此地經過法眼﹐皆言其吉﹐久占此地﹐亦許其吉﹐因屢掘逢石﹐無處導穴﹐央予到冢下﹐得此卦。予曰：世在四爻﹐穴在中段﹐因午火持世﹐卽往中段觀看﹐有一處艸木枯焦﹐有幾朵野花紅色﹐別處皆無。予曰：卽此穴也﹐掘之必逢土穴。東家尚疑。予曰：我有一法﹐將錢一丈點記紅原乳﹐入數百錢內﹐公可設下香案﹐禱告于天﹐得紅原錢者﹐卽其穴也﹐令人遍地灑之﹐果得原錢于紅花之下﹐掘之周圍僅有丈予﹐皆泥土也﹐予皆石塊﹐此公次年開府﹐兩公郎五年之內俱登甲榜。
謀地偸葬章第一百二十五
覺子曰：謀地偸葬﹐乃損人利己之事﹐以此喪心之為﹐而問于神﹐卦若有靈﹐是神教人而作喪心之事也﹐殊不知先有心地而後得遇陽地﹐昔有人恃財倚勢﹐期陷貧人﹐謀奪其地以葬親﹐後遇識者而曰：此地不發﹐必無地理﹐此地若發﹐必無天理﹐旣有天理循環之報﹐能久遠昌盛者﹐未之有也。
祖塋舊家章第一百二十六
祖父之墓或葬多年或未久﹐如來卜者必有其因﹐須宜悉明﹐方可決斷。有因連年困苦疑﹐墳塋之不利。有因屢科不發﹐或有子入場﹐疑此風水可能發科否？為己者須宜自占﹐為子孫者命子孫來占﹐有因仕途蹭蹬連歲不升﹐疑其風水有礙。有因子孫不存﹐疑其風水相關。有因六親中父母兄弟妻兒或自身多生疾病﹐疑因風水所致。有因連年官非火盜。有因風水被傷﹐卜其何法而修補。有因閒問祖塋有地脈否。有問祖塋有傷損否。皆以父母為用神。卦遇六沖全無地脈﹐卦變化絕﹐勢若倒懸﹐爻遇伏吟﹐欲遷不遂﹐反吟卦現﹐不遷亦遷﹐卦變六沖龍已去﹐于孫有陵替之危。沖中變合運將來﹐後代有興隆之象。正卦六沖﹐變卦六沖﹐全無脈气﹐卦變化克﹐如倒懸之熱﹐危之急矣﹐凶災立至﹐伏吟卦地脈全無﹐𨿽有遷意而不能遷。卦得反吟﹐心不欲遷而終遷矣。卦變六沖有龍已去﹐子孫從此衰頹。六沖變合﹐先無地脈﹐目今地運將興﹐後代從此發矣。
父母旺相祖墳安然﹐墓絕休囚後裔零落。已葬之地﹐父母為用神﹐宜旺相﹐或日月動爻生扶﹐或動而化生日月化比助化進神乃吉地也﹐兒孫興發之象﹐亡者安而生者樂。旺而又遇帝旺長生者﹐來龍久遠﹐世代興隆﹐不宜墓絕空破﹐及動而破散化退神化絕墓化回頭克化旬空化破散﹐乃凶象也﹐亡者不安﹐生者寥落。
世爻變鬼﹐占者不祥﹐鬼化六親﹐各屬不吉。世爻變鬼及隨墓助傷﹐所占之人不吉﹐兄弟妻子動而化鬼、鬼化兄弟父母妻子者﹐查其所犯而斷也。又有子命化鬼﹐鼠命者殃。午命變鬼﹐馬命不利﹐餘仿此。
野鶴曰：古以父爻不宜旺相﹐父旺父動子孫不安﹐予以為謬也。占舊冢以父為用神﹐父母旺及動而化吉祖父安﹐然又扯到傷克子孫者是宜旺耶？不宜旺耶？惟子孫動而化父及父動化子孫﹐不利于子孫者是也。
因何事所傷章第一百二十七
野鶴曰：須宜另占﹐不可以前卦兼斷﹐專看沖克父母之爻為忌神﹐如得六爻安靜﹐父母有气﹐久後自安﹐不必補修。克神臨火或臨朱雀﹐禍必起于窯竈。倘臨土動或兼元武﹐定因偸葬相傷。金虎因受其驚。木龍有蟠根之礙。克神以帶騰蛇﹐蛇蟻為巢。土鬼勾陳挖掘動土。元武臨水水浸衾棺。克神臨火恐近處開窯作竈或因火燭之事。土克父母兼元武者必有偸葬。臨勾陳騰蛇者築墻蓋屋以致相傷。金虎地震山搖。木虎砍伐樹木。木逢龍動﹐穴下有竹木根傷。火與蛇興﹐冢內有蟻蛇為害。元武水爻克父母﹐穴中黑水相侵。父母被沖﹐地風水漫。金克父母﹐石塊山罔。水沖克者﹐低窪水湧。木爻克父﹐樹木相傷。火克者﹐穴藏蛇蟻。土動者﹐蓋造墻垣。父母爻被日月動爻沖克及卦動化沖﹐如在艮坤之宮﹐卦得亥卯未合成木局克父﹐必有地風衝歪棺槨。如在離宮﹐卦得申子辰水局克父者﹐穴中水湧﹐水泛棺歪。如在震巽之宮﹐金局沖克者﹐山罔石塊。如在乾兌之宮逢火局沖克父母者﹐定因窯火雷驚。爻中水動﹐地窪水浸。卦得木動﹐竹木根滕。火主虫蛇﹐土因動土﹐果有犯之﹐速宜修補。爻無亂動﹐須觀五行之有無﹐卦若安逸﹐又看地支之缺陷。六爻安靜並無沖克父母之爻者﹐又看五行之所少也﹐卦中無土﹐須築墻垣。卦無金星﹐石碑可立。六爻火星缺陷﹐可立煙竈﹐或安看守墳塋之宅舍。水爻不現﹐可作池塘及開河道。木爻不現﹐多栽樹木。此言五行之所少者﹐非獨不上卦也﹐有現于爻空破墓絕無气者亦如無也。
修補祕法章第一百二十八
因窯竈而傷者﹐命道祭火神設火醮而安之。偸葬及動土相傷﹐命道設蘸以安土神。因受驚恐而傷者﹐命道設醮而安墳。或因有竹木蟠根及石塊相傷者﹐須于墳旁挖坑三尺以探之﹐輕輕去其竹木石塊﹐仍命道安墳則吉。倘因蛇蟻為巢者﹐多栽苦楝樹其蛇蟻自散﹐勿信人以焚之其巢穴﹐傷損性命﹐予曾親見兩家見蛇為巢﹐用火焚之﹐後子孫衰敗不堪。倘穴中因水淹沒者﹐若有消水之法﹐設法以消之﹐倘因地窪終無消水之法﹐不得不選地而遷也。或因地風吹歪棺木者﹐前得挖坑二三尺﹐以探之﹐後果歪者仍歸于正向﹐命道安墳則吉。
再占修補吉凶章第一百二十九
子孫持世﹐子孫動搖﹐修之則吉。旣問修補之吉凶﹐則認世爻為用﹐子孫持世﹐子孫發動﹐修之必獲淸安。宜鬼世父爻空﹐遷則獲福。鬼克世﹐我必有害﹐父空破墓絕再被日月動爻傷克者﹐乃因傷者重﹐培補亦無益矣﹐當宜遷之。覺子曰：古以遷塋之說﹐謂父母之墓受傷﹐兒孫一體之感﹐致生災禍﹐理之有也。遷塋改葬不得不行﹐觀世人富者不貴﹐改祖墓以求榮﹐有子不富遷父冢以求富﹐將父母之遺體為市井之貸利﹐不意天理難容﹐身之未榮家產蕩盡﹐財之未發絕減兒孫。予之見者不可勝數﹐附此戒之。
新亡附葬祖塋章第一百三十
六沖變沖﹐卦變絕克﹐父母受傷﹐內外反吟﹐且宜他葬。世爻受克隨墓助傷﹐世動化克化鬼﹐附葬不宜。父母兄弟妻兒動而化鬼化克﹐俱有刑沖傷重﹐惟喜世及六親不逢變克﹐隨卦靜六合﹐必得存亡之安。

（提 要
臣等謹案：
《六壬大全》十二巻，不著撰人名氏。巻首題「懷慶府推官郭載騋校」，蓋明代所刊也。六壬與遁甲、太乙，世謂之「三式」，而六壬其傳尤古，或謂出於黃帝元女，固屬無稽，要其為術，固非後世方技家所能造。大抵數根於五行，而五行始於水，舉陰以起陽，故稱壬焉；舉成以該生，故用六焉。其有天地盤與神將加臨，雖漸近竒遁九宮之式，而由干支而有四課，則亦兩儀、四象也；由發用而有三傳，則亦一生二、二生三、三生萬物也；以至六十四課，莫不原本羲爻，蓋亦《易》象之支流，推而衍之者矣。考《國語》伶州鳩對七律，以所稱「夷則」、「上宮」、「大呂」、「上宮」推之，皆有合於六壬之義。然占卜之屬，特以五音、十二律定數，未可即指為六壬之源。《呉越春秋》載伍員及範蠡「雞鳴」、「日出」、「日映」、「禺中」四術，則時將加乘，與龍、蛇、刑、徳之用，一如今世所傳。而《越絕書》載公孫聖亦有「今日壬午時加南方」之語。其事雖不見經、傳，似出依托，然趙煜、袁康皆後漢人，知其法著於漢代也。其書之見於史者，《隋志》二家，《唐志》六家，《宋志》三十家。而焦竑《經籍志》所列，多至八十三家，然多散佚不傳；其存者，如徐道符《心鏡》，蔣日新《開雲觀月歌》，凌福之《畢法賦》，及《五變中黃經》，術家奉為蓍蔡。而流傳既久，其說多岐，或專論課體而失之拘，或專主類神而失之粗，或雜取神煞而失之支，又皆不可以為法。是書指《大全》，閒人按總集諸書遺文，首載《入手法》、《總鈐》及貴神月將徳煞、加臨喜忌，旁採唐以來諸論，若《括囊》、《雲霄賦》、《課經》之類，而緯以《心鏡》、《觀月》諸篇，採擷頗為詳備。案《明史?藝文志》有袁祥《六壬大全》三十三巻，名目相同而巻帙不符，未必即祥所輯。要其博綜簡括，固六壬家之總匯也。惟是六壬所重，莫過於天乙貴神陰陽順逆，為吉凶所自出，如匠者之準繩矩矱。而先天之徳起於子，後天之德起於未，以五乾徳合神取貴。承學之士多未究其源，我聖祖仁皇帝《御定星歷考原》一書，貫串璣衡，權輿圭臬，以訂曹震圭晝丑夜未之訛，實足立千古之標準。我皇上御纂《協紀辨方書》，複申暢斯旨。謹按《呉越春秋》所載子胥之占，三月甲戌，時加雞鳴，而以為青龍在酉，是甲日醜為陰貴也。範蠡石室之占，十二月戊寅，時加日出，而亦以為青龍臨酉，功曹為螣蛇，是戊日醜為陽貴也。沿溯古義，皆與聖謨垂示先後同符，是書所取天乙尚沿俗例，巻中僅載先天貴人一圖而不用，未免失之舛漏。又所載十二宮分野，亦多拘牽舊說，未能訂正；今以原本所有，姑仍其舊録之，而附訂其失如右。

六壬大全巻一 起例
入手法
十干寄宮
甲課寅兮乙課辰，丙戊課巳不須論。丁己課未庚申上，辛戌壬亥是其真。癸課原來丑宮坐，分明不用四正神。
一 賊克法一下克上曰重審，一上克下曰元首
取課先從下賊呼，如無下賊上克初。初傳之上名中次，中上加臨是末居。三傳既定天盤將，此是入式法第一。
二 比用法即知一也
下賊或三二四侵，若逢上克亦同雲。常將天日比神用，陽日用陽陰用陰。若或俱比俱不比，立法別有渉害陳。
三 渉害法
渉害行來本家止，路逢多克為用取。孟深仲淺季當休，複等柔辰剛日宜。
四 遙克法
神遙克日曰蒿矢，日遙克神曰彈射。四課無克號為遙，日與神兮逓互招。先取神遙克其日，如無方取日來遙。或有日克乎兩神，複有兩神來克日。擇與日幹比者用，陽日用陽陰用陰。
五 昴星法
無遙無克昴星窮，陽仰陰俯酉位中論初傳也。剛日先辰而後日，柔日先日而後辰論中末也。
六 別責法戊辰、戊午、丙辰三剛日各一課，辛未二課，辛丑二課，丁酉、辛酉各一課
四課不全三課備，無遙無克別責例。剛日乾合上頭神，柔日支前三合取。皆以天上作初傳，陰陽中末干中寄。剛三柔六共九課，此課先賢俱隱秘。戊午戊辰與丙辰，乾上皆午是為親。辛丑辛未各二日，下上皆是丑未真。丁酉當為己丁是，辛酉原來是酉辛。
七 八專法論克不論遙
兩課無克號八專，陽日日陽順行三連本位數。陰日辰陰逆三位，中末總向日上眠。
八 伏吟法
伏吟有克還為用，無克剛干柔取辰。迤邐刑之作中末，從茲《玉厯》職其真。若也自刑為發用，次傳顛倒日辰並。次傳更複自刑者，衝取末傳不論刑。
九 返吟法
返吟有克亦為用，無克別有井欄名。若知六日該無克，丑未同乾丁己辛。丑日登明未太乙，辰中日末識原因陽日用辰，陰日用日，辰上作中，日上作末。

歲神煞
歲君：甲見甲之類。年中天子之象，統攝諸位神煞。入占尊長、部官之事。占官有面君之喜，不宜受克。
太歲：子年見子之類，利仕人不利常人。受克尊長凶。如六月以前見舊年太歲，舊年事；七月以後見來年太歲，來年事。
太歲神煞：
太歲排輪十二宮，歲破大耗與年衝，前五死符並小耗，病符後一不離宗。後二太陰並吊客，後四白虎是凶神。歲前二辰喪門凶，前四畜官官符神。太歲前維力士位，對衝蠶室有災星。奏書後維衝博士，五鬼逆行子加辰。黃幡只向三合來，對衝豹尾不虛云。金神之殺隨年乾，納音金位同庚辛。三合中衝兩邊去，便是伏兵大禍神。亥子丑年將軍酉，三年一移順仲神。

內天罡行十二經絡
每日寅罡在肺經，卯時流入大腸中。辰胃巳脾午心上，未時卻入小腸行。申在膀胱酉在腎，戌在胞絡亥三焦。子膽丑肝循環轉，晝夜周流十二遭。今年某月初一日趕來年某月初一日，有閏前加二十五，無閏後退六爻神。陽日後三辰，陰日前三辰。

徳煞
徳
徳者，福佑之神也。凡臨日入傳，能轉凶為吉，其名有四。
凡四徳入傳皆吉，日徳尤吉，俱宜生旺，不宜休囚。
凡徳入傳，忌逢空、落空及神將外戰。
凡徳加乾發用為鬼，仍作徳斷，不可作鬼斷。蓋徳神能化鬼為吉也惟寅己、申乙、巳辛、亥丁四課。
凡徳下賊發用，得貴神生扶，仍作全吉斷。若無生扶，又見克洩，主喜處生憂如乙未日申加午發用，申為乙徳，受制於午，但陰陽貴神屬土，脫午生申，仍作全吉之例。
凡徳神歸日，又會合帶貴，主有意外之喜，惟不宜占病訟。
凡徳臨死絕，又值凶神，減力十之七。
凡日徳發用，又同下神克日，名鬼徳格，主邪正同途如丁酉日陽貴幹上亥之例。如乙酉日遙克，申加酉發用，申為酉挾，化徳為鬼之例。
凡徳作官星，又臨朱雀，名文徳格。主應舉得官，在官得薦如己巳日寅加己發用作官星，順貴朱臨寅之例。
合
合者，和順之神也。凡臨日入傳，主有和合成就之喜。蓋陰陽配合，竒偶交逑，故凡事皆成也。其名有三：
行合，即三合也。亥夘未木合，主繁宂駁雜；寅午戌火合，主侶黨不正；巳酉丑金合，主矯革離異；申子辰水合，主流動無滯。
凡三合入傳，主事闗牽連，必過月方能了結。又主親識朋儕眾多之應。
凡取成合之期，以三合決之。凡三合入傳缺一神，名折腰格，占事必待缺神值日方能成就，亦名虛一待用格如寅午戌日見天空則發，若不見天空，主戌月戌日成就之例。
凡三合入傳缺一神，若日辰偶足之，名湊合格，主有意外和合之事。以所湊乘神決之如湊足者是貴人，即主貴人提攜之例。。
一干合，即五合也。甲己為中正合，乙庚為仁義合，丙辛為威權合，丁壬為淫泆合，戊癸為無情合。
凡中正合，乘貴人，主貴人成就，見貴得喜。與徳神並，能解諸凶；若與陰、後、玄、六相乗於夘酉，主有貴人奸邪不正之事。
凡仁義合，乗吉神，主內外和合，作事端肅。若乗陰、六、玄、後臨夘酉，主假仁義，以行奸邪之事。
凡威權合，乗吉神，主施威徳，布號令，觀兵耀武。若乗凶神，主挾令凌下，卑幼勉強承順。
凡淫泆合，乗吉神，主陰謀成事。若乗陰、後、玄、六臨夘酉，主女子淫奔，家門丑行。
凡無情合，乗吉神，占事半實半虛；若乗凶神，主外合中離，百凡承順，皆是假意。
一支合，即六合也。子與丑合，寅與亥合，夘與戌合，辰與酉合，巳與申合，午與未合。
凡合與徳同入傳，百事皆吉，即會凶神，亦主凶中和合。
凡合入傳，視其進退，傳進利進，傳退利退，百事如意。
凡寅合亥為破合，巳合申為刑合，主謀事合而不合，成而不成；若得貴、青、徳、祿乗之，仍主順利。
凡合入傳，謀事皆成，但不能實時了結；不宜占病、占訟。
凡暗中三合、六合，主失脫藏匿難獲。凡天后、神後作合，占婚立成；二後與陰合，同。
凡刑破二合發用，主內吉外凶，占事須費力，然終有濟。
凡合逢空、落空，又見刑害，主和中藏禍，有徳可觧。
凡合帶刑害，雖乗吉神，其力亦減，但可宛轉小用。
凡合克日，或乗蛇、虎、朱雀，主合中有害，不可托人謀幹，恐以直信人，反招不足。
右三等合神，以干合為主，支合次之，行合又次之。要與徳神、祿、喜臨並，方為全吉。可制諸凶，若乗凶神，全無吉助，則又與凶合，返為凶矣，凡占宜詳之。
凡三合在課中，作干支上神，交克干支者，主外合中離，各懐疑忌；或為人挑激，以致不和。如甲子日乾上戌，支上申，干支三合。
凡支干互合，名同心格，主一切謀望皆同契齊心成就；若見刑害，又主同心之中暗生妬忌如乙酉、丙申、戊申、辛卯、壬寅五日返吟，干支相合，上神亦相合，此五日支加乾，或干加支，皆干支會合。又如甲申日亥加乾，上神與支干合；乙亥日卯加乾，上神自相合；壬午日未加乾，乾上神與支合，支上神與乾合之例。
凡支加乾上神鄰近相合，主彼此變換，共相謀事，皆有成就惟壬子、戊午、丙午三日有之。
凡支加乾，上神相合；或干加支，上神相合；亦可共謀成事惟丙寅、丙戌、戊戌三日有之。
凡支干上神相合又相破，而支干自相害者，主謀事外面假意相成，中心百方暗毒惟壬申、戊寅、丙寅日六課。
凡干支相害，上神相合，無刑破者，主外合中離，凡相成皆是假意；若逢空，仍主暗害乙卯、辛酉二日四課。
凡日乾與支上神相合，支辰與乾上神相合，名交車格。主交闗、交易、交加、交換、成合之事。凡值此課，惟利合謀，不利解散，此例除甲寅、庚申、丁未、己未、癸丑五日，申克日，戌克神之例，支乾同處，交車不合。餘則一日一課，有十種分別，占用各隨所宜：
一、長生合，宜合本營為如甲申日乾上巳為支長生與支合，支上亥為干長生與乾合之例。
二、財合，宜交闗取財，或財相交渉如辛丑日乾上子為支財與支合，支上卯為乾財與乾合之例。
三、脫合，不宜交渉，主彼此各懐相脫之意如戊辰日乾上酉脫支與支合，支上申脫干與乾合之例。
四、害合，主彼此合謀，暗中相害如丁丑日乾上午害干與支合，支上午害支與乾合之例。
五、空合，主先好後惡，有初無終如辛亥日乾上寅空與支合，支上卯空與乾合之例。
六、刑合，主和美中生出爭競，及彼此各不徇理如癸卯日乾上戌刑干與支合，乾上戌刑干支支合，支上子刑支與乾合之例。
七、衝合，主先合後離，不論親踈，五倫皆然如甲申日乾上巳與支合支上亥與乾合己亥寅申又相衝之例。
八、克合，主交渉中生出爭訟，或匿怨相友，笑裏藏刀如庚子日乾上丑克支與支合，支上巳克干與乾合之例。
九、三交合，凡交闗用事，必有奸私，或相交渉二三事三交者，孟仲季各臨孟仲季也。惟己酉日辰加乾，丁卯日戌加乾二課。
十、交會合，主內外相合，或世代義門，更有外人相助。凡占事事有成，惟忌空亡如乙丑日乾上子與支合，支上酉與乾合，三傳巳丑酉又三合之例。
鬼
鬼者，賊害之神也。干支之中，陽克陽為鬼，陰克陰為鬼。《經》曰：「傳中多鬼，事事不美。謀望不成，凶災及已。」
凡晝鬼主公訟是非，夜鬼主神袛妖祟。
凡鬼入傳，若日乾旺相，及傳中命上見子孫，亦不為凶。
凡占訟、占病，忌鬼入傳臨日，見子孫為救神，減凶。
凡占盜，鬼入傳自相衝，或與盜神相衝，其盜自敗。若落空帶合，返難捕捉。
凡干上鬼發，事多不美。若用見徳合，猶可望事求官，
凡傳鬼帶合，又克日之上神，主求事返覆，進退而後成。
凡鬼宜衰敗，不宜生旺。若鬼當時亦不為凶如甲為戊鬼，若在仲春，木貪生發，返不制圡之例防過時為凶。
凡鬼發用又臨克日之鄉，名攅眉格，占事主有兩重不美。即遇救神，惟解其一如庚辰日午加巳發用之例。
凡辰上神發用為日鬼，占事主自家人暗害。
凡鬼多有制，返不為凶，占事未免先值驚危，終乃無畏。若聞人謀害，但是商量，不能為禍。惟白虎發用，大有畏忌。要年命上有制虎之神如壬辰日遙克，戌加未發用，三傳戌丑辰，上下六鬼，午上寅木制之之例。
凡鬼發用是支上神，又引中末入鬼鄉，謂之家鬼弄家神，有救無禍，無救有禍如己丑日支上寅發用作鬼，三傳寅卯辰皆歸木鄉之例。此課幹上申制鬼有救。
凡鬼臨日乾，得支上神救者，主一切事自外來，要家內人解救如癸亥日，辰加乾發用為鬼，支上寅制之之例。
凡鬼發用，生末傳作干長生，名鬼脫生格，主一切先凶後吉如丙子日，乾上子發用為鬼，生末傳寅之例。
凡三傳入局為鬼，返生起乾上神生乾者，主一切返凶為吉如庚午日，乾上辰，三傳戌午寅火局為鬼，生起辰土以生乾之例。庚寅午戌、乙巳酉丑、己巳七日同。
凡貴徳臨身制鬼者，返吉如乙丑、乙巳二日，酉加巳發用，三傳酉丑巳，金局為鬼，申加乾為徳、為貴，初傳螣蛇火制破其局，末傳巳返作救神之例。
凡傳鬼為貴人盜氣，亦能免禍如辛巳日，午加辛發用，三傳火局，順逆貴皆貴、勾、常，盜火氣，不能為鬼之例。
凡傳雖脫干，能制暗鬼，名借益格。猶有人來賺我，恰值我有禍患，欲借其力，姑遂其意，用之反有益也暗鬼者，貴神克乾也其凶甚於眀鬼。如壬子日，未加卯發用，三傳木局脫干，夜貴貴、勾、常為鬼，木反制例之例。
同類受克絕，以神而言：甲乙日寅卯臨申酉，丙丁日以巳午臨亥子，庚辛日申酉臨寅卯，壬癸日亥子臨巳午。
同類受克絕，以將而言：甲乙日青龍六合乘申酉，丙丁日朱雀螣蛇乘亥子，戊己日貴人太常勾陳乘寅卯，庚辛日白虎太陰乗巳午，壬癸日玄武天后乗辰戌丑未。
墓
墓者，伏沒之神也。五行墓於四季，有陰陽生死之分，陽幹死地即陰乾生地，故未為甲癸之墓，戌為丙戊乙之墓，丑為庚丁己之墓，辰為壬辛之墓。此蓋戊己從丙丁分順逆，以子依母，以生金也。
未為木墓，戌為火墓，丑為金墓，辰為水土墓，此蓋單論五行。土寄坤，不以干之陰陽分順逆也。
壬課重在日，惟従十干墓，不從五行墓。
凡墓入傳臨日，主一切閉塞暗昧，壅蔽不通。
凡辰未為日墓，戌丑為夜墓。日墓剛速，夜墓柔延。
凡墓，朦昧昏暗。若夜墓臨日，自暗投眀，諸事尚有觧救。如日墓臨夜，自眀投暗，一切愈見模糊。
凡寅加戌，巳加丑，申加辰，亥加未，自生入墓。如人墜井中，呼天不應，占病必死，占賊難獲，占行人不來。
日之長生處乗墓，如甲乙日未臨亥，丙丁日戌臨寅，戊己壬癸日辰臨申，庚辛日丑臨巳是也。主舊事再發。
長生處自乗墓，主新事廢。如甲乙日辰加亥，丙丁日未加寅，戊己壬癸日丑加申，庚辛日戌加巳是也。
天上長生坐墓，如甲乙日亥臨辰，丙丁日寅臨未，戊己壬癸日申臨丑，庚辛日巳臨戌是也。主不能生。
以身入墓，如甲乙日末傳遇未，丙丁日末傳遇戌之類。
以魂入墓，即墓神覆日。如甲乙日未加寅、辰，丙丁日戌加巳、未之類。
以日入墓，即坐墓。如甲乙日寅、辰臨未，丙丁日巳、未臨戌，戊己日巳、未臨辰，庚辛日申、戌臨丑，壬癸日亥、丑臨辰。
以支戴墓、坐墓：戴墓，如辰加亥子並辰戌丑未，未加寅夘，丑加申酉，戌加巳午。坐墓，如亥子並辰戌丑未臨辰，寅卯臨未，申酉臨丑，巳午臨戌。
行年化氣入墓，如行年立寅午戌，化氣屬火，火墓戌，加戌是也。
年命乘墓、坐墓，如年命在子，辰加子為乘墓，天上子臨辰為坐墓。
以鬼入墓，如甲乙日申酉加丑，丙丁日亥子加辰之類。
凡生旺入墓，成而後敗；墓入生旺，敗而複成。
凡墓，主暗昧憂鬱。若自墓傳生，凶中變吉。
凡墓發用。宜日乾有氣。若無氣，占病防死，占訟防屈。
凡中傳見墓，百事不順，進退有悔。
凡末傳見墓，百事終無成就。
凡墓逢衝則吉，逢合則凶，若年命上神能克制之亦可為救。
破
破者，散也，移也。
其法以十二支環列，陽日破後四辰，陰日破前四辰。
凡破臨日入傳，惟宜散凶事，不宜成吉事。
凡破，占事多中輟，有更改，一切主不完全。
凡午破卯，主門戶破敗。辰破丑，主牆墓頹圮。酉破子，主陰小災悔。戌破未，主人物刑傷。亥破寅，申破巳，破中有合，敗而複成。六反皆然。
凡四孟見酉，四仲見巳，四季見丑，名破碎煞。主凡物破損不完。
凡破衝，主人情暗中不順，占婚雖強成，難久；占產，胎動難生。若乘喜神、吉神，凡事艱難後遂。若逢空、落空，有聲無形。
凡年命上見破，主有傷損。
害
害者，阻也，斗也。
其法，以十二從辰戌兩分，自戌至卯橫列於下，自酉至辰橫加其上，上下相交，即為六害。
凡害臨日入傳，事多阻隔。
凡子加未，主事無終始，官非口舌；未加子，主營謀阻滯，暗裏生災。
丑加午，主公訟不利，夫妻不和；午加丑，主事不分明，終難成就。
寅加巳，主出行改動，退利進阻；巳加寅，主謀事阻難，口舌憂疑。
夘加辰，主事有虛爭，好中生斗；辰加夘，主求謀多阻，幹事無終。
酉加戌，主門戶損傷，陰小災疾；戌加酉，主暗中不美，奴婢邪謀。
申加亥，主先阻後得，事必有終；亥加申，主圖謀未遂，事必無始。
凡害必無和氣，只宜守舊，動即有失。
刑
刑者，傷也，殘也。
其法，以十二支環列，以丑寅向下兩分，隔四刑之。始分而刑三，衝中者自刑；終交而刑二，衝首者自刑。故丑刑戌，戌刑未，未刑辰，辰衝戌為自刑。寅刑巳，巳刑申，申刑亥，亥衝巳為自刑。子刑夘，夘刑午，午衝子為自刑。夘刑子，子刑酉，酉衝夘為自刑。是以辰亥午酉為自刑，子夘、夘子為互刑，丑戌未、寅巳申為朋刑，故曰三刑也。
凡朋刑，惟丑能刑戌，戌能刑未，未不能刑戌，戌不能刑丑。惟寅能刑巳，巳能刑申，申不能刑巳，巳不能刑寅。而《世本》有以未刑丑，申刑寅者，蓋未考衝首為自刑，而誤以衝為刑也。
凡刑入傳臨日，必主傷殘。自刑，主自逞自作，以致落敗，事非順成，死非正命。凡互刑，主無禮無義，大蕩小淫。子刑夘，死敗相刑，門戶不正，尊卑不睦；夘刑子明入晦出，子息不律，水陸不通。凡朋刑主無情無恩，威凌勢挾。寅刑巳，刑中有害，舉動艱難，災訟駢至。丑刑戌，刑中有鬼，貴賤相侮，病獄交臻；巳刑申，戌刑未，刑中有破，長幼不和，身家零落。
凡刑發用，必見刑傷。刑乾憂男，刑支憂女，刑時憂事。
凡時刑日憂小人，日刑時憂君子。
凡旺刑衰則福過，死刑旺則禍起。
凡發用刑月建，不可對訟；刑日陰，不可逺行；刑干支，諸事不安。
干刑應在外、速，支刑應在內、遅。
凡上下相刑發用，又作日鬼，主返複乖戾，公私兩憂。
衝
衝者，動也，格也。
其法，以十二支環列，陰陽各相對為衝，即返吟之例。
凡衝日，主身有攸往。衝辰，主宅有動移。
凡衝，主動移，返複不寜。子午相加，道路驅逐，男女爭交，謀為變遷，舉動差失。卯酉相加，分異失脫，更改門戶，乘陰臨合淫泆奸私。寅申相加，邪鬼作祟，夫妻異心。巳亥相加，順去逆來，重求輕得。丑未相加，弟兄兩意，謀望無成。辰戌相加，悲喜不眀，奴僕逃走。
凡歲月日干支皆不宜衝，衝歲歲中不足，衝月月中不足。
凡吉神不宜衝，衝則不吉。凶神宜衝，衝則不凶。
課目
元首一上克其下，天地得位品亨通一干。
重審一下賊乎上，以臣諍君詳審行二坤。
知一上下有二克，擇比而用先執中三比。
涉害俱比俱不比，度難歸家分深淺四坎。
遙克神日互相克，蒿矢彈射勢為輕五睽。
昂星四課旡克遙，陰伏掩相陽轉逢六履。
別責無克三課備，剛三柔六九為宗七。
八專二課俱無克，日陽辰陰順逆從八同人。
伏吟天地皆不動，乙癸有克法不同九艮。
返吟有克往來取，井欄丑未乙巳辛十震。
三光用神與日辰，時旺將吉萬事通十一賁。
三陽日辰與用旺，日辰貴前貴順登十二晉 四順。
三奇子戌尋大吉，申午辰寅子亥辰十三豫。
六儀六甲勾頭發，日儀午逆未順吉十四兌。
時太發用歲日方，龍合財德最為強十五泰 天恩。
龍德太歲與月將，天乙發用致福祥十六革。
官爵歲月與年命，驛馬魁常發用者十七益。
富貴天乙乘旺相，日乘年命相生良十八大有。
軒蓋三傳午卯子，正七兩月相當是十九升。
鑄印發用戌加巳，戌卯巳爐綬太常二十鼎。
斫輪太衝申上傳，卯輪庚斧乙庚歡二一頤。
引從二傳引干支，又有貴引幹年吉二二渙。
亨通三傳遞生日，天生地生有兩般二三漸。
繁昌夫妻年為用，德合旺相卦應咸二四咸 德孕 旺孕。
繁華貴旺祿馬發，干支年命吉將傳二五師。
德慶天德與月德，干支二德用為先二六需。
合歡日上遁干合，吉將三六合用兼二七井。
和美專言四課事，各合互合皆為歡二八豐。
斬關魁罡日辰用，重土塞門斬關行二九遁。
閉口旬尾加旬首，又有武陰逆四從三十謙 刑德。
游子季用又乘丁，再遇天馬是西東三一觀。
三交四仲來加仲，三傳皆仲陰合逢三二姤。
亂首支加乾克干，干加支上被克同三三觀。
贅胥支臨乾被克，干加支上克支通三四旅。
衝破日辰衝為用，更兼歲月破神並三五。
淫泆後合乘卯酉，狡童泆女此中情三六既濟。
蕪淫三課有克課，交軍克下男女爭三七小畜。
解離日辰互克下，年命互克亦同稱三八。
孤寡四季之前後，春巳孤丑寡星臨三九。
地盤為孤天盤寡，陽孤陰寡三盤呈四十。
度厄三課上下克，上下相克長幼驚四一剝。
無祿四下賊乎上，小人無禮肆縱橫四二否。
迍福八迍兼五福，吉凶參駁此為名四三屯。
侵害日辰六害兼，年命發用最凶殘四四屯。
刑傷干支三刑用，又兼本命與年命四五損 凌犯。
二煩日月加四仲，斗擊丑未此為言四六訟。
天禍四立絕神用，昨日之干加今乾四七明夷。
天獄墓死作囚用，天罡日木之宮纏四八大過。
天寇分至前一日，月加離辰發用先四九噬嗑。
天網時用俱克日，物孕有損病纏綿五十蹇。
魄化死囚白虎隨，干支年用凶禍連五一蒙 羅網。
三陰貴迍日辰後，死囚玄虎時克年五二中孚 四逆。
龍戰卯酉日兼用，年立卯酉事迍邅五三離 飛魂 喪魄 喪門。
死奇月纏天罡用，丘墓歲伏殃災隨五四離。
災厄喪吊游魂用，丘墓歲虎伏殃邊五五 死色。
殃咎三傳克日囚，神將克戰乘墓真五六歸妹。
九丑子午與卯酉，配合乙戊己辛壬五七解。
鬼墓日辰鬼作墓，鬼克墓覆禍宅身五九困 鬼呼 喪門 五墳四煞。
勵德日辰看前後，天乙立在二八門六十隨。
盤珠歲月與日時，傳課俱全此為雲六一大壯 即天心格、回環格。
全局三合之課是，水火木金土中存六二大畜。
玄胎三傳皆四孟，玄中有胎名義深六三家人。
聯珠連茹兼進退，間傳順逆此中論六四複 間傳 撞支巽 撞乾 。
六純十難兼物類，三課之說是紛紜六五革 新故 拘檢 始終。
補論
凡干支相害，犯外好里槎丫者，止五日：丙寅、壬申、乙夘、辛酉、戊寅。
凡上神作合，支加乾鄰近相會，止三日：壬子、丙午、戊午。
凡萬事喜忻三六合，止八日九課：壬寅、乙酉、壬午、丙申、丙辰、丙子、戊辰、戊申。
凡源消根斷課，止四日四課：癸未、癸巳、癸夘、辛夘。
凡六庚日，巳加申，皆丁神臨宅，人災宅動，旦將反生。
凡六辛日，午加辛，亦丁神臨宅。
凡昴星止十六課。
凡喪吊全逢，惟十日：甲午、丁亥、己亥、庚子、癸巳，乃干上乘吊客，支上乘喪門；甲戌、丁卯、己卯、庚辰、癸酉五日，乃干上喪門，支上吊客。

己 庚 辛
此貴神晝順行，夜逆行。不坐辰戌牢獄之地。各取喜其合處，不喜其刑害之方。如晝貴甲從子起，為諸乾之首。且貴人之前不敢有對衝坐者，故午上無寄。乾癸無所處，特寄在別宮。故晝寄丑宮，夜寄未宮。今內幹系晝，外幹系夜，互相取合。今畫其晝貴，夜貴仿此。其說甚有理，而近不用。
貴神無處不臨
子上解息用童僕，丑上升堂名利途。寅上按幾可干謁，卯上登車宜奔囑。辰戌入獄多憂懼，巳午受貢君臣福。未上列席申求乾，酉入私室亥操笏。貴人在申願神動，丑巳圡地及皂神。酉上逢之多咒詛，須防午上貴人嗔。
貴神當權，神藏煞沒。天乙入獄，諸事不治。貴登天門為當權，到辰戌上為入獄。
螣蛇不臨戌亥
子上墜水可消憂，丑上盤龜福善儔。寅上生角宜進用，卯上當門主官愁。辰上化龍利科甲，巳上入穴不出頭。午上飛空才官利又云乘霧，未上入林防暗幽。申上銜刀酉露齒，戌眠亥掩目無咎。螣蛇在酉他多妒，陰人不足怒嗔心。若是男兒傷風病，卯中門戶鬧時臨。
螣蛇交戰，毒氣凌遲。螣蛇當臥，鬼怪傷夷。交戰者，正卯、二酉、三子、四午，周而複始；逢之則凶。當臥者，春亥、夏子、秋巳、冬酉，遇之皆吉。
朱雀不臨酉戌亥子
損羽投江子丑為，寅卯安巢文書遅。辰上投網巳翱翔，午銜符凶未喙食。申上厲嘴主怪異。酉上夜鳴官降職。戌上無毛亥入水，朱雀行宮須細推。朱雀來飛申酉位，傳言妄說酉申看。談天論地戌咒詛，要之酉上是為端。
朱雀銜物，婚姻財物。朱雀開口，爭鬥填塞。銜物者，正酉、二巳、三丑、四子、五申、六辰、七卯、八亥、九未、十午、十一寅、十二戌，宜求財婚事。開口者，正巳、二辰、三午、四未、五卯、六寅、七申、八酉、九丑、十子、十一戌、十二亥。
六合不臨申酉戌亥子丑
反目嚴妝子丑是，寅上乘軒卯入室。辰上違禮巳賀書又云不諧驚悖，升堂納彩午未居。申上結髮成歡好，酉上私竄走陰私。戌上亡羞加罪過，亥上待命便為吉。六合失利申酉鄉，消災折本業將亡。辰上大小生唇吻，戌上姑姐也難康。
六合不合，陰陽相雜。不合者是六合乘子午卯酉又或入四仲之辰，為之相雜，主陰私不明事，凶。
勾陳不臨酉戌亥子
子丑之宮皆被辱，寅卯受制官事起在寅遭囚，宜上書；在夘臨門，家不寜。辰上升堂獄勾連，巳上捧印官職喜。午上反目未入驛，申上佩劍酉病足。戌上入獄亥遺冠，勾陳方鄉無好處。勾陳克日禍殃纒，公私牽連不暫閒。日克勾陳宜幹事，寅方公吏有災連。亥上見之多不測，子逢出入更難平。巳午只是遲延勢，辰戌二位更難陳。
勾陳交會，連綿禍深勾陳本凶將，又值天罡，是神將俱凶，故主連綿之禍也。勾陳仗劍，疾病傷殘伏劍者正月起已逆行十二支是也。
青龍不臨戌亥
子上入海丑盤泥，寅上乘雲卯戲珠。辰上閉目巳飛空，午上損尾折角未。申上無鱗酉伏路，登途逰江戌亥是。
青龍開眼，萬事相宜開眼者，孟月寅，仲月酉，季月戌，逢之皆吉。。青龍若臥，人災禍隨臥者，春丑，夏寅，秋辰，冬巳是也。
天空無處不臨
子上溺水丑虛詐，寅上受制夘被刑。辰上入獄巳被控，午上識字未得食。申上鼓舌酉巧說，居家誣詞戌亥宮。
天空下淚，哀聲聒起。天空凶將而又臨壬癸，故曰下淚，主哭泣之事。凡六甲旬中壬癸日是也。如甲子旬中傳出申酉二字，即是下淚。
白虎不臨辰巳
子上渡江丑臨欄，寅上登山夘門前。辰上咥人巳喪身，午上斷尾未逰田。申上銜書酉當戶，戌為落井亥溺泉。
白虎遭擒，已免凶惡白虎兇將，若臨巳午為燒身，絕命之災。白虎仰視，凶咎大作仰視者，正申、二寅、三卯、四亥，周而複始，逢之主咥人之凶。
太常不臨夘辰巳午
子上遭枷丑受官，寅上側目夘遺冠。辰上捧綬巳作印，午上乗軒未列筵又云升堂。申上捧爵酉作卷，戌上持印又云逆命亥詔宣。
太常被剝，百事銷鑠。銷鑠者，春辰、夏酉、秋夘、冬巳，得之亦凶。
玄武不臨寅夘辰巳午未
子上散發丑虛詐，寅上入林夘窺室。辰上入獄巳反顧，午上截路未不治。申上折足酉拔刀，戌上遭囚又云被察亥藏匿。
玄武橫絕，盜賊發兵。玄武兇將，若臨辰戌丑上，主盜賊侵凌事。
太陰不臨夘辰巳午
子上垂簾丑入內，寅上跌足夘征行。辰上理冠巳伏枕，午上披髮未書通。申上執正酉閉戶，戌上刺繡亥裸形。
太陰拔刀，陰謀害之。太陰乗申上，主小人暗害，吉中有凶。臨申酉亦是。
天后不臨辰巳
子上守閨丑窺人，寅上修容夘倚門。辰上毀妝巳裸體，伏枕沐浴午未存。申上理妝酉把鏡，居帷治事戌亥真。
天后淫亂，女喜他人若陰月臨申，陽月臨酉，為犯淫亂浴盆煞也。
十二天將惟貴神、天空不乗辰戌，玄武、六合不乗丑未，其餘無神不乗。
六壬大全巻一終
欽定四庫全書
六壬大全卷二 神將釋
大神總論
十二支神有陰陽之分，各司其事。以十二宮論之，凡五行、五方之次序，四時、四季之循環，三垣、二十八宿之次度，七政、四餘之星辰，九州萬國之分野，陰陽生克之體用，莫不包羅於其內，經緯於其間，斯天神之大概也。故以天上鬥罡旋轉而言，則天罡為首順布；以太陽躔度過宮而言，則登眀為首逆布。逆布者謂之月將，其實即十二神也。壬課取用配合，皆曰「神」，不曰「將」。視其加於日辰年命，或生或克，或刑或合，而休咎判矣。凡十二神相加，上克下與上下生比者，俱取天盤言之；下克上者，取地盤言之。
又總說
子午為陰陽二至，卯酉為日月之門。寅申為道路之神，辰戌為牢獄之地。丑未為天廚之所，巳亥為堂廟之宮。
十二神釋
登明亥
水神，雨水後日躔娵訾，正月將。
登明云者，正月三陽始兆於地上，見龍在田，天下文明。《易、明夷》有曰：「初登於天，照萬國也。」又亥為天門，故曰登明。
登明神，面長髪黃，手足黑色帶破。為陰水，亦名天怪，古之修宮室匠人也。壬寄其上，木生其下，玄武之象。音角，數四，味咸，星室壁，禽豬貐熊，宮雙魚，分野衛、並州，屬豬，位天門。
所主禎祥、徵召、陰私事，為自刑。為極陰之位。又主爭訟、獄囚、沉溺謂乗凶將，主取索、亡失巳酉丑日、不浄。
類為天雨師，又為鬼神，天馬、天耳，為幼子、將軍、夫人、上客、醉人、乞丐，為肝、腎、髪、頭加酉臨日乾、足陽日加申，陰日加未，為脾病、哭臨辰、眼斜青丑、壊頭面亥加已已加亥、病瀉加年命上，為盜作元武、殺賊、奸神作後元，為寳殿作貴人、樓閣加寅不作貴加寅又龍為樓合為閣、台加卯又加卯為燈台、廷院、坑園、牆基、獄犴、廁加戌又甲乙日作天空加已，為圖畫、襆頭、帳幕、筆墨、傘葢、管鑰加已、笠笈、圓環，為梅花、葫蘆，為廩廄、酢醤酉加、稻、麥、鹽朱雀加。
為姓楊、朱、魯、衛、乾、房、季寅卯加、壬丑未加、鄧、範俱六合加、馮蛇乗已午加亥，凡點水字様、直傍之類皆是。
登明天柱亥為天柱廩乘太常樓台乗青龍臨申，賊盜乗元武傷人乗虎幼子乘六合哀乗蛇丙日占更的。獄乗勾主獄甲戌庚壬癸的廁穢乗空主穢廁豬憂溺死乗後主溺死，陰私乗陰主私管鑰乗雀召徵乗馬作貴或貴臨亥的來。
注云：五音山向，以登明為天柱，若乗太常主廩祿，葢太常是穀粟之神，家未與亥三合也。乗青龍主樓台，然必臨申，加他處則非。乗武主盜賊入室故也，乗虎主傷人，亥是木之父母，虎作木鬼故也。乗六合主小兒，木到亥上方生故也。乗蛇主哀哭，太乙喪車煞，與蛇同體；若丙日占之，更的。乗勾主獄，若甲壬癸三日有戰，主吏嗔；戊庚二日，與神和，不妨甲壬癸三日，又云丙丁二日。乗天空主豬穢廁，亥為天豬殺也。乗天後主溺死，以水投流，溺之象也。乗太陰主陰私，乗朱雀主管鑰，葢四孟鑰神所居之地；若占訟，得放之象。貴人臨天門主徵召，作驛馬更的。
河魁戌
土神，春分後日躔降婁，二月將。河魁即天魁，斗魁第一星，抵於戌故名。建卯之月，萬物皆生根本，以類聚合；魁者，聚之義也。
河魁神，古之獄吏也。辛寄其上，火墓其下，天空之象。音商，數五，味甘，星奎婁，禽狼、狗、豺，宮白羊，分野魯，分徐州。屬犬，位西北。
所主詐欺、印綬及奴婢逃亡；若發用，舊事重新之象。又主虛耗、失錢物、帶眾。
類為天鬥魁，又為天羅、計都、兵神、厭神作元武、地戶，為監司加月建、都轄加太歲、官長作雀加日辰、司直、善人、長者、僧道、獵人、小童、奴僕、屠惡、強盜作虎克辰、兵士戌加申申加戌、舅翁、妹、貧丐作元空。
為命門、膀胱、足、腿加年命主足病，為城廓、寺觀、岡嶺、牢獄作勾陳更的、窯冶作蛇加巳午、虛堂、僕室、土物、墳墓作虎發用、牆塤甲日加寅，為朝服作雀、印綬、鞋履、軍器、杻枷作元武臨刑、劍仗、城鐘、鐵鋤、鏟槍、鎖鑰、碓磨、瓦器、石作勾陳加申酉、數珠，為五穀、田絲。
為姓魏、王、魯、徐、婁、倪，凡土傍、足偏之類。
天魁印綬乗常吏乗雀主訟都官乗龍為官，壘土髙墳壬癸日乗虎集眾攢魁主眾乗勾陳主集。徳合乗六合奴婢乗武為奴，乗陰為婢兼長者乗後利君子，犬豺狼畜乘蛇厭主狼虎怪悉為歡乘陰婚姻事。
河魁主印，太常主綬，若魁作太常，乃曰印綬。雀為文書，雀入墓戌，凡言訟主其吏也。青龍為都官，天魁為集眾，凡言官位必有部轄之權。魁凶神，虎兇將，若壬癸日占，天乙逆治，魁作虎克日，名曰壘土之煞，病者必死。勾陳為土星，天魁為集眾，此二神將並臨，即主攅集會眾之事。六合卯與戍合，又是支前五辰之合，故曰徳合。元武奴，太陰婢，二將若臨戍上，謂之陰空同位，奴婢主不良，非逃即盜。六丙日天后臨戌，乃是官星，利君子，故曰長者，利見大人。螣蛇臨戌，主犬豺狼怪，春占有三等：辰戌丑未日為天狗煞，戌日為月厭煞，甲乙寅卯日為天喜，三者須各詳之。又戊已辰戌丑未日，戌蛇多主怪事；若甲乙寅卯日，戌乗吉將，主婚姻產喜吉事。
從魁酉
金神，穀雨後日躔大梁，三月將。
從魁者，斗魁第二星也，星抵於酉，故名。又三月草木枝葉從根而出之義也。
從魁神形貌端正，黃白色，古之女巫也。正祿不受所寄，太陰之象，音羽，數六，味辛，星胃昴畢，禽雉雞鳥，宮金牛，分野趙、冀州，屬雞位，正西。
所主陰私、解散、賞賜，又主金刀、奴婢、信息。
類為天文星，又為霖雨加子、霜加戌、雪醜午加之、海加巳、江加子，為私門，為中丞、太親、陰貴、婦人臨旺少女、姨女天空休衰、外妾、婢妾作六合，作青龍，若作太陰加日辰，主妾為妻、匠婢、酒人、小奴作天空、尼作合加寅申、樂妓加太常、卯、未、老婢加子丑。為官祿、邊兵作虎加孟、孝服作虎，主甲乙日服至、夫婦不和，為皮毛、口竅、耳目、爪骨、精血、小腸、唇舌，為勞瘵、目疾作蛇雀、赤眼丙丁加之，為刀傷加季刑命，為白塔，街巷、小陌、祠廟、倉廩。
為碑碣、金銀、首飾、珍珠、盤鏡、銅鉛作太常加寅、鐵石、皮革、氈條，為酒漿、菜食、姜蒜。
為姓趙、金、樂、石、劉卯加酉、閔卯酉加六合、鄭貴人加之、程、呂俱大陽加之，凡立人、金傍之類。
從魁金玉乗龍虎旺相的小刀乗龍虎囚死的錢丙丁日乗陰的，奴婢乗空主奴，乗陰主妾私通乗後合主表里私通近水邊乗元。小麥乗常九江乗後伏吟并賞賜乘貴人旺相，雞鳥乗雀主雞，乗蛇怪鳥解散乘勾不為嫌。
虎臨從魁，旺相為金玉，囚死為刀。龍臨旺相，亦為金玉；若龍發用，金木相克，事有終始。六辛日太陰主事，旺相為金玉，死為刀及屠戮事。丙丁日太陰加酉乃錢也，若非火制，酉金不能成錢之形；如甲戊庚三日，魁雖太陰，則不言錢。甲日春占，太陰囚，主奴妾奸私事；戊日則太陰相氣，金土相生，兩陰相會，主婚姻事；庚日太陰旺氣，主金帛事。天空為奴，從魁為婢，二者相鄰，故通言奴婢。私通者，合主之，合是私門，卯酉相並，謂之左右表裏陰私也。酉曰九江，玄武水將，金能生水，故曰水邊；若六己日土克玄武水，則濡涸。太常主小麥，壬癸日占金水相生，麥苗以秀；若甲戊庚三日占，又不同：甲日太常加酉，則麥已熟而先有損，酉克乾故也；戊日則金土相生力壯，麥秀而實；庚日則過扵剛硬，麥堅固而粒小。天後加酉，淵源之水，故曰九江。貴人加酉，旺相賞賜，囚死主貴人嗔責，占訟即憂枷鎖。朱雀加酉，主雞鳥，若克日又主獄訟、文書。螣蛇加酉，旦主鳥怪，暮主雞怪，若二月六己日占，月厭在酉更的。勾陳加酉，主解散：甲日青龍直事克勾陳，勾陳之子是酉金，又克甲木，互相持勢而戰，戰則散而不為嫌矣；戊庚日合而無戰，亦主散；壬癸日被勾陳克，卻得勾陳子金相生救之，謂之無恩解散。
傳送申
金神，小滿後日躔實沉，四月將。
傳送者，四月萬物茂盛，陽極將退，一陰欲生，傳陰而送陽也。
傳送神形項短，目圓睜，微有須髪，大身，古之行人也。庚寄其上，水生其下，白虎之象。音征，數七，味辛，星觜參，禽猴猿猱，宮陰陽，分野晉、益州，屬猴，位西南。
所主道路、疾病、信耗事。
類為天錢星，又為天鬼、天醫，為廷尉、元帥加三合之首、行人、公人、民人、孝子、征夫若加子午又主軍逃亡、鋪兵、獵師作虎、銀匠、鐵匠、舅、僧作龍加孟、商賈、巫醫作六合、屠戶，為肺、膽、大腸、骸骨、音聲，為疾病、死尸、喪孝，為產乳、水厄加亥克日、仇讎、攻劫作勾、饋送、失脫作元武加亥子、淫壬癸日。
為祠廟、庵堂、城宇、道路、池湖、陵寢、靈柩，為絹帛、綿絮、經文、毛羽、藥物、刀兵加刑、礱磨、大麥。
為姓袁、郭、申、晉、侯、韓、鄧，凡金傍、之繞之類。
傳送刀兵乗虎僧及醫乗常主醫或僧，寃仇已日乗勾克徳也道路乗龍稅乗貴主賦湖池乗後。大麥守城乗陰旺相為麥，囚死為守城喪乗蛇碓磨乗空，市賈乗合劫攻乗劫殺元武田獵師乗雀。
虎加申主刀兵，其義有五：
甲日青龍主事，則虎因財而爭傷，並死煞尤甚，謂金木相克，流血之禍也。
戊日勾陳主事，金土相生無戰，雖並惡煞不凶。
庚日即虎主事，持徳直日，雖動刀兵不傷，且利見大人，誅討不義也。
壬日天後主事，奸淫相傷；癸日玄武主事，盜賊有傷，俱不凶。
傳送乗太常，主醫及僧。六己日勾陳臨傳送，主寃仇爭鬥，葢己德在甲，勾乗申遙克傷德故也。
道路之說有五：
甲戊庚日俱申為青龍，但甲日主財帛出其道路，或遠信財物。戊日主奴婢公文出其道路；庚日主疾病喪孝出其道路；壬日卦得申子辰，主婦人淫亂，敗露出其道路；癸日切忌出行，主道路有遺亡。
天乙加申，主田園賦稅。葢申為水之長生貴人，土遙克之故也。水生申、旺子，天後加之，主湖池。甲日為池，戊日為湖，丙丁日不為湖池，名曰日被雲遮，作事暗昧，妨有謀窺。
六辛日太陰加申，旺相為麥，囚死為守城。
螣蛇主喪，甲日官貴財富之喪，戊日奴婢之喪或因官致病死之喪，庚日則不病尫羸之喪，丙日官使之喪或爐冶之家喪碓磨，天空主之。
六合主交易市賈：壬癸日女人交易，或是媒禮之事；丙丁日男子交易，牙儈與官置買賣事。
朱雀主田獵或劫攻未解，或玄武主之。
小吉未
土神，夏至後日躔鶉首，五月將。
小吉者，夏至之氣，大徃小來，小人之道長，小之吉也。又為萬物小成之義。
小吉神為風伯，古之藥師也。丁寄其上，木墓其下，太常之象。音征，數八，味甘，星井鬼，禽犴羊鷹，宮巨蟹，分野秦、雍州。屬羊，位西南方。
所主酒食、婚姻、祠祀事。
類為天酒星，又為天耳加巳午、風伯、鬼神一云家鬼。為太常、主保、父母、老人、繼父加亥、繼母加酉、姑、嫂、姨、妹、媒奶、寡婦、道人、酒匠、帽匠，為請召青龍比日、慶賀、筵會、離別見行年離神，為旱熯、蝗蟲雀加亥子，為肝、脫脊，為廷院、牆垣、園加辰、林加卯、土物、井泉、陶冶、墳地甲乙日角姓、茶房、酒肆、賽場，為海鮮、盤盞、冠裳、印信、笙歌、醫藥、苗簾、桑木、罇、麻龍後加寅卯。
為姓朱、秦、髙、章、羊、杜、井、魏、楊，凡羊、土傍之類。
小吉姨姑乗陰婚禮儀乗龍，羊酒祠禱祭神祗乗常見元武貴人應此。白頭乗蛇見喪車主孝爭訟壬癸日乗朱勾公婆母乗後，井泉乗空天耳乗空，四月宜捉訪墓乙日乗虎風師辛、己日乗虎。
太陰臨主姑姨妹之事，青龍臨主婚姻禮儀之事。太常穀粟之神，壬癸日並土，以土克水，故酣而為酒。丙丁日，亥作天乙為天豬煞，未為天羊煞，亥與太常三合，主豬羊事；天乙加未，玄武居亥，為三合，主祠禱神祗。葢玄武是北斗將軍，掌妖訛事，不聽居其於丑未；丑、未，天乙所處，即無將軍之位，如君子不與小人競，故曰祠禱也。白頭者，孝服也；螣蛇為喪車煞、魄煞，三者並臨，主孝服。勾陳主爭，謂上將臨旺鄉，值壬癸日占，必有爭也。朱雀主公訟文書，天後水生木，墓於未鄉，主婆母。天空主井泉。帶凶煞則主井怪、崩壊；四月占天空又為天耳煞，凡捉人遇此必得的信天耳，正月起戌順行四季。木日占病，白虎臨之為墳墓煞；六乙日占虎臨又為風師，主作大風。
勝光午
火神，大暑後日躔鶉火，六月將。
勝光者，午為陽火，正當離位，光被四表，所謂「大明當天，爝火不熄」，難乎其為光者也，故曰勝光。
勝光神形貌：目圓，面赤，大身，古之御馬人也。正祿無寄，朱雀之象，音宮，數九，味苦，星柳星張，禽獐馬鹿，宮獅子，分野周、兩河，屬馬，位正南。
所主光怪、絲綿，又主文書、官事。
類為天王良星，又為左天目、霞雷，為上小下大，為宮妃、雨林、使君、娼婦、亭長、使者、善人、僧巫、騎者、蠶姑，為驚恐、疑惑見申、誠信、文書雀加寅、口舌、咒咀見申與雀、胎孕加亥受絕，為兵勾陳加申酉、詞訟、信息、光彩，為心若見亥主心疼、目、口，為血光、心虛、小腸患雀加子、吐瀉，為宮室、城門、堂宇、田宅、道路、廚太常加申酉、窯冶。
為火燭、旌旗、絲繡、衣服、書畫、衣架、櫃、蒸籠，為馬、蠶絲、鴉巢、雉、小豆太常加卯。
為姓蕭、張、李、許、周、馬、朱、柳六合加、狄勾陳加亥、馮蛇乗午加子。
勝光宮女乗後信誠乗雀妃乗陰，善人乗貴通語乗合驚恐乗蛇遺乗元。土工乗空田宅乗常巫天目乗元見天目，使君乗龍亭長乗勾巷兵持乗虎主道路刀兵。
天後主宮女，甲日則婦小而長，仁而有貌；戊日黃而濁肥；庚日瘦而有禮，多病；壬癸日淫而有色，壬則淫夫，癸則渝亂。
朱雀主信誠，謂火性主禮，雀主書也。
太陰婢妾之象，主妃。
天乙主善人，六辛日勝光為鬼，若作天乙，變凶為吉。
六合主通語，丙丁日為牙儈，壬癸日為婦媒。
蛇主驚恐，六庚日最緊，他日緩矣。
玄武臨午謂之左目將軍，又曰天眼開，主盜賊敗遺。
天空主土工，太常主田宅。巫天目者，玄武被天目照之之義也，與遺意同。
青龍文官之象，故曰使君。勾陳武官之象，又鄉耆土官之稱，故曰亭長。白虎主街巷伯，又為兵刃持用之物故曰巷兵持也。
太乙巳
火神，處暑後日躔鶉首，七月將。
太乙者，太微垣所在，太乙所居也。又七月百榖成實，自能任持之義。
太乙神形貌：髙額，赤大口，黃髪，眼目不正，古之鍜人也。丙、戊寄其上，金生其下，螣蛇之象。音角，數四，味苦，星翼軫，禽蛇蚓蟬，宮雙女，分野楚、荊州，屬蛇，位南方。
所主鬥爭、口舌、憂驚、怪異事。又飛禍、賞賜事總論，巳見辰為進往，吉；辰居巳為退伏，不吉。
類為天太乙星，又為雪冬至後巳主雪，為車騎、姑女、婦、術人、書工、木匠、廚夫、店人、乞丐、吊客作虎主外服、歌兒太陰主娼妓，為孕若作蛇加辰主雙胎、憂、文學、取索、輕狂、毀罵克日辰、徒配巳酉相加。
為心胞胳、三焦、咽喉、面齒、班點，為車乗、金鐡、珠玉、筐盒、疋帛、樂器、管鑰、磁器、磚瓦、弓弩、花果、斧又主金鳴、爐冶加火、窯灶加土，又巳未相加主井灶相連，巳亥日戌加巳主灶側相連、火光。為飛蟲、飛鳥、蜴、蟺、蛇月厭加主夢蛇。
為姓陳、石、趙、田、張、荊、餘、朱、郝六合加、楚、杞寅加、耿子加、龔辰加、紀丑加。
太乙蟬鳴乗合蟲乗空臨水散解乗武加水，賓姑乗龍罵詈乗雀弩喪車乗虎。賞賜乗貴灶爐乗陰，常丙丁日的管鑰乗勾，戊日的等。非橫之災辛酉日乗蛇，六月的吊客蛇亦辛日乘蛇占病凶。
六合臨為蟬鳴煞，天空臨為水蟲煞。元武是小人，又加太乙破敗煞，謀用破敗無成，故曰解散。
青龍主賓姑，朱雀主罵詈。甲日因財口舌，戊日因官文與爭田地口舌，庚日為憂最深，維無凶。白虎為喪車煞，又主弓弩曲物。貴人臨主賞賜。太常、太陰俱主爐灶，丙丁日太常臨巳，爐灶最的。勾陳臨謂之管鑰神，囚禁可放。
辛酉占得螣蛇，有非橫之災，惟六月月厭在巳，定主見怪，災禍連綿；又占病，則為吊客蛇之為患如此。
天罡辰
土神，秋分後日躔壽星，八月將。
天罡者，斗杓之所建也。又八枝條堅剛之義。
天罡神黃色，面圓滿，多須，古之獄師也。乙寄其上，水、土墓其下，勾陳之象。音商，數五，味甘，星角亢，禽蛟魚龍，宮天秤，分野鄭、襄州。屬龍，位東南方，近東多。
所主鬥訟、死喪、田宅舊事。又曰辰天牢，戌地獄，專主獄訟官府。
類為天哭星，又為獄神、右天目、天羅。為宰公、監司加月建、大將軍、侄軍、漁敗、屠殺虎加死地又加金，為勑書、官事雀勾克日，加壬癸日、頑惡、堅硬、凶怪、欺爭、殺鬥發用克日、動搖、悲虎加、驚日辰上、慮作初未傳，又加土、娠天后、邪夢蛇發夢，加行年、自縊蛇虎克日。
為腸、胸，又為死尸，為偏盲能視，為廊廡、寺觀、溝澮、石欄、墳墓、田園、麥地、海水天後加亥、井武加巳、山坡天空。為甲胄、網罟加火、澇漉、杻械、碾、碓、缸甕、錢物、盔盆、皮毛、破衣、膠漆，為五穀、米麥、葷腥、鱗族加水、魚食加亥。
為姓馬、郭、喬、鄭、邱、岳、龍、陳、田、龎加勾、周加酉。
天罡本是魚乗龍，秋、冬、暮的龍物乗龍，春、夏、旦的，欺詐乗朱網羅乗蛇為惡人乗虎。戰鬥乗勾陂池乗後二千石乗常，右目乗元主妖邪虞官乗陰宰殺乗合神。
青龍臨辰，春夏主龍，秋冬主魚；又旦為龍，暮為魚。
雀臨謂之欺詐；蛇臨謂之網罟、躔繞，壬日婦人躔繞，癸日盜賊相絆。
罡凶神，虎惡將，並主惡人。
勾陳主戰鬥，天後主陂池，太常主二千石。玄武臨辰，謂之右目將軍，在北斗位下，掌妖邪、盜賊，主賊難捕。
太陰主虞官，乃左右侍從之官也。
六合主宰殺。
太衝卯
木神，霜降後日躔大火，九月將。
太衝者，日月五星所出之門戶，天之衝也。又萬物離散剝毀，若衝之義。
太衝神面長，青色，髙額，有須，身材細長，狡獪不正，古之樂師也。
正祿無寄，六合之象，音羽，數六，味酸，星氐房心，禽狢兔狐，宮天蠍，分野宋、豫州，屬兔，位正東。
所主驛馬、船車。
類為天雷神，又為天心、地耳、雷電、雨水，為長子、公主、大夫、母姑、兄弟、男女、童穉、沙門、賊人、藝術六合加寅申。為逃元空加酉戌、出入、門戶不寧，為大腸、榮血、聲蛇加空、目疾午卯相加，為橋梁加辰、竹木加同類、池潭、船車龍旺又主邊方。又見水船，見土車。
為牕牖、梯椅、衣架、棺槨、杓梳、床、旛竿、香盒、笙簧、鼔笛、刀俎、木器見金、葢、輪、坊牌、箱、棒、竹籬，為羝羊、驢、騾蛇加巳午。
為姓朱、房、魯、楊、張、盧、髙、劉、雷、宋、柳加寅、茹六合加、季、李俱加亥子、鐘、藺，凡木傍、絲子、千里之姓、孫董之類。
太衝術士乗貴沙門乗勾空類，行往車舟乗常水乗蛇陸乗虎因。林木乗龍江河乗武雷電乗朱雨乗龍，己日的，兄弟乗陰，甲日的私門乗後匿婦人三交卦主匿婦或罪人。
衝乘天乙主術士；勾陳、天空俱主沙門，甲日僧多不潔少實，丙丁日天空僧善講談。
太常與太衝為三合，主舟車。蛇則主水，虎則主陸。青龍主林木，元武主江河，朱雀主雷電，青龍又主雨，太陰主兄弟，天后臨於私門必有淫婦。
功曹寅
木神，大雪後日躔析木，十月將。功曹者，十月萬物大聚，歲功成就而會計於曹也。
功曹神，面方，青色，有須，勢大身材，古之使命也。甲寄其上，火生其下，青龍之象。音征，數七，味酸，星尾箕，禽虎豹貓，宮人馬，分野燕、幽州，屬虎，位東北。
所主木器、文書、婚姻、才帛、官吏之事。
類為天三台星，又為天，又為風作虎加申，為丞相、賓客、督郵、家長、夫壻、秀才加六合、青龍、吏雀加申戌、醫天後加未、丹客亥加巳、僧後加申，為謁見 、徵召、喜慶、文章加卯、信作六合，又為五色蛇加午、四角，為三焦、膽、筋脈、髪、口、眼，為社稷、公衙、庵觀、神祠加土、神樹、山林，為棟柱寅午相加、花木、屏風、寳劍、機杼、棺槨、火盆、香爐、禪椅、橋梁、竹箱、食物。
為姓韓、蘓、曾、喬、林寅卯相加、霍子加寅、杜戌加、程、朱太陰加，凡木傍、草頭、走腳、髙趙杜之類。
功曹道士乘龍兼書籍乗常，雜色班文乗元火炬紅乗雀。從事乗後信誠乗雀徵召乗貴吏乘勾，虎豹乘虎，晝貓狸乘虎、蛇、空夜的居木叢乘合，水日木，火日為柴薪。
青龍主道士，太常主書籍，玄武主雜色班文，朱雀主火炬之物，天後主從事，朱雀又主信誠，天乙主徵召；勾陳主吏，白虎晝主虎豹，夜主貓狸；螣蛇、天空則主貓狸之怪。六合壬癸日主木叢，丙丁則為柴薪，謂火旺木休也。
大吉丑
土神，冬至後日躔星紀，十一月將。大吉者，冬至之氣，小往大來，君子道長，大人之吉也。又一陽始生，上帝複位之義。
大吉將，其色黑，為古之牧牛人也。癸寄其上，金墓其下，貴人之象。
音征，數八，味甘，星斗牛，禽獬牛龜，宮磨蠍，分野吳、楊州，屬牛，位北方。
所主田宅、園圃及闘爭事。
又總論丑未，專主田宅、才帛、晏喜。
類為天牽牛星，又為天耳、風伯、雨師、天衢作常加申酉、雷雨丑加卯雨後雷，卯加丑雷後雨，為人君、土主、宰執加歲、將軍、長者、父母、神佛、尼僧、矮子作空、瘸子加卯酉，為表奏雀加寅、舉薦、福徳、爵、寃仇、咒咀，為脾、肺、小腸，又為禿髪、病目、腹洩丑亥相加，為寳殿貴加寅、室閣、社壇、僧舍加申、桑園、倉庫、田圃、橋龍加亥子、井、牆，為車轎卯日、珍珠貴人加，得旺相、首飾、鞋履、秤、尺、斗斛、飲食、枯物、不完物醜為末，為六畜、龜、鱉加子、蜈蚣。
為姓田、孫、牛、呉、趙、楊、杜、董、岳、王丑未加亥子、苗、黃俱六合加丑、汪亥加丑，凡土傍之類。
大吉將軍乗勾主薦賢乗雀，火日的，橋梁乗龍，乙辛日的長者乗貴地祗乗陰寃乗月厭的。風伯乗虎雨師乗後貴人召乗貴，車見卯畜牛鱉乘蛇、空宅與田乘常。
勾陳乗丑加卯為將軍，六丙日朱雀主薦賢，壬癸日則主官訟口舌，六辛日、六乙日俱醜青龍辛金乙木斵削，且醜癸水，龍木在水上，故屬橋梁。天乙在丑為長者；太陰主地祗寃，帶煞者是也。白虎為風伯，天後為雨師，丑上乘天乙為徵召，六合主車，天空、螣蛇主鱉，且主牛蛇之怪，太常主田宅事。
神后子
水神，大寒後日躔元枵，十二月將。子者，十二支之首，有君道焉。十二月子位，北方之中，上帝所居。
神后者，帝君之稱也，歲畢酒醮蠟祭，以報百神，故名。
神后，面圓，黑色，古之淫婦也。正祿無寄，天后之象。音宮，數九，味咸，星女虛危，禽蝠鼠燕，宮寳瓶，分野齊、青州，屬鼠，位正北。
所主陰私、暗昧、婦女之事。
類為天華葢星，又為河祟丙丁日辰上、陰天加酉、大雨子日元、龍、雪冬至後加巳午，為后妃、淫女、乳媼、媒妁或作六合、幼女作後加午，或作天空。又日子為小口，並虎災；受土克死亡、孩童亥加、老婦加未加丑、嫁婦巳加、軍婦加辰作虎、孀婦酉加、娼婦太常、婢妾太陰、翁婆加日辰、樂工、染匠、盜賊、駝子勾陳、邪師空加卯木、僧尼貴合加申亥、溺死，為奸邪加卯、陰小、胎產、女經、淫泆、私禱、聰明、悲加巳日，子加已為六陽盡也。若乘吉將臨德，變凶為吉，為腎、膀胱，又為滴痢、血病作虎克日，為江湖、溝渠、沙石、道路加寅申、蓮塘、花盆，為石灰、木灰、珠玉、圖書、文墨、首飾、籠筐、繩索、木匙、瓶盞日辰上、浴盆、梯、甕加辰戌、小裁刀、水物，為絲、布帛天後加寅卯、大豆、糖武加亥，為燕窩、魚鮓。
為姓孫、齊、謝、耿、聶、沐、漆、汪、任醜未加、姜未加、孔六合加、陳加卯、傅申加、馮午加，凡水偏傍、流曲之類。
神后陰私乗陰彩女乘後奸乘合，亡遺乘龍盜賊乗元鬼神言乘貴常。土公乘勾悲泣乘空浴盆乗蛇，見本季浴盆的事，燕乗雀，旦鼠乘虎，夜行人取類看。
太陰主陰私，天后主彩女。六合主奸淫，丙丁日男誘女，壬癸日女誘男。青龍主遺亡。元武主盜賊，壬癸日賊由水路，中必勞眾；丙丁日陸路，勢凶。天乙、太常供鬼神。勾陳主土公事。天空主悲泣。蛇臨謂之浴盆煞，課傳中見四時浴盆煞，又是壬癸，虎為浴盆，占小兒其凶甚矣。朱雀旦主燕，暮主鼠。虎主行人。
天將總論
十二天將天乙貴人為主居中，前有五位：一蛇、二雀、三合、四勾、五龍，此木、火、土之神在左方者。後有五位：一后、二陰、三元、四常、五虎，此金、水、土之神在右方者。
天空雖云後六位，有名而無物，緣貴人相對無物衝之，猶月殺之有月空，以遇之事皆可也。
以課之天盤起貴神之例， 地盤定順逆之序：順布者，則背天門；逆布者，則向地戶。
凡壬課吉凶系於天將，五行雖各有所屬，而用者專取天盤乘神決之。如貴人屬土，若乘亥子則屬水矣，生克皆以水論。
生日為吉，雖凶將亦為吉，克日為凶，雖吉將亦為凶，緊要不離「生」、「克」二字。吉將喜生扶，忌克制；凶將反此。更察乘神所加盤之神，生克、旺相休囚，喜則宜旺相，忌則宜休囚也。
又《頥旨經》曰：四課三傳雖一定不易，十二神將如四時而運轉無窮。人皆言青龍吉將，白虎凶神，太常多主飲饌，勾陳必至勾留，殊不知龍無鱗未上則傷身之害至，折角申酉上則鬥訟之愆生；虎登山未上則秉權於閫外，銜牒申上則通信於道途；太常荷項子上而枷鎖，勾陳捧印巳上而轉職。似此之類，世所不知。又曰：十二天官在天應十二神，在地表十二分野，在歲為十二月，在人為十二經。
十二將釋
貴人論
《天官書》曰：「天乙在紫微宮門外右星，天帝之神，主戰鬥。知人吉凶。」
《經》曰：「天乙閶闔門外，事天皇大帝，下逰十二辰，家於艮丑鬥牛之次，執玉衡校量世間之事，乃壬式中天子也。」
天乙貴人，己丑土，吉將也。為神將之主，傳順吉，傳逆凶，比和吉，不比和凶。
若貴人順治，更與日乾相生，雖遇前一蛇、前四勾，不為深害。逆治，雖前三合、前五龍，不為深喜；兼克日乾，定主貴人嗔責。
順治謂在天門之前，地戶之後；逆治謂在地戶之前，天門之後。貴人順逆，為吉凶之分。又看侍從之神，在吉則吉，在凶則凶，諸神將仿此。
貴神得地則貴，失地則賤，加小人之命則生殃，在君子之身則降福，愛龍常合，不立魁罡。在卯酉為關，子午為格；在日辰前則動，在後則寧。
貴人從十幹分書治、暮治，獨不居辰、戌之地。以辰為宰殺，戌為牢獄也；故貴人若臨辰戌上者，則巳上起子，辰上起丑，卯上起寅，寅上起卯，丑上見辰，子上見巳，亥上見午，戌上見未，酉上見申，申上見酉，未上見戌，午上見亥，此謂「太乙起子逆後尋」也。
又云：「貴人臨辰戌者，以衝為神，臨辰衝申，臨戌衝寅，乃天乙所臨之位，諸將並隨天乙順逆、前後取之。」
又云：「貴神在丑，其十二神入家，則不治事。四仲則正衝，子午相衝，卯酉相衝；四孟則斜衝，辰戌相衝，寅申相衝，亥巳相衝，醜未相衝，而為井欄衝。」「移神換將」，此之謂也。
貴人空亡，憂喜皆不成。《經》所謂「當憂不憂，當喜不喜。兩火一金，金被銷爍；二水一火，火乃滅光。」如貴人乙丑金下臨乙亥火，火欲克金，有水為救，雖有魁不為憂。若辛未土下臨癸酉金，金土相生，吉兆。壬寅金下臨甲辰火，火乃克金，得丙午水為救神，災殃消散。十二天官以此推論此論納音。
貴人出獄之法，天官以此推。
一日兩貴，一貴當權，其一為簾冪貴人，科試占得，與日乾相生，必得髙第。
凡謀事遇兩貴人，宜於囑托。太歲作貴人，不必入傳，皆為救助。
凡占得貴人吉，惟不救病一說亦主病輕。
貴人臨旺相氣發用，及加日辰年命者，曰富貴卦。歲貴更用起月將者，曰龍德卦，皆主升遷，所求遂。
貴人臨二八門，曰勵德卦，利君子遷轉與動移事，不利小人，主憂；身宅移動不寧。
貴人入獄，主君子煩燥不寧，凡謁貴遇入獄及勵德，必阻滯，即相見亦欠利，或貴人自有憂煩。
貴人專主錢財、喜慶、詔命之事，君子拜命遷官，小人田宅財物。貴人在旺上主貴人官爵印信，相主貴人錫賜財物，休主貴人憂病，囚主貴人囚系，死主貴人死喪。
賦
天乙居中，後六前五。在子也解息，必囑事於僕童。在醜也升堂，宜投書於公府。案幾在寅，卜庭謁之無虞。登車在卯，知路訴為有補。辰戌懐怒兮，上妬下憂。巳午受生兮，君悅臣喜。移途在申兮，有干求之榮。列席在未兮，有酒食之美。亥還絳宮坦然安居，酉入私室不遑寧處。
子居北方幽隱地，故為房，貴臨為解息。一云沐浴，又云主婦人病。
房前為堂，丑又為玉堂，投書進策，主貴人接引喜合。又云丑為夲家不治事，惟宜守舊。
寅宜謁見於家，卯宜訴訟於路。又云在卯為荷項，不利於進，主官求退。又為追魂使者，病凶。貴在卯酉，家宅遷移不寧。
巳午以火生土，謂之受賞。又在巳謂趨朝，在午謂乘軒，皆主進望、詔命、薦接、遷擢之喜；又云官訟逺行。
在辰戌，上欲害下，且怒且懼，主貴人不寧，有決罰之事，又入獄。
貴人下臨未，太常主晏樂、小惠。
申白虎，主道路干求，一云有神像事；又主損財。
加酉與卯同，酉為日月入明之地，群象私出之門，為陰私不明，關隔不通，或云主口舌疾病。
加戌與辰同。
加亥曰持笏，又為登天門，貴人順治，諸煞被制，利於進取。
詩
天乙神中是貴人，利為幹謁慶財因。君子拜官遷祿秩，小人爭訟入公庭。旺相相生尊者召，死囚刑克忌官嗔。病名寒熱頭目痛，祟非凡鬼廟宗神。
類為官祿、文章、首飾、珍寳、榖麻、鱉、獬、牛，變異為水木之精，鱗角之物。色黃白，數八
螣蛇論
螣蛇在天事天乙為車騎都尉，雷部鞭馭之神，位居前一家，丁巳火旺六十日，凶將也。螣蛇為太乙，照則福生，過則禍生，凡事造釁發端者，此神也。既過之後，風火刀兵，大劫小盜，流災凶旱，風水蟊賊，蟲毒疾疫，多行暗道，私匿婦人，姙孕不明事。愛陰、虎、龍、玄、後，畏戌。
蛇主文字、虛譽、公信、小財、水火之交，其戾主火燭、驚恐、怪夢、火光、斧鳴、官司、口舌、血光事，應在丙、丁、巳、午日。
若旺相相生比和，則吉；休囚則轉災；空亡減半；披刑帶殺，災病立至。
蛇附旺相神，更相生者，主胎產與婚姻之喜，以其為陰私、血光之神也。在君子主威權之相，以其將厲車騎威武也。若附血忌，帶刑煞，占胎必墜，當產即生。
蛇附旺相神，乃有氣，占怪必生氣之類；附死囚氣，為死物，或有聲無形。
占夢與見怪，先責螣蛇及陰神，日辰三傳次之。凡蛇附火神居火鄉，及值時下見火，決主火燭驚恐，不然有口舌公事。
求財蛇附財星旺相相生，必因賤貨而得財，反此者主驚恐。凡蛇臨日辰。占貨必得下賤之物。
蛇旺主縣官斗訟，相主亡財爭訟，囚主囚系恐懼，休主疾病怪異，死主死喪驚恐。
賦
螣蛇怪異。掩目在亥，去難以消災；盤龜在丑，禍淫而福善。生角在寅，露牙在酉，進用非訟，禍福兩途。乘霧在午，飛空在巳，休祥不辨，皆主進望。入林兮在未，舉歩可防；墜水兮在子，從心無患。卯當門，申銜劍，總是成災；戌入塜，辰乘龍，並云釋難。
蛇加亥曰掩目，不能傷人。一云發用主婢走，或失財。
丑為寺、龜、蛇、鑒、盤文，故主鑒降禍福。又云乃入穴自蔵之象，憂事自散。
寅變火，乃變化之地。旺則生角成龍而得時，利於進用；衰則失時，反為蜴蜥，以大為小。
在酉為克傷之地，故露齒，必主陰人災疾，口舌怪異。
未木墓之地，為入林，主口舌官訟。
子，火絕之鄉，為墜水，主凶災不成。一云主驚疑、怪夢。
加卯曰當門，傷人口，門戶上不和。一云血光。
申金與將刑合內戰，戌乃火庫為睡床，故入塜憂散。
辰為龍庭，加辰曰自蟠，只可逺不可近。又蛇處辰宮，名為進化，凶怪皆消。一云主產婦、公事。
詩
前一螣蛇車騎尉，火神驚恐怪非安。君子居官憂失位，小人爭鬥病災躔。旺相相生災未發，死囚刑克禍連綿。病者四肢頭目痛，水木神來作祟寃。
類為文華、金火、毎物，變異為金火之精，於人為驚狂、婦人，或作熒惑小人。於祟水木土神，或不葬客鬼。於病為頭目、四肢、癰腫、見血，於五榖為豆黍，於獸為蛇、蛟受，味甘美食物，色紅赤，數四。
朱雀論
朱雀在天事天乙為羽林將軍，在雷部行火，亦名招風神。位居前二家，丙午火，夏旺春相，凶將也。陰火寄於重離，陽極反陰，不足之神；又名飛火流金。愛虎、陰，畏後、空，不立亥、子、戌。
雀吉，得地主文章、印信、勑命、服色、王庭事；失地則凶，主火燭、焚煌、口舌、生病、公訟、文字、財物、損失馬畜、災傷等事。
若旺相，披刑帶殺，為害必深，反此則淺。凡占公事，雀逆理；刑賊日乾，官必嗔責；反此無害。
占科場與投獻文策，雀不入傳，亦須尋討，最愛為歲、月建與月將並，不然與歲、月、日相合，帶祿、附馬、並德，加臨生旺之地，文策必中；如被刑克及落空亡，無氣，加臨死絕，其文必不合格。又卦體三傳並吉，亦不必以此斷。
朱雀羽蟲之長，文書、信息、口舌、刑戮之神。其為印信亦分大小，或天戒，或朝廷公文，或行人私信。嘗夏月見山蛇戲路中，占得醜雀附天喜臨門戶發用，合主朝廷文字，不然則天驚也。當晚驟風雨，幾旬而止。葢丑為太歲，為風伯、雨師，附天喜臨門戶，果應天戒。又旬日中有禦榜至。凡將驚動，仿此斷之。
雀附火神，臨火鄉，並值火時占，決主火燭。嘗正月己卯日占季卦，雀乘午火居南方，春得相氣逆理，三傳卯子午，四刑衡殺，當主火燭；幸課名伏吟，神殺不動，雀下賊日乾，後不為災。
朱雀開口法，主鬥喧。正巳、二辰、三午、四未、五卯、六寅、七申、八酉、九醜、十子、十一戌、十二亥。
朱雀旺主縣官口舌，相主錢財婚姻，死主死喪口舌，囚主囚禁，休主疾病，心腹、口竅不利。
賦
朱雀南方，文書可防。損翼在子，自傷災難；掩目在丑，用靜得昌。寅卯安巢，則遲滯沉溺；辰戌投網，則乖錯遺亡。在申曰厲嘴，在午曰銜符，怪異經官語訟；在未名臨墳，在亥名入水，悲哀且在雞窻。官災起，葢因夜噪在酉；音書至，都縁晝翔在巳。
雀火在子受克，故主自傷。又云有官印信。
在癸丑名破頭，只宜安靜。又云田土事起。
寅卯文書不動；又云寅安巢，主文字喜，逺信至。卯坐林，怨抑之象。
辰戌主文字失遺；又云主有信息、口舌、獄訟。
申為克傷，故曰厲嘴，主驚怪。又申主信音在途。
午為正司，故曰銜符，主訟獄。一云主婚姻。
木為火父母，在未是父母之墓，故名臨墳，主悲哀之事。又在未為啄食，求財吉。
亥是火胞養，故名入水，宜守靜，不宜獻策。又云浴沐，主失財。
子云投江，主災退。
酉為火克之地，於時在夜，主官非口舌，又主疾病。
巳為火進之地，於時在晝，主文字信息。又云在外髙逺。
詩
前二朱雀號羽林，災殃霹靂火星辰。大人文卷憂察考，庻士妻財兢苦辛。旺氣扶持情解釋，衰空克制事逡巡。病傷心腹還發嘔，瘥日宜看子午辰。
類為羽毛、文章，於人與蛇畧同，於祟咒咀、灶神，於病在心腹、上竅或見血、嘔吐、陰腫，於五榖為果榖，於獸為飛禽、獐、馬之類，變異為火氣燒灼之屬，色赤黑，數九。
六合論
六合在天為光祿大夫，雷部中雨師也。家乙卯木位，居前三，旺春三月、六乙日，吉將也。
六合乃和合之神，柔順能通，委曲和合人事。位居東方，是青帝五陰之長女，職居輔弼，得地則文儒、九流之官，失地則暗昧、虛詐、僧道尼之類。愛龍、常，畏後、陰、虎、空，不利四仲。
六合主婚姻、喜慶、信息、求望、交易、胎產、媒妁、牙保、陰私、財物、交契、木植、舟車之象。其戾主陰刑不明、先喜後憂、小人女子之過傷、失六畜之象。
又云：六合主門戶、道路、更改、變遷，凡六合乘旺相氣，相生順理，而入用傳者的，主婚姻或胎產喜，陰私財物。若死囚刑克，則主財物口舌、陰人煩撓。
六合乘酉戌，多主奴婢走失。嘗見鴉窺天井，占得六合乘戌臨門，旬內果有奴走。以六合為天地之私門也。故占盜切忌六合入卦，以私門逃亡難獲。
六合與天后同入傳，謂之狡童佚女卦，占則人多不正，所為奸弊，兼妨有失。
六合附金，謂之內戰，主陰私婦人、兄弟口舌；附土神謂之外戰，事在外發，謀起議不安，宜暗求私禱。
六合不合，陰私相懐，酉卯子午也。
六合旺主賞賜遷職，相主嫁娶財禮，死主爭財或死喪事，囚主婚姻囚系、陰私謀匿事，休主疾病陰私事。
賦
六合之神，婚姻嘉會。在亥為待命平和，在巳則不諧驚悖。在子反目兮，無禮之事；在酉私竄兮，不明之因。乘輅在寅，結發在申，從媒妁而成歡，皆主婚姻喜美；違禮在辰，亡羞在戌，因妄冒而加罪，皆主婚姻訟事。升堂在午，入室在卯，並為婚姻就已之占；納採在未，麗妝在丑，總是婚姻欲成之例。
夫亥，木生之地，又為三合，故婚姻百事迪吉。
巳，金生之地，即為賊鄉，故不吉。一云巳曰贄書，主信息見貴。
子卯相刑，恩中主怨，婚姻不成，夫妻不睦。又云持笏，宜慎災病。
酉為私門，臨之主男兒淫奔；又跣足，主不進。
在寅萬事皆通，又云寅主出求吉。
在申一說為披髮，才離病損。
辰戌為牢獄，又卯戌私合，故主奸淫冒罪。在辰一云持巾，主婚；戌一云登途。
午為正位，故升堂。一云主半遂；又云十月占，門戶小口不利。
卯為門戶，故入室，吉。又云小口災。
未為三合，故納採。丑為臨金，故妝嚴。又云未為素服，醜為臥病。
詩
前三六合大夫位，和會婚姻吉兆扶。君子升遷増俸祿，小人飲食更歡娛。相生謀產多吉慶，受制奸窬用暗圖。問疾陰陽心腹痛，丈人司命祭當蘓。
類為竹木、金石所傷之屬，變異食鹽、羽毛。於人為工巧、兒子，或術士，或仕宦，又為隱逸之士。於祟丈人、身命、丈人，一云土神。於疾陰陽不調，心腹虛。於五榖鹽粟，於獸兔之類，味可食物，色光彩，數六。
勾陳論
勾陳在天為大將軍，雷部中作喚云神。位居前四，家戊辰，土旺四季，凶將也。
勾陳乃宮中殺，職任將軍。得地則上令兵威，失地則兵卒不利；持重威權，又為兵甲、守門之吏，大好爭訟，多蓄二心。若伏喪帶吊，則為不孝之神。一云左將軍
愛玄、空，畏龍、後，不立四孟。
勾陳主兵戈、官訟、公事、印信、虎符、留連、皮革，或爭田宅、土舎、財帛。占望信息，財帛出行，俱主留滯。其戾主病、蹇厄牽罣、財物損失，庶人得之如此，若官員見之乃為印綬，盛則吉，衰則凶也。
凡占訟，先以勾陳為主。如勾陳賊日，理難伸雪；日克勾陳，訟得理伸。又忌勾之陰神附蛇、鼠、雀，帶殺克日者最凶。勾陰若作貴人生日上，得貴助為吉。亦要人行年上神不落空亡。
凡捕天賊，勾陳所乘神制玄武所乘神主獲。勾陳臨日乾亦主獲，反此不獲。又勾陳所立之地制玄武所立之地，亦主賊敗，或自首發。如玄武立申酉，而勾陳立巳午是也。占晴雨最宜勾陳入傳臨日辰、制玄武，決主天晴。占戰鬥亦以勾陳制玄武，准上斷之。占宅墓勾陳乘旺氣加墓宅者，主安乆不移；若休囚刑克，當主公事。
勾陳拔劍，主病患相傷。正月起巳逆行十二位。若與辰戌丑未交會，禍患連深；辰戌大凶，醜未口舌。又勾陳披刑帶殺，災咎即臨。
勾陳旺主貴人戰鬥，相貴人爭訟，死爭死人財物，囚爭訟禁錮，休爭病人田宅。
賦
或逢勾陳發用，鬥訟爭官。吏過受鉞，暗遭辱害。遭囚在寅兮，宜上書；捧印在巳兮，有改拜。臨門在卯，家必不寧；被刃在酉，身遭決責。升堂在辰，有獄吏以牽躔；反目在午，因他人而累帶。在未入驛，在戌下獄，往來語訟稽遲；在申趨戶，在亥褰衣，反複勾連改革。
勾陳主戰鬥，醜為明堂，封功決罪。又丑為斧鉞，勾陳臨之為受鉞，主被凌辱。
子為暗室，故曰沉戰，主有陰害。又云：醜曰入化，主口舌。子曰臨官，主訟牽事變。一云，主財帛。
又說，醜未皆主酒食、田宅。
在寅受克，囚杖危身，宜上書進策。
巳為金生火盛，金投火為鑄印。勾陳臨之為捧印，以火旺土相也。故主遷升。
在卯為鬼克，又云入獄，故凶。主遷居、不利小口。
酉金故主刑責，又云病足難進。
辰為獄，加之故主獄吏勾連。
午為生地，故主惹累。一說，未入驛主吉，在戌又為佩劍凶。一說在申曰利河，吉；加亥宜求財。
詩
勾陳前四大將軍，兵災刑鬥訟留連。君子掩逃擒盜賊，小人爭婦競田園。旺相相生猶合理，死囚刑克系遲延。病者腫癰寒熱苦，祟在邱陵及主垣。
類
於人為醜婦，或軍卒，或貧薄小人。於祟寃死之鬼，及門戶土垣鬼。於病心腹寒熱，癰腫見血。於五榖為木實。於獸魚、龍、水蟲之屬。變異為瓦石、金鐵，若被損勾連羅網之類。色青黑，數五。
青龍論
青龍在天為左丞相，雷部中作甘雨之神。位居前五，家甲寅，木旺春三月，吉將也。青龍水木神也，東方青帝，九陽五所居，祿首甲寅之地，髙貴端雅，方正亷平，執生氣，為輔弼大臣，得地則富貴尊崇，失地則財寳外耗。畏陰、虎，愛、後、合，不立申酉。
青龍主文字、財帛、舟車、林木、衣服、書契、官府、升遷、僧道、髙人、婚姻、喜慶、媒妁、胎產、宴會、果藥之屬。其戾主哭泣、病疾、公訟、失財、走畜、陷溺舟車。
凡占公事，雖以青龍為喜神，若披刑殺入卦，賊日乾，卻主凶，以其為殺神也。
凡新婦入門時，忌天后乘神克青龍，主損夫。
求財以青龍為主，要乘旺相氣，臨旺相鄉，與日辰相生，或作三合、六合者吉，亦須入日辰、三傳，不然亦為閒地，求財難矣。占婚姻、胎產同此。
又龍生命有財，克命退財。占盜賊忌龍入卦，以龍為萬里之翼也。占行人亦主轉往他方。占病龍入傳，必因酒食；不然因會親、情喜好得病。
占文官則視青龍，武官則視太常，與日和合者吉，反此者凶。太歲作龍常，必主遷轉。
凡龍與煞並加日辰者，主喜慶中有鬥殺。
龍開眼，主消災。孟寅、仲酉、季戌是也。
龍旺主貴人遷官，相婚姻喜慶，死有死人財物，囚有囚人財物，休有故舊酒食。
賦
青龍財喜，多主亨通。伏陸在酉，允宜退守；蟠泥在丑，所謀未稱。登魁在戌兮，小人爭財；飛天在巳兮，君子欲動。乘雲在寅，驅雷在卯，宜於營運，利進；摧角在申，無鱗在未，宜乎安靜，動凶。午焚身，辰掩目，縁財有不測之憂；子入海，亥逰江，因動有非常之慶。
天魁小人也，故在戌主小人爭財。一名禦雨出入，多勞，主凶。在巳主炎盛，雲行雨施，故曰飛龍，利於進謁。寅主徵召，又主子孫歡慶。卯又名戲水，才貨重重。一說龍乘寅卯，多是求親。龍乘寅卯加申酉，折足鬥訟之象。未為木墓，辰為水墓，故曰無鱗。掩目在午，一云無毛，損才、憂官府，若妻有孕動搖即無虞。亥子俱主舟車、財帛之喜，亥又主婚姻；一說子乘龍合，女占必受皇恩。又曰「子午乘龍，妻妾懐孕，不然家藏孕婦。」
詩
前五青龍丞相位，酒食財錢婚禮儀。君子奏官遷逺職，小人財物送鄉耆。旺相相生媒妁吉，死囚刑克是私通。病者沉熱心腸疾，祟關司命且堪醫。
類
於人為貴官、族、僧道、髙人；於祟司命；於病頭目、心痛、四肢、寒熱、癰腫；於五榖草木之精，可食之物；於獸龍、虎、豹、狸、貓之屬；變異文章、羽毛、錢物、脯璽之類；又為棺槨、枷棒之類。色黃赤，數七。
天空論
天空在天為司直官，雷部中為黃埃塵霧之神。又為渴雨神。位居後六，家戊戌，土旺四季，凶將也。
天空乃陽土之神，燥灰之土，為中央最卑之位，列奴婢之行，為天地之雜氣，作人間之詐神。得地則當直之吏，非多是少，妄起事謀；失地則奴辱婢舌，或顯或隱，動無濟物之心，靜有妖氛之氣。愛元、後，畏龍、合、陰、雀，不立四孟。
天空主奴婢、公吏、市井、小人、財帛、言約、私契，其戾主奴婢、口舌、脫空、不實、虛偽、巧詐、是非、毀敗之事，以其為空亡寂滅之神，即空亡之類也。
若在辰戌丑未四宮，謂之天空閉，亦可以成小，不可成大事。其或順理，旺氣相生，主財帛喜，奴婢小人同心，更帶財星及天喜者，必因小人獲財也；不然因僧道獲財，或因虛詐有功。
《花瓶記》曰：「天空安居，有言不虛。「嘗夏占鑄鐘，天空附火發用，旺相相生，鐘遂成，止有小釁。
占詞訟，最愛天空發用，及終傳，主訟解，謀不成。若求財物，又深忌之。
一說，加臨日乾旺相，主作營運行商。
占婚，天空發用及臨日辰者，其家必有孤寡之人，不然更徙祖業。
占奴河魁，婢從魁，皆以天空為主星，要天空乘神與干支生合無克賊，則吉。不然，主逃走，更值魁罡，其僕不良。占行動，主道路卑賤相損。占赴試奏對，亦吉。天空乃奏書之神也。托人謀事最防虛詐。
占宅墓，若宅墓上見水神，或門戶上見天空並者，必主水道垣牆壅塞，泥淤不便。宅墓者，宮音宅在未，墓在辰；商音宅在酉，墓在醜；角音宅在卯，墓在未；徵音宅在午，墓在戌；羽音宅在子，墓在辰。惟年將其音相連，如天空戊戌土乃徵音及商羽音；太常己未土，貴人己丑土，俱商音及角音。勾陳戊辰土，宮羽徵音。凡占得年將，必主大小墓相連也。
天空見淚，哀聲聒耳。六甲旬中居壬癸，地見壬癸也。
天空旺主貴人欺詐，相才物欺紿，死欺詐死人事，囚刑獄欺紿，休被人欺詐事
賦
天空司直，欺情詐弊。伏室在子，患生於婦女；居家在戌，事因於奴婢。侍側在丑，詐尊長之言；趨進在未，起貨財之利。受辱在巳，被制在寅，然自別其是非；識字在午，鼓舌在申，實難分其真偽。凶惡在辰，乘侮在卯，有暴客以欺侵。巧說在酉，誣詞在亥，值奸人之謀計。
子為房室，故主陰人災。又云溺水，主小人蹇塞。戌為奴婢本家，故主之。
在戌辰丑未俱名處機，主小事成合。
丑為貴人，故曰侍側。
未為酒食，以戌刑未，故主誆賺得財。一云，主宿疾。
加寅一名犯牢，主公私口舌。
加巳，一云投絕，若發用主血痢之疾。
午為文明，故識字；申為舌辨，故鼔舌，情偽難測。
辰為惡殺，卯為門戶，克傷故主暴客。酉為蔽匿，亥為口舌，二者皆主巧言奸誣。一說天空加酉奴婢走失、奸淫；加亥名濡冠，亦主小利遺失
詩
後六天空司直官，奸謀詭詐事多端。君子遷轉防讒誑，俗輩孤單被欺瞞。比助相扶奴婢喜，刑傷不睦是非攙。疾關氣脹疼胸脅，井灶為殃豈得安
類
於人醜婦、貧人，祟井灶及絕嗣鬼，於病脅腹中氣並下痢，於五榖，於獸狼狗之屬，又為印綬、金鐡、空虛之物，變異為虛臭惡物，色黃，數五。
白虎論
白虎在天為廷尉卿，雷部者霹靂之神。又為風伯，位居後五，家庚申，金旺秋三月，凶將也。
虎乃西方白帝金神，四炁陰柔之五女也。剛金專主權煞，九天元女下執法神也。貌若婦人，多與人為凶器、喪服，能損骨肉，亦為胎孕，多行暗道，好作陰私，浸淫濁濫，與後婦同好暗室，操行不良，職居大將。運得地則氣雄威猛，失地則狼狽而凶。
冬至雹、凍、大風，夏主暴雷害物。
白虎主道路、信息、兵戈、動眾、威權、財帛、犬馬、金銀、寳物，其戾主孝服、哭泣、死喪、疾病、怪異、凶惡、殺伐、災害、口舌、獄禁、斗鬧、暗昧、血光、怨仇、驚恐、刑戮之事。披刑帶殺，災禍立至。
虎旺相相生及順理者，亦作財物斷之；不然因鬧處得財。
凡占施大功，作大事，最要虎入課發用，其功立成，虎乃威權之將也。
占官爵亦闕要白虎，乃為威權，更帶殺尤美，所謂「不刑則不發也。」
占病切忌白虎賊日，兼虎帶殺賊日，斗魁作虎克日、克行年，虎陰克日辰年命，皆凶。最愛虎空，附徳神者吉。有白虎落空亡，或有徳與日相生，不損人惟，凶煞重亦，不能救；占公事，忌蛇、虎、克日乾，以二將皆血光之神也。占墓宅，看白虎臨何方，斷其方有岩石、神廟之象。占行人以虎為准，初傳立至，中傳在途，末傳失約未來。虎帶喪吊加支，主家喪服，或外服入宅。傳中見虎，須乾有服人。
占天時，虎主大風。虎仰視凶惡之甚，治四孟是也。
虎遭擒免災，太歲類合治寅午戌是也。
虎旺上主哭泣遭官事，相上逺使怨仇相爭事，死病疾死喪事，囚血光沉淪獄訟事，休有疾病。
賦
白虎道路，官災疾病。溺水亥子，望音書不至；焚身巳午，雖災禍反昌。臨門兮卯酉，傷折人口；伏野兮丑未，損失牛羊。登山在寅，掌生殺之柄；落穽在戌，脫桎梏之殃。銜牒在申，立可待其有喜；咥人在辰，終不見其為祥。
金到水沉溺，故望信不至。一云在亥主有孕婦。
巳午火克金，主反禍為福。一云虎乘魁罡加巳午主孝服，或干孝人事。
未伏穴難動，酉當路俱老幼疾病。丑未為田野，故損牛羊。又云，丑日直視有求望。一雲防害/未亦名登山。主進用有權。滯中得速。虎登山主生財，人口有傷。一云，蛇虎臨寅梁，折屋壊落；穽亦主反禍為福。一云在戌閉目，戌為白虎兮犬驚，乃正位為銜牒，主道途信通。又云，申酉俱爭訟，辰凶惡，故咥人，主官災刑戮，又名夜行，凶。
詩
後五白虎廷尉宰，孝服疾病獄囚縈。君子失官流血恐，小人殺傷致身傾。旺相相生惟損失，死囚刑克慮沉溟。病者目頭癰疽苦，祟犯傷鬼祭乃寧。
類
於人為病、人孝子，於祟兵死客鬼，於病癰腫、頭目見血、憂驚，於五榖麥麻，於獸猿猴虎之屬，又為金銅、鐵闕之器，變異為劍傷形，色白，數七。
太常論
太常在天為太常卿，一云少府，雷部中養物之雨，淑氣之風。位居後四，家己未，土旺四季各十八日，吉將也。
太常己未燥土，為四時之喜神，和八節之嘉會，動遵禮樂為司察之官，職在禮樂榖帛之權。得地則為衣物、財帛、田園、寳貨，失地則退蔵屯剝，牙保、媒人。愛貴、合、後，畏蛇、空。
太常主文章、印綬、公裳、服飾、信息、交關、酒食、宴樂、絹帛、田地、五榖之屬。其戾主乖違、失公私文字、竊盜、衣裳、哭泣、不美、公私、牢系。
占官最喜此將，終始見太常、天驛二馬、印綬之卦，所求遂意。如傳見河魁、太常，主兩重印綬；葢河魁為印，太常為綬也。
占得太常發用，更臨日辰門戶者，為印綬星動，君子遇之，決主印綬文字之喜。旺相相生，遷官轉職，即小人亦主媒妁婚姻。休囚刑克，則財帛不安，貨物不足。
太常被剝，百事消爍。春辰、夏酉、秋卯、冬巳是也。
太常旺主貴人財物，酒食婚禮喜事；相祠祀、衣裳、婚事；死謚贈、財帛、囚、縣官、召命；休有病人、衣服、錢物，披刑帶殺，其事速成。
賦
太常筵宴，酒食相奉。遭枷在子，必值決罰；側目在寅，須遭佞讒。遺冠在卯也，財物損失。逆命在戌也，尊卑起訟。銜杯在申，受爵在丑，必進職而遷官。鑄印在巳，捧觴在未，或徵召與喜慶。午乗軒，有改拜之恩。辰佩印，有再遷之命。亥為聘詔，上雖善而必慮下憎。酉作券書，始雖順而堤防後競。
子水旺，土囚，故名荷項，因酒食與人決罰。
寅木克土，故小人側目加讒。
太常為衣冠，卯木克之，故遺失。戌一名入獄，故尊卑不和。
申為杯，醜為貴人，故銜杯而受爵。
巳為印，未為酒食，故鑄印而捧觴。未又名列席，醜亦名列席，俱有資財之喜。
午為相地，故乘軒。辰土近巳，故佩印。辰一名枷項。
亥乃絳宮貴人之闕，上人喜，但未土克亥水，故慮下憎。
酉為秋分之故，卷出後必有競也，主陰人喜，且防後爭。
詩
後四官為太常卿，田園財帛彩鮮眀。君子遷官榮爵貴，小人媒嫂酒逢迎。旺相相生婚吉慶，死囚刑克失財驚。病者四肢頭腹疾，祟縁新鬼可求親。
類
於人為貴人、貧婦；於祟司命，又新化鬼；於病四肢，頭腹不寜；於五榖為麻，於獸為雁羊之屬，變異為金石、文華、耳目、毛發之類，味可食，形圓，色黃，數八。
玄武論
玄武在天為後軍，一云又將軍，雷部中為苦雨神。位居後三，家癸亥，水旺冬三月，凶將也。
玄武純陰之水，倚幹輔坎，陰極之位，北方至陰之邪氣也。能終萬物，職將軍。得地則禦侮之官，專耗散之權；失地則奸盜賊害，不祥。抱不正之氣，妖邪六窮之鬼氣，當六甲之窮，位在四時之盡。愛龍、蛇、雀，畏空、勾，惡立魁罡。
玄武主聰明多智、文章巧伎、求望財物、干謁貴人。其戾主失脫、盜賊、奸詐、小人、女子、陰私、不明、走失、疾病、鬼魅、夢想、離別等事。
武主鬼扇，其為事多浮泛難成。武在江湖則主風雲，在道路則主雨水。武與財星並，主財聚散，或亡失稽滯，少成多敗。如其旺相相生，則主交易財物，或作牙儈斷之。
凡占盜賊，須責元武之三傳。先以元武為本傳，次看元武之陰為苐二傳，謂之盜神；而盜神有所生為藏物潛居之處也。又須看盜神之陰，為苐三傳。此三處神將相生，上得吉將，其賊難獲；若三傳神將相克有凶，當主敗露；又看人年上神與日，克制元武者亦獲。凡卦。忌武臨日辰。或日辰作武。逆理克日辰者。俱防盜賊失脫，亦不宜與小人交易，恐有脫賺；不然其宅有陰人乘門戶不利也；如順理，旺相相生，不在此限。
占走失人物，元武附德，更臨日辰，逃歸獲。元武臨門戶，更直昴星者，必主失脫，官家當主牢獄走失；若直刑害，罪人自犯。元武橫截、盜賊、兵傷，順行亥子是也。《未明》又云：武並風伯雨師二神，必有盜賊。
元武旺主貴人遺失財物事，相系官失財事，死盜賊死亡事，囚盜賊囚系事，休亡失病人財物事。
賦
元武遺陰賊走失。散發在子，有捕盜之心。升堂在丑，有干求之意。愛寅兮入林而難尋，惡辰兮失路而自制。窺戶在卯也，家有盜賊；反顧在巳也，虛見怖驚。在亥名伏藏，則隱於深邃之鄉；在未為不戒，則敗於酒食之地。截路在午，拔劍在酉，懐惡反傷；折足在申，遭囚在戌，失勢可得。
子曰過海，出入進退。丑曰立雲，賊、失物、欺詐、乾求。
在寅，一說和諧之地，不為災。在辰主官事，一云魁罡乘武奴婢逃亡。
在巳，一云跣足，進身之象，有人舉薦。未曰朝天，宜於貴。
亥主損官。
在午、酉，賊不宜攻。一雲午為失劍，不為害。又曰：元武午未兮轉職。
申主賊現形，又橫劍，主害人。一說武乘玄子申，加卯酉，絕傷。
詩
後三玄武後將軍，盜賊奸邪獄訟陳。君子奴逃車馬失，常人家破戶門淫。相生健旺傷財畜，互克衰絕喪系迍。病者患腰兼脹滿，祟殃河伯溺潭神
類
於人盜賊，邪視，小人；於祟河伯、水神；一云廁鬼於病，心腹脹滿；一云患腰，於五榖為豆，於獸狳豬之屬，又為蟲，於水中連鱗甲文章之物，變異為內虛女子之物，色黑，數四。
太陰論
太陰在天為御史大夫、中丞，又云天乙嬪妃彩女也，雷部中霜雪氷凍之神。位居後二，家辛酉，金旺秋三月，吉將也。
太陰乘金，西方白帝之少女，輔後宮，處人臣之位，有肅殺之權，嚴重有威貌。得地則正直無私，主台垣諫府、刑章典憲，操天下是非，故於人為信，氣稟少陰，嬪媵之職；失地則為婢為妾，三十六怪之主。愛龍、常、後，畏雀、蛇、空，不立卯、午、子。
太陰主婦女、才帛、金銀、錢物、陰私、喜慶、婚姻。其戾為陰私損失、謀事遲滯未成、逺信未至、病疾未痊。旺相相生，主陰人財喜，或為胎產；死囚刑克，陰小病患，及陰私舌口，婢弊不正之事。
占公訟，太陰入卦，與日相生者，宜首罪。占罪太陰入卦刑克者，主有神佛願。
占盜賊切，忌太陰入卦或臨日辰，主難獲；天地之私門也。徐曰：「太陰六合來加日，冥福佐之登逺程。」
占墓宅，太陰入卦，所臨之方斷其有佛寺，及竒美好物名。
占婚，見太陰並酉、亥、未發用，加日辰，其女必不正，或神佛阻，婦人間阻。加日本克日，曰主淫亂。丙午日見之有財，太陰居申酉為拔劍，主陰。
太陰旺主嫁娶陰私事，相財物蔽匿，死陰私死喪，囚陰私囚禁，休巫醫蔽匿事。
賦
太陰所為蔽匿，其來禍福不寜。垂簾在子，則妾婦相侮；守局在丑，則尊卑相蒙。被察在戌兮，憂怪異，小人誣譖；遭淫在辰兮，被乖爭，勾連爭訟。寅跌足，午脫巾，財物文書暗動；亥裸形，巳伏枕，口舌盜賊驚憂。閉戶在酉，看書在未，雅稱士人之正；微行在卯，執正在申，偏宜君子之貞。
凡太陰所為，雖福亦是蔽匿之事。子為房，陰為妾，故垂簾相侮。丑尊貴之宅，陰加故尊卑相蒙，占婚當主貴人為事；一云主僧願。戌天空之宅，小人之象，故防譖。辰主乖爭，又為獄，故有訟；一云戌曰繡衣，主婚。辰曰理冠，求就；又云墮胎、損婦、跌足、財動。寅脫巾，文書動，其憂喜決於占時；又云午日披髮懐憂，寅榮遷恩錫。金生水，在亥為裸體，日亥元武，酉金珠，主陰有盜賊；又孕病；又云孕喜。巳火克酉，為伏枕，陰人口舌。酉為正位，故閉戶；未為夏未迎秋，金將至，故看書。卯為門，太陰出之，主正直；申為臨官，故為執政，四者皆君子則吉，小人凶也。一云酉主奴婢、疾病、出入、防憂；未主傳書、欺詐、破失，又婚事。
詩
後二太陰內史丞，陰私蔽匿事相仍。君子罪名將出入，小人髒奸致憂驚。乗旺相生婚禮驗，逢衰刑克祀神徵。病者足疾腰傷損，有祟須祈灶有靈。
類
於人與天后同，或云賤妾；於祟女祥，並灶，及絕嗣鬼；於病心、腹、腰、腳損；於五榖為小麥，於獸雞、雉、飛、鳥之屬。又為金鐵、刀針，變異為野外、水中物，色黃白，數六。
天后論
天后在天事天乙為后妃，雷部陰霖霧雨之神。位居前一，家壬子，水旺冬三月，吉將也。
天后六陰之極，北方黑帝之五女，處人臣之位，任用財物，為陰戶之事。掌握後宮，配貴人，多柔順，主遲滯，體天地之至位，作群侯之慈母，得地則清真亷潔、髙貴尊崇，失地則淫濫奸邪、雜亂人倫。愛龍、常、貴、合，畏勾、空土神，不立四季。
天后主宮庭、陰私、喜慶、婦人、財物、婚姻、胎產與賞赦、慶賀、恩澤。其類主帷簿不修，陰私不明，欺詐不實，口舌走失。
凡占后乘太歲加日、臨門戶，主恩赦之兆立至；更值三陽、三光尤准，占公事最宜見之；如不臨門戶，但入課傳者，則主遲慢。
天后所乘神切忌下賊上，必有小人凌辱之事；葢後是皇后星，女弱之象，不宜為下所制也。
占婚，宜後與日相生，及三六合者成，反此不成。天后克日乾，女貪，男不肯；日乾克天後，男貪女，而女不肯。若卦傳大吉，主先阻後成。
天后乘神可以定女子性情、容貌。天后乘馬，命見解神，主陰人離別。后陰作玄，暗昧不明；后陰作虎，主妻病凶。罡為後加婦年，主墮胎。
天后陰申陽酉，主淫亂未明。一曰：天后多因占女人，忽逢土旺主災損。若臨午未並壬癸，萬事十謀無一真。
天后旺主嫁娶酒食，相婦人陰私事，死主死喪財帛事，囚奸邪系事，休陰私疾病事。
賦
天后婦女，敝匿陰私。守閨在子，治事在亥，動止多宜。臨門在卯，倚戶在酉，奸淫不足。褰帷在戌，伏枕在午，非嘆息則呻吟裸體。在巳毀妝，在辰不悲憂則羞辱。優逰閒暇，皆因理發在寅，修容在申。悚懼驚慌，縁為偷窺在丑，沐浴在未。
子宜靜，亥宜動，又云子主貴人、婚禮、逺信、盜賊，亥主陰人病，占訟必獄。
卯酉為門戶，主奸淫，家事不寜。
午為水胎，故伏枕，主孕病。
戌為獄，水受克，故褰衣，主失物訟事。
水淫於巳，故裸體奸淫之羞。
辰為牢獄，故毀妝，主遺失衣物，官訟。又云魁罡作后，家藏惡疾陰人。一云在辰，婚產。
寅為毛發，水生木故理發。一云文書不決。申為容水生之地，故修容。一云奸私，寅亥合而醜近之，故偷窺主陰私。一云主婚禮。又云後乘丑加支為用，夜夢鬼交，未為衣服，水受克，故沭浴主婦人憂。又云陰後在小吉，主婦人婚。一云男進田宅。
詩
後一天后彩女嬪，惟須禁錮莫因循。君子遷官會賓客，小人陳儀議婚姻。旺相維持妻妾產，休囚傷害暗私淫。病成痢疾腰肢患，祟犯河官溺死神。
類
於人貴流婦人，於祟水神溺鬼，病陰陽不調，大小便不利，摹腑之疾。於五榖稻豆，於獸鼠蝠，又為女人用物，變異為金石草木之屬，色白，數九
